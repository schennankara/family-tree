const SUPABASE_URL = 'https://hnsikxxbpyhsybqmjgss.supabase.co';
const SUPABASE_KEY = 'sb_publishable_Pe8ZW66e6BVCZ7kLdL0-XA_bejiFhId';
const SB_HEADERS = {
  'apikey': SUPABASE_KEY,
  'Authorization': 'Bearer ' + SUPABASE_KEY,
  'Content-Type': 'application/json',
  'Prefer': 'return=representation'
};

async function sbFetch(path, opts = {}) {
  const url = SUPABASE_URL + '/rest/v1/' + path;
  const resp = await fetch(url, { ...opts, headers: { ...SB_HEADERS, ...(opts.headers||{}) } });
  if (!resp.ok) {
    const err = await resp.text();
    throw new Error(`Supabase ${resp.status}: ${err}`);
  }
  const text = await resp.text();
  if (!text) return [];
  try { return JSON.parse(text); } catch(e) { return []; }
}

/* ───── LOAD FROM SUPABASE ───── */
async function loadFromSupabase() {
  try {
    // Fetch all persons and families
    const [persons, families] = await Promise.all([
      sbFetch('persons?select=*&order=display_name'),
      sbFetch('families?select=*'),
    ]);
    console.log(`Loaded ${persons.length} persons, ${families.length} families from Supabase`);
    return buildTreeFromDB(persons, families);
  } catch (err) {
    console.error('Supabase load failed:', err);
    return null;
  }
}

function buildTreeFromDB(persons, families) {
  const pMap = {};
  persons.forEach(p => {
    pMap[p.id] = {
      id:p.id, fn:p.first_name, mn:p.middle_name, ln:p.last_name,
      dn:p.display_name, nk:p.nickname, md:p.maiden_name, g:p.gender,
      dob:p.date_of_birth, dod:p.date_of_death, dec:p.is_deceased, bo:p.birth_order,
      em:p.email, ph:p.phone, a1:p.address1, a2:p.address2,
      ci:p.city, st:p.state, zp:p.zip, co:p.country,
      fb:p.facebook, ig:p.instagram, li:p.linkedin, ws:p.website,
      pp:p.profile_photo, bio:p.bio, loc:p.location, prof:p.profession, emp:p.employer,
      stories:p.stories, notes:p.notes, pgl:p.photo_gallery_link, dl:p.documents_link,
      _fams: [], _famc: [],
    };
  });

  // Build family links
  const fMap = {};
  families.forEach(f => {
    fMap[f.id] = f;
    if (f.husband_id && pMap[f.husband_id]) pMap[f.husband_id]._fams.push(f.id);
    if (f.wife_id && pMap[f.wife_id]) pMap[f.wife_id]._fams.push(f.id);
    (f.children || []).forEach(cid => {
      if (pMap[cid]) pMap[cid]._famc.push(f.id);
    });
  });

  // Find roots (no famc)
  const hasParents = new Set();
  families.forEach(f => (f.children||[]).forEach(c => hasParents.add(c)));
  const roots = Object.keys(pMap).filter(pid => !hasParents.has(pid));

  // Find best root (most descendants, prefer named)
  function countDesc(pid, seen=new Set()) {
    if(seen.has(pid))return 0;seen.add(pid);let c=1;
    const p=pMap[pid];if(!p)return 0;
    for(const fid of p._fams){const f=fMap[fid];if(f)(f.children||[]).forEach(cid=>{c+=countDesc(cid,seen)});}
    return c;
  }
  let bestRoot=null,bestScore=0;
  for(const pid of roots){
    const p=pMap[pid];
    if(!p||(!p.fn&&!p.nk)) continue;
    const c=countDesc(pid);
    if(c>bestScore){bestScore=c;bestRoot=pid;}
  }
  if(!bestRoot){ for(const pid of roots){ const c=countDesc(pid); if(c>bestScore){bestScore=c;bestRoot=pid;} } }
  if(!bestRoot) bestRoot=roots[0];
  console.log('DB tree root:', bestRoot, pMap[bestRoot]?.dn, 'with', bestScore, 'descendants');

  // Build hierarchical tree
  function buildNode(pid, visited=new Set()) {
    if(visited.has(pid))return null;visited.add(pid);
    const p=pMap[pid];if(!p)return null;
    const node={...p, sp:null, ch:[]};
    delete node._fams; delete node._famc;

    for(const fid of (p._fams||[])){
      const fam=fMap[fid];if(!fam)continue;
      const spId = fam.husband_id===pid ? fam.wife_id : fam.husband_id;
      if(spId&&pMap[spId]&&!visited.has(spId)){
        visited.add(spId);
        const sp={...pMap[spId], mdate:fam.marriage_date||'', mplace:fam.marriage_place||''};
        delete sp._fams; delete sp._famc;
        node.sp=sp;
      }
      node.mdate=fam.marriage_date||'';
      node.mplace=fam.marriage_place||'';
      for(const cid of (fam.children||[])){
        const cn=buildNode(cid,visited);
        if(cn)node.ch.push(cn);
      }
      node.ch.sort((a,b)=>(a.bo||999)-(b.bo||999));
    }
    return node;
  }

  return buildNode(bestRoot);
}

/* ───── SAVE TO SUPABASE ───── */
async function savePerson(person, editUser) {
  const row = {
    id: person.id,
    first_name: person.fn||'', middle_name: person.mn||'', last_name: person.ln||'',
    display_name: person.dn||'', nickname: person.nk||'', maiden_name: person.md||'',
    gender: person.g||'', date_of_birth: person.dob||'', date_of_death: person.dod||'',
    is_deceased: !!person.dec, birth_order: person.bo||0,
    email: person.em||'', phone: person.ph||'',
    address1: person.a1||'', address2: person.a2||'', city: person.ci||'',
    state: person.st||'', zip: person.zp||'', country: person.co||'',
    facebook: person.fb||'', instagram: person.ig||'', linkedin: person.li||'',
    website: person.ws||'', profile_photo: person.pp||'', bio: person.bio||'',
    location: person.loc||'', profession: person.prof||'', employer: person.emp||'',
    stories: person.stories||'', notes: person.notes||'',
    photo_gallery_link: person.pgl||'', documents_link: person.dl||'',
    updated_by: editUser||'',
  };
  await sbFetch('persons?on_conflict=id', {
    method: 'POST',
    body: JSON.stringify(row),
    headers: { 'Prefer': 'resolution=merge-duplicates,return=representation' }
  });
  // Log edit
  try {
    await sbFetch('edit_log', {
      method: 'POST',
      body: JSON.stringify({ person_id: person.id, action: 'update', edited_by: editUser||'', changes: row })
    });
  } catch(e) { console.warn('Edit log failed:', e); }
}

async function saveFamily(familyId, husbandId, wifeId, children, mdate, mplace) {
  const row = {
    id: familyId,
    husband_id: husbandId||null, wife_id: wifeId||null,
    children: children||[],
    marriage_date: mdate||'', marriage_place: mplace||'',
  };
  await sbFetch('families?on_conflict=id', {
    method: 'POST',
    body: JSON.stringify(row),
    headers: { 'Prefer': 'resolution=merge-duplicates,return=representation' }
  });
}

async function deletePersonFromDB(personId, editUser) {
  // Remove from family children arrays
  const fams = await sbFetch(`families?select=*&children=cs.{${personId}}`);
  for (const f of fams) {
    const newChildren = (f.children||[]).filter(c=>c!==personId);
    await sbFetch(`families?id=eq.${f.id}`, {
      method: 'PATCH',
      body: JSON.stringify({ children: newChildren })
    });
  }
  // Remove families where this person is husband or wife (if no children)
  const asFams = await sbFetch(`families?select=*&or=(husband_id.eq.${personId},wife_id.eq.${personId})`);
  for (const f of asFams) {
    if (!f.children || f.children.length === 0) {
      await sbFetch(`families?id=eq.${f.id}`, { method: 'DELETE' });
    }
  }
  // Delete person
  await sbFetch(`persons?id=eq.${personId}`, { method: 'DELETE' });
  // Log
  try {
    await sbFetch('edit_log', {
      method: 'POST',
      body: JSON.stringify({ person_id: personId, action: 'delete', edited_by: editUser||'' })
    });
  } catch(e) {}
}

async function addPersonToDB(person, parentId, editUser) {
  // Save the new person
  await savePerson(person, editUser);
  // Find or create family for the parent
  if (parentId) {
    const parentFams = await sbFetch(`families?select=*&or=(husband_id.eq.${parentId},wife_id.eq.${parentId})`);
    if (parentFams.length > 0) {
      // Add to first family's children
      const fam = parentFams[0];
      const newChildren = [...(fam.children||[]), person.id];
      await sbFetch(`families?id=eq.${fam.id}`, {
        method: 'PATCH',
        body: JSON.stringify({ children: newChildren })
      });
    } else {
      // Create new family with parent + child
      const parent = await sbFetch(`persons?id=eq.${parentId}&select=gender`);
      const pGender = parent[0]?.gender || 'M';
      await saveFamily(
        '@F_new_' + Date.now() + '@',
        pGender === 'M' ? parentId : null,
        pGender === 'F' ? parentId : null,
        [person.id], '', ''
      );
    }
  }
}

async function saveSpouseToDB(parentId, spouse, editUser) {
  // Save spouse person record
  await savePerson(spouse, editUser);
  // Find parent's family or create one
  const parentFams = await sbFetch(`families?select=*&or=(husband_id.eq.${parentId},wife_id.eq.${parentId})`);
  const parent = await sbFetch(`persons?id=eq.${parentId}&select=gender`);
  const pGender = parent[0]?.gender || 'M';
  if (parentFams.length > 0) {
    const fam = parentFams[0];
    const patch = pGender === 'M' ? { wife_id: spouse.id } : { husband_id: spouse.id };
    await sbFetch(`families?id=eq.${fam.id}`, { method: 'PATCH', body: JSON.stringify(patch) });
  } else {
    await saveFamily(
      '@F_sp_' + Date.now() + '@',
      pGender === 'M' ? parentId : spouse.id,
      pGender === 'F' ? parentId : spouse.id,
      [], '', ''
    );
  }
}

async function deleteSpouseFromDB(parentId, spouseId, editUser) {
  // Remove spouse from family, don't delete the person record
  const fams = await sbFetch(`families?select=*&or=(husband_id.eq.${parentId},wife_id.eq.${parentId})`);
  for (const f of fams) {
    if (f.husband_id === spouseId) {
      await sbFetch(`families?id=eq.${f.id}`, { method: 'PATCH', body: JSON.stringify({ husband_id: null }) });
    } else if (f.wife_id === spouseId) {
      await sbFetch(`families?id=eq.${f.id}`, { method: 'PATCH', body: JSON.stringify({ wife_id: null }) });
    }
  }
}

/* ───── BROWSER-BASED GEDCOM → SUPABASE MIGRATION ───── */
async function migrateGedcomToSupabase(gedcomText, onProgress) {
  // Parse GEDCOM into flat persons/families
  const raw = gedcomText.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
  const lines = raw.split('\n').filter(l => l.trim());
  const elements = [];
  const stack = [{ children: elements, level: -1 }];
  for (const line of lines) {
    const m = line.match(/^(\d+)\s+(@[^@]+@)?\s*(\S+)\s*(.*)?$/);
    if (!m) continue;
    const level = parseInt(m[1]);
    const pointer = (m[2] || '').trim();
    const tag = m[3].trim();
    const value = (m[4] || '').trim();
    const el = { level, pointer, tag, value, children: [] };
    while (stack.length > 1 && stack[stack.length - 1].level >= level) stack.pop();
    stack[stack.length - 1].children.push(el);
    stack.push(el);
  }

  function gv(el, tag) { const ch = el.children.find(c => c.tag === tag); return ch ? ch.value : ''; }
  function gnv(el, pt, ct) { const p = el.children.find(c => c.tag === pt); if (!p) return ''; const c = p.children.find(x => x.tag === ct); return c ? c.value : ''; }

  const persons = [];
  const families = [];

  for (const el of elements) {
    if (el.tag === 'INDI' && el.pointer) {
      let fn='',mn='',ln='',nk='',md='';
      const nameEls = el.children.filter(c => c.tag === 'NAME');
      for (const nameEl of nameEls) {
        const typeEl = nameEl.children.find(c => c.tag === 'TYPE');
        const type = typeEl ? typeEl.value : '';
        if (type === 'nick') { nk = nameEl.value.replace(/\//g, '').trim(); }
        else if (type === 'birth') { md = nameEl.value.replace(/\//g, '').trim(); }
        else if (type === 'married') { continue; }
        else if (!fn && !ln) {
          const givnEl = nameEl.children.find(c => c.tag === 'GIVN');
          const surnEl = nameEl.children.find(c => c.tag === 'SURN');
          const secgEl = nameEl.children.find(c => c.tag === 'SECG');
          if (givnEl) { let v=givnEl.value.replace(/^\d+\.\s*/,''); const parts=v.split(' '); fn=parts[0]||''; if(parts.length>1&&!mn)mn=parts.slice(1).join(' '); }
          if (surnEl) ln = surnEl.value;
          if (secgEl && !mn) mn = secgEl.value;
          if (!fn && !ln) {
            const nv = nameEl.value.replace(/^\d+\.\s*/,'');
            const sm = nv.match(/^(.*?)\/([^\/]*)\//);
            if (sm) { const gp=sm[1].trim(); ln=sm[2].trim(); const gs=gp.split(' '); fn=gs[0]||''; if(gs.length>1)mn=gs.slice(1).join(' '); }
            else fn = nv.replace(/\//g, '').trim();
          }
        }
      }
      const g = gv(el, 'SEX');
      const dob = gnv(el, 'BIRT', 'DATE');
      const loc = gnv(el, 'BIRT', 'PLAC');
      const dod = gnv(el, 'DEAT', 'DATE');
      const deatEl1 = el.children.find(c => c.tag === 'DEAT');
      const hasDeat = deatEl1 ? (deatEl1.value === 'Y' || !!dod) : false;
      let dn = (fn + (mn ? ' ' + mn : '') + (ln ? ' ' + ln : '')).trim();
      if (!dn) dn = nk || '(Unknown)';
      if (!fn && ln && !mn) dn = 'Mrs. ' + ln + ' (name unknown)';

      // Address
      let a1='',a2='',ci='',st='',zp='',co='';
      const addrEl = el.children.find(c => c.tag === 'ADDR' || c.tag === 'RESI');
      if (addrEl) {
        a1 = addrEl.value || gv(addrEl, 'ADR1') || '';
        a2 = gv(addrEl, 'ADR2'); ci = gv(addrEl, 'CITY');
        st = gv(addrEl, 'STAE'); zp = gv(addrEl, 'POST'); co = gv(addrEl, 'CTRY');
      }

      persons.push({
        id: el.pointer, first_name: fn, middle_name: mn, last_name: ln,
        display_name: dn, nickname: nk, maiden_name: md, gender: g,
        date_of_birth: dob, date_of_death: dod, is_deceased: hasDeat || !!dod, birth_order: 0,
        email: gv(el,'EMAI')||gv(el,'EMAIL'), phone: gv(el,'PHON'),
        address1:a1, address2:a2, city:ci, state:st, zip:zp, country:co,
        facebook: gv(el,'_FACEBOOK'), instagram: gv(el,'_INSTAGRAM'),
        linkedin: gv(el,'_LINKEDIN'), website: gv(el,'WWW'),
        profile_photo: gv(el,'_PHOTO'), bio: '', location: loc,
        profession: gv(el,'OCCU'), employer: gv(el,'_EMPLOYER'),
        stories: '', notes: gv(el,'NOTE'),
        photo_gallery_link: gv(el,'_PHOTOGALLERY'), documents_link: gv(el,'_DOCUMENTS'),
        updated_by: 'GEDCOM migration',
      });
    } else if (el.tag === 'FAM' && el.pointer) {
      families.push({
        id: el.pointer,
        husband_id: gv(el,'HUSB') || null,
        wife_id: gv(el,'WIFE') || null,
        children: el.children.filter(c => c.tag === 'CHIL').map(c => c.value),
        marriage_date: gnv(el,'MARR','DATE'),
        marriage_place: gnv(el,'MARR','PLAC'),
      });
    }
  }

  // Compute birth order
  const pMap = {};
  persons.forEach(p => pMap[p.id] = p);
  families.forEach(f => {
    (f.children||[]).forEach((cid, i) => { if (pMap[cid]) pMap[cid].birth_order = i + 1; });
  });

  onProgress(`Parsed: ${persons.length} persons, ${families.length} families`);

  // Clear existing data
  onProgress('Clearing existing data...');
  try { await sbFetch('edit_log?id=gt.0', { method: 'DELETE' }); } catch(e) {}
  try { await sbFetch('families?id=neq.', { method: 'DELETE' }); } catch(e) {}
  try { await sbFetch('persons?id=neq.', { method: 'DELETE' }); } catch(e) {}

  // Insert persons in batches
  const batchSize = 30;
  for (let i = 0; i < persons.length; i += batchSize) {
    const batch = persons.slice(i, i + batchSize);
    onProgress(`Inserting persons ${i + 1}-${Math.min(i + batchSize, persons.length)} of ${persons.length}...`);
    try {
      await sbFetch('persons', {
        method: 'POST',
        body: JSON.stringify(batch),
        headers: { 'Prefer': 'resolution=merge-duplicates,return=minimal' }
      });
    } catch (e) {
      // Try one by one
      for (const p of batch) {
        try {
          await sbFetch('persons', {
            method: 'POST',
            body: JSON.stringify(p),
            headers: { 'Prefer': 'resolution=merge-duplicates,return=minimal' }
          });
        } catch (e2) {
          console.warn('Skip person:', p.id, e2);
        }
      }
    }
  }

  // Insert families in batches
  for (let i = 0; i < families.length; i += batchSize) {
    const batch = families.slice(i, i + batchSize);
    onProgress(`Inserting families ${i + 1}-${Math.min(i + batchSize, families.length)} of ${families.length}...`);
    try {
      await sbFetch('families', {
        method: 'POST',
        body: JSON.stringify(batch),
        headers: { 'Prefer': 'resolution=merge-duplicates,return=minimal' }
      });
    } catch (e) {
      for (const f of batch) {
        try {
          await sbFetch('families', {
            method: 'POST',
            body: JSON.stringify(f),
            headers: { 'Prefer': 'resolution=merge-duplicates,return=minimal' }
          });
        } catch (e2) {
          console.warn('Skip family:', f.id, e2);
        }
      }
    }
  }

  onProgress('Verifying...');
  const pCount = await sbFetch('persons?select=id');
  const fCount = await sbFetch('families?select=id');
  return { persons: pCount.length, families: fCount.length };
}

function MigrateDialog({onDone, onCancel}) {
  const [status, setStatus] = useState('');
  const [running, setRunning] = useState(false);
  const [result, setResult] = useState(null);
  const [error, setError] = useState('');
  const inp={width:'100%',background:'#1a1a14',border:'1px solid '+BR,color:TX,padding:'8px 12px',borderRadius:6,fontSize:13,outline:'none',fontFamily:'inherit'};

  const handleFile = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    setRunning(true); setError('');
    setStatus('Reading file...');
    try {
      const text = await file.text();
      const res = await migrateGedcomToSupabase(text, setStatus);
      setResult(res);
      setStatus('');
    } catch (err) {
      setError(err.message);
      setStatus('');
    } finally {
      setRunning(false);
    }
  };

  const handleFromRepo = async () => {
    setRunning(true); setError('');
    setStatus('Fetching GEDCOM from repo...');
    try {
      const resp = await fetch(GEDCOM_SOURCE_URL + '?t=' + Date.now());
      if (!resp.ok) throw new Error('Could not fetch GEDCOM file: ' + resp.status);
      const text = await resp.text();
      const res = await migrateGedcomToSupabase(text, setStatus);
      setResult(res);
      setStatus('');
    } catch (err) {
      setError(err.message);
      setStatus('');
    } finally {
      setRunning(false);
    }
  };

  if (result) return(
    <div style={{position:'fixed',inset:0,zIndex:300,display:'flex',alignItems:'center',justifyContent:'center'}}>
      <div onClick={onDone} style={{position:'absolute',inset:0,background:'rgba(0,0,0,0.7)'}}/>
      <div style={{position:'relative',background:CD,border:'1px solid '+BR,borderRadius:12,width:Math.min(440,window.innerWidth-32),padding:28,zIndex:301,textAlign:'center'}}>
        <div style={{fontSize:48,marginBottom:12}}>✓</div>
        <div style={{fontSize:20,color:GC,fontWeight:300,marginBottom:8}}>Migration Complete</div>
        <div style={{fontSize:14,color:TX}}>{result.persons} persons, {result.families} families loaded into Supabase</div>
        <div style={{fontSize:12,color:DM,marginTop:8,marginBottom:20}}>Refresh the page to load from the database.</div>
        <button onClick={()=>{ onDone(); window.location.reload(); }} style={{background:'rgba(196,163,90,0.15)',border:'1px solid '+GD,color:GC,padding:'10px 24px',borderRadius:6,cursor:'pointer',fontSize:14}}>Reload Page</button>
      </div>
    </div>
  );

  return(
    <div style={{position:'fixed',inset:0,zIndex:300,display:'flex',alignItems:'center',justifyContent:'center'}}>
      <div onClick={onCancel} style={{position:'absolute',inset:0,background:'rgba(0,0,0,0.7)'}}/>
      <div style={{position:'relative',background:CD,border:'1px solid '+BR,borderRadius:12,width:Math.min(480,window.innerWidth-32),padding:28,zIndex:301}}>
        <div style={{fontSize:20,color:GC,fontWeight:300,marginBottom:4}}>Migrate GEDCOM → Supabase</div>
        <div style={{fontSize:12,color:DM,marginBottom:20,lineHeight:1.6}}>
          This will parse a GEDCOM file and load all persons and families into the Supabase database.
          <strong style={{color:'#c05050'}}> This replaces all existing data in the database.</strong>
        </div>
        <div style={{display:'flex',gap:10,marginBottom:16}}>
          <button onClick={handleFromRepo} disabled={running}
            style={{flex:1,background:'rgba(196,163,90,0.1)',border:'1px solid '+GD,color:GC,padding:'12px',borderRadius:6,cursor:'pointer',fontSize:13,opacity:running?0.5:1}}>
            Load from repo<br/><span style={{fontSize:10,color:DM}}>({GEDCOM_SOURCE_URL})</span>
          </button>
          <label style={{flex:1,background:'rgba(107,158,114,0.1)',border:'1px solid '+MC,color:MC,padding:'12px',borderRadius:6,cursor:'pointer',fontSize:13,textAlign:'center',opacity:running?0.5:1}}>
            Upload .ged file<br/><span style={{fontSize:10,color:DM}}>from your computer</span>
            <input type="file" accept=".ged,.gedcom" onChange={handleFile} disabled={running} style={{display:'none'}}/>
          </label>
        </div>
        {status && <div style={{fontSize:12,color:MC,marginBottom:12,display:'flex',alignItems:'center',gap:8}}>
          <div style={{width:12,height:12,border:'2px solid '+BR,borderTopColor:MC,borderRadius:'50%',animation:'spin 0.8s linear infinite',flexShrink:0}}/>
          {status}
        </div>}
        {error && <div style={{fontSize:12,color:'#c05050',marginBottom:12}}>Error: {error}</div>}
        <div style={{display:'flex',justifyContent:'flex-end'}}>
          <button onClick={onCancel} disabled={running} style={{background:'transparent',border:'1px solid '+BR,color:DM,padding:'8px 20px',borderRadius:6,cursor:'pointer',fontSize:13}}>Cancel</button>
        </div>
      </div>
    </div>
  );
}

/* ───── GEDCOM 5.5.1 EXPORTER ───── */
function exportTreeToGedcom(tree) {
  const lines = [];
  const indis = [];
  const fams = [];
  let famCounter = 0;

  function gedcomDate() {
    const d = new Date();
    const months = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
    return `${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()}`;
  }
  function gedcomTime() {
    const d = new Date();
    return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}`;
  }

  function buildIndi(person, famsRefs, famcRef) {
    const L = [];
    const pid = person.id;
    L.push(`0 ${pid} INDI`);

    // Primary NAME
    const fn = person.fn || '';
    const mn = person.mn || '';
    const ln = person.ln || '';
    const givn = (fn + (mn ? ' ' + mn : '')).trim();
    const nameStr = ln ? `${givn} /${ln}/` : (givn || person.dn || '(Unknown)');
    L.push(`1 NAME ${nameStr}`);
    if (fn) L.push(`2 GIVN ${fn}`);
    if (ln) L.push(`2 SURN ${ln}`);
    if (mn) L.push(`2 SECG ${mn}`);

    // Nickname
    if (person.nk) {
      L.push(`1 NAME ${person.nk} //`);
      L.push(`2 TYPE nick`);
      L.push(`2 GIVN ${person.nk}`);
    }

    // Maiden name
    if (person.md) {
      L.push(`1 NAME ${person.md} //`);
      L.push(`2 TYPE birth`);
    }

    // SEX
    if (person.g) L.push(`1 SEX ${person.g}`);

    // BIRT
    if (person.dob || person.loc) {
      L.push('1 BIRT');
      if (person.dob) L.push(`2 DATE ${person.dob}`);
      if (person.loc) L.push(`2 PLAC ${person.loc}`);
    }

    // DEAT
    if (person.dod || person.dec) {
      L.push('1 DEAT');
      if (person.dod) L.push(`2 DATE ${person.dod}`);
    }

    // Contact
    if (person.ph) L.push(`1 PHON ${person.ph}`);
    if (person.em) L.push(`1 EMAI ${person.em}`);

    // Address
    if (person.a1 || person.ci || person.st || person.co) {
      L.push(`1 ADDR ${person.a1 || ''}`);
      if (person.a2) L.push(`2 ADR2 ${person.a2}`);
      if (person.ci) L.push(`2 CITY ${person.ci}`);
      if (person.st) L.push(`2 STAE ${person.st}`);
      if (person.zp) L.push(`2 POST ${person.zp}`);
      if (person.co) L.push(`2 CTRY ${person.co}`);
    }

    // Occupation
    if (person.prof) L.push(`1 OCCU ${person.prof}`);

    // Website
    if (person.ws) L.push(`1 WWW ${person.ws}`);

    // Notes
    if (person.notes) L.push(`1 NOTE ${person.notes}`);
    if (person.bio) L.push(`1 NOTE BIO: ${person.bio}`);
    if (person.stories) L.push(`1 NOTE STORY: ${person.stories}`);

    // Custom tags for rich fields
    if (person.fb) L.push(`1 _FACEBOOK ${person.fb}`);
    if (person.ig) L.push(`1 _INSTAGRAM ${person.ig}`);
    if (person.li) L.push(`1 _LINKEDIN ${person.li}`);
    if (person.pp) L.push(`1 _PHOTO ${person.pp}`);
    if (person.emp) L.push(`1 _EMPLOYER ${person.emp}`);
    if (person.pgl) L.push(`1 _PHOTOGALLERY ${person.pgl}`);
    if (person.dl) L.push(`1 _DOCUMENTS ${person.dl}`);

    // FAMS / FAMC refs
    famsRefs.forEach(ref => L.push(`1 FAMS ${ref}`));
    if (famcRef) L.push(`1 FAMC ${famcRef}`);

    // CHAN
    L.push('1 CHAN');
    L.push(`2 DATE ${gedcomDate()}`);
    L.push(`3 TIME ${gedcomTime()}`);

    return L;
  }

  function buildFam(famId, husbId, wifeId, childIds, mdate, mplace) {
    const L = [`0 ${famId} FAM`];
    if (husbId) L.push(`1 HUSB ${husbId}`);
    if (wifeId) L.push(`1 WIFE ${wifeId}`);
    if (mdate || mplace) {
      L.push('1 MARR');
      if (mdate) L.push(`2 DATE ${mdate}`);
      if (mplace) L.push(`2 PLAC ${mplace}`);
    }
    childIds.forEach(cid => L.push(`1 CHIL ${cid}`));
    return L;
  }

  function processNode(node, parentFamId) {
    const famsRefs = [];
    const children = node.ch || [];
    const spouse = node.sp;

    // Create FAM if has spouse or children
    if (spouse || children.length > 0) {
      famCounter++;
      const famId = `@F${famCounter}@`;
      famsRefs.push(famId);

      const husbId = node.g === 'M' ? node.id : (spouse ? spouse.id : '');
      const wifeId = node.g === 'F' ? node.id : (spouse ? spouse.id : '');
      const childIds = children.map(c => c.id);

      fams.push(buildFam(famId, husbId, wifeId, childIds, node.mdate || '', node.mplace || ''));

      // Spouse INDI
      if (spouse && spouse.id) {
        indis.push(buildIndi(spouse, [famId], null));
      }

      // Recurse children
      children.forEach(child => processNode(child, famId));
    }

    // This person's INDI
    indis.push(buildIndi(node, famsRefs, parentFamId));
  }

  processNode(tree, null);

  // Assemble
  lines.push('0 HEAD');
  lines.push('1 SOUR FTLS');
  lines.push('2 NAME Chennamkara Family Tree Living Site');
  lines.push('2 VERS 0.2');
  lines.push('1 CHAR UTF-8');
  lines.push('1 GEDC');
  lines.push('2 VERS 5.5.1');
  lines.push('2 FORM LINEAGE-LINKED');
  lines.push('1 SUBM @SUBM1@');
  lines.push('0 @SUBM1@ SUBM');
  lines.push('1 NAME FTLS Export');

  indis.forEach(indi => lines.push(...indi));
  fams.forEach(fam => lines.push(...fam));
  lines.push('0 TRLR');

  return lines.join('\n') + '\n';
}

function downloadGedcom(tree) {
  const content = exportTreeToGedcom(tree);
  const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'Chennamkara_Family_Tree_Export.ged';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* ───── GEDCOM 5.5.1 IMPORTER / PARSER ───── */
function parseGedcomFile(text) {
  // Normalize line endings
  const raw = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
  const lines = raw.split('\n').filter(l => l.trim());

  // Parse into elements: {level, pointer, tag, value, children[]}
  const elements = [];
  const stack = [{ children: elements, level: -1 }];

  for (const line of lines) {
    const m = line.match(/^(\d+)\s+(@[^@]+@)?\s*(\S+)\s*(.*)?$/);
    if (!m) continue;
    const level = parseInt(m[1]);
    const pointer = (m[2] || '').trim();
    const tag = m[3].trim();
    const value = (m[4] || '').trim();
    const el = { level, pointer, tag, value, children: [] };

    // Pop stack to find parent
    while (stack.length > 1 && stack[stack.length - 1].level >= level) {
      stack.pop();
    }
    stack[stack.length - 1].children.push(el);
    stack.push(el);
  }

  // Extract individuals
  const people = {};
  const families = {};

  for (const el of elements) {
    if (el.tag === 'INDI' && el.pointer) {
      const p = parseIndi(el);
      people[p.id] = p;
    } else if (el.tag === 'FAM' && el.pointer) {
      const f = parseFam(el);
      families[f.id] = f;
    }
  }

  // Compute generations & build tree
  return buildTreeFromFlat(people, families);
}

function getChildValue(el, tag) {
  const ch = el.children.find(c => c.tag === tag);
  return ch ? ch.value : '';
}

function getNestedValue(el, parentTag, childTag) {
  const parent = el.children.find(c => c.tag === parentTag);
  if (!parent) return '';
  const child = parent.children.find(c => c.tag === childTag);
  return child ? child.value : '';
}

function parseIndi(el) {
  const id = el.pointer;

  // Primary name
  let fn = '', mn = '', ln = '', nk = '', md = '';
  const nameEls = el.children.filter(c => c.tag === 'NAME');

  for (const nameEl of nameEls) {
    const typeEl = nameEl.children.find(c => c.tag === 'TYPE');
    const type = typeEl ? typeEl.value : '';

    if (type === 'nick') {
      nk = nameEl.value.replace(/\//g, '').trim();
    } else if (type === 'birth') {
      md = nameEl.value.replace(/\//g, '').trim();
    } else if (type === 'married') {
      // Skip married-name-only entries (the "George married to George" issue)
      continue;
    } else if (!fn && !ln) {
      // Primary name - parse from structured value or sub-tags
      const givnEl = nameEl.children.find(c => c.tag === 'GIVN');
      const surnEl = nameEl.children.find(c => c.tag === 'SURN');
      const secgEl = nameEl.children.find(c => c.tag === 'SECG');

      if (givnEl) {
        // Strip leading birth-order number prefix like "4. Samuel" → "Samuel"
        let givnVal = givnEl.value.replace(/^\d+\.\s*/, '');
        const parts = givnVal.split(' ');
        fn = parts[0] || '';
        if (parts.length > 1 && !mn) mn = parts.slice(1).join(' ');
      }
      if (surnEl) ln = surnEl.value;
      if (secgEl && !mn) mn = secgEl.value;

      // Fallback: parse "Given /Surname/" format
      if (!fn && !ln) {
        // Strip leading birth-order number prefix
        const nameVal = nameEl.value.replace(/^\d+\.\s*/, '');
        const slashMatch = nameVal.match(/^(.*?)\/([^\/]*)\//);
        if (slashMatch) {
          const givenPart = slashMatch[1].trim();
          ln = slashMatch[2].trim();
          const gParts = givenPart.split(' ');
          fn = gParts[0] || '';
          if (gParts.length > 1) mn = gParts.slice(1).join(' ');
        } else {
          fn = nameVal.replace(/\//g, '').trim();
        }
      }
    }
  }

  const g = getChildValue(el, 'SEX');
  const dob = getNestedValue(el, 'BIRT', 'DATE');
  const loc = getNestedValue(el, 'BIRT', 'PLAC');
  const dod = getNestedValue(el, 'DEAT', 'DATE');
  const deatEl2 = el.children.find(c => c.tag === 'DEAT');
  const hasDeat = deatEl2 ? (deatEl2.value === 'Y' || !!dod) : false;

  // Contact
  const ph = getChildValue(el, 'PHON');
  const em = getChildValue(el, 'EMAI') || getChildValue(el, 'EMAIL');
  const ws = getChildValue(el, 'WWW');

  // Address
  let a1='',a2='',ci='',st='',zp='',co='';
  const addrEl = el.children.find(c => c.tag === 'ADDR' || c.tag === 'RESI');
  if (addrEl) {
    a1 = addrEl.value || getChildValue(addrEl, 'ADR1') || '';
    a2 = getChildValue(addrEl, 'ADR2');
    ci = getChildValue(addrEl, 'CITY');
    st = getChildValue(addrEl, 'STAE');
    zp = getChildValue(addrEl, 'POST');
    co = getChildValue(addrEl, 'CTRY');
  }

  // Other fields
  const prof = getChildValue(el, 'OCCU');
  const notes = getChildValue(el, 'NOTE');

  // Custom tags
  const fb = getChildValue(el, '_FACEBOOK');
  const ig = getChildValue(el, '_INSTAGRAM');
  const li = getChildValue(el, '_LINKEDIN');
  const pp = getChildValue(el, '_PHOTO');
  const emp = getChildValue(el, '_EMPLOYER');
  const pgl = getChildValue(el, '_PHOTOGALLERY');
  const dl = getChildValue(el, '_DOCUMENTS');

  // Family links
  const fams = el.children.filter(c => c.tag === 'FAMS').map(c => c.value);
  const famc = el.children.filter(c => c.tag === 'FAMC').map(c => c.value);

  // Build display name
  let dn = (fn + (mn ? ' ' + mn : '') + (ln ? ' ' + ln : '')).trim();
  if (!dn) dn = nk || '(Unknown)';

  // Handle the "surname only" spouse issue - if no first name and only surname
  if (!fn && ln && !mn) {
    dn = `Mrs. ${ln} (name unknown)`;
  }

  return {
    id, fn, mn, ln, dn, nk, md, g,
    dob, dod, dec: hasDeat || !!dod, bo: 0,
    em, ph, a1, a2, ci, st, zp, co,
    fb, ig, li, ws, pp, bio: '', loc,
    prof, emp, stories: '', notes, pgl, dl,
    fams, famc,
  };
}

function parseFam(el) {
  return {
    id: el.pointer,
    husb: getChildValue(el, 'HUSB'),
    wife: getChildValue(el, 'WIFE'),
    children: el.children.filter(c => c.tag === 'CHIL').map(c => c.value),
    mdate: getNestedValue(el, 'MARR', 'DATE'),
    mplace: getNestedValue(el, 'MARR', 'PLAC'),
  };
}

function parseDateSort(d) {
  if (!d) return 99999999;
  const months = {JAN:1,FEB:2,MAR:3,APR:4,MAY:5,JUN:6,JUL:7,AUG:8,SEP:9,OCT:10,NOV:11,DEC:12};
  // MM/DD/YYYY
  let m = d.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if (m) return parseInt(m[3])*10000 + parseInt(m[1])*100 + parseInt(m[2]);
  // DD MON YYYY
  m = d.match(/(\d{1,2})\s+(\w{3})\s+(\d{4})/);
  if (m) return parseInt(m[3])*10000 + (months[m[2].toUpperCase()]||0)*100 + parseInt(m[1]);
  return 99999999;
}

function buildTreeFromFlat(people, families) {
  // Compute birth order per family
  for (const fam of Object.values(families)) {
    const kids = fam.children.filter(cid => people[cid]);
    kids.sort((a, b) => parseDateSort(people[a].dob) - parseDateSort(people[b].dob));
    kids.forEach((cid, i) => { if (people[cid]) people[cid].bo = i + 1; });
  }

  // BFS to assign generations
  const hasParents = new Set();
  for (const fam of Object.values(families)) {
    fam.children.forEach(c => hasParents.add(c));
  }
  const roots = Object.keys(people).filter(pid => !hasParents.has(pid));

  const genMap = {};
  const visited = new Set();
  const queue = roots.map(pid => [pid, 0]);

  while (queue.length > 0) {
    const [pid, gen] = queue.shift();
    if (visited.has(pid)) continue;
    visited.add(pid);
    genMap[pid] = gen;

    const person = people[pid];
    if (!person) continue;

    for (const famId of person.fams) {
      const fam = families[famId];
      if (!fam) continue;
      // Spouse gets same gen
      const spouseId = fam.husb === pid ? fam.wife : fam.husb;
      if (spouseId && !visited.has(spouseId)) queue.push([spouseId, gen]);
      // Children get gen+1
      for (const cid of fam.children) {
        if (!visited.has(cid)) queue.push([cid, gen + 1]);
      }
    }
  }

  // Find the person with most descendants as root
  function countDesc(pid, seen = new Set()) {
    if (seen.has(pid)) return 0;
    seen.add(pid);
    let count = 1;
    const p = people[pid];
    if (!p) return 0;
    for (const famId of p.fams) {
      const fam = families[famId];
      if (!fam) continue;
      for (const cid of fam.children) {
        count += countDesc(cid, seen);
      }
    }
    return count;
  }

  let bestRoot = null;
  let bestCount = 0;
  for (const pid of roots) {
    const p = people[pid];
    // Skip unnamed people entirely as root candidates
    if (!p || (!p.fn && !p.nk)) continue;
    const c = countDesc(pid);
    if (c > bestCount) { bestCount = c; bestRoot = pid; }
  }
  // If no named root found, fall back to most descendants
  if (!bestRoot) {
    for (const pid of roots) {
      const c = countDesc(pid);
      if (c > bestCount) { bestCount = c; bestRoot = pid; }
    }
  }
  if (!bestRoot) bestRoot = roots[0];
  console.log('Tree root:', bestRoot, people[bestRoot]?.dn, 'with', bestCount, 'descendants');

  // Build hierarchical tree
  function buildNode(pid, visitedNodes = new Set()) {
    if (visitedNodes.has(pid)) return null;
    visitedNodes.add(pid);

    const p = people[pid];
    if (!p) return null;

    const node = { ...p, gen: genMap[pid] || 0, sp: null, ch: [] };
    // Remove flat refs from display node
    delete node.fams;
    delete node.famc;

    for (const famId of (p.fams || [])) {
      const fam = families[famId];
      if (!fam) continue;

      // Spouse
      const spId = fam.husb === pid ? fam.wife : fam.husb;
      if (spId && people[spId] && !visitedNodes.has(spId)) {
        visitedNodes.add(spId);
        const sp = { ...people[spId], mdate: fam.mdate || '', mplace: fam.mplace || '' };
        delete sp.fams;
        delete sp.famc;
        node.sp = sp;
      }
      node.mdate = fam.mdate || '';
      node.mplace = fam.mplace || '';

      // Children
      for (const cid of fam.children) {
        const childNode = buildNode(cid, visitedNodes);
        if (childNode) node.ch.push(childNode);
      }
      // Sort children by birth order
      node.ch.sort((a, b) => (a.bo || 999) - (b.bo || 999));
    }

    return node;
  }

  return buildNode(bestRoot);
}

function triggerImportGedcom(onImport) {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.ged,.gedcom';
  input.onchange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (evt) => {
      try {
        const tree = parseGedcomFile(evt.target.result);
        if (tree) {
          onImport(tree, file.name);
        } else {
          alert('Could not parse the GEDCOM file. No valid records found.');
        }
      } catch (err) {
        alert('Error parsing GEDCOM file: ' + err.message);
        console.error(err);
      }
    };
    reader.readAsText(file, 'utf-8');
  };
  input.click();
}

/* ───── HELPERS ───── */
const MC='#6b9e72', FC='#9b82c4', GC='#c4a35a', GD='#8a7340', BG='#0a0a08', CD='#141410', TX='#d4cfc0', DM='#7a7568', BR='rgba(196,163,90,0.12)';
const flattenAll=(n,p='')=>{const arr=[];const nm=n.dn||'?';const fp=p?p+' › '+nm:nm;arr.push({...n,_p:fp,_n:nm});(n.ch||[]).forEach(c=>arr.push(...flattenAll(c,fp)));return arr};
const cnt=n=>{if(!n)return 0;let c=1+(n.sp?1:0);(n.ch||[]).forEach(x=>{c+=cnt(x)});return c};
const findPath=(r,id,p=[])=>{if(r.id===id)return[...p,r];for(const c of r.ch||[]){const res=findPath(c,id,[...p,r]);if(res)return res}return null};

/* ───── SUPABASE AUTH SYSTEM ───── */
const SB_AUTH_URL = SUPABASE_URL + '/auth/v1';

async function sbAuthFetch(path, opts = {}) {
  const url = SB_AUTH_URL + path;
  const resp = await fetch(url, {
    ...opts,
    headers: { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json', ...(opts.headers||{}) }
  });
  const data = await resp.json();
  if (!resp.ok) throw new Error(data.error_description || data.msg || data.message || 'Auth error');
  return data;
}

// Auth state
let authSession = null; // { access_token, user: {id, email} }
let authUser = null;    // { id, name, email, role, person_id } from users table

async function signIn(email, password) {
  const data = await sbAuthFetch('/token?grant_type=password', {
    method: 'POST',
    body: JSON.stringify({ email, password })
  });
  authSession = data;
  // Fetch user profile from users table
  const users = await sbFetch(`users?id=eq.${data.user.id}&select=*`, {
    headers: { 'Authorization': 'Bearer ' + data.access_token }
  });
  authUser = users[0] || null;
  return { session: data, user: authUser };
}

async function signOut() {
  if (authSession?.access_token) {
    try { await sbAuthFetch('/logout', { method: 'POST', headers: { 'Authorization': 'Bearer ' + authSession.access_token } }); } catch(e) {}
  }
  authSession = null;
  authUser = null;
}

async function resetPassword(email) {
  await sbAuthFetch('/recover', {
    method: 'POST',
    body: JSON.stringify({ email })
  });
}

async function createUserAccount(email, password, name, personId, role) {
  // Create auth user
  const data = await sbAuthFetch('/admin/users', {
    method: 'POST',
    headers: { 'Authorization': 'Bearer ' + authSession.access_token, 'apikey': SUPABASE_KEY },
    body: JSON.stringify({ email, password, email_confirm: true })
  });
  // Insert into users table
  await sbFetch('users', {
    method: 'POST',
    headers: { 'Authorization': 'Bearer ' + authSession.access_token, 'Prefer': 'return=minimal' },
    body: JSON.stringify({ id: data.id, name, email, person_id: personId || null, role: role || 'editor' })
  });
  return data;
}

// Override sbFetch to use auth token when available
const _origSbFetch = sbFetch;
async function sbAuthenticatedFetch(path, opts = {}) {
  if (authSession?.access_token) {
    opts.headers = { ...(opts.headers||{}), 'Authorization': 'Bearer ' + authSession.access_token };
  }
  return _origSbFetch(path, opts);
}
// Monkey-patch: after auth, use authenticated fetch
function getHeaders() {
  const h = { ...SB_HEADERS };
  if (authSession?.access_token) h['Authorization'] = 'Bearer ' + authSession.access_token;
  return h;
}

function canEdit() { return authUser && ['editor','admin','super_admin'].includes(authUser.role); }
function isAdmin() { return authUser && ['admin','super_admin'].includes(authUser.role); }
function isSuperAdmin() { return authUser && authUser.role === 'super_admin'; }

function canEditPerson(personId) {
  if (!authUser) return false;
  if (isAdmin()) return true;
  // Editors: check scope later (for now allow, RLS enforces)
  return authUser.role === 'editor';
}

/* ───── LOGIN MODAL ───── */
function LoginModal({onSuccess, onCancel, onRequestAccount}) {
  const [mode, setMode] = useState('login'); // 'login' | 'forgot'
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [error, setError] = useState('');
  const [info, setInfo] = useState('');
  const [busy, setBusy] = useState(false);
  const inp={width:'100%',background:'#1a1a14',border:'1px solid rgba(196,163,90,0.12)',color:'#d4cfc0',padding:'8px 12px',borderRadius:6,fontSize:14,outline:'none',fontFamily:'inherit'};

  const handleLogin = async () => {
    if (!email || !password) { setError('Enter email and password'); return; }
    setBusy(true); setError('');
    try {
      const result = await signIn(email, password);
      if (!result.user) {
        setError('Account not set up. Contact the family admin.');
        setBusy(false);
        return;
      }
      onSuccess(result.user);
    } catch (e) {
      setError(e.message || 'Login failed');
    }
    setBusy(false);
  };

  const handleForgot = async () => {
    if (!email) { setError('Enter your email first'); return; }
    setBusy(true); setError('');
    try {
      await resetPassword(email);
      setInfo('Password reset email sent! Check your inbox.');
    } catch (e) { setError(e.message); }
    setBusy(false);
  };

  return(
    <div style={{position:'fixed',inset:0,zIndex:300,display:'flex',alignItems:'center',justifyContent:'center'}}>
      <div style={{position:'absolute',inset:0,background:'rgba(0,0,0,0.8)'}}/>
      <div style={{position:'relative',background:'#141410',border:'1px solid rgba(196,163,90,0.12)',borderRadius:12,width:Math.min(400,window.innerWidth-32),padding:28,zIndex:301}}>
        <div style={{textAlign:'center',marginBottom:20}}>
          <div style={{fontSize:28,color:'#c4a35a',fontWeight:300,letterSpacing:1}}>Chennamkara</div>
          <div style={{fontSize:11,color:'#7a7568',letterSpacing:3,textTransform:'uppercase'}}>Sign In</div>
        </div>

        {mode==='login'&&<>
          <div style={{marginBottom:12}}>
            <label style={{fontSize:11,color:'#7a7568',display:'block',marginBottom:3}}>Email</label>
            <input value={email} onChange={e=>{setEmail(e.target.value);setError('')}} placeholder="your@email.com" style={inp}
              onKeyDown={e=>{if(e.key==='Enter')handleLogin()}}/>
          </div>
          <div style={{marginBottom:16}}>
            <label style={{fontSize:11,color:'#7a7568',display:'block',marginBottom:3}}>Password</label>
            <input type="password" value={password} onChange={e=>{setPassword(e.target.value);setError('')}} placeholder="Enter password" style={inp}
              onKeyDown={e=>{if(e.key==='Enter')handleLogin()}}/>
          </div>
          {error&&<div style={{fontSize:12,color:'#c05050',marginBottom:12}}>{error}</div>}
          <button onClick={handleLogin} disabled={busy} style={{width:'100%',background:'rgba(196,163,90,0.15)',border:'1px solid #8a7340',color:'#c4a35a',padding:'10px',borderRadius:6,cursor:'pointer',fontSize:14,marginBottom:12}}>
            {busy?'Signing in...':'Sign In'}
          </button>
          <div style={{display:'flex',justifyContent:'space-between',fontSize:12}}>
            <span onClick={()=>{setMode('forgot');setError('')}} style={{color:'#7a7568',cursor:'pointer',textDecoration:'underline'}}>Forgot password?</span>
            <span onClick={onRequestAccount} style={{color:'#9b82c4',cursor:'pointer',textDecoration:'underline'}}>Request account</span>
          </div>
        </>}

        {mode==='forgot'&&<>
          <div style={{fontSize:14,color:'#d4cfc0',marginBottom:12}}>Enter your email to receive a password reset link.</div>
          <div style={{marginBottom:16}}>
            <input value={email} onChange={e=>{setEmail(e.target.value);setError('');setInfo('')}} placeholder="your@email.com" style={inp}/>
          </div>
          {error&&<div style={{fontSize:12,color:'#c05050',marginBottom:12}}>{error}</div>}
          {info&&<div style={{fontSize:12,color:'#6b9e72',marginBottom:12}}>{info}</div>}
          <button onClick={handleForgot} disabled={busy} style={{width:'100%',background:'rgba(107,158,114,0.15)',border:'1px solid #6b9e72',color:'#6b9e72',padding:'10px',borderRadius:6,cursor:'pointer',fontSize:14,marginBottom:12}}>
            {busy?'Sending...':'Send Reset Email'}
          </button>
          <span onClick={()=>{setMode('login');setError('');setInfo('')}} style={{fontSize:12,color:'#7a7568',cursor:'pointer',textDecoration:'underline'}}>Back to sign in</span>
        </>}

        {onCancel&&<div style={{textAlign:'center',marginTop:12}}>
          <span onClick={onCancel} style={{fontSize:12,color:'#7a7568',cursor:'pointer'}}>Cancel</span>
        </div>}
      </div>
    </div>
  );
}

  const personMatches = useMemo(()=>{
    if(personSearch.length<2)return[];
    const q=personSearch.toLowerCase();

  return(

        <div style={{fontSize:12,color:'#7a7568',marginBottom:20,lineHeight:1.6}}>

        </div>
        <div style={{marginBottom:12}}>
          <label style={{fontSize:11,color:'#7a7568',display:'block',marginBottom:3}}>Your Name</label>
          <input value={name} onChange={e=>setName(e.target.value)} placeholder="Full name" style={inp}/>
        </div>
        <div style={{marginBottom:12}}>
          <label style={{fontSize:11,color:'#7a7568',display:'block',marginBottom:3}}>Email</label>

function AdminPanel({onClose}) {
  const [tab, setTab] = useState('updates'); // 'updates' | 'accounts' | 'users' | 'log'
  const [updateReqs, setUpdateReqs] = useState([]);
  const [accessReqs, setAccessReqs] = useState([]);
  const [allUsers, setAllUsers] = useState([]);
  const [editLog, setEditLog] = useState([]);
  const [loading, setLoading] = useState(true);
  const [actionMsg, setActionMsg] = useState('');
  const btnS2={background:'rgba(196,163,90,0.08)',border:'1px solid rgba(196,163,90,0.2)',color:'#c4a35a',padding:'6px 14px',borderRadius:5,fontSize:12,cursor:'pointer'};

  useEffect(()=>{
    (async()=>{
      try {
        const h = { 'Authorization': 'Bearer ' + authSession.access_token };
        const [ur, ar, us, el] = await Promise.all([
          sbFetch('update_requests?order=created_at.desc&limit=50', {headers:h}),
          sbFetch('access_requests?order=created_at.desc&limit=50', {headers:h}),
          sbFetch('users?order=name', {headers:h}),
          sbFetch('edit_log?order=created_at.desc&limit=50', {headers:h}),
        ]);
        setUpdateReqs(ur); setAccessReqs(ar); setAllUsers(us); setEditLog(el);
      } catch(e) { console.error('Admin load error:', e); }
      setLoading(false);
    })();
  },[]);

  const approveUpdate = async (req) => {
    try {
      const h = { 'Authorization': 'Bearer ' + authSession.access_token };
      // Apply changes to persons table
      await sbFetch(`persons?id=eq.${req.person_id}`, {
        method: 'PATCH', headers: {...h, 'Prefer':'return=minimal'},
        body: JSON.stringify(req.changes)
      });
      // Mark request as approved
      await sbFetch(`update_requests?id=eq.${req.id}`, {
        method: 'PATCH', headers: h,
        body: JSON.stringify({ status: 'approved', resolved_by: authUser.id, resolved_at: new Date().toISOString() })
      });
      setUpdateReqs(prev=>prev.map(r=>r.id===req.id?{...r,status:'approved'}:r));
      setActionMsg('Update approved and applied!');
      setTimeout(()=>setActionMsg(''),3000);
    } catch(e) { setActionMsg('Error: ' + e.message); }
  };

  const rejectUpdate = async (req, reason) => {
    try {
      const h = { 'Authorization': 'Bearer ' + authSession.access_token };
      await sbFetch(`update_requests?id=eq.${req.id}`, {
        method: 'PATCH', headers: h,
        body: JSON.stringify({ status: 'rejected', admin_response: reason||'', resolved_by: authUser.id, resolved_at: new Date().toISOString() })
      });
      setUpdateReqs(prev=>prev.map(r=>r.id===req.id?{...r,status:'rejected'}:r));
      setActionMsg('Request rejected');
      setTimeout(()=>setActionMsg(''),3000);
    } catch(e) { setActionMsg('Error: ' + e.message); }
  };

  const approveAccess = async (req) => {
    try {
      const h = { 'Authorization': 'Bearer ' + authSession.access_token };
      // Mark as approved (admin creates account separately via Supabase dashboard for now)
      await sbFetch(`access_requests?id=eq.${req.id}`, {
        method: 'PATCH', headers: h,
        body: JSON.stringify({ status: 'approved', resolved_by: authUser.id, resolved_at: new Date().toISOString() })
      });
      setAccessReqs(prev=>prev.map(r=>r.id===req.id?{...r,status:'approved'}:r));
      setActionMsg('Access request approved! Create their account in Supabase Auth dashboard.');
      setTimeout(()=>setActionMsg(''),5000);
    } catch(e) { setActionMsg('Error: ' + e.message); }
  };

  const changeUserRole = async (userId, newRole) => {
    try {
      const h = { 'Authorization': 'Bearer ' + authSession.access_token };
      await sbFetch(`users?id=eq.${userId}`, {
        method: 'PATCH', headers: h,
        body: JSON.stringify({ role: newRole })
      });
      setAllUsers(prev=>prev.map(u=>u.id===userId?{...u,role:newRole}:u));
      setActionMsg('Role updated!');
      setTimeout(()=>setActionMsg(''),3000);
    } catch(e) { setActionMsg('Error: ' + e.message); }
  };

  const statusBadge = (s) => {
    const colors = {pending:'#c4a35a',approved:'#6b9e72',rejected:'#c05050',clarification:'#9b82c4'};
    return <span style={{fontSize:10,background:colors[s]+'22',color:colors[s],padding:'2px 8px',borderRadius:10,textTransform:'uppercase',letterSpacing:1}}>{s}</span>;
  };

  const tabBtn = (id,label,count) => (
    <button key={id} onClick={()=>setTab(id)} style={{
      background:tab===id?'rgba(196,163,90,0.12)':'transparent',
      border:tab===id?'1px solid #8a7340':'1px solid transparent',
      color:tab===id?'#c4a35a':'#7a7568',padding:'6px 14px',borderRadius:5,fontSize:12,cursor:'pointer'
    }}>{label}{count>0&&<span style={{marginLeft:4,fontSize:10,background:'#c4a35a22',color:'#c4a35a',padding:'1px 6px',borderRadius:8}}>{count}</span>}</button>
  );

  const pendingUpdates = updateReqs.filter(r=>r.status==='pending').length;
  const pendingAccess = accessReqs.filter(r=>r.status==='pending').length;

  return(
    <div style={{maxWidth:1200,margin:'0 auto',padding:'0 16px 60px'}}>
      <div style={{display:'flex',gap:8,marginBottom:16,flexWrap:'wrap',alignItems:'center'}}>
        {tabBtn('updates','Update Requests',pendingUpdates)}
        {tabBtn('accounts','Account Requests',pendingAccess)}
        {isSuperAdmin()&&tabBtn('users','Manage Users',0)}
        {tabBtn('log','Edit Log',0)}
        {actionMsg&&<span style={{fontSize:12,color:'#6b9e72',marginLeft:16}}>{actionMsg}</span>}
      </div>

      {loading&&<div style={{color:'#7a7568',fontSize:13}}>Loading...</div>}

      {!loading&&tab==='updates'&&<div>
        {updateReqs.length===0&&<div style={{color:'#7a7568',fontSize:13}}>No update requests yet.</div>}
        {updateReqs.map(r=><div key={r.id} style={{background:'#141410',border:'1px solid rgba(196,163,90,0.08)',borderRadius:8,padding:16,marginBottom:8}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>
            <div>

              style={{...btnS2,borderColor:'#9b82c4',color:'#9b82c4',textDecoration:'none'}}>✉ Reply</a>
          </div>}
        </div>)}

      {!loading&&tab==='accounts'&&<div>
        {accessReqs.length===0&&<div style={{color:'#7a7568',fontSize:13}}>No account requests yet.</div>}

              <span style={{color:'#d4cfc0',fontSize:14,fontWeight:500}}>{r.name}</span>
              <span style={{color:'#7a7568',fontSize:12,marginLeft:8}}>claims to be {r.person_name}</span>
            </div>

          <div style={{fontSize:12,color:'#7a7568'}}>Email: {r.email}{r.phone&&' · Phone: '+r.phone} · {new Date(r.created_at).toLocaleString()}</div>

/* ───── TREE NODE ───── */
function TreeNode({node,exp,onTog,onSel,onEdit,onAdd,onDel,onEditSpouse,onDelSpouse,hl}){
  const has=node.ch&&node.ch.length>0;
  const open=exp.has(node.id);
  const isHL=hl===node.id;
  return(
    <div>
      <div style={{display:'flex',alignItems:'center',gap:6,padding:'6px 8px',borderRadius:6,
        background:isHL?'rgba(196,163,90,0.15)':'transparent',transition:'background 0.15s'}}
        onMouseEnter={e=>{if(!isHL)e.currentTarget.style.background='rgba(255,255,255,0.03)'}}
        onMouseLeave={e=>{if(!isHL)e.currentTarget.style.background='transparent'}}>
        <span onClick={()=>has&&onTog(node.id)} title={has?(open?'Collapse children':'Expand children'):''} style={{width:16,height:16,display:'flex',alignItems:'center',justifyContent:'center',
          fontSize:10,color:DM,transform:open?'rotate(90deg)':'none',transition:'transform 0.2s',
          opacity:has?1:0.2,cursor:has?'pointer':'default',background:has?'rgba(196,163,90,0.06)':'none',borderRadius:3,flexShrink:0}}>
          {has?'▶':'·'}
        </span>
        <span title={node.g==='M'?'Male':'Female'} style={{width:7,height:7,borderRadius:'50%',background:node.g==='M'?MC:FC,flexShrink:0}}/>
        <span onClick={()=>onSel(node)} title="View details" style={{fontSize:14,color:node.dec?'#6b6560':'#f0ebe0',cursor:'pointer',
          whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{node.dn}</span>
        {node.nk&&node.nk!==node.dn&&<span style={{fontSize:11,color:DM,fontStyle:'italic'}}>"{node.nk}"</span>}
        {node.sp?.dn&&<span style={{fontSize:12,color:DM,display:'inline-flex',alignItems:'center',gap:4}}>
          <span style={{color:GD,fontSize:11}}>⚭</span> <span style={{opacity:0.7}}>{node.sp.dn}</span>
          <span style={{display:'inline-flex',gap:1,opacity:0.65}}
            onMouseEnter={e=>e.currentTarget.style.opacity='1'} onMouseLeave={e=>e.currentTarget.style.opacity='0.65'}>
            <button onClick={e=>{e.stopPropagation();onEditSpouse(node)}} title="Edit spouse details" style={{background:'none',border:'none',color:GD,cursor:'pointer',fontSize:11,padding:'1px 3px'}}>✎</button>
            <button onClick={e=>{e.stopPropagation();onDelSpouse(node.id)}} title="Remove spouse from this person" style={{background:'none',border:'none',color:'#a05050',cursor:'pointer',fontSize:11,padding:'1px 3px'}}>✕</button>
          </span>
        </span>}
        {node.dob&&<span style={{fontSize:11,color:DM,marginLeft:'auto',opacity:0.6}}>b.{node.dob}</span>}
        {has&&<span title={node.ch.length+' children'} style={{fontSize:10,color:GD,background:'rgba(196,163,90,0.08)',padding:'1px 6px',borderRadius:8,flexShrink:0}}>{node.ch.length}</span>}
        <span style={{display:'flex',gap:2,marginLeft:has?0:'auto',opacity:0.4,transition:'opacity 0.2s'}}
          onMouseEnter={e=>e.currentTarget.style.opacity='1'} onMouseLeave={e=>e.currentTarget.style.opacity='0.4'}>
          <button onClick={e=>{e.stopPropagation();onEdit(node)}} title="Edit this person's details" style={{background:'none',border:'none',color:GD,cursor:'pointer',fontSize:12,padding:'2px 4px'}}>✎</button>
          <button onClick={e=>{e.stopPropagation();onAdd(node.id)}} title="Add a child under this person" style={{background:'none',border:'none',color:MC,cursor:'pointer',fontSize:12,padding:'2px 4px'}}>+</button>
          {!node.sp?.dn&&<button onClick={e=>{e.stopPropagation();onEditSpouse(node)}} title="Add a spouse to this person" style={{background:'none',border:'none',color:FC,cursor:'pointer',fontSize:12,padding:'2px 4px'}}>⚭</button>}
          {!has&&<button onClick={e=>{e.stopPropagation();onDel(node.id)}} title="Delete this person (only if no children)" style={{background:'none',border:'none',color:'#a05050',cursor:'pointer',fontSize:12,padding:'2px 4px'}}>✕</button>}
        </span>
      </div>
      {has&&open&&<div style={{paddingLeft:20,marginLeft:18,borderLeft:`1px solid ${BR}`}}>
        {node.ch.map(c=><TreeNode key={c.id} node={c} exp={exp} onTog={onTog} onSel={onSel} onEdit={onEdit} onAdd={onAdd} onDel={onDel} onEditSpouse={onEditSpouse} onDelSpouse={onDelSpouse} hl={hl}/>)}

    </div>
  );
}

/* ───── APP ───── */
function App(){
  const [tree,setTree]=useState(null);
  const [loading,setLoading]=useState(true);
  const [exp,setExp]=useState(new Set());
  const [sel,setSel]=useState(null);
  const [search,setSearch]=useState('');
  const [hl,setHl]=useState(null);
  const [editing,setEditing]=useState(null);
  const [adding,setAdding]=useState(null);
  const [spouseEditing,setSpouseEditing]=useState(null);
  const [msg,setMsg]=useState('');
  const [showLogin,setShowLogin]=useState(false);
  const [showRequestAccount,setShowRequestAccount]=useState(false);
  const [showMigrate,setShowMigrate]=useState(false);
  const [pendingAction,setPendingAction]=useState(null);
  const [user,setUser]=useState(null); // authUser object or {role:'viewer'}
  const [activeTab,setActiveTab]=useState('tree'); // 'tree' | 'admin'
  const [viewerGate,setViewerGate]=useState(true); // true = locked, must enter family password
  const [gatePassword,setGatePassword]=useState('');
  const [gateError,setGateError]=useState('');
  const [gateChecking,setGateChecking]=useState(false);
  const flat=useMemo(()=>tree?flattenAll(tree):[],[tree]);

  // Auth gate: require login for edit actions
  const requireAuth = useCallback((action) => {
    if (user && (canEdit() || user.role === 'viewer')) {
      // Viewers AND editors/admins can open edit forms
      // The save handler routes differently based on role
      action();
    } else {
      setPendingAction(() => action);
      setShowLogin(true);
    }
  }, [user]);

  const handleLoginSuccess = (u) => {
    setUser(u);
    setShowLogin(false);
    setViewerGate(false); // signed-in users bypass the gate
    if (u.role !== 'viewer') {
      setMsg('Signed in as ' + (u.name || u.email));
    }
    setTimeout(()=>setMsg(''),3000);
    if (pendingAction) { pendingAction(); setPendingAction(null); }
  };

  const handleSignOut = async () => {
    await signOut();
    setUser(null);
    setActiveTab('tree');
    setViewerGate(true); // re-lock on sign out
    setMsg('Signed out');
    setTimeout(()=>setMsg(''),2000);
  };

  const handleViewerGate = async () => {
    if (!gatePassword) { setGateError('Enter the family password'); return; }
    setGateChecking(true); setGateError('');
    try {
      const settings = await sbFetch("settings?key=eq.viewer_password&select=value");
      if (settings[0]?.value === gatePassword) {
        setViewerGate(false);
        setUser({ role: 'viewer', name: 'Viewer' });
      } else {
        setGateError('Incorrect password. Ask a family member for access.');
      }
    } catch (e) {
      setGateError('Could not verify. Try again.');
    }
    setGateChecking(false);
  };

  // Load from Supabase first, fall back to GEDCOM file
  useEffect(()=>{
    (async()=>{
      // Try Supabase
      let parsed = await loadFromSupabase();
      let source = 'Supabase';
      // Fallback to GEDCOM file
      if(!parsed){
        parsed = await loadSourceGedcom();
        source = 'GEDCOM file';
      }
      if(parsed){
        setTree(parsed);
        const s=new Set();
        const add=(n,d)=>{if(d<2&&n.ch?.length){s.add(n.id);n.ch.forEach(c=>add(c,d+1))}};
        add(parsed,0);
        setExp(s);
        setMsg('Loaded '+cnt(parsed)+' people from '+source);
        setTimeout(()=>setMsg(''),3000);
      } else {
        setMsg('Failed to load family tree');
      }
      setLoading(false);
    })();
  },[]);

  const findNodeById=useCallback((root,id)=>{
    if(!root)return null;
    if(root.id===id)return root;
    for(const c of root.ch||[]){
      const found=findNodeById(c,id);
      if(found)return found;
    }
    return null;
  },[]);

  const getAncestorIds=useCallback((root,id)=>{
    const path=findPath(root,id)||[];
    return path.slice(0,-1).map(n=>n.id);
  },[]);

  const updateNode=useCallback((root,id,updater)=>{
    if(root.id===id)return updater(root);
    if(!root.ch)return root;
    return {...root,ch:root.ch.map(c=>updateNode(c,id,updater))};
  },[]);

  const removeNode=useCallback((root,targetId)=>{
    if(!root.ch)return root;
    return {...root,ch:root.ch.filter(c=>c.id!==targetId).map(c=>removeNode(c,targetId))};
  },[]);

  const toggle=useCallback(id=>{
    setExp(p=>{const n=new Set(p);n.has(id)?n.delete(id):n.add(id);return n});
  },[]);

  const expandAll=()=>{const s=new Set();flat.forEach(n=>{if(n.ch?.length)s.add(n.id)});setExp(s)};
  const collapseAll=()=>setExp(new Set());
  const expandTo=d=>{const s=new Set();const add=(n,depth)=>{if(depth<d&&n.ch?.length){s.add(n.id);n.ch.forEach(c=>add(c,depth+1))}};add(tree,0);setExp(s)};

  const matches=useMemo(()=>{
    if(search.length<2)return[];
    const q=search.toLowerCase();
    const results=[];
    flat.forEach(n=>{
      // Match on person name or nickname
      if((n.dn||'').toLowerCase().includes(q)||(n.nk||'').toLowerCase().includes(q)){
        results.push({...n, _matchType:'person'});
      }
      // Match on spouse name - show spouse as a separate result pointing to this node
      if(n.sp?.dn && (n.sp.dn||'').toLowerCase().includes(q)){
        results.push({...n, _n: n.sp.dn, _matchType:'spouse', _spouseOf: n.dn, g: n.sp.g || 'F'});
      }
    });
    return results.slice(0,15);
  },[search,flat]);

  const revealNode=useCallback((nodeId,opts={})=>{
    const ancestorIds=getAncestorIds(tree,nodeId);
    setExp(p=>{
      const s=new Set(p);
      ancestorIds.forEach(id=>s.add(id));
      return s;
    });
    setHl(nodeId);
    if(opts.select){
      const latest=findNodeById(tree,nodeId);
      if(latest)setSel(latest);
    }
    setTimeout(()=>setHl(null),2000);
  },[tree,getAncestorIds,findNodeById]);

  const navigateTo=useCallback(node=>{
    revealNode(node.id,{select:true});
    setSearch('');
  },[revealNode]);

  // State for viewer submission flow
  const [viewerSubmitData, setViewerSubmitData] = useState(null); // {personId, personName, changes, type}
  const [showViewerIdentity, setShowViewerIdentity] = useState(false);

  const isViewer = () => user && user.role === 'viewer';

  const handleSaveEdit=(data)=>{
    if (isViewer()) {
      // Viewer: collect identity then send to request queue
      const node = findNodeById(tree, data.id);
      setViewerSubmitData({ personId: data.id, personName: node?.dn || data.dn || data.id, changes: data, type: 'edit' });
      setShowViewerIdentity(true);
      setEditing(null);
      return;
    }
    let updatedNodeId=data.id;
    setTree(prev=>{
      const next=updateNode(prev,data.id,(existing)=>({...existing,...data,ch:existing.ch||[],sp:existing.sp}));
      return next;
    });
    setEditing(null);
    savePerson(data, user?.name||user?.email||"").then(()=>{
      setMsg('Saved to database!');
    }).catch(e=>{
      console.error('Save error:',e);
      setMsg('Saved locally (DB sync failed)');
    });
    setTimeout(()=>{revealNode(updatedNodeId,{select:false})},0);
    setTimeout(()=>setMsg(''),2000);
  };

  const handleAdd=(data)=>{
    if (isViewer()) {
      const parentNode = findNodeById(tree, adding);
      setViewerSubmitData({ personId: adding, personName: parentNode?.dn || adding, changes: {...data, _action: 'add_child'}, type: 'add' });
      setShowViewerIdentity(true);
      setAdding(null);
      return;
    }
    const parentId=adding;
    const newNode={...data,ch:[]};
    setTree(prev=>updateNode(prev,parentId,p=>({...p,ch:[...(p.ch||[]),newNode]})));
    setAdding(null);
    setSel(newNode);
    addPersonToDB(data, parentId, user?.name||user?.email||"").then(()=>{
      setMsg('Added to database!');
    }).catch(e=>{
      console.error('Add error:',e);
      setMsg('Added locally (DB sync failed)');
    });
    setTimeout(()=>revealNode(newNode.id,{select:false}),0);
    setTimeout(()=>setMsg(''),2000);
  };

  const handleDelete=(id)=>{
    if (isViewer()) {
      const node = findNodeById(tree, id);
      setViewerSubmitData({ personId: id, personName: node?.dn || id, changes: { _action: 'delete' }, type: 'delete' });
      setShowViewerIdentity(true);
      return;
    }
    const node=findNodeById(tree,id);
    if(node?.ch?.length){
      setMsg('Cannot delete: has descendants');
      setTimeout(()=>setMsg(''),3000);
      return;
    }
    if(!confirm(`Delete ${node?.dn||'this person'}?`))return;
    const parentIds=getAncestorIds(tree,id);
    const parentId=parentIds[parentIds.length-1]||null;
    setTree(prev=>removeNode(prev,id));
    if(sel?.id===id)setSel(parentId?findNodeById(tree,parentId):null);
    if(editing?.id===id)setEditing(null);
    if(adding===id)setAdding(null);
    setExp(p=>{const s=new Set(p); s.delete(id); return s;});
    // Delete from Supabase
    deletePersonFromDB(id, user?.name||user?.email||"").then(()=>{
      setMsg('Deleted from database');
    }).catch(e=>{
      console.error('Delete error:',e);
      setMsg('Deleted locally (DB sync failed)');
    });
    setTimeout(()=>{if(parentId) revealNode(parentId,{select:true})},0);
    setTimeout(()=>setMsg(''),2000);
  };

  const handleSaveSpouse=(data)=>{
    if(!spouseEditing?.parentId)return;
    const parentId=spouseEditing.parentId;
    if (isViewer()) {
      const parentNode = findNodeById(tree, parentId);
      setViewerSubmitData({ personId: parentId, personName: parentNode?.dn || parentId, changes: {...data, _action: 'edit_spouse'}, type: 'spouse' });
      setShowViewerIdentity(true);
      setSpouseEditing(null);
      return;
    }
    const spouseId=(spouseEditing.spouse&&spouseEditing.spouse.id)||data.id||('@sp_'+Date.now()+'@');
    const spouseData={...data, id:spouseId};
    setTree(prev=>updateNode(prev,parentId,(existing)=>({...existing,sp:{...(existing.sp||{}),...spouseData}})));
    setSpouseEditing(null);
    saveSpouseToDB(parentId, spouseData, user?.name||user?.email||"").then(()=>{
      setMsg('Spouse saved to database!');
    }).catch(e=>{
      console.error('Spouse save error:',e);
      setMsg('Spouse saved locally (DB sync failed)');
    });
    setTimeout(()=>setMsg(''),2000);
  };

  const handleDeleteSpouse=(parentId)=>{
    if (isViewer()) {
      const parent = findNodeById(tree, parentId);
      setViewerSubmitData({ personId: parentId, personName: parent?.dn || parentId, changes: { _action: 'delete_spouse', spouse_name: parent?.sp?.dn }, type: 'delete_spouse' });
      setShowViewerIdentity(true);
      return;
    }
    const parent=findNodeById(tree,parentId);
    if(!parent?.sp){
      setMsg('No spouse to delete');
      setTimeout(()=>setMsg(''),2000);
      return;
    }
    const spouseId=parent.sp.id;
    if(!confirm(`Delete spouse ${parent.sp.dn||'record'}?`))return;
    setTree(prev=>updateNode(prev,parentId,(existing)=>({...existing,sp:null})));
    if(spouseEditing?.parentId===parentId)setSpouseEditing(null);
    // Delete from Supabase
    if(spouseId){
      deleteSpouseFromDB(parentId, spouseId, user?.name||user?.email||"").catch(e=>{
        console.error('Spouse delete error:',e);
      });
    }
    setMsg('Spouse deleted');
    setTimeout(()=>setMsg(''),2000);
  };

  const total=tree?cnt(tree):0;
  const btnS={background:CD,border:`1px solid ${BR}`,color:DM,padding:'6px 12px',borderRadius:5,fontSize:12,cursor:'pointer',whiteSpace:'nowrap'};
  const gateInp={width:'100%',background:'#1a1a14',border:'1px solid '+BR,color:TX,padding:'10px 14px',borderRadius:6,fontSize:15,outline:'none',fontFamily:'inherit',textAlign:'center',letterSpacing:1};

  // ─── VIEWER GATE: Must enter family password to see anything ───
  if(viewerGate) return(
    <div style={{background:BG,minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',flexDirection:'column',gap:16}}>
      <style>{'@keyframes spin{to{transform:rotate(360deg)}}'}</style>
      <span style={{fontSize:36,color:GC,fontWeight:300,letterSpacing:2}}>Chennamkara</span>
      <span style={{fontSize:11,color:DM,letterSpacing:4,textTransform:'uppercase',marginBottom:8}}>Family Tree</span>
      <div style={{width:Math.min(340,window.innerWidth-48),textAlign:'center'}}>
        <div style={{fontSize:13,color:DM,marginBottom:16,lineHeight:1.6}}>Enter the family password to view the tree</div>
        <input type="password" value={gatePassword} onChange={e=>{setGatePassword(e.target.value);setGateError('')}}
          placeholder="Family password" style={gateInp}
          onKeyDown={e=>{if(e.key==='Enter')handleViewerGate()}}/>
        {gateError&&<div style={{fontSize:12,color:'#c05050',marginTop:8}}>{gateError}</div>}
        <button onClick={handleViewerGate} disabled={gateChecking}
          style={{width:'100%',marginTop:12,background:'rgba(196,163,90,0.15)',border:'1px solid '+GD,color:GC,padding:'10px',borderRadius:6,cursor:'pointer',fontSize:14}}>
          {gateChecking?'Checking...':'Enter'}
        </button>
        <div style={{marginTop:20,borderTop:'1px solid '+BR,paddingTop:16}}>
          <span style={{fontSize:12,color:DM}}>Have an account? </span>
          <span onClick={()=>{setShowLogin(true)}} style={{fontSize:12,color:GC,cursor:'pointer',textDecoration:'underline'}}>Sign in</span>
        </div>
      </div>
      {showLogin&&<LoginModal onSuccess={handleLoginSuccess} onCancel={()=>setShowLogin(false)} onRequestAccount={()=>{setShowLogin(false);setShowRequestAccount(true)}}/>}
      {showRequestAccount&&<RequestAccountModal flat={flat} onDone={()=>setShowRequestAccount(false)} onCancel={()=>setShowRequestAccount(false)}/>}
    </div>
  );

  if(loading) return(
    <div style={{background:BG,minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',flexDirection:'column',gap:16}}>
      <span style={{fontSize:28,color:GC,fontWeight:300,letterSpacing:1}}>Chennamkara</span>
      <span style={{fontSize:13,color:DM}}>Loading family tree...</span>
      <div style={{width:40,height:40,border:'2px solid '+BR,borderTopColor:GC,borderRadius:'50%',animation:'spin 1s linear infinite'}}/>
      <style>{'@keyframes spin{to{transform:rotate(360deg)}}'}</style>
    </div>
  );

  if(!tree) return(
    <div style={{background:BG,minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',flexDirection:'column',gap:16}}>
      <span style={{fontSize:28,color:GC,fontWeight:300}}>Chennamkara</span>
      <span style={{fontSize:13,color:'#a05050'}}>Could not load family tree.</span>
      <button onClick={()=>triggerImportGedcom((newTree,fileName)=>{setTree(newTree);setMsg('Imported: '+fileName)})}
        style={{...btnS,background:'rgba(107,158,114,0.1)',borderColor:MC,color:MC,padding:'10px 20px'}}>⬆ Import GEDCOM File</button>
    </div>
  );

  return(
    <div style={{background:BG,minHeight:'100vh',color:TX,fontFamily:'system-ui,-apple-system,sans-serif'}}>
      <div style={{position:'sticky',top:0,zIndex:50,background:`linear-gradient(180deg,${BG} 80%,transparent)`,padding:'16px 16px 24px'}}>
        <div style={{maxWidth:1200,margin:'0 auto'}}>
          <div style={{display:'flex',alignItems:'baseline',gap:12,marginBottom:4}}>
            <span style={{fontSize:28,color:GC,fontWeight:300,letterSpacing:1,cursor:'pointer'}} onClick={()=>setActiveTab('tree')}>Chennamkara</span>
            <span style={{fontSize:11,color:DM,letterSpacing:3,textTransform:'uppercase'}}>Family Tree</span>
            {user&&isAdmin()&&<>
              <span onClick={()=>setActiveTab('tree')} style={{fontSize:12,color:activeTab==='tree'?GC:DM,cursor:'pointer',padding:'2px 8px',borderRadius:4,background:activeTab==='tree'?'rgba(196,163,90,0.1)':'transparent'}}>🌳 Tree</span>
              <span onClick={()=>setActiveTab('admin')} style={{fontSize:12,color:activeTab==='admin'?GC:DM,cursor:'pointer',padding:'2px 8px',borderRadius:4,background:activeTab==='admin'?'rgba(196,163,90,0.1)':'transparent'}}>👤 Admin</span>
            </>}
            <span style={{flex:1}}/>
            {user?
              <span style={{display:'flex',alignItems:'center',gap:8,fontSize:12}}>
                <span style={{width:6,height:6,borderRadius:'50%',background:user.role==='viewer'?DM:MC}}/>
                <span style={{color:TX}}>{user.name||user.email||'Viewer'}</span>
                <span style={{fontSize:10,color:DM,textTransform:'uppercase'}}>{user.role==='viewer'?'viewing':user.role}</span>
                {user.role!=='viewer'&&<span onClick={handleSignOut} style={{color:DM,cursor:'pointer',textDecoration:'underline',marginLeft:4}}>Sign out</span>}
              </span>
            :
              <span onClick={()=>setShowLogin(true)} style={{fontSize:12,color:GC,cursor:'pointer',padding:'4px 12px',border:'1px solid '+GD,borderRadius:5}}>🔒 Sign In</span>
            }
            {msg&&<span style={{fontSize:12,color:'#6b9e72',marginLeft:8,animation:'fadeIn 0.3s'}}>{msg}</span>}
          </div>
          <div style={{display:'flex',gap:20,fontSize:12,color:DM,marginBottom:12}}>
            <span><strong style={{color:GD}}>{total}</strong> people</span>
          </div>
          <div style={{display:'flex',gap:8,flexWrap:'wrap',alignItems:'center'}}>
            <div style={{position:'relative',flex:1,minWidth:180,maxWidth:360}}>
              <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search by name..."
                style={{width:'100%',background:CD,border:`1px solid ${BR}`,color:TX,padding:'7px 12px',borderRadius:6,fontSize:13,outline:'none'}}/>
              {matches.length>0&&<div style={{position:'absolute',top:'100%',left:0,right:0,background:CD,border:`1px solid rgba(196,163,90,0.25)`,
                borderTop:'none',borderRadius:'0 0 6px 6px',maxHeight:280,overflowY:'auto',zIndex:60}}>
                {matches.map((m,mi)=><div key={m.id+'_'+mi} onClick={()=>navigateTo(m)}
                  style={{padding:'6px 12px',cursor:'pointer',fontSize:13,display:'flex',alignItems:'center',gap:6}}
                  onMouseEnter={e=>e.currentTarget.style.background='rgba(255,255,255,0.04)'}
                  onMouseLeave={e=>e.currentTarget.style.background='transparent'}>
                  <span style={{width:6,height:6,borderRadius:'50%',background:m.g==='M'?MC:FC}}/><span>{m._n}</span>
                  {m._matchType==='spouse'&&<span style={{fontSize:10,color:DM,fontStyle:'italic'}}>⚭ spouse of {m._spouseOf}</span>}
                </div>)}
              </div>}
            </div>
            {[['Expand All',expandAll],['Collapse',collapseAll],['2 Lvls',()=>expandTo(2)],['3 Lvls',()=>expandTo(3)]].map(([l,f])=>
              <button key={l} onClick={f} style={btnS}>{l}</button>)}
            <button onClick={()=>{downloadGedcom(tree);setMsg('GEDCOM exported!')}} title="Download the family tree as a GEDCOM file" style={{...btnS,background:'rgba(196,163,90,0.1)',borderColor:GD,color:GC}}>⬇ Export GEDCOM</button>
            <button onClick={()=>triggerImportGedcom((newTree,fileName)=>{setTree(newTree);setMsg('Imported: '+fileName);expandTo(2)})} title="Import a GEDCOM file to view (does not save to database)" style={{...btnS,background:'rgba(107,158,114,0.1)',borderColor:MC,color:MC}}>⬆ Import GEDCOM</button>
            {user&&isAdmin()&&<button onClick={()=>setShowMigrate(true)} title="Replace all database data with a GEDCOM file" style={{...btnS,background:'rgba(196,163,90,0.06)',borderColor:'rgba(196,163,90,0.3)',color:GD}}>🗄 Migrate GEDCOM→DB</button>}
          </div>
        </div>
      </div>
      {activeTab==='tree'&&<>
      <div style={{maxWidth:1200,margin:'0 auto',padding:'0 16px 60px'}}>
        <TreeNode node={tree} exp={exp} onTog={toggle} onSel={(node)=>setSel(findNodeById(tree,node.id)||node)} onEdit={(node)=>requireAuth(()=>setEditing(findNodeById(tree,node.id)||node))} onAdd={(id)=>requireAuth(()=>setAdding(id))} onDel={(id)=>requireAuth(()=>handleDelete(id))} onEditSpouse={(node)=>requireAuth(()=>setSpouseEditing({parentId:node.id,spouse:{...(node.sp||{}),dn:(node.sp&&node.sp.dn)||''}}))} onDelSpouse={(id)=>requireAuth(()=>handleDeleteSpouse(id))} hl={hl}/>
      </div>
      {sel&&!editing&&<Detail node={findNodeById(tree,sel.id)||sel} root={tree} onClose={()=>setSel(null)} onEdit={(node)=>requireAuth(()=>setEditing(findNodeById(tree,node.id)||node))} onEditSpouse={(node)=>requireAuth(()=>setSpouseEditing({parentId:node.id,spouse:{...(node.sp||{}),dn:(node.sp&&node.sp.dn)||''}}))} onDelSpouse={(id)=>requireAuth(()=>handleDeleteSpouse(id))}/>}
      {editing&&<EditForm node={findNodeById(tree,editing.id)||editing} onSave={handleSaveEdit} onCancel={()=>setEditing(null)} isNew={false}/>}
      {spouseEditing&&<EditForm node={spouseEditing.spouse||empty()} onSave={handleSaveSpouse} onCancel={()=>setSpouseEditing(null)} isNew={false}/>}
      {adding&&<EditForm node={empty()} onSave={handleAdd} onCancel={()=>setAdding(null)} isNew={true} parentId={adding} parentName={flat.find(n=>n.id===adding)?._n}/>}
      </>}
      {activeTab==='admin'&&user&&isAdmin()&&<AdminPanel/>}
      {showLogin&&<LoginModal onSuccess={handleLoginSuccess} onCancel={()=>{setShowLogin(false);setPendingAction(null)}} onRequestAccount={()=>{setShowLogin(false);setShowRequestAccount(true)}}/>}
      {showRequestAccount&&<RequestAccountModal flat={flat} onDone={()=>setShowRequestAccount(false)} onCancel={()=>setShowRequestAccount(false)}/>}
      {showViewerIdentity&&viewerSubmitData&&<ViewerIdentityModal submitData={viewerSubmitData} onDone={()=>{setShowViewerIdentity(false);setViewerSubmitData(null);setMsg('Update request submitted!')}} onCancel={()=>{setShowViewerIdentity(false);setViewerSubmitData(null)}}/>}
      {showMigrate&&<MigrateDialog onDone={()=>setShowMigrate(false)} onCancel={()=>setShowMigrate(false)}/>}
      {user&&user.role!=='viewer'&&<div style={{position:'fixed',bottom:16,right:16,background:CD,border:'1px solid '+BR,borderRadius:8,padding:'8px 14px',fontSize:11,color:DM,zIndex:80,display:'flex',alignItems:'center',gap:8}}>
        <span style={{width:6,height:6,borderRadius:'50%',background:MC}}/>
        <span>Signed in as <strong style={{color:TX}}>{user.name||user.email}</strong></span>
        <span style={{color:GD}}>·</span>
        <span>{isAdmin()?'Admin':'Editor'} — changes save to database</span>
      </div>}
    </div>
  );
}

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
