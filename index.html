      </div>}
    </div>
  );
}

/* ───── MEDIA UPLOAD MODAL ───── */
function MediaUploadModal({flat, user, onDone, onCancel}) {
  const [files, setFiles] = useState([]);
  const [caption, setCaption] = useState('');
  const [eventDate, setEventDate] = useState('');
  const [tagSearch, setTagSearch] = useState('');
  const [taggedPersons, setTaggedPersons] = useState([]);
  const [uploading, setUploading] = useState(false);
  const [progress, setProgress] = useState('');
  const [error, setError] = useState('');
  const [previews, setPreviews] = useState([]);

  const inp = { width: '100%', background: '#1a1a14', border: `1px solid ${BR}`, color: TX, padding: '8px 12px', borderRadius: 6, fontSize: 14, outline: 'none', fontFamily: 'inherit' };

  const tagMatches = useMemo(() => {
    if (tagSearch.length < 2) return [];
    const q = tagSearch.toLowerCase();
    const alreadyTagged = new Set(taggedPersons.map(p => p.id));
    return flat.filter(n => !alreadyTagged.has(n.id) && ((n.dn || '').toLowerCase().includes(q) || (n.nk || '').toLowerCase().includes(q))).slice(0, 8);
  }, [tagSearch, flat, taggedPersons]);

  const handleFiles = (e) => {
    const selected = Array.from(e.target.files);
    setFiles(selected);
    // Generate previews for images
    const prevs = [];
    selected.forEach(f => {
      if (f.type.startsWith('image/')) {
        const url = URL.createObjectURL(f);
        prevs.push({ name: f.name, url, type: 'image' });
      } else {
        prevs.push({ name: f.name, url: null, type: 'document' });
      }
    });
    setPreviews(prevs);
  };

  const handleUpload = async () => {
    if (files.length === 0) { setError('Select at least one file'); return; }
    if (taggedPersons.length === 0) { setError('Tag at least one family member'); return; }
    setUploading(true); setError('');
    try {
      for (let i = 0; i < files.length; i++) {
        const file = files[i];
        setProgress(`Uploading ${i + 1} of ${files.length}: ${file.name}`);
        const isDoc = file.type === 'application/pdf' || !file.type.startsWith('image/');
        const result = await uploadToCloudinary(file, 'gallery');
        await saveMediaRecord({
          cloudinary_url: result.url,
          cloudinary_id: result.publicId,
          media_type: isDoc ? 'document' : 'photo',
          file_name: isDoc ? file.name : '',
          caption: caption,
          uploaded_by: user.name || user.email || '',
          uploaded_by_id: user.id || '',
          tagged_persons: taggedPersons.map(p => p.id),
          event_date: eventDate,
        });
      }
      setProgress('');
      onDone();
    } catch (err) {
      setError('Upload failed: ' + err.message);
      setUploading(false);
    }
  };

  return (
    <div style={{ position: 'fixed', inset: 0, zIndex: 300, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
      <div onClick={onCancel} style={{ position: 'absolute', inset: 0, background: 'rgba(0,0,0,0.7)' }} />
      <div style={{ position: 'relative', background: CD, border: `1px solid ${BR}`, borderRadius: 12, width: Math.min(480, window.innerWidth - 32), maxHeight: '90vh', overflowY: 'auto', padding: 24, zIndex: 301 }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 16 }}>
          <span style={{ fontSize: 18, color: GC, fontWeight: 300 }}>Upload Photos & Documents</span>
          <button onClick={onCancel} style={{ background: 'none', border: 'none', color: DM, fontSize: 18, cursor: 'pointer' }}>✕</button>
        </div>

        {/* File picker */}
        <div style={{ marginBottom: 16 }}>
          <label style={{ display: 'block', background: 'rgba(196,163,90,0.06)', border: `2px dashed ${GD}`, borderRadius: 8, padding: 20, textAlign: 'center', cursor: 'pointer' }}>
            <div style={{ fontSize: 28, marginBottom: 4 }}>📷 📄</div>
            <div style={{ fontSize: 13, color: GC }}>{files.length > 0 ? `${files.length} file(s) selected` : 'Tap to select photos or PDFs'}</div>
            <div style={{ fontSize: 11, color: DM, marginTop: 4 }}>Images & PDF documents accepted</div>
            <input type="file" accept="image/*,.pdf" multiple onChange={handleFiles} style={{ display: 'none' }} />
          </label>
          {previews.length > 0 && <div style={{ display: 'flex', gap: 6, marginTop: 8, flexWrap: 'wrap' }}>
            {previews.map((p, i) => (
              <div key={i} style={{ width: 60, height: 60, borderRadius: 6, overflow: 'hidden', background: '#1a1a14', border: `1px solid ${BR}`, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                {p.type === 'image' ? <img src={p.url} style={{ width: '100%', height: '100%', objectFit: 'cover' }} alt="" /> : <span style={{ fontSize: 24 }}>📄</span>}
              </div>
            ))}
          </div>}
        </div>

        {/* Caption */}
        <div style={{ marginBottom: 12 }}>
          <label style={{ fontSize: 11, color: DM, display: 'block', marginBottom: 3 }}>Caption (optional)</label>
          <input value={caption} onChange={e => setCaption(e.target.value)} placeholder="e.g., Family reunion 2023" style={inp} />
        </div>

        {/* Event date */}
        <div style={{ marginBottom: 12 }}>
          <label style={{ fontSize: 11, color: DM, display: 'block', marginBottom: 3 }}>Date (optional)</label>
          <input type="date" value={eventDate} onChange={e => setEventDate(e.target.value)} style={inp} />
        </div>

        {/* Tag people */}
        <div style={{ marginBottom: 16, position: 'relative' }}>
          <label style={{ fontSize: 11, color: DM, display: 'block', marginBottom: 3 }}>Tag family members *</label>
          {taggedPersons.length > 0 && <div style={{ display: 'flex', gap: 4, flexWrap: 'wrap', marginBottom: 6 }}>
            {taggedPersons.map(p => (
              <span key={p.id} style={{ display: 'inline-flex', alignItems: 'center', gap: 4, fontSize: 11, color: TX, background: 'rgba(107,158,114,0.1)', border: `1px solid rgba(107,158,114,0.3)`, padding: '2px 8px', borderRadius: 12 }}>
                <span style={{ width: 5, height: 5, borderRadius: '50%', background: p.g === 'M' ? MC : FC }} />
                {p.dn}
                <span onClick={() => setTaggedPersons(prev => prev.filter(t => t.id !== p.id))} style={{ cursor: 'pointer', color: DM, marginLeft: 2 }}>✕</span>
              </span>
            ))}
          </div>}
          <input value={tagSearch} onChange={e => setTagSearch(e.target.value)} placeholder="Search by name to tag..." style={inp} />
          {tagMatches.length > 0 && <div style={{ position: 'absolute', top: '100%', left: 0, right: 0, background: '#141410', border: `1px solid rgba(196,163,90,0.25)`, borderRadius: '0 0 6px 6px', maxHeight: 200, overflowY: 'auto', zIndex: 10 }}>
            {tagMatches.map(m => <div key={m.id} onClick={() => { setTaggedPersons(prev => [...prev, m]); setTagSearch(''); }}
              style={{ padding: '6px 12px', cursor: 'pointer', fontSize: 12, display: 'flex', alignItems: 'center', gap: 6 }}
              onMouseEnter={e => e.currentTarget.style.background = 'rgba(255,255,255,0.04)'}
              onMouseLeave={e => e.currentTarget.style.background = 'transparent'}>
              <span style={{ width: 5, height: 5, borderRadius: '50%', background: m.g === 'M' ? MC : FC }} /><span>{m.dn}</span>
            </div>)}
          </div>}
        </div>

        {error && <div style={{ fontSize: 12, color: '#c05050', marginBottom: 12 }}>{error}</div>}
        {progress && <div style={{ fontSize: 12, color: GC, marginBottom: 12 }}>{progress}</div>}

        <div style={{ display: 'flex', gap: 8, justifyContent: 'flex-end' }}>
          <button onClick={onCancel} style={{ background: 'transparent', border: `1px solid ${BR}`, color: DM, padding: '8px 20px', borderRadius: 6, cursor: 'pointer', fontSize: 13 }}>Cancel</button>
          <button onClick={handleUpload} disabled={uploading} style={{ background: 'rgba(196,163,90,0.15)', border: `1px solid ${GD}`, color: GC, padding: '8px 20px', borderRadius: 6, cursor: 'pointer', fontSize: 13 }}>
            {uploading ? 'Uploading...' : `Upload ${files.length || ''} File${files.length !== 1 ? 's' : ''}`}
          </button>
        </div>
      </div>
    </div>
  );
}

/* ───── GEDCOM DIFF & MERGE UI — BASKET WORKFLOW ───── */
function GedcomDiffModal({ onClose, personMap, familyMap, user, onMergeComplete, onSilentRefresh }) {
  const [diffResult, setDiffResult] = useState(null);
  const [fileName, setFileName] = useState('');
  const [extGedcomText, setExtGedcomText] = useState(''); // keep raw text for merge-into
  const [extFamilyIds, setExtFamilyIds] = useState(new Set());
  const [extFamiliesMap, setExtFamiliesMap] = useState({}); // full parsed external families for child comparison
  const [extPeopleMap, setExtPeopleMap] = useState({}); // parsed external persons for breadcrumbs
  const [tab, setTab] = useState('summary');
  const [merging, setMerging] = useState(false);
  const [mergeLog, setMergeLog] = useState([]);
  const [expandedDiffs, setExpandedDiffs] = useState(new Set());

  // Direction state: 'import' | 'export' | null
  // extDir: { personId: 'import'|null } for ext-only persons
  const [extDir, setExtDir] = useState({});
  // ftlsDir: { personId: 'export'|null } for ftls-only persons
  const [ftlsDir, setFtlsDir] = useState({});
  // changedDir: { personId: 'import'|'export'|null } person-level default
  const [changedDir, setChangedDir] = useState({});
  // fieldDir: { personId: { fieldKey: 'import'|'export'|null } } per-field override
  const [fieldDir, setFieldDir] = useState({});
  // extFamDir: { famId: 'import'|null }
  const [extFamDir, setExtFamDir] = useState({});
  // familyFactDir: { famId: { fieldKey: 'import'|'export'|null } }
  // Same-ID family/marriage diffs are FAM-level facts, not person fields, so
  // they need their own basket state. Without this, Review Marriage Facts could
  // update FTLS but there was no way to mark those FAM facts for GEDCOM export.
  const [familyFactDir, setFamilyFactDir] = useState({});
  const [fuzzyResolved, setFuzzyResolved] = useState({}); // { extId: 'remapped' | 'ignored' }
  const [fuzzyFamResolved, setFuzzyFamResolved] = useState({}); // { extFamId: 'remapped' | 'ignored' }
  const [showAddrOnly, setShowAddrOnly] = useState(false);
  const [showOthers, setShowOthers] = useState(false);
  const [familyReview, setFamilyReview] = useState(null);
  const [ftlsDupReview, setFtlsDupReview] = useState(null); // { currentId, duplicateId, current, duplicate, matchReasons, score }
  // External-merge review state: opens DuplicateResolveModal with keepId = FTLS id,
  // orphan = external person (from ext data, not Supabase). This is what wires the
  // fuzzy-matched-person "Keep FTLS ID, merge fields" flow.
  const [extMergeReview, setExtMergeReview] = useState(null); // { ftlsId, extId, ftlsPerson, extPerson, matchReasons, score }
  // Follow-on matches queued after a successful merge — rendered at the top of
  // the Fuzzy tab so the user can walk the chain one step at a time (Option A
  // cascade: nothing auto-merges, each step needs explicit confirmation).
  // Each entry: { kind: 'person'|'family', ...context, originId: string, sourceLabel: string }
  const [followOnMatches, setFollowOnMatches] = useState([]);
  const [followOnResolved, setFollowOnResolved] = useState({}); // { followOnKey: 'merged'|'skipped' }

  const handleFile = () => {
    const input = document.createElement('input');
    input.type = 'file'; input.accept = '.ged,.gedcom';
    input.onchange = (e) => {
      const file = e.target.files[0]; if (!file) return;
      setFileName(file.name);
      const reader = new FileReader();
      reader.onload = (evt) => {
        try {
          const text = evt.target.result;
          setExtGedcomText(text);
          // Use the canonical shared tokenizer (faithful — preserves whitespace).
          const elements = tokenizeGedcom(text);
          const noteMap = buildGedcomNoteMap(elements);
          const extPeople = {}, extFamilies = {};
          for (const el of elements) {
            if (el.tag === 'INDI' && el.pointer) { const p = parseIndi(el, noteMap); extPeople[p.id] = p; }
            else if (el.tag === 'FAM' && el.pointer) { const f = parseFam(el, noteMap); extFamilies[f.id] = f; }
          }
          repairGedcomLinks(extPeople, extFamilies);
          setExtFamilyIds(new Set(Object.keys(extFamilies)));
          setExtFamiliesMap(extFamilies);
          setExtPeopleMap(extPeople);
          const result = computeGedcomDiff(extPeople, extFamilies, personMap, familyMap);
          setDiffResult(result);
          setTab('summary');
          // Reset all directions
          setExtDir({}); setFtlsDir({}); setChangedDir({}); setFieldDir({}); setExtFamDir({}); setFamilyFactDir({});
          setExpandedDiffs(new Set()); setMergeLog([]);
          setFuzzyResolved({}); setFuzzyFamResolved({});
          setFollowOnMatches([]); setFollowOnResolved({});
        } catch (err) { alert('Error parsing GEDCOM: ' + err.message); }
      };
      reader.readAsText(file, 'utf-8');
    };
    input.click();
  };

  const toggleExpand = (id) => { const s = new Set(expandedDiffs); s.has(id)?s.delete(id):s.add(id); setExpandedDiffs(s); };

  // Get effective direction for a field (field override > person default > null)
  const getFieldDirection = (personId, fieldKey) => {
    const fo = (fieldDir[personId]||{})[fieldKey];
    if (fo) return fo;
    return changedDir[personId] || null;
  };

  const personResolutionMap = useMemo(() => {
    const map = {};
    Object.keys(personMap || {}).forEach(id => { map[id] = id; });
    if (!diffResult) return map;
    (diffResult.matched || []).forEach(m => { map[m.id] = m.id; });
    (diffResult.fuzzyMatched || []).forEach(m => { map[m.extId] = m.ftlsId; });
    return map;
  }, [diffResult, personMap]);

  const resolveDbPersonId = useCallback((id) => {
    if (!id) return null;
    if (personMap[id]) return id;
    return personResolutionMap[id] || null;
  }, [personMap, personResolutionMap]);

  const normalizeExtFamilyForDb = useCallback((fam) => {
    const resolvedKids = [...new Set((fam.children || []).map(cid => resolveDbPersonId(cid)).filter(Boolean))];
    return {
      ...fam,
      husb: resolveDbPersonId(fam.husb),
      wife: resolveDbPersonId(fam.wife),
      children: resolvedKids,
      mdate: fam.mdate || fam.marriage_date || '',
      mplace: fam.mplace || fam.marriage_place || ''
    };
  }, [resolveDbPersonId]);

  const findFtlsFamilyCandidate = useCallback((extFam) => {
    if (!extFam || !diffResult) return null;
    return fuzzyMatchFamily(extFam, familyMap, extPeopleMap, personMap, personResolutionMap);
  }, [diffResult, familyMap, extPeopleMap, personMap, personResolutionMap]);

  // Build rich context for a person: parents, siblings, spouse families, children, lineage path
  const buildPersonContext = useCallback((personId) => {
    const p = personMap[personId];
    if (!p) return null;
    const ctx = { person: p, parentFamily: null, siblings: [], spouseFamilies: [], lineagePath: [] };

    // Parent family
    for (const [fid, fam] of Object.entries(familyMap)) {
      if ((fam.children || []).includes(personId)) {
        const hid = fam.husband_id || '';
        const wid = fam.wife_id || '';
        ctx.parentFamily = {
          id: fid,
          father: hid ? (personMap[hid]?.dn || hid) : null,
          fatherId: hid || null,
          mother: wid ? (personMap[wid]?.dn || wid) : null,
          motherId: wid || null
        };
        ctx.siblings = (fam.children || []).filter(c => c !== personId).map(c => ({
          id: c,
          name: personMap[c]?.dn || c,
          gender: personMap[c]?.g || ''
        }));
        break;
      }
    }

    // Spouse families
    for (const [fid, fam] of Object.entries(familyMap)) {
      const hid = fam.husband_id || '';
      const wid = fam.wife_id || '';
      if (hid === personId || wid === personId) {
        const spouseId = hid === personId ? wid : hid;
        ctx.spouseFamilies.push({
          id: fid,
          spouseId: spouseId || null,
          spouseName: spouseId && personMap[spouseId] ? personMap[spouseId].dn : null,
          children: (fam.children || []).map(c => ({
            id: c,
            name: personMap[c]?.dn || c,
            gender: personMap[c]?.g || ''
          }))
        });
      }
    }

    // Lineage path: walk up parent chain
    const path = [{ id: personId, name: p.dn || p.fn || personId }];
    let curId = personId;
    let safety = 0;
    while (safety++ < 15) {
      let found = false;
      for (const fam of Object.values(familyMap)) {
        if ((fam.children || []).includes(curId)) {
          const pid = fam.husband_id || fam.wife_id || '';
          if (pid && personMap[pid]) {
            path.unshift({ id: pid, name: personMap[pid].dn || pid });
            curId = pid;
            found = true;
          }
          break;
        }
      }
      if (!found) break;
    }
    ctx.lineagePath = path;
    return ctx;
  }, [personMap, familyMap]);

  // After a person merge (ftlsId ↔ extId), compute the follow-on candidates that
  // stem from the newly-linked identity. Walks parent and spouse families on both
  // sides; anywhere the FTLS side has xref X and the external side has xref Y
  // for what appears to be the same role (parent, spouse, family-unit), surface
  // Y as a new match candidate. The user then merges or skips each one.
  //
  // Returns an array of follow-on entries. Types:
  //   { kind: 'person', ftlsId, extId, ftlsPerson, extPerson, reason, originLabel }
  //   { kind: 'family', ftlsFamId, extFam, ftlsFam, reason, originLabel }
  // Each entry has a stable `key` built from its identifying xrefs so the user's
  // merged/skipped state survives re-computation.
  const computeFollowOnMatches = useCallback((ftlsId, extId, originLabel) => {
    const out = [];
    const ftlsPerson = personMap[ftlsId];
    const extPerson = extPeopleMap[extId];
    if (!ftlsPerson || !extPerson) return out;

    const seen = new Set(); // dedup by key

    // Helper: push a person follow-on if xrefs differ and both ends exist
    const tryPersonPair = (fId, eId, reason) => {
      if (!fId || !eId || fId === eId) return;
      const f = personMap[fId];
      const e = extPeopleMap[eId];
      if (!f || !e) return;
      // Skip if the FTLS side already exists at the external xref (i.e., this
      // particular mismatch has already been resolved elsewhere)
      if (personMap[eId]) return;
      const key = 'person|' + fId + '|' + eId;
      if (seen.has(key)) return;
      seen.add(key);
      out.push({
        key, kind: 'person',
        ftlsId: fId, extId: eId,
        ftlsPerson: f, extPerson: e,
        reason, originLabel
      });
    };

    // Helper: push a family follow-on if xrefs differ
    const tryFamilyPair = (fFamId, eFamId, reason) => {
      if (!fFamId || !eFamId || fFamId === eFamId) return;
      const ff = familyMap[fFamId];
      const ef = extFamiliesMap[eFamId];
      if (!ff || !ef) return;
      // Skip if FTLS already has the external family id (already reconciled)
      if (familyMap[eFamId]) return;
      const key = 'family|' + fFamId + '|' + eFamId;
      if (seen.has(key)) return;
      seen.add(key);
      out.push({
        key, kind: 'family',
        ftlsFamId: fFamId, extFamId: eFamId,
        ftlsFam: ff, extFam: ef,
        reason, originLabel
      });
    };

    // Parent family walk
    const ftlsParentFam = Object.entries(familyMap).find(([,f]) => (f.children || []).includes(ftlsId));
    const extParentFam = Object.entries(extFamiliesMap).find(([,f]) => (f.children || []).includes(extId));
    if (ftlsParentFam && extParentFam) {
      const [fFamId, fFam] = ftlsParentFam;
      const [eFamId, eFam] = extParentFam;
      if (fFamId !== eFamId) {
        tryFamilyPair(fFamId, eFamId, 'Parent family of ' + (extPerson.dn || extId));
      }
      // Parents themselves — father and mother of the merged person
      const fHusb = fFam.husband_id || fFam.husb || '';
      const eHusb = eFam.husband_id || eFam.husb || '';
      tryPersonPair(fHusb, eHusb, 'Father of ' + (extPerson.dn || extId));
      const fWife = fFam.wife_id || fFam.wife || '';
      const eWife = eFam.wife_id || eFam.wife || '';
      tryPersonPair(fWife, eWife, 'Mother of ' + (extPerson.dn || extId));
    }

    // Spouse-family walk
    const ftlsSpouseFams = Object.entries(familyMap).filter(([,f]) =>
      (f.husband_id === ftlsId) || (f.wife_id === ftlsId)
    );
    const extSpouseFams = Object.entries(extFamiliesMap).filter(([,f]) =>
      ((f.husband_id || f.husb) === extId) || ((f.wife_id || f.wife) === extId)
    );
    // If each side has exactly one spouse family, pair them up as likely the same
    if (ftlsSpouseFams.length === 1 && extSpouseFams.length === 1) {
      const [fFamId, fFam] = ftlsSpouseFams[0];
      const [eFamId, eFam] = extSpouseFams[0];
      if (fFamId !== eFamId) {
        tryFamilyPair(fFamId, eFamId, 'Spouse family of ' + (extPerson.dn || extId));
      }
      // The spouse themselves
      const fSpouse = fFam.husband_id === ftlsId ? (fFam.wife_id || '') : (fFam.husband_id || '');
      const eSpouse = ((eFam.husband_id || eFam.husb) === extId)
        ? ((eFam.wife_id || eFam.wife) || '')
        : ((eFam.husband_id || eFam.husb) || '');
      tryPersonPair(fSpouse, eSpouse, 'Spouse of ' + (extPerson.dn || extId));
      // Children who share names/positions — pair by birth order if present
      const fKids = fFam.children || [];
      const eKids = eFam.children || [];
      if (fKids.length === eKids.length && fKids.length > 0) {
        // Only safe-pair when sets differ and lengths match; otherwise the user
        // reviews children via the family merge flow.
        for (let i = 0; i < fKids.length; i++) {
          tryPersonPair(fKids[i], eKids[i], 'Child of ' + (extPerson.dn || extId));
        }
      }
    }

    // Filter out anything the user already resolved in this session
    return out.filter(entry => !followOnResolved[entry.key]);
  }, [personMap, familyMap, extPeopleMap, extFamiliesMap, followOnResolved]);

  const reconcileExternalFamily = useCallback(async (extFam, ftlsFamId, options={}) => {
    if (!extFam || !ftlsFamId) throw new Error('Family reconciliation needs both an external family and an FTLS family');
    const keepMode = options.keepMode || 'ftls';
    const fieldSelections = options.fieldSelections || {};
    const editUser = user?.email || user?.name || 'GEDCOM family reconcile';
    const normalizedFam = normalizeExtFamilyForDb(extFam);
    let targetId = ftlsFamId;

    if (keepMode === 'external' && ftlsFamId !== extFam.id) {
      await remapFamilyId(ftlsFamId, extFam.id, editUser);
      targetId = extFam.id;
    }

    const currentRows = await sbFetch(`families?id=eq.${targetId}&select=*`);
    const current = currentRows[0];
    if (!current) throw new Error('Family ' + targetId + ' not found after reconcile step');

    const patch = {};
    if (!current.husband_id && normalizedFam.husb) patch.husband_id = normalizedFam.husb;
    if (!current.wife_id && normalizedFam.wife) patch.wife_id = normalizedFam.wife;

    const currentKids = current.children || [];
    const mergedKids = [...new Set([...currentKids, ...(normalizedFam.children || [])])];
    if (mergedKids.length !== currentKids.length) patch.children = mergedKids;

    const pickFamilyFact = (key, currentVal, extVal) => {
      const source = fieldSelections[key];
      if (source === 'external') return extVal || currentVal || '';
      if (source === 'ftls') return currentVal || '';
      return currentVal || extVal || '';
    };

    const nextMdate = pickFamilyFact('mdate', current.marriage_date || '', normalizedFam.mdate || '');
    const nextMplace = pickFamilyFact('mplace', current.marriage_place || '', normalizedFam.mplace || '');
    const nextDivdate = pickFamilyFact('divdate', current.divorce_date || '', normalizedFam.divdate || '');
    if (nextMdate !== (current.marriage_date || '')) patch.marriage_date = nextMdate;
    if (nextMplace !== (current.marriage_place || '')) patch.marriage_place = nextMplace;
    if (nextDivdate !== (current.divorce_date || '')) patch.divorce_date = nextDivdate;
    if (!current.divorced && normalizedFam.divorced) patch.divorced = true;

    if (Object.keys(patch).length > 0) {
      await sbFetch(`families?id=eq.${targetId}`, {
        method: 'PATCH',
        body: JSON.stringify(patch),
        headers: { 'Prefer': 'return=minimal' }
      });
    }

    await logEditAction({
      personId: current.husband_id || current.wife_id || normalizedFam.husb || normalizedFam.wife || null,
      familyId: targetId,
      action: 'reconcile_family_duplicate',
      editedBy: editUser,
      changes: {
        family_name: ((personMap[patch.husband_id || current.husband_id]?.dn || extPeopleMap[extFam.husb]?.dn || '—') + ' ⚭ ' + (personMap[patch.wife_id || current.wife_id]?.dn || extPeopleMap[extFam.wife]?.dn || '—')).trim(),
        kept_family_id: targetId,
        original_ftls_id: ftlsFamId,
        external_family_id: extFam.id,
        keep_mode: keepMode,
        field_selections: fieldSelections,
        patch
      }
    });

    return { targetId, patch };
  }, [user, normalizeExtFamilyForDb, personMap, extPeopleMap]);

  // Set person-level direction (cascades to all fields that don't have overrides)
  const setPersonDirection = (personId, dir) => {
    setChangedDir(prev => ({ ...prev, [personId]: dir }));
    // Clear field-level overrides so cascade takes effect
    setFieldDir(prev => { const n = {...prev}; delete n[personId]; return n; });
  };

  // Set field-level override
  const setFieldDirection = (personId, fieldKey, dir) => {
    setFieldDir(prev => ({
      ...prev,
      [personId]: { ...(prev[personId]||{}), [fieldKey]: dir }
    }));
  };

  // Same-ID family/marriage fact direction helpers. These drive the basket for
  // FAM-level facts like MARR DATE/PLAC, which cannot be represented as person
  // field exports.
  const getFamilyFactDirection = (familyId, fieldKey) => (familyFactDir[familyId]||{})[fieldKey] || null;
  const setFamilyFactDirection = (familyId, fieldKey, dir) => {
    setFamilyFactDir(prev => ({
      ...prev,
      [familyId]: { ...(prev[familyId]||{}), [fieldKey]: dir }
    }));
  };
  const setFamilyFactAllDirection = (familyId, diffs, dir) => {
    setFamilyFactDir(prev => {
      const next = { ...prev };
      if (!dir) { delete next[familyId]; return next; }
      next[familyId] = {};
      (diffs || []).forEach(d => { next[familyId][d.field || d.key] = dir; });
      return next;
    });
  };

  // ── Family breadcrumb helpers ──
  // Build "Father & Mother → Spouse, children: A, B, C" string for a person
  // Build lineage path: walk up through parent families to root
  function ftlsBreadcrumb(personId) {
    const path = [], pathIds = [];
    let curId = personId;
    const visited = new Set();
    // Helper: check if a person has parents in FTLS
    const hasParentsInFtls = (pid) => {
      if (!pid) return false;
      for (const [fid, fam] of Object.entries(familyMap)) {
        if ((fam.children||[]).includes(pid)) return true;
      }
      return false;
    };
    while (curId && !visited.has(curId)) {
      visited.add(curId);
      const p = personMap[curId];
      if (!p) break;
      if (curId !== personId) { path.unshift(p.dn || p.fn || '?'); pathIds.unshift(curId); }
      let parentFound = false;
      for (const [fid, fam] of Object.entries(familyMap)) {
        if ((fam.children||[]).includes(curId)) {
          // Pick the parent who has parents themselves (continues the chain)
          const hid = fam.husband_id, wid = fam.wife_id;
          if (hid && wid) {
            curId = hasParentsInFtls(hid) ? hid : hasParentsInFtls(wid) ? wid : hid;
          } else {
            curId = hid || wid || null;
          }
          parentFound = true;
          break;
        }
      }
      if (!parentFound) break;
    }
    if (path.length === 0) {
      for (const [fid, fam] of Object.entries(familyMap)) {
        const hid = fam.husband_id, wid = fam.wife_id;
        if (hid === personId && wid && personMap[wid]) return { text: '⚭ ' + (personMap[wid].dn||'?'), ids: [wid] };
        if (wid === personId && hid && personMap[hid]) return { text: '⚭ ' + (personMap[hid].dn||'?'), ids: [hid] };
      }
      return { text: '', ids: [] };
    }
    return { text: path.join(' → '), ids: pathIds };
  }

  function extBreadcrumb(personId) {
    const path = [], pathIds = [];
    let curId = personId;
    const visited = new Set();
    // Helper: check if a person has parents in ext or FTLS families
    const hasParents = (pid) => {
      if (!pid) return false;
      for (const [fid, fam] of Object.entries(extFamiliesMap)) {
        if ((fam.children||[]).includes(pid)) return true;
      }
      for (const [fid, fam] of Object.entries(familyMap)) {
        if ((fam.children||[]).includes(pid)) return true;
      }
      return false;
    };
    while (curId && !visited.has(curId)) {
      visited.add(curId);
      const p = extPeopleMap[curId] || personMap[curId];
      if (!p) break;
      if (curId !== personId) { path.unshift(p.dn || p.fn || '?'); pathIds.unshift(curId); }
      let parentFound = false;
      for (const [fid, fam] of Object.entries(extFamiliesMap)) {
        if ((fam.children||[]).includes(curId)) {
          const hid = fam.husb, wid = fam.wife;
          if (hid && wid) {
            curId = hasParents(hid) ? hid : hasParents(wid) ? wid : hid;
          } else {
            curId = hid || wid || null;
          }
          parentFound = true;
          break;
        }
      }
      if (!parentFound) {
        for (const [fid, fam] of Object.entries(familyMap)) {
          if ((fam.children||[]).includes(curId)) {
            const hid = fam.husband_id, wid = fam.wife_id;
            if (hid && wid) {
              curId = hasParents(hid) ? hid : hasParents(wid) ? wid : hid;
            } else {
              curId = hid || wid || null;
            }
            parentFound = true;
            break;
          }
        }
      }
      if (!parentFound) break;
    }
    if (path.length === 0) {
      for (const [fid, fam] of Object.entries(extFamiliesMap)) {
        const hp = extPeopleMap[fam.husb] || personMap[fam.husb];
        const wp = extPeopleMap[fam.wife] || personMap[fam.wife];
        if (fam.husb === personId && wp) return { text: '⚭ ' + (wp.dn||'?'), ids: [fam.wife] };
        if (fam.wife === personId && hp) return { text: '⚭ ' + (hp.dn||'?'), ids: [fam.husb] };
      }
      return { text: '', ids: [] };
    }
    return { text: path.join(' → '), ids: pathIds };
  }

  // Render lineage for a person — shows path up to root
  function FamilyPath({personId, showExt, showFtls}) {
    const fbc = showFtls !== false ? ftlsBreadcrumb(personId) : { text: '', ids: [] };
    const ebc = showExt !== false ? extBreadcrumb(personId) : { text: '', ids: [] };
    if (!fbc.text && !ebc.text) return null;
    // Compare by person IDs, not display names — avoids false "Different lineage" from name formatting
    const same = fbc.ids.join(',') === ebc.ids.join(',');
    return (
      <div style={{fontSize:10, lineHeight:1.6, marginTop:2, paddingLeft:20}}>
        {fbc.text && <div style={{color:'#8a8578'}}><span style={{color:'#c4a35a',fontSize:9}}>FTLS</span> {fbc.text}</div>}
        {ebc.text && !same && <div style={{color:'#6a8a70'}}><span style={{color:'#6b9e72',fontSize:9}}>EXT</span> {ebc.text}</div>}
        {fbc.text && ebc.text && !same && <div style={{color:'#d08050',fontSize:9,fontWeight:500}}>⚠ Different lineage</div>}
      </div>
    );
  }

  // Global select all for changed tab
  const globalChangedDir = (dir) => {
    if (!diffResult) return;
    const d = {};
    diffResult.matched.filter(m => m.diffs.length > 0).forEach(m => { d[m.id] = dir; });
    setChangedDir(d);
    setFieldDir({});
  };

  // ── Compute basket contents ──
  const basket = useMemo(() => {
    if (!diffResult) return { imports: [], exports: [], importFams: [], orphanFams: [], familyFactImports: [] };
    const imports = []; // { type, person, fields? }
    const exports = []; // { type, person, fields? } or { type:'family_facts', familyId, family, fields }
    const importFams = [];
    const familyFactImports = [];

    // Ext-only persons marked for import
    diffResult.extOnly.forEach(p => { if (extDir[p.id] === 'import') imports.push({ type: 'ext_person', person: p }); });
    // Ext-only families marked for import
    diffResult.familyDiffs.filter(f => f.type === 'ext_only').forEach(f => { if (extFamDir[f.id] === 'import') importFams.push(f.ext); });
    // FTLS-only persons marked for export
    diffResult.ftlsOnly.forEach(p => { if (ftlsDir[p.id] === 'export') exports.push({ type: 'ftls_person', person: p }); });

    // Changed persons — split fields by direction
    diffResult.matched.filter(m => m.diffs.length > 0).forEach(m => {
      const impFields = [], expFields = [];
      const nonBranchDiffs = m.diffs.filter(d => d.key !== '_famc');
      nonBranchDiffs.forEach(d => {
        const dir = getFieldDirection(m.id, d.key);
        if (dir === 'import') impFields.push(d);
        else if (dir === 'export') expFields.push(d);
      });
      if (impFields.length > 0) imports.push({ type: 'changed_fields', person: m.ftls, ext: m.ext, fields: impFields });
      if (expFields.length > 0) exports.push({ type: 'changed_fields', person: m.ftls, fields: expFields });
    });

    // Changed same-ID FAM records — split marriage/divorce facts by direction.
    // These are intentionally separate from person diffs because MARR DATE/PLAC
    // live on GEDCOM FAM records. Exporting one of these should add the FAM record
    // to the GEDCOM basket even if no person record is selected.
    (diffResult.familyDiffs || []).filter(f => f.type === 'different').forEach(f => {
      const dirs = familyFactDir[f.id] || {};
      const impFields = [], expFields = [];
      (f.diffs || []).forEach(d => {
        const key = d.field || d.key;
        const dir = dirs[key];
        if (dir === 'import') impFields.push(d);
        else if (dir === 'export') expFields.push(d);
      });
      if (impFields.length > 0) familyFactImports.push({ type:'family_facts', familyId:f.id, ftls:f.ftls, ext:f.ext, fields:impFields });
      if (expFields.length > 0) exports.push({ type:'family_facts', familyId:f.id, family:f.ftls, ext:f.ext, fields:expFields });
    });

    // ── ORPHAN FAMILIES: ext-only families whose members already exist in FTLS DB ──
    // These are families that failed to import (FK error) or were never selected
    const markedFamIds = new Set(importFams.map(f => f.id));
    const orphanFams = [];
    diffResult.familyDiffs.filter(f => f.type === 'ext_only').forEach(f => {
      if (markedFamIds.has(f.id)) return; // already in importFams
      const fam = f.ext;
      const memberIds = [fam.husb, fam.wife, ...(fam.children || [])].filter(Boolean);
      const hasDbMember = memberIds.some(mid => !!personMap[mid]);
      if (hasDbMember) orphanFams.push(fam);
    });

    return { imports, exports, importFams, orphanFams, familyFactImports };
  }, [diffResult, extDir, ftlsDir, changedDir, fieldDir, extFamDir, familyFactDir, personMap]);

  const orphanFamilyCandidates = useMemo(() => {
    return basket.orphanFams.map(fam => {
      if (fuzzyFamResolved[fam.id]) return null;
      const match = findFtlsFamilyCandidate(fam);
      return match ? { ext: fam, match } : null;
    }).filter(Boolean);
  }, [basket.orphanFams, findFtlsFamilyCandidate, fuzzyFamResolved]);

  const orphanFamilyCandidateMap = useMemo(() => {
    const map = {};
    orphanFamilyCandidates.forEach(item => { map[item.ext.id] = item.match; });
    return map;
  }, [orphanFamilyCandidates]);

  const repairableOrphanFams = useMemo(() => {
    return basket.orphanFams.filter(fam => !orphanFamilyCandidateMap[fam.id]);
  }, [basket.orphanFams, orphanFamilyCandidateMap]);

  // ── REPAIR ORPHAN FAMILIES (standalone — no basket selection needed) ──
  const repairOrphanFamilies = async (familiesToRepair=repairableOrphanFams) => {
    if (familiesToRepair.length === 0) return;
    setMerging(true);
    const log = [];
    let fixed = 0;
    for (const fam of familiesToRepair) {
      try {
        const result = await mergeFamilyToDb(fam);
        if (result && !result.skipped) {
          const hName = fam.husb ? (extPeopleMap[fam.husb]?.dn || personMap[fam.husb]?.dn || fam.husb) : '?';
          const wName = fam.wife ? (extPeopleMap[fam.wife]?.dn || personMap[fam.wife]?.dn || fam.wife) : '?';
          log.push('✓ ' + hName + ' ⚭ ' + wName + ' — ' + (result.action || 'created'));
          fixed++;
        } else if (result?.skipped) {
          log.push('⊘ Family ' + fam.id + ' (' + result.reason + ')');
        }
      } catch(e) { log.push('✗ Family ' + fam.id + ': ' + e.message); }
    }
    log.push('── ' + fixed + ' orphan families repaired');
    setMergeLog(prev => [...prev, ...log]);
    setMerging(false);
  };

  // ── BATCH IMPORT (merge to DB) ──
  const batchImport = async () => {
    setMerging(true); const log = [];
    for (const item of basket.imports) {
      if (item.type === 'ext_person') {
        try {
          const result = await mergePersonToDb(item.person, user?.email||'GEDCOM merge');
          if (result?.skipped) log.push('⊘ Skipped ' + (item.person.dn||'?') + ' (' + result.reason + ')');
          else log.push('✓ Added ' + (item.person.dn||'?'));
        } catch(e) { log.push('✗ ' + (item.person.dn||'?') + ': ' + e.message); }
      } else if (item.type === 'changed_fields') {
        const keys = item.fields.map(f => f.key);
        try { await mergeFieldsToDb(item.person, keys, item.ext, user?.email||'GEDCOM merge'); log.push('✓ Updated ' + keys.length + ' fields on ' + item.person.dn); }
        catch(e) { log.push('✗ ' + item.person.dn + ': ' + e.message); }
      }
    }
    for (const fam of basket.importFams) {
      try {
        const result = await mergeFamilyToDb(fam);
        if (result?.skipped) log.push('⊘ Skipped family ' + fam.id + ' (' + result.reason + ')');
        else log.push('✓ Family ' + fam.id + ' — ' + (result?.action || 'created'));
      } catch(e) { log.push('✗ Family ' + fam.id + ': ' + e.message); }
    }
    for (const item of (basket.familyFactImports || [])) {
      try {
        const patch = {};
        for (const d of item.fields || []) {
          const key = d.field || d.key;
          if (key === 'mdate') patch.marriage_date = item.ext.mdate || item.ext.marriage_date || '';
          if (key === 'mplace') patch.marriage_place = item.ext.mplace || item.ext.marriage_place || '';
          if (key === 'divdate') patch.divorce_date = item.ext.divdate || item.ext.divorce_date || '';
        }
        if (item.ext.divorced && !item.ftls?.divorced) patch.divorced = true;
        if (Object.keys(patch).length > 0) {
          await sbFetch(`families?id=eq.${item.familyId}`, {
            method:'PATCH',
            body:JSON.stringify(patch),
            headers:{'Prefer':'return=minimal'}
          });
          log.push('✓ Updated family facts on ' + item.familyId + ' (' + item.fields.map(f => f.label || f.field).join(', ') + ')');
        }
      } catch(e) { log.push('✗ Family facts ' + item.familyId + ': ' + e.message); }
    }
    // Auto-update: find ALL external families that reference any imported person
    // This catches cases where a new child was added to an existing FTLS family
    const importedPersonIds = new Set(
      basket.imports.filter(i => i.type === 'ext_person').map(i => i.person.id)
    );
    const alreadyProcessedFams = new Set(basket.importFams.map(f => f.id));
    if (importedPersonIds.size > 0 && extFamiliesMap) {
      for (const [fid, fam] of Object.entries(extFamiliesMap)) {
        if (alreadyProcessedFams.has(fid)) continue;
        const involves = importedPersonIds.has(fam.husb) || importedPersonIds.has(fam.wife) ||
          (fam.children||[]).some(c => importedPersonIds.has(c));
        if (!involves) continue;
        try {
          const result = await mergeFamilyToDb(fam);
          if (result && !result.skipped) log.push('✓ Auto-updated family: ' + fid + ' — ' + (result.action || 'updated'));
        } catch(e) { log.push('⚠ Auto-family ' + fid + ': ' + e.message); }
      }
    }
    // Post-import validation: check for orphan family links (#22)
    if (log.some(l => l.startsWith('✓'))) {
      try {
        const allPersons = await sbFetch('persons?select=id');
        const allFamilies = await sbFetch('families?select=id,husband_id,wife_id,children');
        const pidSet = new Set(allPersons.map(p => p.id));
        for (const f of allFamilies) {
          if (f.husband_id && !pidSet.has(f.husband_id)) log.push('⚠ Family ' + f.id + ' references missing husband ' + f.husband_id);
          if (f.wife_id && !pidSet.has(f.wife_id)) log.push('⚠ Family ' + f.id + ' references missing wife ' + f.wife_id);
          for (const cid of (f.children || [])) {
            if (!pidSet.has(cid)) log.push('⚠ Family ' + f.id + ' references missing child ' + cid);
          }
        }
      } catch(e) { log.push('⚠ Could not run post-import validation: ' + e.message); }
    }
    if (log.length === 0) log.push('Nothing to import.');
    setMergeLog(prev => [...prev, ...log]);
    setMerging(false);
    if (log.some(l => l.startsWith('✓'))) setTab('basket');
  };

  // ── BATCH EXPORT (download GEDCOM) ──
  const batchExportGedcom = async () => {
    const persons = basket.exports.filter(e => e.type === 'ftls_person').map(e => e.person);
    // For changed_fields exports, include the FTLS person version
    basket.exports.filter(e => e.type === 'changed_fields').forEach(e => {
      if (!persons.find(p => p.id === e.person.id)) persons.push(e.person);
    });
    const forcedFamilyIds = new Set(basket.exports.filter(e => e.type === 'family_facts').map(e => e.familyId));
    if (persons.length === 0 && forcedFamilyIds.size === 0) { alert('No items to export.'); return; }
    // Load ALL gedcom_meta records for lossless MacFamilyTree round-trip export
    try { window.gedcomMetaRecords = await sbFetch('gedcom_meta?select=*'); } catch(e) { window.gedcomMetaRecords = []; }
    const content = exportDiffGedcom(persons, familyMap, extFamilyIds, extFamiliesMap, personMap, forcedFamilyIds);
    const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob); const a = document.createElement('a');
    a.href = url; a.download = 'FTLS_Export_For_Merge.ged';
    document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
    setMergeLog(prev => [...prev, '⬆ Exported ' + persons.length + ' persons and ' + forcedFamilyIds.size + ' family fact record(s) as new GEDCOM']);
  };

  // ── MERGE INTO LOADED GEDCOM ──
  const batchMergeIntoGedcom = () => {
    if (!extGedcomText) { alert('No external GEDCOM loaded.'); return; }
    const persons = basket.exports.filter(e => e.type === 'ftls_person').map(e => e.person);
    basket.exports.filter(e => e.type === 'changed_fields').forEach(e => {
      if (!persons.find(p => p.id === e.person.id)) persons.push(e.person);
    });
    const forcedFamilyIds = new Set(basket.exports.filter(e => e.type === 'family_facts').map(e => e.familyId));
    if (persons.length === 0 && forcedFamilyIds.size === 0) { alert('No items to export.'); return; }
    const expFields = basket.exports.filter(e => e.type === 'changed_fields').map(e => ({
      personId: e.person.id,
      fields: e.fields.map(f => ({ key: f.key, value: f.ftls }))
    }));
    const content = buildMergedGedcom(extGedcomText, persons, expFields, familyMap, extFamilyIds, forcedFamilyIds);
    const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob); const a = document.createElement('a');
    a.href = url; a.download = fileName.replace('.ged', '') + '_merged.ged';
    document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
    setMergeLog(prev => [...prev, '⬆ Merged into ' + fileName + ' (' + persons.length + ' persons, ' + expFields.length + ' field updates, ' + forcedFamilyIds.size + ' family fact record(s))']);
  };

  const S = diffResult?.stats;
  const tabSt = (t) => ({ fontSize:12, padding:'6px 12px', cursor:'pointer', borderRadius:'6px 6px 0 0', background:tab===t?'rgba(196,163,90,0.15)':'transparent', color:tab===t?GC:DM, border:tab===t?'1px solid '+GD:'1px solid transparent', borderBottom:'none', whiteSpace:'nowrap' });
  const hdr = { fontSize:14, color:GC, fontWeight:600, margin:'16px 0 8px', paddingBottom:4, borderBottom:'1px solid '+BR };
  const rowSt = { padding:'6px 0', borderBottom:'1px solid rgba(196,163,90,0.06)', fontSize:13 };
  const badge = (c) => ({ display:'inline-block', padding:'1px 8px', borderRadius:10, fontSize:11, background:c, color:'#fff', marginLeft:6 });
  const selBar = { display:'flex', gap:8, alignItems:'center', marginBottom:10, padding:'6px 10px', background:'rgba(196,163,90,0.04)', borderRadius:6, border:'1px solid '+BR, flexWrap:'wrap' };
  const lnkBtn = { fontSize:11, color:GC, cursor:'pointer', textDecoration:'underline', background:'none', border:'none', padding:0 };

  // Direction toggle button
  const DirBtn = ({ dir, onSet, allowImport=true, allowExport=true }) => {
    const impActive = dir === 'import';
    const expActive = dir === 'export';
    return (<span style={{ display:'inline-flex', gap:1, fontSize:11 }}>
      {allowImport && <span onClick={()=>onSet(impActive?null:'import')} style={{ padding:'2px 8px', borderRadius:'4px 0 0 4px', cursor:'pointer', background: impActive?'rgba(107,158,114,0.25)':'rgba(255,255,255,0.04)', border:'1px solid '+(impActive?MC:'rgba(255,255,255,0.1)'), color: impActive?MC:DM }}>⬇ Import</span>}
      {allowExport && <span onClick={()=>onSet(expActive?null:'export')} style={{ padding:'2px 8px', borderRadius: allowImport?'0 4px 4px 0':'4px', cursor:'pointer', background: expActive?'rgba(196,163,90,0.2)':'rgba(255,255,255,0.04)', border:'1px solid '+(expActive?GD:'rgba(255,255,255,0.1)'), color: expActive?GC:DM }}>⬆ Export</span>}
    </span>);
  };

  const basketCount = basket.imports.length + basket.importFams.length + (basket.familyFactImports||[]).length + basket.exports.length + repairableOrphanFams.length + orphanFamilyCandidates.length;

  return (
    <div style={{ position:'fixed', inset:0, zIndex:200, display:'flex', alignItems:'center', justifyContent:'center' }}>
      <div style={{ position:'absolute', inset:0, background:'rgba(0,0,0,0.85)' }} onClick={onClose} />
      <div style={{ position:'relative', background:'#141410', border:'1px solid '+GD, borderRadius:12, width:Math.min(940,window.innerWidth-32), maxHeight:'90vh', display:'flex', flexDirection:'column', zIndex:201 }}>
        {/* Header */}
        <div style={{ padding:'14px 20px', borderBottom:'1px solid '+BR, display:'flex', justifyContent:'space-between', alignItems:'center' }}>
          <div>
            <span style={{ fontSize:18, color:GC, fontWeight:500 }}>🔀 GEDCOM Diff &amp; Merge</span>
            {fileName && <span style={{ fontSize:12, color:DM, marginLeft:12 }}>vs {fileName}</span>}
          </div>
          <span onClick={onClose} style={{ fontSize:20, color:DM, cursor:'pointer', padding:'4px 8px' }}>✕</span>
        </div>

        {/* Body */}
        <div style={{ flex:1, overflowY:'auto', padding:'0 20px 20px' }}>
          {!diffResult ? (
            <div style={{ textAlign:'center', padding:'60px 20px' }}>
              <div style={{ fontSize:48, marginBottom:16 }}>📂</div>
              <div style={{ fontSize:15, color:TX, marginBottom:8 }}>Upload an external GEDCOM to compare</div>
              <div style={{ fontSize:12, color:DM, marginBottom:24, lineHeight:1.6 }}>Compare every person and family against FTLS.<br/>Mark items for import or export, then process in the basket.</div>
              <button onClick={handleFile} style={{ background:'rgba(107,158,114,0.15)', border:'1px solid '+MC, color:MC, padding:'12px 28px', borderRadius:8, cursor:'pointer', fontSize:14 }}>📄 Select GEDCOM File</button>
            </div>
          ) : (<>
            {/* Tabs */}
            <div style={{ display:'flex', gap:2, marginTop:12, borderBottom:'1px solid '+BR, flexWrap:'wrap' }}>
              <span style={tabSt('summary')} onClick={()=>setTab('summary')}>Summary</span>
              {(S.changed>0 || ((diffResult.familyDiffs||[]).filter(f=>f.type==='different').length>0)) && <span style={tabSt('changed')} onClick={()=>setTab('changed')}>Changed ({S.changed + ((diffResult.familyDiffs||[]).filter(f=>f.type==='different').length)})</span>}
              {S.extOnly>0 && <span style={tabSt('ext_only')} onClick={()=>setTab('ext_only')}>External Only ({S.extOnly})</span>}
              {S.ftlsOnly>0 && <span style={tabSt('ftls_only')} onClick={()=>setTab('ftls_only')}>FTLS Only ({S.ftlsOnly})</span>}
              {(diffResult.fuzzyMatched.length>0 || (diffResult.duplicateExactMatches||[]).length>0 || (diffResult.fuzzyMatchedFamilies||[]).length>0) && <span style={tabSt('fuzzy')} onClick={()=>setTab('fuzzy')}>Fuzzy ({diffResult.fuzzyMatched.length + (diffResult.duplicateExactMatches||[]).length + (diffResult.fuzzyMatchedFamilies||[]).length})</span>}
              <span style={tabSt('basket')} onClick={()=>setTab('basket')}>🧺 Basket {basketCount>0 && <span style={badge('rgba(196,163,90,0.7)')}>{basketCount}</span>}</span>
              {mergeLog.length>0 && <span style={tabSt('log')} onClick={()=>setTab('log')}>Log ({mergeLog.length})</span>}
            </div>

            {/* ──── SUMMARY ──── */}
            {tab==='summary' && (<div style={{ padding:'16px 0' }}>
              <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:12, marginBottom:20 }}>
                <div style={{ background:'rgba(107,158,114,0.08)', border:'1px solid rgba(107,158,114,0.2)', borderRadius:8, padding:14 }}>
                  <div style={{ fontSize:11, color:DM, textTransform:'uppercase', letterSpacing:1, marginBottom:4 }}>External GEDCOM</div>
                  <div style={{ fontSize:24, color:MC, fontWeight:600 }}>{S.extTotal} <span style={{ fontSize:13, fontWeight:400 }}>persons</span></div>
                  <div style={{ fontSize:13, color:DM }}>{S.extFamilies} families</div>
                </div>
                <div style={{ background:'rgba(196,163,90,0.08)', border:'1px solid rgba(196,163,90,0.2)', borderRadius:8, padding:14 }}>
                  <div style={{ fontSize:11, color:DM, textTransform:'uppercase', letterSpacing:1, marginBottom:4 }}>FTLS Database</div>
                  <div style={{ fontSize:24, color:GC, fontWeight:600 }}>{S.ftlsTotal} <span style={{ fontSize:13, fontWeight:400 }}>persons</span></div>
                  <div style={{ fontSize:13, color:DM }}>{S.ftlsFamilies} families</div>
                </div>
              </div>
              <div style={hdr}>Match Results</div>
              <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fill,minmax(150px,1fr))', gap:8 }}>
                {[[S.identical,'#6b9e72','Identical'],[S.changed,'#c4a35a','Changed'],[S.extOnly,'#7eb8d0','External Only'],[S.ftlsOnly,'#9b82c4','FTLS Only'],...(S.fuzzyMatch>0?[[S.fuzzyMatch,'#d0a07e','Fuzzy (People)']]:[])]
                  .map(([v,c,l])=><div key={l} style={{ padding:10, background:'rgba(255,255,255,0.02)', borderRadius:6, border:'1px solid '+BR }}><div style={{ fontSize:22, color:c, fontWeight:600 }}>{v}</div><div style={{ fontSize:11, color:DM }}>{l}</div></div>)}
                {(S.duplicateExactMatch||0) > 0 && <div style={{ padding:10, background:'rgba(255,255,255,0.02)', borderRadius:6, border:'1px solid '+BR }}><div style={{ fontSize:22, color:'#d0a07e', fontWeight:600 }}>{S.duplicateExactMatch}</div><div style={{ fontSize:11, color:DM }}>Duplicate IDs</div></div>}
                {(S.fuzzyFamilyMatch||0) > 0 && <div style={{ padding:10, background:'rgba(255,255,255,0.02)', borderRadius:6, border:'1px solid '+BR }}><div style={{ fontSize:22, color:'#7eb8d0', fontWeight:600 }}>{S.fuzzyFamilyMatch}</div><div style={{ fontSize:11, color:DM }}>Fuzzy (Families)</div></div>}
              </div>
              <div style={{ marginTop:20 }}><button onClick={handleFile} style={{ background:'transparent', border:'1px solid '+BR, color:DM, padding:'8px 16px', borderRadius:6, cursor:'pointer', fontSize:12 }}>📄 Load Different File</button></div>
            </div>)}

            {/* ──── CHANGED ──── */}
            {tab==='changed' && (()=>{
              const addressKeys = new Set(['a1','ci','st','co','zp']);
              const allChanged = diffResult.matched.filter(m=>m.diffs.length>0);
              const hasNonAddr = (m) => m.diffs.some(d => !addressKeys.has(d.key));
              
              // Split changed: in-tree vs not-in-tree
              const familyChanged = allChanged.filter(m => personMap[m.id]);
              const othersChanged = allChanged.filter(m => !personMap[m.id]);
              const familyMeaningful = familyChanged.filter(hasNonAddr);
              const familyAddrOnly = familyChanged.filter(m => !hasNonAddr(m));
              
              // External Only: split into connected-to-tree vs unconnected
              const extOnlyAll = diffResult.extOnly || [];
              const extOnlyFams = (diffResult.familyDiffs || []).filter(f=>f.type==='ext_only');
              const changedFams = (diffResult.familyDiffs || []).filter(f=>f.type==='different');
              const isConnected = (p) => {
                const visited = new Set();
                const walk = (pid) => {
                  if (!pid || visited.has(pid)) return false;
                  visited.add(pid);
                  if (personMap[pid] && pid !== p.id) return true;
                  for (const [fid, fam] of Object.entries(extFamiliesMap)) {
                    if ((fam.children||[]).includes(pid)) {
                      if (walk(fam.husb||'') || walk(fam.wife||'')) return true;
                    }
                    if ((fam.husb === pid || fam.wife === pid)) {
                      const spId = fam.husb === pid ? fam.wife : fam.husb;
                      if (spId && personMap[spId]) return true;
                    }
                  }
                  for (const [fid, fam] of Object.entries(familyMap)) {
                    if ((fam.children||[]).includes(pid)) {
                      if (fam.husband_id && personMap[fam.husband_id]) return true;
                      if (fam.wife_id && personMap[fam.wife_id]) return true;
                    }
                  }
                  return false;
                };
                return walk(p.id);
              };
              const extConnected = extOnlyAll.filter(isConnected);
              const extUnconnected = extOnlyAll.filter(p => !isConnected(p));
              
              // FTLS Only: split in-tree vs not
              const ftlsAll = diffResult.ftlsOnly || [];
              const ftlsInTree = ftlsAll.filter(p => personMap[p.id]);
              const ftlsNotInTree = ftlsAll.filter(p => !personMap[p.id]);

              const familyItems = showAddrOnly ? familyChanged : familyMeaningful;
              
              // ── Render: changed person row (individual toggle only) ──
              const renderChangedRow = (m) => {
                const isExp = expandedDiffs.has(m.id);
                const pDir = changedDir[m.id] || null;
                return (<div key={m.id} style={{ marginBottom:6, border:'1px solid '+BR, borderRadius:8, overflow:'hidden' }}>
                  <div style={{ padding:'7px 12px', background:'rgba(196,163,90,0.04)', display:'flex', alignItems:'center', gap:8 }}>
                    <DirBtn dir={pDir} onSet={(d)=>setPersonDirection(m.id, d)} />
                    <div onClick={()=>toggleExpand(m.id)} style={{ flex:1, cursor:'pointer' }}>
                      <div style={{ color:TX, fontSize:13 }}>
                        <span style={{ color:isExp?GC:DM, marginRight:6 }}>{isExp?'▼':'▶'}</span>
                        {m.ftls.dn||m.ext.dn} <span style={badge('rgba(196,163,90,0.6)')}>{m.diffs.length} diff{m.diffs.length>1?'s':''}</span>
                      </div>
                      <FamilyPath personId={m.id} />
                    </div>
                  </div>
                  {isExp && (<div style={{ padding:'8px 12px' }}>
                    <table style={{ width:'100%', fontSize:12, borderCollapse:'collapse' }}>
                      <thead><tr>
                        <th style={{ textAlign:'left', color:DM, padding:'4px 8px', width:130 }}>Direction</th>
                        <th style={{ textAlign:'left', color:DM, padding:'4px 8px' }}>Field</th>
                        <th style={{ textAlign:'left', color:GC, padding:'4px 8px' }}>FTLS</th>
                        <th style={{ textAlign:'left', color:MC, padding:'4px 8px' }}>External</th>
                        <th style={{ textAlign:'left', color:DM, padding:'4px 8px', width:50 }}>Hint</th>
                      </tr></thead>
                      <tbody>{m.diffs.map(d => {
                        const fDir = getFieldDirection(m.id, d.key);
                        const fL=(d.ftls||'').replace(/^[,\s]+/,'').length, eL=(d.ext||'').replace(/^[,\s]+/,'').length;
                        const ftlsW=fL>=eL&&fL>0, extW=eL>fL;
                        const isBranch = d.key === '_famc';
                        // Warn if importing would clear FTLS data
                        const wouldClear = d.ftls && !d.ext && !isBranch;
                        return (<tr key={d.key} style={{ borderTop:'1px solid rgba(196,163,90,0.06)', background: isBranch ? 'rgba(126,184,208,0.06)' : wouldClear ? 'rgba(160,80,80,0.04)' : 'transparent' }}>
                          <td style={{ padding:'4px 8px' }}>{isBranch ? <span style={{fontSize:10,color:'#7eb8d0'}}>🔀</span> : <DirBtn dir={fDir} onSet={(dir)=>setFieldDirection(m.id, d.key, dir)} />}</td>
                          <td style={{ padding:'4px 8px', color: isBranch ? '#7eb8d0' : DM, fontWeight: isBranch ? 500 : 'normal' }}>{d.label}</td>
                          <td style={{ padding:'4px 8px', color:d.ftls?TX:'#5a4040', background:ftlsW&&!isBranch?'rgba(107,158,114,0.06)':'transparent' }}>{d.ftls||'(empty)'}</td>
                          <td style={{ padding:'4px 8px', color:d.ext?'#8ec496':'#5a4040', background:extW&&!isBranch?'rgba(107,158,114,0.06)':'transparent' }}>{d.ext||'(empty)'}{wouldClear && <span style={{fontSize:9,color:'#a05050',marginLeft:4}}>⚠ would clear</span>}</td>
                          <td style={{ padding:'4px 8px', fontSize:10 }}>{isBranch?<span style={{color:'#7eb8d0'}}>Branch</span>:ftlsW?<span style={{color:GC}}>←FTLS</span>:extW?<span style={{color:MC}}>Ext→</span>:<span style={{color:DM}}>—</span>}</td>
                        </tr>);
                      })}</tbody>
                    </table>
                  </div>)}
                </div>);
              };
              
              // ── Render: external-only person row ──
              const renderExtRow = (p) => (<div key={p.id} style={{ ...rowSt }}>
                <div style={{ display:'flex', alignItems:'center', gap:8 }}>
                  <DirBtn dir={extDir[p.id]||null} onSet={(d)=>setExtDir(prev=>({...prev,[p.id]:d}))} allowExport={false} />
                  <span style={{ width:8, height:8, borderRadius:'50%', background:p.g==='M'?MC:FC, flexShrink:0 }} />
                  <span style={{ color:TX, flex:1 }}>{p.dn||'(Unknown)'}</span>
                  {p.dob && <span style={{ color:DM, fontSize:11 }}>b.{p.dob}</span>}
                  <span style={{ color:'#5a5548', fontSize:10 }}>{p.id}</span>
                </div>
                <FamilyPath personId={p.id} showFtls={false} showExt={true} />
              </div>);
              
              // ── Render: FTLS-only person row ──
              const renderFtlsRow = (p) => (<div key={p.id} style={{ ...rowSt }}>
                <div style={{ display:'flex', alignItems:'center', gap:8 }}>
                  <DirBtn dir={ftlsDir[p.id]||null} onSet={(d)=>setFtlsDir(prev=>({...prev,[p.id]:d}))} allowImport={false} />
                  <span style={{ width:8, height:8, borderRadius:'50%', background:p.g==='M'?MC:FC, flexShrink:0 }} />
                  <span style={{ color:TX, flex:1 }}>{p.dn||'(Unknown)'}</span>
                  {p.dob && <span style={{ color:DM, fontSize:11 }}>b.{p.dob}</span>}
                  <span style={{ color:'#5a5548', fontSize:10 }}>{p.id}</span>
                </div>
                <FamilyPath personId={p.id} showFtls={true} showExt={false} />
              </div>);

              // Count totals for Others
              const othersTotal = othersChanged.length + extUnconnected.length + ftlsNotInTree.length + extOnlyFams.length;
              
              return (<div style={{ padding:'12px 0' }}>

                {/* ══════ SECTION 1: FAMILY MEMBERS WITH CHANGES ══════ */}
                <div style={hdr}>👨‍👩‍👧‍👦 Family Members with Changes ({familyItems.length})</div>
                <div style={{ fontSize:12, color:DM, marginBottom:8 }}>Review each person individually before importing. Export is safe — it only sends FTLS data out.</div>
                <div style={selBar}>
                  <button style={lnkBtn} onClick={()=>globalChangedDir('export')}>⬆ All Export</button>
                  <button style={lnkBtn} onClick={()=>globalChangedDir(null)}>Clear All</button>
                  <span style={{ fontSize:11, color:DM }}>{Object.values(changedDir).filter(Boolean).length} toggled</span>
                </div>
                {familyAddrOnly.length > 0 && <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:10,padding:'6px 10px',background:'rgba(196,163,90,0.04)',borderRadius:6,border:'1px solid '+BR}}>
                  <input type="checkbox" checked={showAddrOnly} onChange={e=>setShowAddrOnly(e.target.checked)} style={{accentColor:'#c4a35a'}}/>
                  <span style={{fontSize:11,color:DM}}>Show {familyAddrOnly.length} address-only diffs</span>
                </div>}
                {familyItems.length === 0 && <div style={{color:DM,fontSize:12,padding:'12px 0'}}>No meaningful field differences for family members{familyAddrOnly.length > 0 ? ' (check the box above to see address-only diffs)' : ''}.</div>}
                {familyItems.map(renderChangedRow)}

                {changedFams.length > 0 && <div style={{ marginTop:22 }}>
                  <div style={hdr}>💍 Family / Marriage Facts with Changes ({changedFams.length})</div>
                  <div style={{ fontSize:12, color:DM, marginBottom:8 }}>Marriage date/place live on GEDCOM FAM records, not on person records. Review these separately.</div>
                  {changedFams.map(f => {
                    const hid = f.ftls.husband_id || f.ftls.husb || f.ext.husb;
                    const wid = f.ftls.wife_id || f.ftls.wife || f.ext.wife;
                    const hName = personMap[hid]?.dn || extPeopleMap[hid]?.dn || hid || '—';
                    const wName = personMap[wid]?.dn || extPeopleMap[wid]?.dn || wid || '—';
                    return (<div key={f.id} style={{ marginBottom:8, border:'1px solid '+BR, borderRadius:8, overflow:'hidden' }}>
                      <div style={{ padding:'9px 12px', background:'rgba(196,163,90,0.04)', display:'flex', alignItems:'center', justifyContent:'space-between', gap:8, flexWrap:'wrap' }}>
                        <div>
                          <div style={{ color:TX, fontSize:13 }}>{hName} ⚭ {wName} <span style={badge('rgba(196,163,90,0.6)')}>{f.diffs.length} family diff{f.diffs.length>1?'s':''}</span></div>
                          <div style={{ fontSize:10, color:DM }}>{f.id}</div>
                        </div>
                        <div style={{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap'}}>
                          <button onClick={() => setFamilyFactAllDirection(f.id, f.diffs, 'import')}
                            style={{ background:'rgba(107,158,114,0.10)', border:'1px solid rgba(107,158,114,0.25)', color:MC, padding:'4px 10px', borderRadius:5, cursor:'pointer', fontSize:11 }}>
                            ⬇ Import Facts
                          </button>
                          <button onClick={() => setFamilyFactAllDirection(f.id, f.diffs, 'export')}
                            style={{ background:'rgba(196,163,90,0.10)', border:'1px solid rgba(196,163,90,0.25)', color:GC, padding:'4px 10px', borderRadius:5, cursor:'pointer', fontSize:11 }}>
                            ⬆ Export Facts
                          </button>
                          <button onClick={() => setFamilyFactAllDirection(f.id, f.diffs, null)}
                            style={{ background:'transparent', border:'1px solid '+BR, color:DM, padding:'4px 10px', borderRadius:5, cursor:'pointer', fontSize:11 }}>
                            Clear
                          </button>
                          <button onClick={() => setFamilyReview({ extFam: f.ext, ftlsFamId: f.id, source: 'same_id' })}
                            style={{ background:'rgba(126,184,208,0.12)', border:'1px solid rgba(126,184,208,0.3)', color:'#7eb8d0', padding:'4px 12px', borderRadius:5, cursor:'pointer', fontSize:11 }}>
                            Review Marriage Facts
                          </button>
                        </div>
                      </div>
                      <div style={{ padding:'6px 12px' }}>
                        <table style={{ width:'100%', fontSize:12, borderCollapse:'collapse' }}>
                          <thead><tr>
                            <th style={{ textAlign:'left', color:DM, padding:'4px 8px', width:130 }}>Direction</th>
                            <th style={{ textAlign:'left', color:DM, padding:'4px 8px', width:140 }}>Field</th>
                            <th style={{ textAlign:'left', color:GC, padding:'4px 8px' }}>FTLS</th>
                            <th style={{ textAlign:'left', color:MC, padding:'4px 8px' }}>External</th>
                          </tr></thead>
                          <tbody>{f.diffs.map(d => {
                            const key = d.field || d.key;
                            const dir = getFamilyFactDirection(f.id, key);
                            return (<tr key={key} style={{ borderTop:'1px solid rgba(196,163,90,0.06)' }}>
                              <td style={{ padding:'4px 8px' }}><DirBtn dir={dir} onSet={(next)=>setFamilyFactDirection(f.id, key, next)} /></td>
                              <td style={{ padding:'4px 8px', color:DM, width:140 }}>{d.label || d.field}</td>
                              <td style={{ padding:'4px 8px', color:TX, background:dir==='export'?'rgba(196,163,90,0.06)':'transparent' }}>{Array.isArray(d.ftls) ? d.ftls.join(', ') : (d.ftls || '(empty)')}</td>
                              <td style={{ padding:'4px 8px', color:'#8ec496', background:dir==='import'?'rgba(107,158,114,0.06)':'transparent' }}>{Array.isArray(d.ext) ? d.ext.join(', ') : (d.ext || '(empty)')}</td>
                            </tr>);
                          })}</tbody>
                        </table>
                      </div>
                    </div>);
                  })}
                </div>}
                
                {/* ══════ OTHERS — READ ONLY ══════ */}
                {othersTotal > 0 && <div style={{marginTop:24}}>
                  <div onClick={()=>setShowOthers(!showOthers)} style={{...hdr, cursor:'pointer', color:'#7a7568'}}>
                    <span style={{marginRight:6}}>{showOthers?'▼':'▶'}</span>
                    📋 Others ({othersTotal})
                    <span style={{fontSize:10,fontWeight:'normal',marginLeft:8,color:'#5a5548'}}>Not connected to the family tree — pass through unchanged in merged exports</span>
                  </div>
                  {showOthers && <div style={{padding:'8px 0',fontSize:12}}>
                    {othersChanged.length > 0 && <>
                      <div style={{fontSize:11,color:DM,marginBottom:4,marginTop:8,fontWeight:500}}>Changed but not in tree ({othersChanged.length}):</div>
                      {othersChanged.map(m => (<div key={m.id} style={{...rowSt,color:'#7a7568'}}>
                        {m.ftls.dn||m.ext.dn} <span style={{fontSize:10,color:'#5a5548'}}>{m.diffs.length} diff{m.diffs.length>1?'s':''}</span>
                        <FamilyPath personId={m.id} />
                      </div>))}
                    </>}
                    {extUnconnected.length > 0 && <>
                      <div style={{fontSize:11,color:DM,marginBottom:4,marginTop:12,fontWeight:500}}>External only, no tree connection ({extUnconnected.length}):</div>
                      {extUnconnected.map(p => (<div key={p.id} style={{...rowSt,color:'#7a7568'}}>
                        {p.dn||'(Unknown)'} <span style={{fontSize:10,color:'#5a5548'}}>{p.id}</span>
                        <FamilyPath personId={p.id} showFtls={false} showExt={true} />
                      </div>))}
                    </>}
                    {ftlsNotInTree.length > 0 && <>
                      <div style={{fontSize:11,color:DM,marginBottom:4,marginTop:12,fontWeight:500}}>FTLS only, not in tree ({ftlsNotInTree.length}):</div>
                      {ftlsNotInTree.map(p => (<div key={p.id} style={{...rowSt,color:'#7a7568'}}>
                        {p.dn||'(Unknown)'} <span style={{fontSize:10,color:'#5a5548'}}>{p.id}</span>
                      </div>))}
                    </>}
                    {extOnlyFams.length > 0 && <>
                      <div style={{fontSize:11,color:DM,marginBottom:4,marginTop:12,fontWeight:500}}>New families ({extOnlyFams.length}):</div>
                      {extOnlyFams.map(f => (<div key={f.id} style={{...rowSt,color:'#7a7568'}}>
                        {f.id} — H:{f.ext.husb||'?'} W:{f.ext.wife||'?'} {(f.ext.children||[]).length}ch
                      </div>))}
                    </>}
                  </div>}
                </div>}
              </div>);
            })()}

            {/* ──── EXTERNAL ONLY ──── */}
            {tab==='ext_only' && (()=>{
              const persons = diffResult.extOnly;
              const extFams = diffResult.familyDiffs.filter(f=>f.type==='ext_only');
              
              // Resolve names helper
              const extName = (id) => {
                if (!id) return '?';
                const p = extPeopleMap[id];
                return p ? (p.dn || p.fn || '?') : (personMap[id]?.dn || id);
              };
              
              // Determine connection for each person — walks up through ext families until it finds someone in FTLS
              const _connCache = {};
              const isConnected = (p) => {
                if (_connCache[p.id] !== undefined) return _connCache[p.id];
                const visited = new Set();
                const walk = (pid) => {
                  if (!pid || visited.has(pid)) return null;
                  visited.add(pid);
                  // Direct hit: this person is in FTLS
                  if (personMap[pid] && pid !== p.id) return extName(pid);
                  // Walk up through external families
                  for (const [fid, fam] of Object.entries(extFamiliesMap)) {
                    const hid = fam.husb||'', wid = fam.wife||'', kids = fam.children||[];
                    if (kids.includes(pid)) {
                      const fromH = walk(hid);
                      if (fromH) return fromH;
                      const fromW = walk(wid);
                      if (fromW) return fromW;
                    }
                    if ((hid === pid || wid === pid)) {
                      const spId = hid === pid ? wid : hid;
                      if (spId && personMap[spId]) return extName(spId);
                    }
                  }
                  // Also check FTLS families (person might be in an existing family)
                  for (const [fid, fam] of Object.entries(familyMap)) {
                    if ((fam.children||[]).includes(pid)) {
                      const par = fam.husband_id || fam.wife_id;
                      if (par && personMap[par]) return extName(par);
                    }
                  }
                  return null;
                };
                const result = walk(p.id);
                _connCache[p.id] = result;
                return result;
              };
              
              // Find what role this person plays (child of, spouse of, parent of)
              const getRole = (p) => {
                for (const [fid, fam] of Object.entries(extFamiliesMap)) {
                  const hid = fam.husb||'', wid = fam.wife||'', kids = fam.children||[];
                  if (kids.includes(p.id)) {
                    const dadName = extName(hid), momName = extName(wid);
                    return `child of ${[dadName, momName].filter(n=>n!=='?').join(' & ')}`;
                  }
                  if (hid === p.id || wid === p.id) {
                    const spId = hid === p.id ? wid : hid;
                    if (spId) return `spouse of ${extName(spId)}`;
                  }
                }
                return '';
              };
              
              // Split into connected vs unconnected vs unnamed
              const unnamed = persons.filter(p => !p.fn && !p.ln && (!p.dn || p.dn === '(Unknown)'));
              const named = persons.filter(p => p.fn || p.ln || (p.dn && p.dn !== '(Unknown)'));
              const connected = named.filter(p => isConnected(p));
              const unconnected = named.filter(p => !isConnected(p));
              
              // Find families needed for selected persons
              const getNeededFamilies = () => {
                const needed = [];
                const markedIds = new Set(Object.entries(extDir).filter(([k,v])=>v==='import').map(([k])=>k));
                for (const f of extFams) {
                  const fam = f.ext;
                  const involves = markedIds.has(fam.husb) || markedIds.has(fam.wife) || 
                    (fam.children||[]).some(c => markedIds.has(c));
                  if (involves) needed.push(f);
                }
                return needed;
              };
              
              // Auto-mark families when persons are marked
              const markPerson = (pid, dir) => {
                setExtDir(prev => ({...prev, [pid]: dir}));
                // Auto-mark needed families
                if (dir === 'import') {
                  const famIds = {};
                  for (const f of extFams) {
                    const fam = f.ext;
                    if (fam.husb === pid || fam.wife === pid || (fam.children||[]).includes(pid)) {
                      famIds[f.id] = 'import';
                    }
                  }
                  if (Object.keys(famIds).length > 0) setExtFamDir(prev => ({...prev, ...famIds}));
                }
              };
              
              const markAllConnected = () => {
                const d = {...extDir};
                const fd = {...extFamDir};
                connected.forEach(p => {
                  d[p.id] = 'import';
                  for (const f of extFams) {
                    const fam = f.ext;
                    if (fam.husb === p.id || fam.wife === p.id || (fam.children||[]).includes(p.id)) fd[f.id] = 'import';
                  }
                });
                setExtDir(d);
                setExtFamDir(fd);
              };
              
              const clearAll = () => { setExtDir({}); setExtFamDir({}); };
              
              const markedCount = Object.values(extDir).filter(v=>v==='import').length;
              const neededFams = getNeededFamilies();
              
              return (<div style={{ padding:'12px 0' }}>
                {/* ── CONNECTED TO TREE ── */}
                {connected.length > 0 && <>
                  <div style={{...hdr, color:'#7eb8d0'}}>🆕 Connected to Tree ({connected.length})</div>
                  <div style={{ fontSize:12, color:DM, marginBottom:8 }}>New people linked to someone already in FTLS. Families are imported automatically.</div>
                  <div style={selBar}>
                    <button style={lnkBtn} onClick={markAllConnected}>⬇ All Import</button>
                    <button style={lnkBtn} onClick={clearAll}>Clear All</button>
                    <span style={{ fontSize:11, color:DM }}>{markedCount} marked</span>
                  </div>
                  {connected.map(p => {
                    const conn = isConnected(p);
                    const role = getRole(p);
                    return (<div key={p.id} style={{ ...rowSt }}>
                      <div style={{ display:'flex', alignItems:'center', gap:8 }}>
                        <DirBtn dir={extDir[p.id]||null} onSet={(d)=>markPerson(p.id, d)} allowExport={false} />
                        <span style={{ width:8, height:8, borderRadius:'50%', background:p.g==='M'?MC:FC, flexShrink:0 }} />
                        <span style={{ color:TX, flex:1 }}>
                          {p.dn||'(Unknown)'}
                          {role && <span style={{ color:DM, fontSize:11, marginLeft:6 }}>({role})</span>}
                        </span>
                        {p.dob && <span style={{ color:DM, fontSize:11 }}>b.{p.dob}</span>}
                      </div>
                      <FamilyPath personId={p.id} showFtls={false} showExt={true} />
                    </div>);
                  })}
                </>}
                
                {/* ── UNCONNECTED ── */}
                {unconnected.length > 0 && <>
                  <div style={{...hdr, marginTop:20, color:'#7a7568'}}>Unconnected ({unconnected.length})</div>
                  <div style={{ fontSize:12, color:DM, marginBottom:8 }}>Not linked to anyone in FTLS yet. Import individually if you recognize them.</div>
                  {unconnected.map(p => {
                    const role = getRole(p);
                    return (<div key={p.id} style={{ ...rowSt }}>
                      <div style={{ display:'flex', alignItems:'center', gap:8 }}>
                        <DirBtn dir={extDir[p.id]||null} onSet={(d)=>markPerson(p.id, d)} allowExport={false} />
                        <span style={{ width:8, height:8, borderRadius:'50%', background:p.g==='M'?MC:FC, flexShrink:0 }} />
                        <span style={{ color:'#7a7568', flex:1 }}>
                          {p.dn||'(Unknown)'}
                          {role && <span style={{ color:'#5a5548', fontSize:11, marginLeft:6 }}>({role})</span>}
                        </span>
                        {p.dob && <span style={{ color:DM, fontSize:11 }}>b.{p.dob}</span>}
                      </div>
                      <FamilyPath personId={p.id} showFtls={false} showExt={true} />
                    </div>);
                  })}
                </>}
                
                {/* ── UNNAMED PLACEHOLDERS ── */}
                {unnamed.length > 0 && <>
                  <div style={{...hdr, marginTop:20, color:'#5a4040'}}>Unnamed Placeholders ({unnamed.length}) — skip</div>
