/* ═══════════════════════════════════════════════════════════════════
   TREE HEALTH AUDIT TAB
   Surfaces structural issues: orphans, partial orphans, misfits,
   placeholder families. Super Admin only.
   ═══════════════════════════════════════════════════════════════════ */
function TreeHealthTab({ personMap, familyMap, flat, tree, user, onPlaceOrphan }) {
  const [results, setResults] = useState(null);
  const [running, setRunning] = useState(false);
  const [expanded, setExpanded] = useState({}); // section key → bool

  const runAudit = () => {
    setRunning(true);
    // Use a timeout to let the UI show "Running..." before the sync computation
    setTimeout(() => {
      try {
        const persons = personMap || {};
        const families = familyMap || {};

        // Build lookup sets
        const childOf = new Set();    // person IDs that appear in any family.children
        const spouseOf = new Set();   // person IDs that appear as husband_id or wife_id
        const familyChildren = {};    // familyId → children array

        for (const [fid, fam] of Object.entries(families)) {
          const kids = fam.children || [];
          familyChildren[fid] = kids;
          kids.forEach(cid => childOf.add(cid));
          if (fam.husband_id) spouseOf.add(fam.husband_id);
          if (fam.wife_id) spouseOf.add(fam.wife_id);
        }

        const relationStatus = (pid) => {
          const parts = [];
          if (childOf.has(pid)) parts.push('child');
          if (spouseOf.has(pid)) parts.push('spouse');
          return parts.length ? parts.join(' + ') : 'orphan';
        };

        // 1a. Orphans — not in any family as child, husband, or wife
        const orphans = [];
        for (const [pid, p] of Object.entries(persons)) {
          if (!childOf.has(pid) && !spouseOf.has(pid)) {
            const ln = (p.ln || '').trim();
            // Find candidate families: families where a spouse shares last name
            const candidates = [];
            if (ln) {
              for (const [fid, fam] of Object.entries(families)) {
                const h = fam.husband_id ? persons[fam.husband_id] : null;
                const w = fam.wife_id ? persons[fam.wife_id] : null;
                const hLn = (h?.ln || '').trim();
                const wLn = (w?.ln || '').trim();
                if ((hLn && hLn.toLowerCase() === ln.toLowerCase()) || (wLn && wLn.toLowerCase() === ln.toLowerCase())) {
                  const label = [h?.dn, w?.dn].filter(Boolean).join(' & ') || fid;
                  const kidCount = (fam.children || []).length;
                  const kidNames = (fam.children || []).slice(0, 4).map(cid => persons[cid]?.dn || '?');
                  candidates.push({ fid, label, kidCount, kidNames });
                }
              }
            }
            const duplicateCandidates = Object.values(persons)
              .filter(other => other.id !== pid)
              .map(other => {
                const match = fuzzyMatchPerson(p, [other]);
                if (!match || match.score < 65 || !isStrongDuplicatePersonMatch(p, other, match.score)) return null;
                return {
                  id: other.id,
                  dn: other.dn || other.fn || other.id,
                  score: match.score,
                  status: relationStatus(other.id)
                };
              })
              .filter(Boolean)
              .sort((a, b) => b.score - a.score || a.dn.localeCompare(b.dn))
              .slice(0, 3);
            orphans.push({
              id: pid, dn: p.dn || p.fn || pid, gender: p.g,
              dob: p.dob || '', ln,
              duplicateCandidates,
              candidates: candidates.slice(0, 3), // top 3 suggestions
            });
          }
        }

        // 1b. Married-in only — spouse in some family but never a child in any family
        // Flag only those with birth year > 1950 (suspicious for recent generations)
        const partialOrphans = [];
        for (const [pid, p] of Object.entries(persons)) {
          if (spouseOf.has(pid) && !childOf.has(pid)) {
            const dob = p.dob || '';
            const birthYear = dob.match(/(19[5-9]\d|20\d\d)/);
            if (birthYear) {
              const hName = p.dn || p.fn || pid;
              // Find all families they're a spouse in, with children info
              const spouseFamilies = [];
              for (const [fid, fam] of Object.entries(families)) {
                if (fam.husband_id === pid || fam.wife_id === pid) {
                  const otherName = fam.husband_id === pid
                    ? (fam.wife_id && persons[fam.wife_id] ? (persons[fam.wife_id].dn || persons[fam.wife_id].fn || '?') : '')
                    : (fam.husband_id && persons[fam.husband_id] ? (persons[fam.husband_id].dn || persons[fam.husband_id].fn || '?') : '');
                  const kidCount = (fam.children || []).length;
                  const kidNames = (fam.children || []).slice(0, 3).map(cid => persons[cid]?.dn || '?');
                  spouseFamilies.push({ fid, otherName, kidCount, kidNames });
                }
              }
              partialOrphans.push({ id: pid, dn: hName, dob, spouseFamilies });
            }
          }
        }

        // 1c. Misfits — person has primary_family_id set but that family's children doesn't contain them
        const misfits = [];
        for (const [pid, p] of Object.entries(persons)) {
          const pfid = p.primaryFamId;
          if (pfid && families[pfid]) {
            const kids = families[pfid].children || [];
            if (!kids.includes(pid)) {
              const fam = families[pfid];
              const h = fam.husband_id ? persons[fam.husband_id] : null;
              const w = fam.wife_id ? persons[fam.wife_id] : null;
              const familyLabel = [h?.dn, w?.dn].filter(Boolean).join(' & ') || pfid;
              misfits.push({ id: pid, dn: p.dn || p.fn || pid, familyId: pfid, familyLabel });
            }
          }
        }

        // 1d. Placeholder families — children IDs that don't resolve to a real person
        const placeholders = [];
        for (const [fid, fam] of Object.entries(families)) {
          const kids = fam.children || [];
          const h = fam.husband_id ? persons[fam.husband_id] : null;
          const w = fam.wife_id ? persons[fam.wife_id] : null;
          const familyLabel = [h?.dn, w?.dn].filter(Boolean).join(' & ') || fid;
          for (const cid of kids) {
            const p = persons[cid];
            if (!p) {
              placeholders.push({ familyId: fid, familyLabel, childId: cid, issue: 'Missing — ID not found in persons table' });
            } else {
              const fn = p.fn || '';
              const ln = p.ln || '';
              const dn = p.dn || '';
              const isBlank = !fn.trim() && !ln.trim() && (!dn.trim() || /^(unknown|mrs?\s*\/\/)/i.test(dn));
              if (isBlank) {
                placeholders.push({ familyId: fid, familyLabel, childId: cid, issue: `Placeholder — name is "${dn || '(empty)'}"` });
              }
            }
          }
        }

        setResults({ orphans, partialOrphans, misfits, placeholders, timestamp: new Date().toLocaleTimeString() });
      } catch (e) {
        console.error('Audit error:', e);
        setResults({ error: e.message });
      }
      setRunning(false);
    }, 50);
  };

  const toggle = (key) => setExpanded(prev => ({ ...prev, [key]: !prev[key] }));

  // Section renderer
  const Section = ({ sectionKey, icon, title, color, items, renderItem, emptyMsg }) => {
    const isOpen = expanded[sectionKey] !== false; // default open
    const count = items.length;
    return (
      <div style={{ marginBottom: 12, border: `1px solid ${count > 0 ? color+'40' : BR}`, borderRadius: 8, overflow: 'hidden' }}>
        <div onClick={() => toggle(sectionKey)}
          style={{ display: 'flex', alignItems: 'center', gap: 8, padding: '10px 14px', cursor: 'pointer',
            background: count > 0 ? color+'08' : 'rgba(255,255,255,0.01)' }}>
          <span style={{ fontSize: 14 }}>{icon}</span>
          <span style={{ fontSize: 13, color: count > 0 ? color : DM, fontWeight: 500, flex: 1 }}>{title}</span>
          <span style={{ fontSize: 12, color: count > 0 ? color : DM, background: count > 0 ? color+'18' : 'rgba(255,255,255,0.04)',
            padding: '2px 10px', borderRadius: 10, fontWeight: 600, minWidth: 24, textAlign: 'center' }}>{count}</span>
          <span style={{ color: DM, fontSize: 10, transform: isOpen ? 'rotate(180deg)' : 'rotate(0)', transition: 'transform 0.15s' }}>▼</span>
        </div>
        {isOpen && (
          <div style={{ borderTop: `1px solid ${BR}` }}>
            {count === 0 ? (
              <div style={{ padding: '12px 14px', fontSize: 12, color: DM, fontStyle: 'italic' }}>{emptyMsg || 'All clear — no issues found.'}</div>
            ) : (
              items.map((item, i) => (
                <div key={i} style={{ padding: '8px 14px', borderTop: i > 0 ? `1px solid ${BR}` : 'none', fontSize: 12 }}>
                  {renderItem(item, i)}
                </div>
              ))
            )}
          </div>
        )}
      </div>
    );
  };

  return (
    <div>
      <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 16 }}>
        <div style={{ flex: 1 }}>
          <div style={{ fontSize: 13, color: DM, lineHeight: 1.6 }}>
            Scan the tree for structural problems — people not connected to any family, broken links, and placeholder records. Read-only scan; fixes use the "Place in family" action.
          </div>
        </div>
        <button onClick={runAudit} disabled={running}
          style={{ background: 'rgba(196,163,90,0.1)', border: '1px solid rgba(196,163,90,0.3)', color: '#c4a35a',
            padding: '8px 20px', borderRadius: 6, cursor: running ? 'default' : 'pointer', fontSize: 13, whiteSpace: 'nowrap',
            opacity: running ? 0.6 : 1 }}>
          {running ? '⏳ Scanning...' : '🩺 Run Audit'}
        </button>
      </div>

      {!results && !running && (
        <div style={{ textAlign: 'center', padding: '40px 20px', color: DM, fontSize: 13 }}>
          <div style={{ fontSize: 28, marginBottom: 12 }}>🩺</div>
          <div>Click <strong style={{ color: GC }}>Run Audit</strong> to scan {Object.keys(personMap || {}).length} people and {Object.keys(familyMap || {}).length} families for structural issues.</div>
        </div>
      )}

      {results && results.error && (
        <div style={{ padding: 14, background: 'rgba(192,80,80,0.08)', border: '1px solid rgba(192,80,80,0.3)', borderRadius: 8, color: '#c05050', fontSize: 12 }}>
          Audit failed: {results.error}
        </div>
      )}

      {results && !results.error && (<>
        <div style={{ fontSize: 11, color: DM, marginBottom: 12, textAlign: 'right' }}>
          Last scan: {results.timestamp} · {results.orphans.length + results.partialOrphans.length + results.misfits.length + results.placeholders.length} total issues
        </div>

        <Section sectionKey="orphans" icon="👻" title="Orphans — completely disconnected" color="#c05050"
          items={results.orphans} emptyMsg="No orphans — everyone is connected to at least one family."
          renderItem={(item) => (
            <div>
              <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                <span style={{ width: 8, height: 8, borderRadius: '50%', background: item.gender === 'M' ? MC : item.gender === 'F' ? FC : DM, flexShrink: 0 }} />
                <div style={{ flex: 1 }}>
                  <span style={{ color: TX, fontWeight: 500 }}>{item.dn}</span>
                  {item.dob && <span style={{ color: DM, marginLeft: 8 }}>b. {item.dob}</span>}
                  {item.ln && <span style={{ color: DM, marginLeft: 8, fontSize: 11 }}>({item.ln})</span>}
                </div>
                <button onClick={(e) => { e.stopPropagation(); onPlaceOrphan(item); }}
                  style={{ background: 'rgba(107,158,114,0.1)', border: '1px solid rgba(107,158,114,0.3)', color: MC,
                    padding: '4px 12px', borderRadius: 5, cursor: 'pointer', fontSize: 11, whiteSpace: 'nowrap' }}>
                  {item.duplicateCandidates.length > 0 ? '🧬 Resolve / Place…' : '📌 Place in family…'}
                </button>
              </div>
              <div style={{ fontSize: 10, color: DM, marginTop: 2, marginLeft: 16 }}>{item.id}</div>
              {item.candidates.length > 0 && (
                <div style={{ marginTop: 6, marginLeft: 16, padding: '6px 10px', background: 'rgba(107,158,114,0.04)', border: '1px solid rgba(107,158,114,0.1)', borderRadius: 6 }}>
                  <div style={{ fontSize: 10, color: MC, fontWeight: 500, marginBottom: 4 }}>Likely families (last name "{item.ln}" match):</div>
                  {item.candidates.map((c, ci) => (
                    <div key={ci} style={{ fontSize: 11, color: DM, marginTop: 2, lineHeight: 1.5 }}>
                      <span style={{ color: TX }}>{c.label}</span>
                      <span style={{ marginLeft: 6 }}>· {c.kidCount} children</span>
                      {c.kidNames.length > 0 && <span style={{ marginLeft: 4, color: '#7a7568' }}>({c.kidNames.join(', ')})</span>}
                    </div>
                  ))}
                </div>
              )}
              {item.candidates.length === 0 && (
                <div style={{ marginTop: 4, marginLeft: 16, fontSize: 10, color: '#8a6040', fontStyle: 'italic' }}>
                  No family name match found — may need manual lookup
                </div>
              )}
              {item.duplicateCandidates.length > 0 && (
                <div style={{ marginTop: 6, marginLeft: 16, padding: '6px 10px', background: 'rgba(208,160,126,0.05)', border: '1px solid rgba(208,160,126,0.15)', borderRadius: 6 }}>
                  <div style={{ fontSize: 10, color: '#d0a07e', fontWeight: 500, marginBottom: 4 }}>Possible duplicate people already in DB:</div>
                  {item.duplicateCandidates.map((c, ci) => (
                    <div key={ci} style={{ fontSize: 11, color: DM, marginTop: 2, lineHeight: 1.5 }}>
                      <span style={{ color: TX }}>{c.dn}</span>
                      <span style={{ marginLeft: 6, color: '#d0a07e' }}>score {c.score}</span>
                      <span style={{ marginLeft: 6 }}>{c.status}</span>
                      <span style={{ marginLeft: 6, color: '#7a7568' }}>{c.id}</span>
                    </div>
                  ))}
                </div>
              )}
            </div>
          )} />

        <Section sectionKey="partial" icon="🔗" title="Married-in only — no birth family in tree (post-1950)" color="#c4a35a"
          items={results.partialOrphans} emptyMsg="No married-in-only individuals found among post-1950 entries."
          renderItem={(item) => (
            <div>
              <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                <span style={{ color: TX, fontWeight: 500 }}>{item.dn}</span>
                {item.dob && <span style={{ color: DM }}>b. {item.dob}</span>}
              </div>
              {item.spouseFamilies.map((sf, si) => (
                <div key={si} style={{ fontSize: 11, color: DM, marginTop: 3, marginLeft: 8, lineHeight: 1.5 }}>
                  <span>⚭ Married to <span style={{ color: TX }}>{sf.otherName || '?'}</span></span>
                  {sf.kidCount > 0 && <span style={{ marginLeft: 6 }}>· {sf.kidCount} children ({sf.kidNames.join(', ')})</span>}
                  {sf.kidCount === 0 && <span style={{ marginLeft: 6 }}>· no children</span>}
                </div>
              ))}
              <div style={{ fontSize: 10, color: DM, marginTop: 2, marginLeft: 8 }}>{item.id}</div>
              <div style={{ fontSize: 10, color: '#8a7a50', marginTop: 3, marginLeft: 8, fontStyle: 'italic' }}>
                Typical for spouses who married into the family — only a concern if their parents should be in this tree.
              </div>
            </div>
          )} />

        <Section sectionKey="misfits" icon="🔧" title="Misfits — primary_family_id doesn't match children array" color="#5aa3c4"
          items={results.misfits} emptyMsg="No misfits — all primary_family_id links are consistent."
          renderItem={(item) => (
            <div>
              <span style={{ color: TX, fontWeight: 500 }}>{item.dn}</span>
              <div style={{ fontSize: 11, color: DM, marginTop: 3, lineHeight: 1.5 }}>
                Claims primary family <span style={{ color: '#5aa3c4' }}>{item.familyLabel}</span> <span style={{ fontSize: 10, color: '#666' }}>({item.familyId})</span> but isn't in that family's children array.
              </div>
            </div>
          )} />

        <Section sectionKey="placeholders" icon="❓" title="Placeholder children — missing or unnamed records in families" color="#9b82c4"
          items={results.placeholders} emptyMsg="No placeholder children — all family child references resolve to named people."
          renderItem={(item) => (
            <div>
              <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
                <span style={{ color: TX }}>Child of <span style={{ color: '#9b82c4', fontWeight: 500 }}>{item.familyLabel}</span></span>
              </div>
              <div style={{ fontSize: 11, color: DM, marginTop: 3, lineHeight: 1.5 }}>
                {item.issue}
              </div>
              <div style={{ fontSize: 10, color: '#666', marginTop: 2 }}>
                Family: {item.familyId} → child: {item.childId}
              </div>
            </div>
          )} />
      </>)}
    </div>
  );
}

function AdminPanel({onClose, onReloadTree, onShowMigrate, onShowDiff, onShowBackfill, onShowPrune, personMap, familyMap, flat, tree, user, onPlaceOrphan}) {
  const [tab, setTab] = useState('updates'); // 'updates' | 'accounts' | 'users' | 'log' | 'tools' | 'health'
  const [updateReqs, setUpdateReqs] = useState([]);
  const [accessReqs, setAccessReqs] = useState([]);
  const [allUsers, setAllUsers] = useState([]);
  const [editLog, setEditLog] = useState([]);
  const [expandedLog, setExpandedLog] = useState(null); // id of expanded log entry
  const [loading, setLoading] = useState(true);
  const [actionMsg, setActionMsg] = useState('');
  const btnS2={background:'rgba(196,163,90,0.08)',border:'1px solid rgba(196,163,90,0.2)',color:'#c4a35a',padding:'6px 14px',borderRadius:5,fontSize:12,cursor:'pointer'};

  useEffect(()=>{
    (async()=>{
      try {
        const h = { 'Authorization': 'Bearer ' + authSession.access_token };
        const [ur, ar, us, el] = await Promise.all([
          sbFetch('update_requests?order=created_at.desc&limit=50', {headers:h}),
          sbFetch('access_requests?order=created_at.desc&limit=50', {headers:h}),
          sbFetch('users?order=name', {headers:h}),
          sbFetch('edit_log?order=created_at.desc&limit=50', {headers:h}),
        ]);
        setUpdateReqs(ur); setAccessReqs(ar); setAllUsers(us); setEditLog(el);
      } catch(e) { console.error('Admin load error:', e); }
      setLoading(false);
    })();
  },[]);

  // Field label mapping for human-readable display
  const fieldLabels = {
    fn:'First Name',mn:'Middle Name',ln:'Last Name',dn:'Display Name',nk:'Nickname',md:'Maiden Name',
    g:'Gender',dob:'Date of Birth',dod:'Date of Death',dec:'Deceased',bo:'Birth Order',
    em:'Email',ph:'Phone',a1:'Address 1',a2:'Address 2',ci:'City',st:'State',zp:'Zip',co:'Country',
    fb:'Facebook',ig:'Instagram',li:'LinkedIn',ws:'Website',pp:'Profile Photo',bio:'Bio',loc:'Location',
    prof:'Profession',emp:'Employer',stories:'Stories',notes:'Notes',pgl:'Photo Gallery',dl:'Documents',
    mdate:'Marriage Date',mplace:'Marriage Place',
    _action:'Action Type',_context:'Context/Explanation',
    first_name:'First Name',middle_name:'Middle Name',last_name:'Last Name',display_name:'Display Name',
    nickname:'Nickname',date_of_birth:'Date of Birth',date_of_death:'Date of Death',
    email:'Email',phone:'Phone',profession:'Profession',employer:'Employer',location:'Location',
    profile_photo:'Profile Photo',
  };
  const getLabel = (k) => fieldLabels[k] || k;

  const approveUpdate = async (req) => {
    try {
      const h = { 'Authorization': 'Bearer ' + authSession.access_token };
      const action = req.changes?._action || 'update';

      // Take snapshot before making changes (for undo)
      if (req.person_id && action !== 'add_child') {
        try {
          await sbFetch('rpc/snapshot_person', {
            method: 'POST', headers: h,
            body: JSON.stringify({ p_person_id: req.person_id, p_reason: 'before_approve_request_' + req.id })
          });
        } catch(e) { console.warn('Snapshot failed:', e); }
      }

      // Map short field names (from edit form) to database column names
      const fieldMap = {
        fn:'first_name', mn:'middle_name', ln:'last_name', dn:'display_name',
        nk:'nickname', md:'maiden_name', g:'gender', dob:'date_of_birth',
        dod:'date_of_death', dec:'is_deceased', bo:'birth_order',
        em:'email', ph:'phone', a1:'address1', a2:'address2',
        ci:'city', st:'state', zp:'zip', co:'country',
        fb:'facebook', ig:'instagram', li:'linkedin', ws:'website',
        pp:'profile_photo', loc:'location', prof:'profession', emp:'employer',
        pgl:'photo_gallery_link', dl:'documents_link',
        // These are already correct DB names — pass through
        first_name:'first_name', middle_name:'middle_name', last_name:'last_name',
        display_name:'display_name', nickname:'nickname', gender:'gender',
        date_of_birth:'date_of_birth', date_of_death:'date_of_death',
        email:'email', phone:'phone', profession:'profession', employer:'employer',
        location:'location', profile_photo:'profile_photo', bio:'bio',
        notes:'notes', stories:'stories',
        address1:'address1', address2:'address2', city:'city', state:'state',
        zip:'zip', country:'country', facebook:'facebook', instagram:'instagram',
        linkedin:'linkedin', website:'website',
      };

      // Convert changes to DB column names, stripping unknown/internal fields
      const skipFields = new Set(['_action','_context','_previous','_from_family','_from_label','_to_family','_to_label','id','ch','sp','fams','famc','_fams','_famc','_p','_n','_matchType','_spouseOf','gen','mdate','mplace','marriage_date','marriage_place','bo','birth_order']);
      const dbChanges = {};
      for (const [k, v] of Object.entries(req.changes)) {
        if (skipFields.has(k)) continue;
        const dbCol = fieldMap[k];
        if (dbCol) {
          dbChanges[dbCol] = (k === 'dec') ? !!v : (v || '');
        }
        // If key is already a valid DB column name and not in fieldMap, skip it
      }

      if (action === 'delete') {
        await sbFetch(`persons?id=eq.${req.person_id}`, { method: 'DELETE', headers: h });
      } else if (action === 'move_branch') {
        // Move person from one family to another (or place orphan if fromFam is null)
        const fromFam = req.changes._from_family || null;
        const toFam = req.changes._to_family;
        if (toFam) {
          await movePersonBranch(req.person_id, fromFam, toFam, authUser?.email || 'admin_approve');
        }
      } else if (action === 'add_child') {
        const newId = req.changes.id || ('@I' + Date.now() + '@');
        dbChanges.id = newId;
        await sbFetch('persons', {
          method: 'POST', headers: {...h, 'Prefer':'return=minimal'},
          body: JSON.stringify(dbChanges)
        });
      } else {
        // Regular edit or edit_spouse — patch the person
        if (Object.keys(dbChanges).length > 0) {
          await sbFetch(`persons?id=eq.${req.person_id}`, {
            method: 'PATCH', headers: {...h, 'Prefer':'return=minimal'},
            body: JSON.stringify(dbChanges)
          });
        }
      }

      // Save marriage date/place to families table if present in changes
      const mdate = req.changes.mdate || req.changes.marriage_date;
      const mplace = req.changes.mplace || req.changes.marriage_place;
      if (mdate || mplace) {
        try {
          const fams = await sbFetch(`families?select=*&or=(husband_id.eq.${req.person_id},wife_id.eq.${req.person_id})`, {headers:h});
          if (fams.length > 0) {
            await sbFetch(`families?id=eq.${fams[0].id}`, {
              method: 'PATCH', headers: {...h, 'Prefer':'return=minimal'},
              body: JSON.stringify({ marriage_date: mdate||fams[0].marriage_date||'', marriage_place: mplace||fams[0].marriage_place||'' })
            });
          }
        } catch(e) { console.warn('Marriage approve save failed:', e); }
      }

      // Mark request as approved
      await sbFetch(`update_requests?id=eq.${req.id}`, {
        method: 'PATCH', headers: h,
        body: JSON.stringify({ status: 'approved', resolved_by: authUser.id, resolved_at: new Date().toISOString() })
      });
      setUpdateReqs(prev=>prev.map(r=>r.id===req.id?{...r,status:'approved'}:r));
      setActionMsg('Update approved and applied!');
      if (onReloadTree) onReloadTree();
      setTimeout(()=>setActionMsg(''),3000);
    } catch(e) { setActionMsg('Error: ' + e.message); }
  };

  const rejectUpdate = async (req, reason) => {
    try {
      const h = { 'Authorization': 'Bearer ' + authSession.access_token };
      await sbFetch(`update_requests?id=eq.${req.id}`, {
        method: 'PATCH', headers: h,
        body: JSON.stringify({ status: 'rejected', admin_response: reason||'', resolved_by: authUser.id, resolved_at: new Date().toISOString() })
      });
      setUpdateReqs(prev=>prev.map(r=>r.id===req.id?{...r,status:'rejected'}:r));
      setActionMsg('Request rejected');
      setTimeout(()=>setActionMsg(''),3000);
    } catch(e) { setActionMsg('Error: ' + e.message); }
  };

  const approveAccess = async (req) => {
    try {
      const h = { 'Authorization': 'Bearer ' + authSession.access_token };
      setActionMsg('Creating account for ' + req.name + '...');
      
      // Step 1: Create auth user + public.users row via signup
      await createUserAccount(req.email, req.name, req.person_id || null, 'editor');
      
      // Step 2: Send password reset email so user can set their own password
      let emailSent = false;
      try {
        await resetPassword(req.email);
        emailSent = true;
      } catch(e) { console.warn('Password reset email may not have sent:', e); }
      
      // Step 3: Mark request as approved
      await sbFetch(`access_requests?id=eq.${req.id}`, {
        method: 'PATCH', headers: h,
        body: JSON.stringify({ status: 'approved', resolved_by: authUser.id, resolved_at: new Date().toISOString() })
      });
      
      setAccessReqs(prev=>prev.map(r=>r.id===req.id?{...r,status:'approved'}:r));
      // Refresh users list
      const updatedUsers = await sbFetch('users?order=name', {headers:h});
      setAllUsers(updatedUsers);
      setActionMsg(emailSent 
        ? 'Account created for ' + req.name + '! Password reset email sent to ' + req.email 
        : 'Account created for ' + req.name + '! (Email may not have sent — verify Resend domain)');
      setTimeout(()=>setActionMsg(''),8000);
    } catch(e) { setActionMsg('Error: ' + e.message); }
  };

  const changeUserRole = async (userId, newRole) => {
    try {
      const h = { 'Authorization': 'Bearer ' + authSession.access_token };
      await sbFetch(`users?id=eq.${userId}`, {
        method: 'PATCH', headers: h,
        body: JSON.stringify({ role: newRole })
      });
      setAllUsers(prev=>prev.map(u=>u.id===userId?{...u,role:newRole}:u));
      setActionMsg('Role updated!');
      setTimeout(()=>setActionMsg(''),3000);
    } catch(e) { setActionMsg('Error: ' + e.message); }
  };

  const statusBadge = (s) => {
    const colors = {pending:'#c4a35a',approved:'#6b9e72',rejected:'#c05050',clarification:'#9b82c4'};
    return <span style={{fontSize:10,background:colors[s]+'22',color:colors[s],padding:'2px 8px',borderRadius:10,textTransform:'uppercase',letterSpacing:1}}>{s}</span>;
  };

  const tabBtn = (id,label,count) => (
    <button key={id} onClick={()=>switchTab(id)} style={{
      background:tab===id?'rgba(196,163,90,0.12)':'transparent',
      border:tab===id?'1px solid #8a7340':'1px solid transparent',
      color:tab===id?'#c4a35a':'#7a7568',padding:'6px 14px',borderRadius:5,fontSize:12,cursor:'pointer'
    }}>{label}{count>0&&<span style={{marginLeft:4,fontSize:10,background:'#c4a35a22',color:'#c4a35a',padding:'1px 6px',borderRadius:8}}>{count}</span>}</button>
  );

  const pendingUpdates = updateReqs.filter(r=>r.status==='pending').length;
  const approvedUpdates = updateReqs.filter(r=>r.status==='approved').length;
  const rejectedUpdates = updateReqs.filter(r=>r.status==='rejected').length;
  const pendingAccess = accessReqs.filter(r=>r.status==='pending').length;
  const [statusFilter, setStatusFilter] = useState('pending');

  const switchTab = (t) => { setTab(t); setActionMsg(''); setStatusFilter('pending'); };

  return(
    <div style={{maxWidth:1200,margin:'0 auto',padding:'0 16px 60px'}}>
      <div style={{display:'flex',gap:8,marginBottom:16,flexWrap:'wrap',alignItems:'center'}}>
        {tabBtn('updates','Update Requests',pendingUpdates)}
        {tabBtn('accounts','Account Requests',pendingAccess)}
        {user?.role==='super_admin'&&tabBtn('users','Manage Users',0)}
        {tabBtn('log','Edit Log',0)}
        {tabBtn('tools','🛠 Tools',0)}
        {user?.role==='super_admin'&&tabBtn('health','🩺 Tree Health',0)}
        {actionMsg&&<span style={{fontSize:12,color:actionMsg.startsWith('Error')?'#c05050':'#6b9e72',marginLeft:16}}>{actionMsg}</span>}
      </div>

      {loading&&<div style={{color:'#7a7568',fontSize:13}}>Loading...</div>}

      {!loading&&tab==='updates'&&<div>
        <div style={{display:'flex',gap:6,marginBottom:12}}>
          {[['pending','Pending',pendingUpdates],['approved','Approved',approvedUpdates],['rejected','Rejected',rejectedUpdates]].map(([s,l,c])=>
            <button key={s} onClick={()=>setStatusFilter(s)} style={{
              background:statusFilter===s?'rgba(196,163,90,0.1)':'transparent',
              border:statusFilter===s?'1px solid rgba(196,163,90,0.3)':'1px solid transparent',
              color:statusFilter===s?'#c4a35a':'#7a7568',padding:'4px 12px',borderRadius:4,fontSize:11,cursor:'pointer',textTransform:'uppercase',letterSpacing:1
            }}>{l}{c>0&&<span style={{marginLeft:4,fontSize:10,opacity:0.7}}>({c})</span>}</button>
          )}
        </div>
        {updateReqs.filter(r=>r.status===statusFilter).length===0&&<div style={{color:'#7a7568',fontSize:13}}>No {statusFilter} requests.</div>}
        {updateReqs.filter(r=>r.status===statusFilter).map(r=><div key={r.id} style={{background:'#141410',border:'1px solid rgba(196,163,90,0.08)',borderRadius:8,padding:16,marginBottom:8}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>
            <div>
              <span style={{color:'#d4cfc0',fontSize:14,fontWeight:500}}>{r.person_name||r.person_id}</span>
              <span style={{color:'#7a7568',fontSize:12,marginLeft:8}}>by {r.requester_name} ({r.requester_email})</span>
            </div>
            {statusBadge(r.status)}
          </div>
          <div style={{fontSize:12,color:'#7a7568',marginBottom:8}}>{new Date(r.created_at).toLocaleString()}</div>
          {r.changes?._action&&<div style={{marginBottom:8}}>
            <span style={{fontSize:11,padding:'3px 10px',borderRadius:10,letterSpacing:1,textTransform:'uppercase',
              background:r.changes._action==='delete'?'rgba(192,80,80,0.15)':r.changes._action==='add_child'?'rgba(107,158,114,0.15)':r.changes._action==='move_branch'?'rgba(126,184,208,0.15)':'rgba(196,163,90,0.15)',
              color:r.changes._action==='delete'?'#c05050':r.changes._action==='add_child'?'#6b9e72':r.changes._action==='move_branch'?'#7eb8d0':'#c4a35a',
            }}>{r.changes._action==='edit_spouse'?'Edit Spouse':r.changes._action==='add_child'?'Add Child':r.changes._action==='delete'?'Delete Person':r.changes._action==='move_branch'?'🔀 Move Branch':'Edit Person'}</span>
          </div>}
          {r.changes?._action==='move_branch'&&<div style={{fontSize:12,background:'rgba(126,184,208,0.06)',border:'1px solid rgba(126,184,208,0.15)',padding:'8px 10px',borderRadius:4,marginBottom:8,lineHeight:1.8}}>
            <div><span style={{color:DM}}>From:</span> <span style={{color:'#c07a7a'}}>{r.changes._from_label||r.changes._from_family||'?'}</span></div>
            <div><span style={{color:DM}}>To:</span> <span style={{color:'#6b9e72'}}>{r.changes._to_label||r.changes._to_family||'?'}</span></div>
          </div>}
          {r.changes?._context&&<div style={{fontSize:12,color:'#d4cfc0',background:'rgba(155,130,196,0.08)',border:'1px solid rgba(155,130,196,0.15)',padding:'6px 10px',borderRadius:4,marginBottom:8,fontStyle:'italic'}}>
            "{r.changes._context}"
          </div>}
          {r.changes&&(()=>{
            const prev = r.changes._previous || {};
            const skipDisplay = new Set(['_action','_context','_previous','_from_family','_from_label','_to_family','_to_label','id','ch','sp','fams','famc','_fams','_famc','_p','_n','_matchType','_spouseOf','gen']);
            const entries = Object.entries(r.changes).filter(([k])=>!skipDisplay.has(k));
            // Filter to only changed fields (where new !== old, ignoring both-empty)
            const diffs = entries.filter(([k,v])=>{
              const oldVal = String(prev[k]||'').trim();
              const newVal = String(v||'').trim();
              // Skip if both empty or unchanged
              if (!oldVal && !newVal) return false;
              if (oldVal === newVal) return false;
              return true;
            });
            return diffs.length > 0 ? (
              <div style={{fontSize:12,background:'#0a0a08',padding:10,borderRadius:4,marginBottom:8,maxHeight:200,overflowY:'auto'}}>
                {diffs.map(([k,v])=>{
                  const oldVal = prev[k];
                  const newVal = v;
                  const hasOld = oldVal && String(oldVal).trim();
                  return(
                    <div key={k} style={{padding:'3px 0',borderBottom:'1px solid rgba(196,163,90,0.05)'}}>
                      <strong style={{color:'#8a7340'}}>{getLabel(k)}:</strong>{' '}
                      {hasOld&&<><span style={{color:'#c05050',textDecoration:'line-through',opacity:0.7}}>{String(oldVal)}</span><span style={{color:'#7a7568'}}> → </span></>}
                      <span style={{color:'#6b9e72'}}>{String(newVal)}</span>
                      {!hasOld&&<span style={{color:'#7a7568',fontSize:10,marginLeft:4}}>(new)</span>}
                    </div>
                  );
                })}
              </div>
            ) : (
              <div style={{fontSize:12,color:'#7a7568',marginBottom:8,fontStyle:'italic'}}>No field changes detected</div>
            );
          })()}
          {r.status==='rejected'&&r.admin_response&&<div style={{fontSize:12,color:'#c05050',background:'rgba(192,80,80,0.08)',padding:'6px 10px',borderRadius:4,marginBottom:8}}>
            <strong>Rejection reason:</strong> {r.admin_response}
          </div>}
          {r.resolved_at&&<div style={{fontSize:11,color:'#7a7568',marginBottom:8}}>
            {r.status==='approved'?'Approved':'Rejected'} on {new Date(r.resolved_at).toLocaleString()}
          </div>}
          {r.status==='pending'&&<div style={{display:'flex',gap:8}}>
            <button onClick={()=>approveUpdate(r)} style={{...btnS2,borderColor:'#6b9e72',color:'#6b9e72'}}>✓ Approve</button>
            <button onClick={()=>{const reason=prompt('Reason for rejection (optional):');if(reason!==null)rejectUpdate(r,reason)}} style={{...btnS2,borderColor:'#c05050',color:'#c05050'}}>✕ Reject</button>
            <a href={`mailto:${r.requester_email}?subject=About your family tree update request&body=Hi ${r.requester_name},%0A%0ARegarding your update request for ${r.person_name}:%0A%0A`}
              style={{...btnS2,borderColor:'#9b82c4',color:'#9b82c4',textDecoration:'none'}}>✉ Reply</a>
          </div>}
        </div>)}
      </div>}

      {!loading&&tab==='accounts'&&<div>
        {accessReqs.length===0&&<div style={{color:'#7a7568',fontSize:13}}>No account requests yet.</div>}
        {accessReqs.map(r=><div key={r.id} style={{background:'#141410',border:'1px solid rgba(196,163,90,0.08)',borderRadius:8,padding:16,marginBottom:8}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>
            <div>
              <span style={{color:'#d4cfc0',fontSize:14,fontWeight:500}}>{r.name}</span>
              <span style={{color:'#7a7568',fontSize:12,marginLeft:8}}>claims to be {r.person_name}</span>
            </div>
            {statusBadge(r.status)}
          </div>
          <div style={{fontSize:12,color:'#7a7568'}}>Email: {r.email}{r.phone&&' · Phone: '+r.phone} · {new Date(r.created_at).toLocaleString()}</div>
          {r.status==='pending'&&<div style={{display:'flex',gap:8,marginTop:8}}>
            <button onClick={()=>approveAccess(r)} style={{...btnS2,borderColor:'#6b9e72',color:'#6b9e72'}}>✓ Approve</button>
            <button onClick={()=>{
              sbFetch(`access_requests?id=eq.${r.id}`, {
                method:'PATCH', headers:{'Authorization':'Bearer '+authSession.access_token},
                body:JSON.stringify({status:'rejected',resolved_by:authUser.id,resolved_at:new Date().toISOString()})
              }).then(()=>setAccessReqs(prev=>prev.map(x=>x.id===r.id?{...x,status:'rejected'}:x)));
            }} style={{...btnS2,borderColor:'#c05050',color:'#c05050'}}>✕ Reject</button>
          </div>}
        </div>)}
      </div>}

      {!loading&&tab==='users'&&user?.role==='super_admin'&&<div>
        {allUsers.map(u=><div key={u.id} style={{background:'#141410',border:'1px solid rgba(196,163,90,0.08)',borderRadius:8,padding:12,marginBottom:6,display:'flex',alignItems:'center',gap:12}}>
          <span style={{color:'#d4cfc0',fontSize:14,flex:1}}>{u.name||u.email}</span>
          <span style={{fontSize:11,color:'#7a7568'}}>{u.email}</span>
          {u.role==='super_admin'?
            <span style={{fontSize:11,color:'#c4a35a',padding:'3px 10px',background:'rgba(196,163,90,0.1)',borderRadius:10}}>Super Admin</span>
          :
            <select value={u.role} onChange={e=>changeUserRole(u.id,e.target.value)}
              style={{background:'#0a0a08',border:'1px solid rgba(196,163,90,0.2)',color:'#d4cfc0',padding:'4px 8px',borderRadius:4,fontSize:12}}>
              <option value="editor">Editor</option>
              <option value="admin">Admin</option>
            </select>
          }
        </div>)}
      </div>}

      {!loading&&tab==='log'&&<div>
        {editLog.length===0&&<div style={{color:'#7a7568',fontSize:13}}>No edits logged yet.</div>}
        {editLog.map(e=>{
          const isSnapshot = e.action === 'snapshot';
          const isRevert = e.action === 'revert';
          const isUpdate = e.action === 'update';
          const isMove = e.action === 'move';
          const personName = e.changes?.person?.display_name || e.person_id || '—';
          const reason = e.changes?.reason || '';
          const isOpen = expandedLog === e.id;
          const canRevert = isSnapshot && user && ['admin','super_admin'].includes(user.role); // admin + super_admin can revert

          return(<div key={e.id} style={{background:isOpen?'rgba(196,163,90,0.03)':'transparent',borderRadius:6,marginBottom:4}}>
            <div onClick={()=>setExpandedLog(isOpen?null:e.id)} style={{fontSize:12,color:'#7a7568',padding:'8px 10px',cursor:'pointer',display:'flex',alignItems:'center',gap:8,
              borderBottom:isOpen?'none':'1px solid rgba(196,163,90,0.05)'}}>
              <span style={{width:8,height:8,borderRadius:'50%',flexShrink:0,
                background:isSnapshot?'#9b82c4':isRevert?'#c4a35a':isMove?'#7eb8d0':e.action==='delete'?'#c05050':'#6b9e72'}}/>
              <div style={{flex:1}}>
                <span style={{color:isSnapshot?'#9b82c4':isRevert?'#c4a35a':isMove?'#7eb8d0':'#8a7340',fontWeight:500}}>
                  {isSnapshot?'📸 Snapshot':isRevert?'↩ Reverted':isMove?'🔀 Moved':isUpdate?'✎ Updated':e.action}
                </span>
                {' '}<span style={{color:'#d4cfc0'}}>{isSnapshot?personName:e.person_id||'—'}</span>
                {isMove&&e.changes?.from_parent&&<span style={{color:DM}}> from {e.changes.from_parent} → {e.changes.to_parent}</span>}
                {e.edited_by&&e.edited_by!=='system'&&<span> by {e.edited_by}</span>}
                {reason&&<span style={{fontStyle:'italic'}}> ({reason})</span>}
              </div>
              <span style={{fontSize:11,color:'#5a5548',flexShrink:0}}>{new Date(e.created_at).toLocaleString()}</span>
              <span style={{color:'#5a5548',fontSize:10,flexShrink:0}}>{isOpen?'▼':'▶'}</span>
            </div>

            {isOpen&&<div style={{padding:'8px 10px 12px 28px',borderBottom:'1px solid rgba(196,163,90,0.05)'}}>
              {isSnapshot&&e.changes?.person&&<div style={{fontSize:11,color:'#d4cfc0',background:'#0a0a08',padding:10,borderRadius:4,marginBottom:8,maxHeight:200,overflowY:'auto'}}>
                <div style={{color:'#8a7340',fontWeight:500,marginBottom:6}}>Saved State:</div>
                {Object.entries(e.changes.person).filter(([k,v])=>v&&k!=='id'&&!k.startsWith('created')&&!k.startsWith('updated')).map(([k,v])=>
                  <div key={k}><span style={{color:'#7a7568'}}>{k}:</span> {String(v)}</div>
                )}
                {e.changes.families&&<div style={{marginTop:8}}>
                  <div style={{color:'#8a7340',fontWeight:500,marginBottom:4}}>Family Data:</div>
                  {(Array.isArray(e.changes.families)?e.changes.families:[]).map((f,i)=>
                    <div key={i}>{f.marriage_date&&<span>Marriage: {f.marriage_date} </span>}{f.marriage_place&&<span>at {f.marriage_place}</span>}</div>
                  )}
                </div>}
              </div>}

              {isUpdate&&e.changes&&<div style={{fontSize:11,color:'#d4cfc0',background:'#0a0a08',padding:10,borderRadius:4,marginBottom:8,maxHeight:200,overflowY:'auto'}}>
                {e.changes.person_name&&<div style={{color:'#c4a35a',fontWeight:500,marginBottom:6}}>{e.changes.person_name}</div>}
                {e.changes.changed_fields?
                  <div>
                    <div style={{color:'#8a7340',fontWeight:500,marginBottom:4}}>Changes:</div>
                    {Object.entries(e.changes.changed_fields).filter(([k])=>k!=='id'&&!k.startsWith('updated')).map(([k,v])=>{
                      const prevVal = e.changes.previous_values?.[k];
                      return <div key={k} style={{padding:'2px 0'}}>
                        <span style={{color:'#7a7568'}}>{k.replace(/_/g,' ')}:</span>{' '}
                        {prevVal ? <><span style={{color:'#a05050',textDecoration:'line-through'}}>{String(prevVal).substring(0,60)}</span> → </> : ''}
                        <span style={{color:'#6b9e72'}}>{String(v).substring(0,80)}</span>
                      </div>;
                    })}
                  </div>
                :
                  <div>
                    <div style={{color:'#8a7340',fontWeight:500,marginBottom:6}}>Changes Applied:</div>
                    {Object.entries(e.changes).filter(([k,v])=>v&&k!=='id'&&!k.startsWith('updated')&&k!=='person_name').map(([k,v])=>
                      <div key={k}><span style={{color:'#7a7568'}}>{k}:</span> {String(v).substring(0,80)}</div>
                    )}
                  </div>
                }
              </div>}

              {isRevert&&<div style={{fontSize:11,color:'#c4a35a',fontStyle:'italic'}}>
                Reverted from snapshot #{e.changes?.reverted_from_snapshot}
              </div>}

              {!isSnapshot&&!isUpdate&&!isRevert&&e.changes&&<div style={{fontSize:11,color:'#d4cfc0',background:'#0a0a08',padding:10,borderRadius:4,marginBottom:8,maxHeight:150,overflowY:'auto'}}>
                <pre style={{margin:0,whiteSpace:'pre-wrap',wordBreak:'break-all',fontFamily:'inherit'}}>{JSON.stringify(e.changes,null,2).substring(0,500)}</pre>
              </div>}

              {canRevert&&<button onClick={async(ev)=>{
                ev.stopPropagation();
                if(!confirm('Revert '+personName+' to this snapshot? This will undo all changes made after this point.'))return;
                try{
                  const h={'Authorization':'Bearer '+authSession.access_token};
                  await sbFetch('rpc/revert_to_snapshot',{method:'POST',headers:h,body:JSON.stringify({p_log_id:e.id})});
                  setActionMsg('Reverted '+personName+' to snapshot!');
                  if(onReloadTree)onReloadTree();
                  const newLog=await sbFetch('edit_log?order=created_at.desc&limit=50',{headers:h});
                  setEditLog(newLog);
                  setExpandedLog(null);
                  setTimeout(()=>setActionMsg(''),3000);
                }catch(err){setActionMsg('Revert error: '+err.message)}
              }} style={{background:'rgba(155,130,196,0.1)',border:'1px solid rgba(155,130,196,0.3)',color:'#9b82c4',padding:'4px 14px',borderRadius:4,cursor:'pointer',fontSize:11,marginTop:4}}>
                ↩ Revert to this snapshot
              </button>}
            </div>}
          </div>);
        })}
      </div>}

      {!loading&&tab==='tools'&&<div>
        <div style={{fontSize:13,color:'#7a7568',marginBottom:16}}>Database and GEDCOM management tools. Use with caution — these modify live data.</div>
        <div style={{display:'flex',gap:12,flexWrap:'wrap'}}>
          <div style={{flex:'1 1 300px',background:'rgba(196,163,90,0.04)',border:'1px solid rgba(196,163,90,0.15)',borderRadius:8,padding:16}}>
            <div style={{fontSize:14,color:'#c4a35a',fontWeight:500,marginBottom:8}}>🗄 Migrate GEDCOM → DB</div>
            <div style={{fontSize:12,color:'#7a7568',lineHeight:1.6,marginBottom:12}}>Replace all database data with a GEDCOM file. This clears existing persons, families, and edit logs. Use for initial setup or full reset only.</div>
            <button onClick={onShowMigrate} style={{background:'rgba(196,163,90,0.08)',border:'1px solid rgba(196,163,90,0.3)',color:'#c4a35a',padding:'8px 18px',borderRadius:6,cursor:'pointer',fontSize:13}}>🗄 Open Migrate Tool</button>
            <div style={{fontSize:10,color:'#a05050',marginTop:8}}>⚠ Destructive — replaces all data</div>
          </div>
          <div style={{flex:'1 1 300px',background:'rgba(107,158,114,0.04)',border:'1px solid rgba(107,158,114,0.15)',borderRadius:8,padding:16}}>
            <div style={{fontSize:14,color:'#6b9e72',fontWeight:500,marginBottom:8}}>🔀 Diff &amp; Merge</div>
            <div style={{fontSize:12,color:'#7a7568',lineHeight:1.6,marginBottom:12}}>Compare an external GEDCOM against FTLS. Selectively import new data or export FTLS additions. Safe — uses basket workflow with confirmation.</div>
            <button onClick={onShowDiff} style={{background:'rgba(107,158,114,0.08)',border:'1px solid rgba(107,158,114,0.3)',color:'#6b9e72',padding:'8px 18px',borderRadius:6,cursor:'pointer',fontSize:13}}>🔀 Open Diff &amp; Merge</button>
          </div>
          <div style={{flex:'1 1 300px',background:'rgba(90,163,196,0.04)',border:'1px solid rgba(90,163,196,0.15)',borderRadius:8,padding:16}}>
            <div style={{fontSize:14,color:'#5aa3c4',fontWeight:500,marginBottom:8}}>📦 Backfill GEDCOM Extras</div>
            <div style={{fontSize:12,color:'#7a7568',lineHeight:1.6,marginBottom:12}}>Parse a GEDCOM and populate _extra_gedcom, addresses, titles, burial dates for existing persons. Safe — only fills empty fields, matches by ID, never touches names or family links.</div>
            <button onClick={onShowBackfill} style={{background:'rgba(90,163,196,0.08)',border:'1px solid rgba(90,163,196,0.3)',color:'#5aa3c4',padding:'8px 18px',borderRadius:6,cursor:'pointer',fontSize:13}}>📦 Open Backfill Tool</button>
            <div style={{fontSize:10,color:'#7a7568',marginTop:8}}>✓ Non-destructive — only adds missing data</div>
          </div>
          <div style={{flex:'1 1 300px',background:'rgba(159,126,178,0.04)',border:'1px solid rgba(159,126,178,0.15)',borderRadius:8,padding:16}}>
            <div style={{fontSize:14,color:'#9f7eb2',fontWeight:500,marginBottom:8}}>🧹 Prune Orphan Meta</div>
            <div style={{fontSize:12,color:'#7a7568',lineHeight:1.6,marginBottom:12}}>Find gedcom_meta rows (stale OBJE photo refs, orphan NOTEs, etc.) no longer referenced by any person or family. Dry-run preview first; archives to <code style={{color:TX}}>gedcom_meta_archive</code> — not hard-deleted.</div>
            <button onClick={onShowPrune} style={{background:'rgba(159,126,178,0.08)',border:'1px solid rgba(159,126,178,0.3)',color:'#9f7eb2',padding:'8px 18px',borderRadius:6,cursor:'pointer',fontSize:13}}>🧹 Open Prune Tool</button>
            <div style={{fontSize:10,color:'#7a7568',marginTop:8}}>✓ Reversible — archived rows can be restored</div>
          </div>
        </div>
      </div>}

      {/* ───── TREE HEALTH TAB ───── */}

/* ── Marriage helpers ─────────────────────────────────────────────
   currentMarriage(spouses, primaryFamId) — returns the marriage to treat as
     "current" for display. Resolution order:
       1. If primaryFamId is set and matches a marriage, that wins (explicit pick).
       2. Otherwise, most recent non-divorced marriage by parsed year.
       3. Otherwise, most recent overall by parsed year.
     Dates vary: "1985", "12 JAN 1985", "ABT 1985", etc.
   marriageYear(s) — best-effort 4-digit year extract; 0 if unknown.
*/
function marriageYear(s) {
  if (!s) return 0;
  const m = String(s).match(/\b(1[5-9]\d{2}|2\d{3})\b/);
  return m ? parseInt(m[1], 10) : 0;
}
function currentMarriage(spouses, primaryFamId) {
  if (!spouses || spouses.length === 0) return null;
  if (primaryFamId) {
    const explicit = spouses.find(m => m.famId === primaryFamId);
    if (explicit) return explicit;
    // If the primary ref is stale (family deleted), fall through to date logic.
  }
  const sorted = [...spouses].sort((a, b) => marriageYear(b.mdate) - marriageYear(a.mdate));
  return sorted.find(m => !m.divorced) || sorted[0];
}

function MarriagePopover({node, onEditSpouse, onDelSpouse, onAddMarriage, onAddChild, onSetPrimary}) {
  const [open, setOpen] = React.useState(false);
  const ref = React.useRef(null);
  const marriages = node.spouses || (node.sp ? [{famId:null,sp:node.sp,mdate:node.mdate||'',divorced:false}] : []);
  React.useEffect(()=>{
    if(!open)return;
    const handler = e => { if(ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener('mousedown', handler);
    return ()=>document.removeEventListener('mousedown', handler);
  },[open]);
  const currentLabel = marriages.length === 0 ? null
    : (() => {
        const cur = currentMarriage(marriages, node.primaryFamId);
        return cur?.sp?.dn || (marriages.length === 1 ? '(unknown partner)' : null);
      })();
  return (
    <span ref={ref} style={{position:'relative',display:'inline-flex',alignItems:'center',gap:4,fontSize:12,color:DM}}>
      <span
        onClick={e=>{e.stopPropagation();setOpen(o=>!o)}}

      {open && <div style={{position:'absolute',top:'100%',left:0,zIndex:50,marginTop:4,
        background:'#1a1a14',border:`1px solid ${BR}`,borderRadius:8,minWidth:240,boxShadow:'0 4px 20px rgba(0,0,0,0.5)',padding:8}}>
        {marriages.length===0 && <div style={{fontSize:12,color:DM,padding:'4px 8px'}}>No marriages recorded</div>}
        {marriages.map((m,i)=>{
          const cur = currentMarriage(marriages, node.primaryFamId);
          const isCurrent = m === cur;

                  title={`Add a child to this marriage${m.sp?.dn?' with '+m.sp.dn:''}`}

}

  // most-recent non-divorced, then most-recent overall. Kids of non-primary
  // marriages get a subtle * marker indicating they're from a different union.
  const primaryMarriage = currentMarriage(node.spouses||[], node.primaryFamId);

        <span style={{display:'flex',gap:2,marginLeft:has?0:'auto',opacity:0.4,transition:'opacity 0.2s'}}
          onMouseEnter={e=>e.currentTarget.style.opacity='1'} onMouseLeave={e=>e.currentTarget.style.opacity='0.4'}>
          <button onClick={e=>{e.stopPropagation();onEdit(node)}} title="Edit this person's details" style={{background:'none',border:'none',color:GD,cursor:'pointer',fontSize:12,padding:'2px 4px'}}>✎</button>
          <button onClick={e=>{e.stopPropagation();onAdd(node.id)}} title="Add a child under this person" style={{background:'none',border:'none',color:MC,cursor:'pointer',fontSize:12,padding:'2px 4px'}}>+</button>
          {!has&&<button onClick={e=>{e.stopPropagation();onDel(node.id)}} title="Delete this person (only if no children)" style={{background:'none',border:'none',color:'#a05050',cursor:'pointer',fontSize:12,padding:'2px 4px'}}>✕</button>}
        </span>
      </div>
      {has&&open&&<div style={{paddingLeft:20,marginLeft:18,borderLeft:`1px solid ${BR}`}}>
        {node.ch.map(c=>{
          const isPrior = hasMultipleMarriages && !primaryChildIds.has(c.id);
          return <div key={c.id} style={{position:'relative'}}>
            {isPrior&&<span title="Child from a previous marriage" style={{position:'absolute',left:-14,top:8,fontSize:9,color:GD,fontWeight:600,opacity:0.8}}>*</span>}
            <TreeNode node={c} exp={exp} onTog={onTog} onSel={onSel} onEdit={onEdit} onAdd={onAdd} onDel={onDel} onEditSpouse={onEditSpouse} onDelSpouse={onDelSpouse} onAddMarriage={onAddMarriage} onAddChild={onAddChild} onSetPrimary={onSetPrimary} hl={hl}/>
          </div>;
        })}
      </div>}
    </div>
  );
}

/* ───── DETAIL ───── */
function Detail({node,onClose,onEdit,onEditSpouse,onDelSpouse,onMove,onAddChild,onAddMarriage,onSetPrimary,root}){
  const [personMedia,setPersonMedia]=useState([]);
  const [mediaLoaded,setMediaLoaded]=useState(false);
  const [lightbox,setLightbox]=useState(null);
  
  useEffect(()=>{
    if(node?.id){
      setMediaLoaded(false);
      loadMedia(node.id).then(m=>{setPersonMedia(m||[]);setMediaLoaded(true)}).catch(()=>setMediaLoaded(true));
    }
  },[node?.id]);

  if(!node)return null;

  const R=({l,v})=>v?<div style={{display:'flex',justifyContent:'space-between',padding:'3px 0',fontSize:13}}><span style={{color:DM}}>{l}</span><span style={{color:TX}}>{v}</span></div>:null;
  const personAddress = [node.a1, node.a2, node.ci, node.st, node.zp, node.co].filter(Boolean).join(', ');
  const lineage=(findPath(root,node.id)||[]).map(n=>n.dn);
  const profileUrl = node.pp ? cldImg(node.pp,'c_fill,w_120,h_120,g_face') : null;
  return(<>
    <div onClick={onClose} style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.5)',zIndex:90}}/>
    <div style={{position:'fixed',right:0,top:0,width:Math.min(380,window.innerWidth),height:'100vh',background:CD,borderLeft:`1px solid ${BR}`,zIndex:100,overflowY:'auto',padding:24}}>
      <div style={{display:'flex',justifyContent:'space-between'}}>
        <div/>
        <div style={{display:'flex',gap:8}}>
          <button onClick={()=>onMove(node)} style={{background:'none',border:`1px solid ${BR}`,color:'#7eb8d0',padding:'4px 12px',borderRadius:5,cursor:'pointer',fontSize:12}} title="Move this person to a different branch">🔀 Move</button>
          <button onClick={()=>onEdit(node)} style={{background:'none',border:`1px solid ${BR}`,color:GD,padding:'4px 12px',borderRadius:5,cursor:'pointer',fontSize:12}}>Edit</button>
          <button onClick={onClose} style={{background:'none',border:'none',color:DM,fontSize:18,cursor:'pointer'}}>✕</button>
        </div>
      </div>
      
      {/* Profile photo + name header */}
      <div style={{display:'flex',alignItems:'center',gap:16,marginTop:8,marginBottom:16}}>
        {profileUrl ? 
          <img src={profileUrl} style={{width:80,height:80,borderRadius:'50%',objectFit:'cover',border:`2px solid ${BR}`}} alt={node.dn}/>
          : <div style={{width:80,height:80,borderRadius:'50%',background:'#1a1a14',border:`2px solid ${BR}`,display:'flex',alignItems:'center',justifyContent:'center'}}>
              <span style={{fontSize:36,color:'#3a3a30'}}>{node.g==='F'?'👩':'👨'}</span>
            </div>
        }
        <div>
          <div style={{fontSize:11,color:DM,textTransform:'uppercase',letterSpacing:2}}>{node.g==='M'?'Male':'Female'}{node.dec?' · Deceased':''}</div>
          <div style={{fontSize:22,color:GC,fontWeight:300}}>{node.dn}</div>
          {node.nk&&<div style={{fontSize:13,color:DM,fontStyle:'italic'}}>"{node.nk}"</div>}
        </div>
      </div>
      
      <R l="Born" v={node.dob}/><R l="Birthplace" v={node.loc}/><R l="Died" v={node.dod}/>
      <R l="Profession" v={node.prof}/><R l="Employer" v={node.emp}/><R l="Email" v={node.em}/><R l="Phone" v={node.ph}/>
      <R l="Residence" v={personAddress}/>
      {node.bio&&<div style={{marginTop:12}}><div style={{fontSize:11,color:GD,textTransform:'uppercase',letterSpacing:2,marginBottom:4}}>Bio</div><div style={{fontSize:13,color:TX,lineHeight:1.6,whiteSpace:'pre-wrap'}}>{node.bio}</div></div>}
      {node.notes&&<div style={{marginTop:12}}><div style={{fontSize:11,color:GD,textTransform:'uppercase',letterSpacing:2,marginBottom:4}}>Notes</div><div style={{fontSize:13,color:TX,lineHeight:1.6,whiteSpace:'pre-wrap'}}>{node.notes}</div></div>}
      {node.stories&&<div style={{marginTop:12}}><div style={{fontSize:11,color:GD,textTransform:'uppercase',letterSpacing:2,marginBottom:4}}>Stories / Memories</div><div style={{fontSize:13,color:TX,lineHeight:1.6,whiteSpace:'pre-wrap'}}>{node.stories}</div></div>}

      {/* ── Marriages section — loops spouses[], falls back to legacy sp for GEDCOM-only nodes ── */}
      {(()=>{
        const marriages = node.spouses && node.spouses.length > 0
          ? node.spouses
          : (node.sp ? [{famId:null,sp:node.sp,mdate:node.mdate||'',mplace:node.mplace||'',divorced:false,divdate:'',ch:node.ch||[]}] : []);
        return <>
          {marriages.length > 0 && <div style={{marginTop:16}}>
            <div style={{fontSize:11,color:GD,textTransform:'uppercase',letterSpacing:2,marginBottom:8}}>
              {marriages.length===1 ? 'Marriage' : 'Marriages ('+marriages.length+')'}
            </div>
            {marriages.map((m,i)=>{
              const sp = m.sp;
              const spPp = sp?.pp ? cldImg(sp.pp,'c_fill,w_32,h_32,g_face,r_max') : null;
              const cur = currentMarriage(marriages, node.primaryFamId);
              const isCurrent = m === cur;
              const label = marriages.length === 1 ? null
                : isCurrent ? 'Current' : 'Former';
              return <div key={m.famId||i} style={{marginBottom:12,padding:'10px 12px',borderRadius:8,
                background:'rgba(255,255,255,0.025)',border:`1px solid ${BR}`}}>
                {/* Marriage header */}
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:8}}>
                  <div>
                    {label&&<span style={{fontSize:10,color:DM,textTransform:'uppercase',letterSpacing:1.5,fontWeight:400}}>
                      {label}
                    </span>}
                    {m.mdate&&<span style={{fontSize:11,color:DM,marginLeft:label?8:0}}>m. {m.mdate}</span>}
                    {m.divorced&&m.divdate&&<span style={{fontSize:11,color:DM,marginLeft:8}}>· Ended {marriageYear(m.divdate)||m.divdate}</span>}
                  </div>
                  <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
                    <button onClick={()=>onEditSpouse(node,m.famId,m.sp)}
                      style={{background:'none',border:`1px solid ${BR}`,color:GD,padding:'2px 9px',borderRadius:5,cursor:'pointer',fontSize:11}}>
                      {sp ? 'Edit' : 'Add partner'}
                    </button>
                    {onSetPrimary&&marriages.length>1&&!isCurrent&&sp&&<button onClick={()=>onSetPrimary(node.id,m.famId)}
                      title="Show this marriage as current"
                      style={{background:'none',border:`1px solid ${BR}`,color:DM,padding:'2px 9px',borderRadius:5,cursor:'pointer',fontSize:11}}>
                      Make primary
                    </button>}
                    {sp&&<button onClick={()=>onDelSpouse(node.id,m.famId)}
                      style={{background:'none',border:'1px solid rgba(160,80,80,0.3)',color:'#c07a7a',padding:'2px 9px',borderRadius:5,cursor:'pointer',fontSize:11}}>
                      Remove
                    </button>}
                  </div>
                </div>
                {/* Partner */}
                <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:sp?8:0}}>
                  {spPp ? <img src={spPp} style={{width:32,height:32,borderRadius:'50%',objectFit:'cover'}} alt=""/>
                    : <span style={{width:32,height:32,borderRadius:'50%',background:'#1a1a14',border:`1px solid ${BR}`,display:'flex',alignItems:'center',justifyContent:'center',fontSize:16,color:'#3a3a30',flexShrink:0}}>{sp?.g==='F'?'👩':'👨'}</span>}
                  <div>
                    <div style={{fontSize:13,color:sp?TX:DM,fontStyle:sp?'normal':'italic'}}>
                      {sp?.dn || 'Unknown partner'}
                    </div>
                    {sp?.dob&&<div style={{fontSize:11,color:DM}}>b. {sp.dob}</div>}
                  </div>
                </div>
                {/* Children of this marriage */}
                {m.ch&&m.ch.length>0&&<div style={{marginTop:8,paddingTop:8,borderTop:`1px solid ${BR}`}}>
                  <div style={{fontSize:11,color:DM,marginBottom:4}}>
                    {m.ch.length} {m.ch.length===1?'child':'children'}
                  </div>
                  {m.ch.map(c=><div key={c.id} style={{display:'flex',alignItems:'center',gap:6,padding:'2px 0',fontSize:13}}>
                    {c.pp ? <img src={cldImg(c.pp,'c_fill,w_18,h_18,g_face,r_max')} style={{width:18,height:18,borderRadius:'50%',objectFit:'cover'}} alt=""/>
                      : <span style={{width:5,height:5,borderRadius:'50%',background:c.g==='M'?MC:FC,flexShrink:0}}/>}
                    <span style={{color:TX}}>{c.dn}</span>
                    {c.dob&&<span style={{color:DM,marginLeft:'auto',fontSize:11}}>{c.dob}</span>}
                  </div>)}
                  <button onClick={()=>onAddChild(node.id, m.famId)}
                    style={{marginTop:6,background:'none',border:`1px solid ${BR}`,color:MC,padding:'3px 10px',borderRadius:5,cursor:'pointer',fontSize:11,width:'100%'}}>
                    + Add child to this marriage
                  </button>
                </div>}
                {(!m.ch||m.ch.length===0)&&<button onClick={()=>onAddChild(node.id, m.famId)}
                  style={{marginTop:4,background:'none',border:`1px solid ${BR}`,color:MC,padding:'3px 10px',borderRadius:5,cursor:'pointer',fontSize:11,width:'100%'}}>
                  + Add child to this marriage
                </button>}
              </div>;
            })}
            <button onClick={()=>onAddMarriage(node)}
              style={{width:'100%',background:'rgba(155,130,196,0.06)',border:`1px solid rgba(155,130,196,0.25)`,color:FC,padding:'6px',borderRadius:6,cursor:'pointer',fontSize:12,marginTop:2}}>
              ⚭ Add another marriage
            </button>
          </div>}
          {marriages.length===0&&<div style={{marginTop:16}}>
            <button onClick={()=>onEditSpouse(node,null,null)}
              style={{background:'rgba(155,130,196,0.08)',border:`1px solid rgba(155,130,196,0.25)`,color:FC,padding:'6px 14px',borderRadius:6,cursor:'pointer',fontSize:12}}>
              ⚭ Add Spouse
            </button>
          </div>}
        </>;
      })()}
      
      {/* Photos of this person */}
      {mediaLoaded && personMedia.length>0 && <div style={{marginTop:16}}>
        <div style={{fontSize:11,color:GD,textTransform:'uppercase',letterSpacing:2,marginBottom:8}}>Photos & Documents ({personMedia.length})</div>
        <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:6}}>
          {personMedia.map(m=>(
            <div key={m.id} onClick={()=>setLightbox(m)} style={{cursor:'pointer',borderRadius:6,overflow:'hidden',aspectRatio:'1',background:'#1a1a14',border:`1px solid ${BR}`}}>
              {m.media_type==='document' ?
                <div style={{width:'100%',height:'100%',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:4}}>
                  <span style={{fontSize:24}}>📄</span>
                  <span style={{fontSize:9,color:DM,textAlign:'center',padding:'0 4px',wordBreak:'break-all'}}>{m.file_name||'Document'}</span>
                </div>
              : <img src={cldImg(m.cloudinary_url,'c_fill,w_150,h_150,g_face')} style={{width:'100%',height:'100%',objectFit:'cover'}} alt={m.caption||''}/>
              }
            </div>
          ))}
        </div>
      </div>}
      
      {lineage.length>1&&<div style={{marginTop:16}}><div style={{fontSize:11,color:GD,textTransform:'uppercase',letterSpacing:2,marginBottom:6}}>Lineage</div>
        <div style={{fontSize:12,color:DM,lineHeight:1.8}}>
          {lineage.map((p,i)=><span key={i}><span style={{color:i===lineage.length-1?GC:TX}}>{p}</span>{i<lineage.length-1&&<span style={{color:GD}}> › </span>}</span>)}
        </div>
      </div>}
    </div>
    
    {/* Lightbox */}
    {lightbox&&<div onClick={()=>setLightbox(null)} style={{position:'fixed',inset:0,zIndex:200,background:'rgba(0,0,0,0.9)',display:'flex',alignItems:'center',justifyContent:'center',flexDirection:'column',gap:12}}>
      {lightbox.media_type==='document' ?
        <div style={{background:CD,padding:24,borderRadius:12,textAlign:'center'}}>
          <span style={{fontSize:48}}>📄</span>
          <div style={{color:TX,fontSize:16,marginTop:8}}>{lightbox.file_name||'Document'}</div>
          {lightbox.caption&&<div style={{color:DM,fontSize:13,marginTop:4}}>{lightbox.caption}</div>}
          <a href={lightbox.cloudinary_url} target="_blank" rel="noopener noreferrer" style={{display:'inline-block',marginTop:12,background:'rgba(196,163,90,0.15)',border:`1px solid ${GD}`,color:GC,padding:'8px 20px',borderRadius:6,textDecoration:'none',fontSize:13}}>Open Document</a>
        </div>
      : <img src={cldImg(lightbox.cloudinary_url,'c_limit,w_1200')} style={{maxWidth:'90vw',maxHeight:'80vh',borderRadius:8}} alt=""/>
      }
      {lightbox.caption&&lightbox.media_type!=='document'&&<div style={{color:TX,fontSize:14,maxWidth:'80vw',textAlign:'center'}}>{lightbox.caption}</div>}
      <div style={{color:DM,fontSize:11}}>{lightbox.uploaded_by&&`Uploaded by ${lightbox.uploaded_by}`}{lightbox.event_date&&` · ${lightbox.event_date}`}</div>
      <button onClick={()=>setLightbox(null)} style={{position:'absolute',top:20,right:20,background:'none',border:'none',color:'#fff',fontSize:24,cursor:'pointer'}}>✕</button>
    </div>}
  </>);
}

/* ───── PHOTO GALLERY ───── */
function PhotoGallery({flat, user}) {
  const [allMedia, setAllMedia] = useState([]);
  const [loading, setLoading] = useState(true);
  const [showUpload, setShowUpload] = useState(false);
  const [lightbox, setLightbox] = useState(null);
  const [filter, setFilter] = useState('all'); // 'all' | 'photos' | 'documents' | 'mine'
  const [filterPerson, setFilterPerson] = useState(null);
  const [personSearch, setPersonSearch] = useState('');

  // Load all media on mount
  useEffect(() => {
    loadMedia().then(m => { setAllMedia(m || []); setLoading(false); }).catch(() => setLoading(false));
  }, []);

  const reload = () => {
    loadMedia().then(m => setAllMedia(m || []));
  };

  // Build person lookup from flat
  const personById = useMemo(() => {
    const map = {};
    flat.forEach(n => { map[n.id] = n; });
    return map;
  }, [flat]);

  // Filter media
  const filtered = useMemo(() => {
    let items = allMedia;
    if (filter === 'photos') items = items.filter(m => m.media_type === 'photo');
    if (filter === 'documents') items = items.filter(m => m.media_type === 'document');
    if (filter === 'mine') items = items.filter(m => m.uploaded_by === (user.name || user.email));
    if (filterPerson) items = items.filter(m => (m.tagged_persons || []).includes(filterPerson.id));
    return items;
  }, [allMedia, filter, filterPerson, user]);

  // Person search for filter
  const personMatches = useMemo(() => {
    if (personSearch.length < 2) return [];
    const q = personSearch.toLowerCase();
    return flat.filter(n => (n.dn || '').toLowerCase().includes(q)).slice(0, 8);
  }, [personSearch, flat]);

  const inp = { width: '100%', background: '#1a1a14', border: `1px solid ${BR}`, color: TX, padding: '6px 10px', borderRadius: 5, fontSize: 13, outline: 'none', fontFamily: 'inherit' };
  const btnF = (active) => ({ fontSize: 11, color: active ? GC : DM, cursor: 'pointer', padding: '4px 10px', borderRadius: 4, background: active ? 'rgba(196,163,90,0.12)' : 'transparent', border: 'none' });

  return (
    <div style={{ padding: '16px 0' }}>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 16 }}>
        <div style={{ fontSize: 18, color: GC, fontWeight: 300 }}>Family Photos & Documents</div>
        {canEdit() && <button onClick={() => setShowUpload(true)} style={{ background: 'rgba(196,163,90,0.12)', border: `1px solid ${GD}`, color: GC, padding: '6px 16px', borderRadius: 6, cursor: 'pointer', fontSize: 12 }}>📷 Upload</button>}
      </div>

      {/* Filters */}
      <div style={{ display: 'flex', gap: 4, marginBottom: 12, flexWrap: 'wrap', alignItems: 'center' }}>
        <button onClick={() => { setFilter('all'); setFilterPerson(null); }} style={btnF(filter === 'all' && !filterPerson)}>All</button>
        <button onClick={() => { setFilter('photos'); setFilterPerson(null); }} style={btnF(filter === 'photos')}>Photos</button>
        <button onClick={() => { setFilter('documents'); setFilterPerson(null); }} style={btnF(filter === 'documents')}>Documents</button>
        <button onClick={() => { setFilter('mine'); setFilterPerson(null); }} style={btnF(filter === 'mine')}>My Uploads</button>
        <span style={{ color: DM, fontSize: 11 }}>|</span>
        {filterPerson ?
          <span style={{ display: 'flex', alignItems: 'center', gap: 4, fontSize: 11, color: GC, background: 'rgba(196,163,90,0.1)', padding: '3px 8px', borderRadius: 4 }}>
            {filterPerson.dn}
            <span onClick={() => { setFilterPerson(null); setPersonSearch(''); }} style={{ cursor: 'pointer', color: DM }}>✕</span>
          </span>
        :
          <div style={{ position: 'relative' }}>
            <input value={personSearch} onChange={e => setPersonSearch(e.target.value)} placeholder="Filter by person..." style={{ ...inp, width: 160, fontSize: 11, padding: '3px 8px' }} />
            {personMatches.length > 0 && <div style={{ position: 'absolute', top: '100%', left: 0, right: 0, background: '#141410', border: `1px solid rgba(196,163,90,0.25)`, borderRadius: '0 0 6px 6px', maxHeight: 200, overflowY: 'auto', zIndex: 10 }}>
              {personMatches.map(m => <div key={m.id} onClick={() => { setFilterPerson(m); setPersonSearch(''); setFilter('all'); }}
                style={{ padding: '5px 10px', cursor: 'pointer', fontSize: 12, display: 'flex', alignItems: 'center', gap: 6 }}
                onMouseEnter={e => e.currentTarget.style.background = 'rgba(255,255,255,0.04)'}
                onMouseLeave={e => e.currentTarget.style.background = 'transparent'}>
                <span style={{ width: 5, height: 5, borderRadius: '50%', background: m.g === 'M' ? MC : FC }} /><span>{m.dn}</span>
              </div>)}
            </div>}
          </div>
        }
      </div>

      {/* Gallery Grid */}
      {loading ? <div style={{ color: DM, fontSize: 13 }}>Loading media...</div> :
        filtered.length === 0 ? <div style={{ color: DM, fontSize: 13, padding: 20, textAlign: 'center' }}>No media found. {canEdit() ? 'Upload some photos or documents!' : ''}</div> :
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(150px, 1fr))', gap: 10 }}>
            {filtered.map(m => (
              <div key={m.id} onClick={() => setLightbox(m)} style={{ cursor: 'pointer', borderRadius: 8, overflow: 'hidden', background: '#1a1a14', border: `1px solid ${BR}`, transition: 'border-color 0.2s' }}
                onMouseEnter={e => e.currentTarget.style.borderColor = GD} onMouseLeave={e => e.currentTarget.style.borderColor = BR}>
                <div style={{ aspectRatio: '1', overflow: 'hidden' }}>
                  {m.media_type === 'document' ?
                    <div style={{ width: '100%', height: '100%', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: 6 }}>
                      <span style={{ fontSize: 36 }}>📄</span>
                      <span style={{ fontSize: 10, color: DM, textAlign: 'center', padding: '0 8px', wordBreak: 'break-all' }}>{m.file_name || 'Document'}</span>
                    </div>
                  :
                    <img src={cldImg(m.cloudinary_url, 'c_fill,w_200,h_200,g_face')} style={{ width: '100%', height: '100%', objectFit: 'cover' }} alt={m.caption || ''} loading="lazy" />
                  }
                </div>
                <div style={{ padding: '6px 8px' }}>
                  {m.caption && <div style={{ fontSize: 11, color: TX, marginBottom: 2, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{m.caption}</div>}
                  <div style={{ fontSize: 10, color: DM }}>
                    {m.uploaded_by && <span>{m.uploaded_by}</span>}
                    {m.event_date && <span> · {m.event_date}</span>}
                  </div>
                  {(m.tagged_persons || []).length > 0 && <div style={{ fontSize: 10, color: GD, marginTop: 2 }}>
                    {(m.tagged_persons || []).map(pid => personById[pid]?.dn || pid).join(', ')}
                  </div>}
                </div>
              </div>
            ))}
          </div>
      }

      {/* Upload Modal */}
      {showUpload && <MediaUploadModal flat={flat} user={user} onDone={() => { setShowUpload(false); reload(); }} onCancel={() => setShowUpload(false)} />}

      {/* Lightbox */}
      {lightbox && <div onClick={() => setLightbox(null)} style={{ position: 'fixed', inset: 0, zIndex: 200, background: 'rgba(0,0,0,0.92)', display: 'flex', alignItems: 'center', justifyContent: 'center', flexDirection: 'column', gap: 12 }}>
        <div onClick={e => e.stopPropagation()} style={{ maxWidth: '90vw', textAlign: 'center' }}>
          {lightbox.media_type === 'document' ?
            <div style={{ background: CD, padding: 32, borderRadius: 12 }}>
              <span style={{ fontSize: 56 }}>📄</span>
              <div style={{ color: TX, fontSize: 18, marginTop: 8 }}>{lightbox.file_name || 'Document'}</div>
              {lightbox.caption && <div style={{ color: DM, fontSize: 13, marginTop: 4 }}>{lightbox.caption}</div>}
              <a href={lightbox.cloudinary_url} target="_blank" rel="noopener noreferrer"
                style={{ display: 'inline-block', marginTop: 16, background: 'rgba(196,163,90,0.15)', border: `1px solid ${GD}`, color: GC, padding: '10px 24px', borderRadius: 6, textDecoration: 'none', fontSize: 14 }}>
                Open Document ↗
              </a>
            </div>
          :
            <img src={cldImg(lightbox.cloudinary_url, 'c_limit,w_1200')} style={{ maxWidth: '90vw', maxHeight: '75vh', borderRadius: 8 }} alt="" />
          }
          {lightbox.caption && lightbox.media_type !== 'document' && <div style={{ color: TX, fontSize: 15, marginTop: 10 }}>{lightbox.caption}</div>}
          <div style={{ color: DM, fontSize: 12, marginTop: 6 }}>
            {lightbox.uploaded_by && `Uploaded by ${lightbox.uploaded_by}`}
            {lightbox.event_date && ` · ${lightbox.event_date}`}
          </div>
          {(lightbox.tagged_persons || []).length > 0 && <div style={{ color: GD, fontSize: 12, marginTop: 4 }}>
            Tagged: {(lightbox.tagged_persons || []).map(pid => personById[pid]?.dn || pid).join(', ')}
