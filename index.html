/* ───── GEDCOM 5.5.1 EXPORTER ───── */
function exportTreeToGedcom(tree) {
  const lines = [];
  const indis = [];
  const fams = [];
  let famCounter = 0;

  function gedcomDate() {
    const d = new Date();
    const months = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
    return `${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()}`;
  }
  function gedcomTime() {
    const d = new Date();
    return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}`;
  }

  function buildIndi(person, famsRefs, famcRef) {
    const L = [];
    const pid = person.id;
    L.push(`0 ${pid} INDI`);

    // Primary NAME
    const fn = person.fn || '';
    const mn = person.mn || '';
    const ln = person.ln || '';
    const givn = (fn + (mn ? ' ' + mn : '')).trim();
    const nameStr = ln ? `${givn} /${ln}/` : (givn || person.dn || '(Unknown)');
    L.push(`1 NAME ${nameStr}`);
    if (fn) L.push(`2 GIVN ${fn}`);
    if (ln) L.push(`2 SURN ${ln}`);
    if (mn) L.push(`2 SECG ${mn}`);

    // Nickname
    if (person.nk) {
      L.push(`1 NAME ${person.nk} //`);
      L.push(`2 TYPE nick`);
      L.push(`2 GIVN ${person.nk}`);
    }

    // Maiden name
    if (person.md) {
      L.push(`1 NAME ${person.md} //`);
      L.push(`2 TYPE birth`);
    }

    // SEX
    if (person.g) L.push(`1 SEX ${person.g}`);

    // BIRT
    if (person.dob || person.loc) {
      L.push('1 BIRT');
      if (person.dob) L.push(`2 DATE ${person.dob}`);
      if (person.loc) L.push(`2 PLAC ${person.loc}`);
    }

    // DEAT
    if (person.dod || person.dec) {
      L.push('1 DEAT');
      if (person.dod) L.push(`2 DATE ${person.dod}`);
    }

    // Contact
    if (person.ph) L.push(`1 PHON ${person.ph}`);
    if (person.em) L.push(`1 EMAI ${person.em}`);

    // Address
    if (person.a1 || person.ci || person.st || person.co) {
      L.push(`1 ADDR ${person.a1 || ''}`);
      if (person.a2) L.push(`2 ADR2 ${person.a2}`);
      if (person.ci) L.push(`2 CITY ${person.ci}`);
      if (person.st) L.push(`2 STAE ${person.st}`);
      if (person.zp) L.push(`2 POST ${person.zp}`);
      if (person.co) L.push(`2 CTRY ${person.co}`);
    }

    // Occupation
    if (person.prof) L.push(`1 OCCU ${person.prof}`);

    // Website
    if (person.ws) L.push(`1 WWW ${person.ws}`);

    // Notes
    if (person.notes) L.push(`1 NOTE ${person.notes}`);
    if (person.bio) L.push(`1 NOTE BIO: ${person.bio}`);
    if (person.stories) L.push(`1 NOTE STORY: ${person.stories}`);

    // Custom tags for rich fields
    if (person.fb) L.push(`1 _FACEBOOK ${person.fb}`);
    if (person.ig) L.push(`1 _INSTAGRAM ${person.ig}`);
    if (person.li) L.push(`1 _LINKEDIN ${person.li}`);
    if (person.pp) L.push(`1 _PHOTO ${person.pp}`);
    if (person.emp) L.push(`1 _EMPLOYER ${person.emp}`);
    if (person.pgl) L.push(`1 _PHOTOGALLERY ${person.pgl}`);
    if (person.dl) L.push(`1 _DOCUMENTS ${person.dl}`);

    // FAMS / FAMC refs
    famsRefs.forEach(ref => L.push(`1 FAMS ${ref}`));
    if (famcRef) L.push(`1 FAMC ${famcRef}`);

    // CHAN
    L.push('1 CHAN');
    L.push(`2 DATE ${gedcomDate()}`);
    L.push(`3 TIME ${gedcomTime()}`);

    return L;
  }

  function buildFam(famId, husbId, wifeId, childIds, mdate, mplace) {
    const L = [`0 ${famId} FAM`];
    if (husbId) L.push(`1 HUSB ${husbId}`);
    if (wifeId) L.push(`1 WIFE ${wifeId}`);
    if (mdate || mplace) {
      L.push('1 MARR');
      if (mdate) L.push(`2 DATE ${mdate}`);
      if (mplace) L.push(`2 PLAC ${mplace}`);
    }
    childIds.forEach(cid => L.push(`1 CHIL ${cid}`));
    return L;
  }

  function processNode(node, parentFamId) {
    const famsRefs = [];
    const children = node.ch || [];
    const spouse = node.sp;

    // Create FAM if has spouse or children
    if (spouse || children.length > 0) {
      famCounter++;
      const famId = `@F${famCounter}@`;
      famsRefs.push(famId);

      const husbId = node.g === 'M' ? node.id : (spouse ? spouse.id : '');
      const wifeId = node.g === 'F' ? node.id : (spouse ? spouse.id : '');
      const childIds = children.map(c => c.id);

      fams.push(buildFam(famId, husbId, wifeId, childIds, node.mdate || '', node.mplace || ''));

      // Spouse INDI
      if (spouse && spouse.id) {
        indis.push(buildIndi(spouse, [famId], null));
      }

      // Recurse children
      children.forEach(child => processNode(child, famId));
    }

    // This person's INDI
    indis.push(buildIndi(node, famsRefs, parentFamId));
  }

  processNode(tree, null);

  // Assemble
  lines.push('0 HEAD');
  lines.push('1 SOUR FTLS');
  lines.push('2 NAME Chennamkara Family Tree Living Site');
  lines.push('2 VERS 0.2');
  lines.push('1 CHAR UTF-8');
  lines.push('1 GEDC');
  lines.push('2 VERS 5.5.1');
  lines.push('2 FORM LINEAGE-LINKED');
  lines.push('1 SUBM @SUBM1@');
  lines.push('0 @SUBM1@ SUBM');
  lines.push('1 NAME FTLS Export');

  indis.forEach(indi => lines.push(...indi));
  fams.forEach(fam => lines.push(...fam));
  lines.push('0 TRLR');

  return lines.join('\n') + '\n';
}

function downloadGedcom(tree) {
  const content = exportTreeToGedcom(tree);
  const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'Chennamkara_Family_Tree_Export.ged';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* ───── GEDCOM 5.5.1 IMPORTER / PARSER ───── */
function parseGedcomFile(text) {
  // Normalize line endings
  const raw = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
  const lines = raw.split('\n').filter(l => l.trim());

  // Parse into elements: {level, pointer, tag, value, children[]}
  const elements = [];
  const stack = [{ children: elements, level: -1 }];

  for (const line of lines) {
    const m = line.match(/^(\d+)\s+(@[^@]+@)?\s*(\S+)\s*(.*)?$/);
    if (!m) continue;
    const level = parseInt(m[1]);
    const pointer = (m[2] || '').trim();
    const tag = m[3].trim();
    const value = (m[4] || '').trim();
    const el = { level, pointer, tag, value, children: [] };

    // Pop stack to find parent
    while (stack.length > 1 && stack[stack.length - 1].level >= level) {
      stack.pop();
    }
    stack[stack.length - 1].children.push(el);
    stack.push(el);
  }

  // Extract individuals
  const people = {};
  const families = {};

  for (const el of elements) {
    if (el.tag === 'INDI' && el.pointer) {
      const p = parseIndi(el);
      people[p.id] = p;
    } else if (el.tag === 'FAM' && el.pointer) {
      const f = parseFam(el);
      families[f.id] = f;
    }
  }

  // Compute generations & build tree
  return buildTreeFromFlat(people, families);
}

function getChildValue(el, tag) {
  const ch = el.children.find(c => c.tag === tag);
  return ch ? ch.value : '';
}

function getNestedValue(el, parentTag, childTag) {
  const parent = el.children.find(c => c.tag === parentTag);
  if (!parent) return '';
  const child = parent.children.find(c => c.tag === childTag);
  return child ? child.value : '';
}

function parseIndi(el) {
  const id = el.pointer;

  // Primary name
  let fn = '', mn = '', ln = '', nk = '', md = '';
  const nameEls = el.children.filter(c => c.tag === 'NAME');

  for (const nameEl of nameEls) {
    const typeEl = nameEl.children.find(c => c.tag === 'TYPE');
    const type = typeEl ? typeEl.value : '';

    if (type === 'nick') {
      nk = nameEl.value.replace(/\//g, '').trim();
    } else if (type === 'birth') {
      md = nameEl.value.replace(/\//g, '').trim();
    } else if (type === 'married') {
      // Skip married-name-only entries (the "George married to George" issue)
      continue;
    } else if (!fn && !ln) {
      // Primary name - parse from structured value or sub-tags
      const givnEl = nameEl.children.find(c => c.tag === 'GIVN');
      const surnEl = nameEl.children.find(c => c.tag === 'SURN');
      const secgEl = nameEl.children.find(c => c.tag === 'SECG');

      if (givnEl) {
        const parts = givnEl.value.split(' ');
        fn = parts[0] || '';
        if (parts.length > 1 && !mn) mn = parts.slice(1).join(' ');
      }
      if (surnEl) ln = surnEl.value;
      if (secgEl && !mn) mn = secgEl.value;

      // Fallback: parse "Given /Surname/" format
      if (!fn && !ln) {
        const nameVal = nameEl.value;
        const slashMatch = nameVal.match(/^(.*?)\/([^\/]*)\//);
        if (slashMatch) {
          const givenPart = slashMatch[1].trim();
          ln = slashMatch[2].trim();
          const gParts = givenPart.split(' ');
          fn = gParts[0] || '';
          if (gParts.length > 1) mn = gParts.slice(1).join(' ');
        } else {
          fn = nameVal.replace(/\//g, '').trim();
        }
      }
    }
  }

  const g = getChildValue(el, 'SEX');
  const dob = getNestedValue(el, 'BIRT', 'DATE');
  const loc = getNestedValue(el, 'BIRT', 'PLAC');
  const dod = getNestedValue(el, 'DEAT', 'DATE');
  const hasDeat = el.children.some(c => c.tag === 'DEAT');

  // Contact
  const ph = getChildValue(el, 'PHON');
  const em = getChildValue(el, 'EMAI') || getChildValue(el, 'EMAIL');
  const ws = getChildValue(el, 'WWW');

  // Address
  let a1='',a2='',ci='',st='',zp='',co='';
  const addrEl = el.children.find(c => c.tag === 'ADDR' || c.tag === 'RESI');
  if (addrEl) {
    a1 = addrEl.value || getChildValue(addrEl, 'ADR1') || '';
    a2 = getChildValue(addrEl, 'ADR2');
    ci = getChildValue(addrEl, 'CITY');
    st = getChildValue(addrEl, 'STAE');
    zp = getChildValue(addrEl, 'POST');
    co = getChildValue(addrEl, 'CTRY');
  }

  // Other fields
  const prof = getChildValue(el, 'OCCU');
  const notes = getChildValue(el, 'NOTE');

  // Custom tags
  const fb = getChildValue(el, '_FACEBOOK');
  const ig = getChildValue(el, '_INSTAGRAM');
  const li = getChildValue(el, '_LINKEDIN');
  const pp = getChildValue(el, '_PHOTO');
  const emp = getChildValue(el, '_EMPLOYER');
  const pgl = getChildValue(el, '_PHOTOGALLERY');
  const dl = getChildValue(el, '_DOCUMENTS');

  // Family links
  const fams = el.children.filter(c => c.tag === 'FAMS').map(c => c.value);
  const famc = el.children.filter(c => c.tag === 'FAMC').map(c => c.value);

  // Build display name
  let dn = (fn + (mn ? ' ' + mn : '') + (ln ? ' ' + ln : '')).trim();
  if (!dn) dn = nk || '(Unknown)';

  // Handle the "surname only" spouse issue - if no first name and only surname
  if (!fn && ln && !mn) {
    dn = `Mrs. ${ln} (name unknown)`;
  }

  return {
    id, fn, mn, ln, dn, nk, md, g,
    dob, dod, dec: hasDeat || !!dod, bo: 0,
    em, ph, a1, a2, ci, st, zp, co,
    fb, ig, li, ws, pp, bio: '', loc,
    prof, emp, stories: '', notes, pgl, dl,
    fams, famc,
  };
}

function parseFam(el) {
  return {
    id: el.pointer,
    husb: getChildValue(el, 'HUSB'),
    wife: getChildValue(el, 'WIFE'),
    children: el.children.filter(c => c.tag === 'CHIL').map(c => c.value),
    mdate: getNestedValue(el, 'MARR', 'DATE'),
    mplace: getNestedValue(el, 'MARR', 'PLAC'),
  };
}

function parseDateSort(d) {
  if (!d) return 99999999;
  const months = {JAN:1,FEB:2,MAR:3,APR:4,MAY:5,JUN:6,JUL:7,AUG:8,SEP:9,OCT:10,NOV:11,DEC:12};
  // MM/DD/YYYY
  let m = d.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if (m) return parseInt(m[3])*10000 + parseInt(m[1])*100 + parseInt(m[2]);
  // DD MON YYYY
  m = d.match(/(\d{1,2})\s+(\w{3})\s+(\d{4})/);
  if (m) return parseInt(m[3])*10000 + (months[m[2].toUpperCase()]||0)*100 + parseInt(m[1]);
  return 99999999;
}

function buildTreeFromFlat(people, families) {
  // Compute birth order per family
  for (const fam of Object.values(families)) {
    const kids = fam.children.filter(cid => people[cid]);
    kids.sort((a, b) => parseDateSort(people[a].dob) - parseDateSort(people[b].dob));
    kids.forEach((cid, i) => { if (people[cid]) people[cid].bo = i + 1; });
  }

  // BFS to assign generations
  const hasParents = new Set();
  for (const fam of Object.values(families)) {
    fam.children.forEach(c => hasParents.add(c));
  }
  const roots = Object.keys(people).filter(pid => !hasParents.has(pid));

  const genMap = {};
  const visited = new Set();
  const queue = roots.map(pid => [pid, 0]);

  while (queue.length > 0) {
    const [pid, gen] = queue.shift();
    if (visited.has(pid)) continue;
    visited.add(pid);
    genMap[pid] = gen;

    const person = people[pid];
    if (!person) continue;

    for (const famId of person.fams) {
      const fam = families[famId];
      if (!fam) continue;
      // Spouse gets same gen
      const spouseId = fam.husb === pid ? fam.wife : fam.husb;
      if (spouseId && !visited.has(spouseId)) queue.push([spouseId, gen]);
      // Children get gen+1
      for (const cid of fam.children) {
        if (!visited.has(cid)) queue.push([cid, gen + 1]);
      }
    }
  }

  // Find the person with most descendants as root
  function countDesc(pid, seen = new Set()) {
    if (seen.has(pid)) return 0;
    seen.add(pid);
    let count = 1;
    const p = people[pid];
    if (!p) return 0;
    for (const famId of p.fams) {
      const fam = families[famId];
      if (!fam) continue;
      for (const cid of fam.children) {
        count += countDesc(cid, seen);
      }
    }
    return count;
  }

  let bestRoot = roots[0];
  let bestCount = 0;
  for (const pid of roots) {
    const p = people[pid];
    const c = countDesc(pid);
    // Prefer roots with actual names; skip unnamed spouse-only entries
    const hasName = p && (p.fn || p.nk);
    const score = c + (hasName ? 100000 : 0);
    if (score > bestCount) { bestCount = score; bestRoot = pid; }
  }

  // Build hierarchical tree
  function buildNode(pid, visitedNodes = new Set()) {
    if (visitedNodes.has(pid)) return null;
    visitedNodes.add(pid);

    const p = people[pid];
    if (!p) return null;

    const node = { ...p, gen: genMap[pid] || 0, sp: null, ch: [] };
    // Remove flat refs from display node
    delete node.fams;
    delete node.famc;

    for (const famId of (p.fams || [])) {
      const fam = families[famId];
      if (!fam) continue;

      // Spouse
      const spId = fam.husb === pid ? fam.wife : fam.husb;
      if (spId && people[spId] && !visitedNodes.has(spId)) {
        visitedNodes.add(spId);
        const sp = { ...people[spId], mdate: fam.mdate || '', mplace: fam.mplace || '' };
        delete sp.fams;
        delete sp.famc;
        node.sp = sp;
      }
      node.mdate = fam.mdate || '';
      node.mplace = fam.mplace || '';

      // Children
      for (const cid of fam.children) {
        const childNode = buildNode(cid, visitedNodes);
        if (childNode) node.ch.push(childNode);
      }
      // Sort children by birth order
      node.ch.sort((a, b) => (a.bo || 999) - (b.bo || 999));
    }

    return node;
  }

  return buildNode(bestRoot);
}

function triggerImportGedcom(onImport) {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.ged,.gedcom';
  input.onchange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (evt) => {
      try {
        const tree = parseGedcomFile(evt.target.result);
        if (tree) {
          onImport(tree, file.name);
        } else {
          alert('Could not parse the GEDCOM file. No valid records found.');
        }
      } catch (err) {
        alert('Error parsing GEDCOM file: ' + err.message);
        console.error(err);
      }
    };
    reader.readAsText(file, 'utf-8');
  };
  input.click();
}

const flattenAll=(n,p='')=>{const arr=[];const nm=n.dn||'?';const fp=p?p+' › '+nm:nm;arr.push({...n,_p:fp,_n:nm});(n.ch||[]).forEach(c=>arr.push(...flattenAll(c,fp)));return arr};
const cnt=n=>{if(!n)return 0;let c=1+(n.sp?1:0);(n.ch||[]).forEach(x=>{c+=cnt(x)});return c};
const findPath=(r,id,p=[])=>{if(r.id===id)return[...p,r];for(const c of r.ch||[]){const res=findPath(c,id,[...p,r]);if(res)return res}return null};

/* ───── APP ───── */
function App(){
  const [tree,setTree]=useState(INIT);
  const [exp,setExp]=useState(()=>{const s=new Set();const add=(n,d)=>{if(d<2&&n.ch?.length){s.add(n.id);n.ch.forEach(c=>add(c,d+1))}};add(INIT,0);return s});
  const [sel,setSel]=useState(null);
  const [search,setSearch]=useState('');
  const [hl,setHl]=useState(null);
  const [editing,setEditing]=useState(null);
  const [adding,setAdding]=useState(null);
  const [spouseEditing,setSpouseEditing]=useState(null);
  const [msg,setMsg]=useState('');
  const flat=useMemo(()=>flattenAll(tree),[tree]);

  const findNodeById=useCallback((root,id)=>{
    if(!root)return null;
    if(root.id===id)return root;
    for(const c of root.ch||[]){
      const found=findNodeById(c,id);
      if(found)return found;
    }
    return null;
  },[]);

  const getAncestorIds=useCallback((root,id)=>{
    const path=findPath(root,id)||[];
    return path.slice(0,-1).map(n=>n.id);
  },[]);

  const updateNode=useCallback((root,id,updater)=>{
    if(root.id===id)return updater(root);
    if(!root.ch)return root;
    return {...root,ch:root.ch.map(c=>updateNode(c,id,updater))};
  },[]);

  const removeNode=useCallback((root,targetId)=>{
    if(!root.ch)return root;
    return {...root,ch:root.ch.filter(c=>c.id!==targetId).map(c=>removeNode(c,targetId))};
  },[]);

  const toggle=useCallback(id=>{
    setExp(p=>{const n=new Set(p);n.has(id)?n.delete(id):n.add(id);return n});
  },[]);

  const expandAll=()=>{const s=new Set();flat.forEach(n=>{if(n.ch?.length)s.add(n.id)});setExp(s)};
  const collapseAll=()=>setExp(new Set());
  const expandTo=d=>{const s=new Set();const add=(n,depth)=>{if(depth<d&&n.ch?.length){s.add(n.id);n.ch.forEach(c=>add(c,depth+1))}};add(tree,0);setExp(s)};

  const matches=useMemo(()=>{
    if(search.length<2)return[];
    const q=search.toLowerCase();
    return flat.filter(n=>(n.dn||'').toLowerCase().includes(q)||(n.nk||'').toLowerCase().includes(q)||(n.sp?.dn||'').toLowerCase().includes(q)).slice(0,12);
  },[search,flat]);

  const revealNode=useCallback((nodeId,opts={})=>{
    const ancestorIds=getAncestorIds(tree,nodeId);
    setExp(p=>{
      const s=new Set(p);
      ancestorIds.forEach(id=>s.add(id));
      return s;
    });
    setHl(nodeId);
    if(opts.select){
      const latest=findNodeById(tree,nodeId);
      if(latest)setSel(latest);
    }
    setTimeout(()=>setHl(null),2000);
  },[tree,getAncestorIds,findNodeById]);

  const navigateTo=useCallback(node=>{
    revealNode(node.id,{select:true});
    setSearch('');
  },[revealNode]);

  const handleSaveEdit=(data)=>{
    let updatedNodeId=data.id;
    setTree(prev=>{
      const next=updateNode(prev,data.id,(existing)=>({...existing,...data,ch:existing.ch||[],sp:existing.sp}));
      return next;
    });
    setEditing(null);
    setTimeout(()=>{
      const latest=findNodeById({...tree},updatedNodeId) || flat.find(n=>n.id===updatedNodeId);
      revealNode(updatedNodeId,{select:false});
    },0);
    setMsg('Saved!');
    setTimeout(()=>setMsg(''),2000);
  };

  const handleAdd=(data)=>{
    const parentId=adding;
    const newNode={...data,ch:[]};
    setTree(prev=>updateNode(prev,parentId,p=>({...p,ch:[...(p.ch||[]),newNode]})));
    setAdding(null);
    setSel(newNode);
    setTimeout(()=>revealNode(newNode.id,{select:false}),0);
    setMsg('Member added!');
    setTimeout(()=>setMsg(''),2000);
  };

  const handleDelete=(id)=>{
    const node=findNodeById(tree,id);
    if(node?.ch?.length){
      setMsg('Cannot delete: has descendants');
      setTimeout(()=>setMsg(''),3000);
      return;
    }
    if(!confirm(`Delete ${node?.dn||'this person'}?`))return;
    const parentIds=getAncestorIds(tree,id);
    const parentId=parentIds[parentIds.length-1]||null;
    setTree(prev=>removeNode(prev,id));
    if(sel?.id===id)setSel(parentId?findNodeById(tree,parentId):null);
    if(editing?.id===id)setEditing(null);
    if(adding===id)setAdding(null);
    setExp(p=>{const s=new Set(p); s.delete(id); return s;});
    setTimeout(()=>{
      if(parentId) revealNode(parentId,{select:true});
    },0);
    setMsg('Deleted');
    setTimeout(()=>setMsg(''),2000);
  };

  const handleSaveSpouse=(data)=>{
    if(!spouseEditing?.parentId)return;
    const parentId=spouseEditing.parentId;
    setTree(prev=>updateNode(prev,parentId,(existing)=>({...existing,sp:{...(existing.sp||{}),...data,id:(existing.sp&&existing.sp.id)||data.id||('@sp_'+Date.now()+'@')}})));
    setSpouseEditing(null);
    setMsg('Spouse saved!');
    setTimeout(()=>setMsg(''),2000);
  };

  const handleDeleteSpouse=(parentId)=>{
    const parent=findNodeById(tree,parentId);
    if(!parent?.sp){
      setMsg('No spouse to delete');
      setTimeout(()=>setMsg(''),2000);
      return;
    }
    if(!confirm(`Delete spouse ${parent.sp.dn||'record'}?`))return;
    setTree(prev=>updateNode(prev,parentId,(existing)=>({...existing,sp:null})));
    if(spouseEditing?.parentId===parentId)setSpouseEditing(null);
    setMsg('Spouse deleted');
    setTimeout(()=>setMsg(''),2000);
  };

  const total=cnt(tree);
  const btnS={background:CD,border:`1px solid ${BR}`,color:DM,padding:'6px 12px',borderRadius:5,fontSize:12,cursor:'pointer',whiteSpace:'nowrap'};

  return(
    <div style={{background:BG,minHeight:'100vh',color:TX,fontFamily:'system-ui,-apple-system,sans-serif'}}>
      <div style={{position:'sticky',top:0,zIndex:50,background:`linear-gradient(180deg,${BG} 80%,transparent)`,padding:'16px 16px 24px'}}>
        <div style={{maxWidth:1200,margin:'0 auto'}}>
          <div style={{display:'flex',alignItems:'baseline',gap:12,marginBottom:4}}>
            <span style={{fontSize:28,color:GC,fontWeight:300,letterSpacing:1}}>Chennamkara</span>
            <span style={{fontSize:11,color:DM,letterSpacing:3,textTransform:'uppercase'}}>Family Tree</span>
            {msg&&<span style={{fontSize:12,color:'#6b9e72',marginLeft:16,animation:'fadeIn 0.3s'}}>{msg}</span>}
          </div>
          <div style={{display:'flex',gap:20,fontSize:12,color:DM,marginBottom:12}}>
            <span><strong style={{color:GD}}>{total}</strong> people</span>
          </div>
          <div style={{display:'flex',gap:8,flexWrap:'wrap',alignItems:'center'}}>
            <div style={{position:'relative',flex:1,minWidth:180,maxWidth:360}}>
              <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search by name..."
                style={{width:'100%',background:CD,border:`1px solid ${BR}`,color:TX,padding:'7px 12px',borderRadius:6,fontSize:13,outline:'none'}}/>
              {matches.length>0&&<div style={{position:'absolute',top:'100%',left:0,right:0,background:CD,border:`1px solid rgba(196,163,90,0.25)`,
                borderTop:'none',borderRadius:'0 0 6px 6px',maxHeight:280,overflowY:'auto',zIndex:60}}>
                {matches.map(m=><div key={m.id} onClick={()=>navigateTo(m)}
                  style={{padding:'6px 12px',cursor:'pointer',fontSize:13,display:'flex',alignItems:'center',gap:6}}
                  onMouseEnter={e=>e.currentTarget.style.background='rgba(255,255,255,0.04)'}
                  onMouseLeave={e=>e.currentTarget.style.background='transparent'}>
                  <span style={{width:6,height:6,borderRadius:'50%',background:m.g==='M'?MC:FC}}/><span>{m._n}</span>
                </div>)}
              </div>}
            </div>
            {[['Expand All',expandAll],['Collapse',collapseAll],['2 Lvls',()=>expandTo(2)],['3 Lvls',()=>expandTo(3)]].map(([l,f])=>
              <button key={l} onClick={f} style={btnS}>{l}</button>)}
            <button onClick={()=>{downloadGedcom(tree);setMsg('GEDCOM exported!')}} style={{...btnS,background:'rgba(196,163,90,0.1)',borderColor:GD,color:GC}}>⬇ Export GEDCOM</button>
            <button onClick={()=>triggerImportGedcom((newTree,fileName)=>{setTree(newTree);flat.length=0;flat.push(...flattenAll(newTree));setMsg('Imported: '+fileName);expandTo(2)})} style={{...btnS,background:'rgba(107,158,114,0.1)',borderColor:MC,color:MC}}>⬆ Import GEDCOM</button>
          </div>
        </div>
      </div>
      <div style={{maxWidth:1200,margin:'0 auto',padding:'0 16px 60px'}}>
        <TreeNode node={tree} exp={exp} onTog={toggle} onSel={(node)=>setSel(findNodeById(tree,node.id)||node)} onEdit={(node)=>setEditing(findNodeById(tree,node.id)||node)} onAdd={setAdding} onDel={handleDelete} onEditSpouse={(node)=>setSpouseEditing({parentId:node.id,spouse:{...(node.sp||{}),dn:(node.sp&&node.sp.dn)||''}})} onDelSpouse={handleDeleteSpouse} hl={hl}/>
      </div>
      {sel&&!editing&&<Detail node={findNodeById(tree,sel.id)||sel} root={tree} onClose={()=>setSel(null)} onEdit={(node)=>setEditing(findNodeById(tree,node.id)||node)} onEditSpouse={(node)=>setSpouseEditing({parentId:node.id,spouse:{...(node.sp||{}),dn:(node.sp&&node.sp.dn)||''}})} onDelSpouse={handleDeleteSpouse}/>}
      {editing&&<EditForm node={findNodeById(tree,editing.id)||editing} onSave={handleSaveEdit} onCancel={()=>setEditing(null)} isNew={false}/>}
      {spouseEditing&&<EditForm node={spouseEditing.spouse||empty()} onSave={handleSaveSpouse} onCancel={()=>setSpouseEditing(null)} isNew={false}/>}
      {adding&&<EditForm node={empty()} onSave={handleAdd} onCancel={()=>setAdding(null)} isNew={true} parentId={adding} parentName={flat.find(n=>n.id===adding)?._n}/>}
    </div>
  );
}

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
