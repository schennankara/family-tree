/* ───── CANONICAL GEDCOM TOKENIZER ─────
   The ONLY tokenizer in this app. Previously duplicated inline at three
   callsites (migrateGedcomToSupabase, GedcomDiffModal.handleFile, and the
   original parseGedcomFile at ~line 2853). Those clones drifted subtly and
   all performed .trim() on every value — which silently stripped MFT's
   trailing-whitespace output and caused xref matching to fail on round-trip
   (the "two Steves / missing photo" class of bugs).

   This tokenizer is FAITHFUL: values are preserved byte-for-byte, including
   trailing whitespace. Callers that need normalized values for comparison
   should pass results through normalizedPerson() / normalizedValue().
*/
function tokenizeGedcom(text) {
  const raw = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
  const lines = raw.split('\n').filter(l => l.trim());
  const elements = [];
  const stack = [{ children: elements, level: -1 }];
  for (const line of lines) {
    const m = line.match(/^(\d+)\s+(@[^@]+@)?\s*(\S+)\s*(.*)?$/);
    if (!m) continue;
    const level = parseInt(m[1]);
    const pointer = (m[2] || '').trim();
    const tag = m[3].trim();
    // FAITHFUL: do NOT trim value — MFT's trailing whitespace must survive.
    const value = m[4] || '';
    const el = { level, pointer, tag, value, children: [] };
    if (tag === 'CONT' || tag === 'CONC') {
      const parent = stack[stack.length - 1];
      if (parent && parent.value !== undefined) {
        parent.value += (tag === 'CONT' ? '\n' : '') + value;
      }
      continue;
    }
    while (stack.length > 1 && stack[stack.length - 1].level >= level) {
      stack.pop();
    }
    stack[stack.length - 1].children.push(el);
    stack.push(el);
  }
  return elements;
}

/* ───── NORMALIZATION HELPERS FOR COMPARISON ─────
   Use these ONLY when comparing values for dedup/matching. Never use the
   normalized form for storage or export — that's how faithfulness is lost.
*/
function normalizedValue(v) {
  return (v == null ? '' : String(v)).trim();
}

function normalizedPerson(p) {
  if (!p) return p;
  const out = { ...p };
  for (const k of ['fn', 'mn', 'ln', 'dn', 'nk', 'md', 'tp', 'sx', 'dob', 'dod', 'loc', 'burd']) {
    if (typeof out[k] === 'string') out[k] = out[k].trim();
  }
  return out;
}

function getNameSuffixFromNotes(notes) {
  const text = notes == null ? '' : String(notes);
  const m = text.match(/(?:^|\n)\s*(?:Name\s+suffix|Suffix)\s*:\s*([^\n]+)/i);
  return m ? m[1].trim() : '';
}

function upsertNameSuffixIntoNotes(notes, suffix) {
  const sx = suffix == null ? '' : String(suffix).trim();
  const text = notes == null ? '' : String(notes);
  if (!sx) return text;
  const line = `Name suffix: ${sx}`;
  if (/(?:^|\n)\s*(?:Name\s+suffix|Suffix)\s*:/i.test(text)) {
    return text.replace(/(^|\n)\s*(?:Name\s+suffix|Suffix)\s*:[^\n]*/i, `$1${line}`);
  }
  return text ? `${text}\n${line}` : line;
}

function hasGedcomLevel1Block(raw, tag) {
  if (!raw) return false;
  return new RegExp('^1\\s+' + tag + '(?:\\s|$)', 'm').test(String(raw));
}

function stripGedcomLevel1Block(raw, tags) {
  if (!raw) return raw || '';
  const tagSet = new Set(Array.isArray(tags) ? tags : [tags]);
  const lines = String(raw).split('\n');
  const kept = [];
  let skipping = false;
  for (const line of lines) {
    const m = line.match(/^(\d+)\s+(\S+)/);
    if (m && m[1] === '1') skipping = tagSet.has(m[2]);
    if (!skipping) kept.push(line);
  }
  return kept.filter(x => x.trim()).join('\n');
}


/* ───── GEDCOM NOTE / ADDRESS HELPERS ─────
   MacFamilyTree 11 commonly writes person/event notes as pointers:
     1 NOTE @123@
     0 @123@ NOTE
     1 CONT Actual note text
   It also writes residence in multiple shapes:
     1 RESI Dallas, Texas, USA
     1 RESI
     2 PLAC Street,City,County,State-Zip,Country
   These helpers resolve NOTE pointers and parse RESI/ADDR consistently for
   normal import, diff/merge preview, and destructive migration.
*/
function cleanGedcomNoteText(text) {
  return (text || '').replace(/^\n+/, '').replace(/\n+$/, '');
}

function buildGedcomNoteMap(elements) {
  const noteMap = {};
  for (const el of elements || []) {
    if (el.tag === 'NOTE' && el.pointer) {
      noteMap[el.pointer] = cleanGedcomNoteText(el.value || '');
    }
  }
  return noteMap;
}

function resolveGedcomNoteValue(value, noteMap = {}) {
  const v = value || '';
  const trimmed = v.trim();
  if (/^@[^@]+@$/.test(trimmed) && noteMap[trimmed] !== undefined) return noteMap[trimmed];
  return cleanGedcomNoteText(v);
}

const FTLS_PROFILE_NOTE_PREFIX = '=== FTLS Profile ===';
// Human-readable worksheet shown inside MacFamilyTree for admins. Keep the old
// snapshot marker in the generated-marker list so older FTLS exports are still
// recognized and stripped on round-trip.
const FTLS_RECON_NOTE_PREFIX = '=== FTLS Reconciliation Worksheet v1 ===';
const FTLS_RECON_NOTE_OLD_PREFIX = '=== FTLS Reconciliation Snapshot v1 ===';
const FTLS_RECON_NOTE_END = '=== END FTLS Reconciliation Worksheet ===';
const FTLS_RECON_NOTE_OLD_END = '=== END FTLS Reconciliation Snapshot ===';
const FTLS_FAM_RECON_NOTE_PREFIX = '=== FTLS Family Reconciliation Worksheet v1 ===';
const FTLS_FAM_RECON_NOTE_END = '=== END FTLS Family Reconciliation Worksheet ===';
const FTLS_GENERATED_NOTE_PREFIXES = [FTLS_PROFILE_NOTE_PREFIX, FTLS_RECON_NOTE_PREFIX, FTLS_RECON_NOTE_OLD_PREFIX, FTLS_FAM_RECON_NOTE_PREFIX];

function isFtlsGeneratedNoteText(text) {
  const v = cleanGedcomNoteText(text || '').trimStart();
  return FTLS_GENERATED_NOTE_PREFIXES.some(prefix => v.startsWith(prefix));
}

function parseFtlsReconciliationSnapshotText(text) {
  const cleaned = cleanGedcomNoteText(text || '').trim();
  if (!cleaned.startsWith(FTLS_RECON_NOTE_PREFIX) && !cleaned.startsWith(FTLS_RECON_NOTE_OLD_PREFIX)) return null;
  const out = {};
  const lines = cleaned.split('\n');
  for (const line of lines) {
    if (!line || line === FTLS_RECON_NOTE_PREFIX || line === FTLS_RECON_NOTE_OLD_PREFIX || line === FTLS_RECON_NOTE_END || line === FTLS_RECON_NOTE_OLD_END) continue;
    const idx = line.indexOf(':');
    if (idx <= 0) continue;
    const key = line.slice(0, idx).trim();
    const val = line.slice(idx + 1).trim().replace(/\\n/g, '\n');
    out[key] = val;
  }
  return out;
}


function parseFtlsFamilyReconciliationSnapshotText(text) {
  const cleaned = cleanGedcomNoteText(text || '').trim();
  if (!cleaned.startsWith(FTLS_FAM_RECON_NOTE_PREFIX)) return null;
  const out = {};
  const lines = cleaned.split('\n');
  for (const line of lines) {
    if (!line || line === FTLS_FAM_RECON_NOTE_PREFIX || line === FTLS_FAM_RECON_NOTE_END) continue;
    const idx = line.indexOf(':');
    if (idx <= 0) continue;
    const key = line.slice(0, idx).trim();
    const val = line.slice(idx + 1).trim().replace(/\\n/g, '\n');
    out[key] = val;
  }
  return out;
}

function normalizeFtlsReconciliationValue(value) {
  if (value === null || value === undefined) return '';
  const v = String(value).trim();
  if (!v) return '';
  if (/^\(blank in FTLS\)$/i.test(v)) return '';
  return v.replace(/\\n/g, '\n');
}

function getFtlsReconciliationValue(snapshot, labels) {
  if (!snapshot) return '';
  for (const label of labels) {
    if (Object.prototype.hasOwnProperty.call(snapshot, label)) {
      return normalizeFtlsReconciliationValue(snapshot[label]);
    }
  }
  return '';
}

function splitFtlsReconciliationRefs(value) {
  const v = normalizeFtlsReconciliationValue(value);
  if (!v) return [];
  return v.split(',').map(x => x.trim()).filter(Boolean);
}

function applyFtlsReconciliationSnapshotDefaults(person, snapshot) {
  if (!snapshot) return person;
  const out = { ...person, _ftlsSnapshot: snapshot };
  const applied = [];
  const isBlank = (v) => {
    if (v === null || v === undefined) return true;
    if (Array.isArray(v)) return v.length === 0;
    if (typeof v === 'number') return !v;
    if (typeof v === 'boolean') return false;
    return String(v).trim() === '';
  };
  const fill = (key, labels, transform) => {
    if (!isBlank(out[key])) return;
    const raw = getFtlsReconciliationValue(snapshot, labels);
    if (!raw) return;
    const next = transform ? transform(raw) : raw;
    if (next === null || next === undefined || next === '') return;
    out[key] = next;
    applied.push(key);
  };

  fill('dn', ['Display Name']);
  fill('fn', ['First/Given Name', 'First Name']);
  fill('mn', ['Middle/Second Name', 'Middle Name']);
  fill('ln', ['Last/Surname', 'Last Name', 'Surname']);
  fill('nk', ['Nickname']);
  fill('md', ['Maiden Name']);
  fill('tp', ['Title Prefix']);
  fill('sx', ['Name Suffix', 'Suffix']);
  fill('g', ['Gender']);
  fill('bo', ['Birth Order'], v => {
    const n = parseInt(v, 10);
    return Number.isFinite(n) ? n : 0;
  });

  fill('dob', ['Birth Date']);
  fill('loc', ['Birth Place']);
  fill('dod', ['Death Date']);
  fill('burd', ['Burial Date']);

  const decVal = getFtlsReconciliationValue(snapshot, ['Deceased Flag', 'Deceased']);
  if (decVal && !out.dec) {
    if (/^(true|yes|y|1)$/i.test(decVal)) { out.dec = true; applied.push('dec'); }
  }

  fill('a1', ['Address 1 / Residence Place', 'Address 1', 'Residence Place']);
  fill('a2', ['Address 2']);
  fill('ci', ['City']);
  fill('st', ['State']);
  fill('zp', ['Zip / Postal Code', 'Zip', 'Postal Code']);
  fill('co', ['Country']);

  fill('ph', ['Phone']);
  fill('em', ['Email']);
  fill('ws', ['Website']);
  fill('fb', ['Facebook']);
  fill('ig', ['Instagram']);
  fill('li', ['LinkedIn']);
  fill('prof', ['Profession / Occupation', 'Profession', 'Occupation']);
  fill('emp', ['Employer']);
  fill('pp', ['Profile Photo']);
  fill('pgl', ['Photo Gallery Link', 'Photo Gallery']);
  fill('dl', ['Documents Link', 'Documents']);

  // These are FTLS-only content fields. MFT may not export them except through
  // this worksheet, so the worksheet should repopulate them when normal NOTE
  // parsing did not already produce values.
  fill('notes', ['FTLS Notes', 'Notes']);
  fill('bio', ['FTLS Bio', 'Bio']);
  fill('stories', ['FTLS Stories / Memories', 'Stories', 'Story']);

  if (isBlank(out.fams)) {
    const refs = splitFtlsReconciliationRefs(getFtlsReconciliationValue(snapshot, ['Spouse-family refs (FAMS)', 'FAMS']));
    if (refs.length) { out.fams = refs; applied.push('fams'); }
  }
  if (isBlank(out.famc)) {
    const refs = splitFtlsReconciliationRefs(getFtlsReconciliationValue(snapshot, ['Parent-family refs (FAMC)', 'FAMC']));
    if (refs.length) { out.famc = refs; applied.push('famc'); }
  }
  fill('primaryFamId', ['Primary Family ID']);

  if (applied.length > 0) out._ftlsSnapshotApplied = applied;
  return out;
}

function applyFtlsReconciliationSnapshotDefaultsToDbRow(row, snapshot) {
  if (!snapshot) return row;
  const person = {
    id: row.id,
    fn: row.first_name, mn: row.middle_name, ln: row.last_name, dn: row.display_name,
    nk: row.nickname, md: row.maiden_name, sx: getNameSuffixFromNotes(row.notes), g: row.gender,
    dob: row.date_of_birth, dod: row.date_of_death, dec: row.is_deceased, bo: row.birth_order,
    em: row.email, ph: row.phone,
    a1: row.address1, a2: row.address2, ci: row.city, st: row.state, zp: row.zip, co: row.country,
    fb: row.facebook, ig: row.instagram, li: row.linkedin, ws: row.website,
    pp: row.profile_photo, bio: row.bio, loc: row.location,
    prof: row.profession, emp: row.employer, stories: row.stories, notes: row.notes,
    pgl: row.photo_gallery_link, dl: row.documents_link,
    tp: row.title_prefix, burd: row.burial_date,
    primaryFamId: row.primary_family_id,
  };
  const merged = applyFtlsReconciliationSnapshotDefaults(person, snapshot);
  row.first_name = merged.fn || '';
  row.middle_name = merged.mn || '';
  row.last_name = merged.ln || '';
  row.display_name = merged.dn || ((merged.fn || '') + (merged.mn ? ' ' + merged.mn : '') + (merged.ln ? ' ' + merged.ln : '')).trim() || merged.nk || '(Unknown)';
  row.nickname = merged.nk || '';
  row.maiden_name = merged.md || '';
  row.gender = merged.g || '';
  row.date_of_birth = merged.dob || '';
  row.date_of_death = merged.dod || '';
  row.is_deceased = !!merged.dec;
  row.birth_order = merged.bo || 0;
  row.email = merged.em || '';
  row.phone = merged.ph || '';
  row.address1 = merged.a1 || '';
  row.address2 = merged.a2 || '';
  row.city = merged.ci || '';
  row.state = merged.st || '';
  row.zip = merged.zp || '';
  row.country = merged.co || '';
  row.facebook = merged.fb || '';
  row.instagram = merged.ig || '';
  row.linkedin = merged.li || '';
  row.website = merged.ws || '';
  row.profile_photo = merged.pp || '';
  row.bio = merged.bio || '';
  row.location = merged.loc || '';
  row.profession = merged.prof || '';
  row.employer = merged.emp || '';
  row.stories = merged.stories || '';
  row.notes = dedupeNoteTextLines(upsertNameSuffixIntoNotes(merged.notes || '', merged.sx || ''));
  row.photo_gallery_link = merged.pgl || '';
  row.documents_link = merged.dl || '';
  row.title_prefix = merged.tp || '';
  row.burial_date = merged.burd || '';
  // Do not set primary_family_id during destructive migration: persons are inserted before families,
  // and a FK constraint could reject otherwise-valid person rows.
  return row;
}

function collectFtlsReconciliationSnapshots(el, noteMap = {}) {
  const snapshots = [];
  for (const child of (el.children || [])) {
    if (child.tag !== 'NOTE') continue;
    const val = resolveGedcomNoteValue(child.value, noteMap);
    const parsed = parseFtlsReconciliationSnapshotText(val);
    if (parsed) snapshots.push(parsed);
  }
  return snapshots;
}


function collectFtlsFamilyReconciliationSnapshots(el, noteMap = {}) {
  const snapshots = [];
  for (const child of (el.children || [])) {
    if (child.tag !== 'NOTE') continue;
    const val = resolveGedcomNoteValue(child.value, noteMap);
    const parsed = parseFtlsFamilyReconciliationSnapshotText(val);
    if (parsed) snapshots.push(parsed);
  }
  return snapshots;
}

function applyFtlsFamilyReconciliationSnapshotDefaults(family, snapshot) {
  if (!snapshot) return family;
  const out = { ...family, _ftlsFamilySnapshot: snapshot };
  const applied = [];
  const isBlank = (v) => {
    if (v === null || v === undefined) return true;
    if (Array.isArray(v)) return v.length === 0;
    if (typeof v === 'boolean') return false;
    return String(v).trim() === '';
  };
  const fill = (key, labels, transform) => {
    if (!isBlank(out[key])) return;
    const raw = getFtlsReconciliationValue(snapshot, labels);
    if (!raw) return;
    const next = transform ? transform(raw) : raw;
    if (next === null || next === undefined || next === '') return;
    out[key] = next;
    applied.push(key);
  };

  fill('husb', ['Husband ID', 'HUSB']);
  fill('wife', ['Wife ID', 'WIFE']);
  fill('mdate', ['Marriage Date']);
  fill('mplace', ['Marriage Place', 'Marriage Location']);
  const divVal = getFtlsReconciliationValue(snapshot, ['Divorced Flag', 'Divorced']);
  if (divVal && !out.divorced) {
    if (/^(true|yes|y|1)$/i.test(divVal)) { out.divorced = true; applied.push('divorced'); }
  }
  fill('divdate', ['Divorce Date']);
  if (isBlank(out.children)) {
    const kids = splitFtlsReconciliationRefs(getFtlsReconciliationValue(snapshot, ['Children IDs', 'CHIL']));
    if (kids.length) { out.children = kids; applied.push('children'); }
  }
  if (applied.length > 0) out._ftlsFamilySnapshotApplied = applied;
  return out;
}

function applyFtlsFamilyReconciliationSnapshotDefaultsToDbRow(row, snapshot) {
  if (!snapshot) return row;
  const fam = applyFtlsFamilyReconciliationSnapshotDefaults({
    id: row.id,
    husb: row.husband_id || '',
    wife: row.wife_id || '',
    children: row.children || [],
    mdate: row.marriage_date || '',
    mplace: row.marriage_place || '',
    divorced: !!row.divorced,
    divdate: row.divorce_date || ''
  }, snapshot);
  row.husband_id = row.husband_id || fam.husb || null;
  row.wife_id = row.wife_id || fam.wife || null;
  row.children = (row.children && row.children.length) ? row.children : (fam.children || []);
  row.marriage_date = row.marriage_date || fam.mdate || '';
  row.marriage_place = row.marriage_place || fam.mplace || '';
  row.divorced = !!fam.divorced;
  row.divorce_date = row.divorce_date || fam.divdate || '';
  return row;
}

function findGeneratedFtlsNoteIds(elements, noteMap = {}) {
  const ids = new Set();
  for (const el of elements || []) {
    const noteText = el.pointer ? (noteMap[el.pointer] || el.value || '') : '';
    if (el.tag === 'NOTE' && el.pointer && isFtlsGeneratedNoteText(noteText)) {
      ids.add(el.pointer);
    }
  }
  return ids;
}

function stripGeneratedFtlsNoteRecordsFromGedcomLines(lines, generatedNoteIds) {
  if (!generatedNoteIds || generatedNoteIds.size === 0) return lines;
  const out = [];
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    const top = line.match(/^0\s+(@[^@]+@)\s+NOTE(?:\s|$)/);
    if (top && generatedNoteIds.has(top[1])) {
      i++;
      while (i < lines.length && !/^0\s+/.test(lines[i])) i++;
      i--;
      continue;
    }
    const directRef = line.match(/^1\s+NOTE\s+(@[^@]+@)\s*$/);
    if (directRef && generatedNoteIds.has(directRef[1])) continue;
    out.push(line);
  }
  return out;
}

function gedcomEventLabel(tag) {
  const labels = {
    BIRT: 'Birth', DEAT: 'Death', ADOP: 'Adoption', BURI: 'Burial',
    RESI: 'Residence', MARR: 'Marriage', DIV: 'Divorce', OCCU: 'Occupation',
    EDUC: 'Education', IMMI: 'Immigration', EMIG: 'Emigration', EVEN: 'Event'
  };
  return labels[tag] || tag;
}

function normalizeGedcomNoteDedupeKey(text) {
  return cleanGedcomNoteText(text || '')
    .replace(/\r?\n/g, '\n')
    .split('\n')
    .map(line => line.replace(/\s+/g, ' ').trim())
    .filter(Boolean)
    .join('\n')
    .toLowerCase();
}

function dedupeNoteTextLines(text) {
  const seen = new Set();
  const out = [];
  for (const line of String(text || '').replace(/\r\n/g, '\n').replace(/\r/g, '\n').split('\n')) {
    const key = normalizeGedcomNoteDedupeKey(line);
    if (!key) continue;
    if (seen.has(key)) continue;
    seen.add(key);
    out.push(line.trim());
  }
  return out.join('\n');
}

function collectGedcomNotes(el, noteMap = {}) {
  const pieces = [];
  const seen = new Set();
  // Dedupe key is computed from the RAW (unlabeled) text. This way a person-level
  // NOTE and a DEAT/BIRT/etc. event NOTE carrying the same underlying sentence
  // collapse to one piece — even though the labeled output differs ("Death note: X"
  // vs bare "X"). Without this, both keys differ and both pieces survive,
  // producing the round-trip duplication seen in MFT-sourced GEDCOMs.
  // First-wins: in practice the unlabeled person NOTE appears first in MFT output
  // and is kept; the event-label gets dropped. That's the cleaner outcome.
  const pushPiece = (scope, rawText, labeledText) => {
    const cleaned = cleanGedcomNoteText(rawText || '');
    if (!cleaned || isFtlsGeneratedNoteText(cleaned)) return;
    const key = normalizeGedcomNoteDedupeKey(cleaned);
    if (!key || seen.has(key)) return;
    seen.add(key);
    const emit = labeledText !== undefined ? cleanGedcomNoteText(labeledText) : cleaned;
    pieces.push({ scope, text: emit });
  };
  for (const child of (el.children || [])) {
    if (child.tag === 'NOTE') {
      const val = resolveGedcomNoteValue(child.value, noteMap);
      pushPiece('person', val);
      continue;
    }
    // Capture event-level notes such as BIRT/DEAT/ADOP/MARR > NOTE @...@.
    // Store them in the same FTLS Notes field with a label so they are not lost.
    // De-duplicate after round-trip: an FTLS export may contain the same text as
    // a normal person NOTE and as an event-level NOTE preserved by MFT.
    for (const grand of (child.children || [])) {
      if (grand.tag !== 'NOTE') continue;
      const val = resolveGedcomNoteValue(grand.value, noteMap);
      if (!val || isFtlsGeneratedNoteText(val)) continue;
      pushPiece(child.tag, val, `${gedcomEventLabel(child.tag)} note: ${val}`);
    }
  }
  return pieces;
}

function splitMftPlaceParts(text) {
  return (text || '').split(',').map(x => x.trim()).filter(Boolean);
}

function normalizeGedcomCountry(value) {
  const v = (value || '').trim();
  if (!v) return '';
  if (/^(USA|U\.S\.A\.|United States)$/i.test(v)) return 'USA';
  if (/^(UK|U\.K\.|United Kingdom)$/i.test(v)) return 'UK';
  return v;
}

function parseMftResidencePlace(raw) {
  const text = (raw || '').trim();
  if (!text) return { a1:'', a2:'', ci:'', st:'', zp:'', co:'' };
  const parts = splitMftPlaceParts(text);
  const out = { a1:'', a2:'', ci:'', st:'', zp:'', co:'' };

  // MacFamilyTree's formatted place often ends with State-Zip,Country.
  // Example: Street,City,County,NY-11501,USA
  const last = parts[parts.length - 1] || '';
  let country = normalizeGedcomCountry(last);
  let working = parts.slice();
  if (parts.length >= 2 && /^[A-Za-z .]+(?:-\d{5}(?:-\d{4})?)?$/.test(last) && !/\d/.test(last)) {
    out.co = country;
    working = parts.slice(0, -1);
  }

  if (working.length) {
    const tail = working[working.length - 1];
    // India-style: ...,Kerala,India-689667 keeps country+postal together.
    let m = tail.match(/^(.+?)[-\s]+(\d{5,6})$/);
    if (m && /^(India|USA|U\.S\.A\.|United States|UK|U\.K\.|United Kingdom)$/i.test(m[1].trim())) {
      out.co = normalizeGedcomCountry(m[1].trim());
      out.zp = m[2].trim();
      working = working.slice(0, -1);
    } else {
      m = tail.match(/^([A-Za-z .]+)[-\s]+(\d{5}(?:-\d{4})?)$/);
      if (m) {
        out.st = m[1].trim();
        out.zp = m[2].trim();
        working = working.slice(0, -1);
      }
    }
  }

  if (working.length >= 4) {
    out.a1 = working[0] || '';
    out.a2 = working[1] || '';
    out.ci = working[2] || '';
    if (!out.st) out.st = working[3] || '';
  } else if (working.length === 3) {
    if (out.zp || out.co) {
      // Street, City, County with state/zip/country already parsed from the tail.
      out.a1 = working[0] || '';
      out.ci = working[1] || '';
      out.a2 = working[2] || '';
    } else {
      out.ci = working[0] || '';
      out.st = working[1] || '';
      if (!out.co) out.co = normalizeGedcomCountry(working[2]);
    }
  } else if (working.length === 2) {
    out.ci = working[0] || '';
    if (!out.co && /^(USA|U\.S\.A\.|United States|India|Oman|UAE|U\.A\.E|UK|U\.K\.|Canada|Australia)$/i.test(working[1])) {
      out.co = normalizeGedcomCountry(working[1]);
    } else {
      out.st = working[1] || '';
    }
  } else if (working.length === 1) {
    // Single MFT RESI value is ambiguous; preserve it as the address line so
    // arbitrary text like "Address Goes here" is not mislabeled as a city.
    out.a1 = working[0] || '';
  }

  // If the pattern was too unusual, preserve the full text in address1.
  if (!out.a1 && !out.ci && !out.st && !out.co) out.a1 = text;
  return out;
}

function parseGedcomResidenceAddress(addrEl, noteMap = {}) {
  if (!addrEl) return { a1:'', a2:'', ci:'', st:'', zp:'', co:'' };
  const childValue = (tag) => {
    const ch = (addrEl.children || []).find(c => c.tag === tag);
    return ch ? ch.value : '';
  };

  const structured = {
    a1: childValue('ADR1') || '',
    a2: childValue('ADR2') || '',
    ci: childValue('CITY') || '',
    st: childValue('STAE') || '',
    zp: childValue('POST') || '',
    co: childValue('CTRY') || '',
  };
  if (structured.a1 || structured.a2 || structured.ci || structured.st || structured.zp || structured.co) {
    if (!structured.a1 && addrEl.value) structured.a1 = addrEl.value;
    return structured;
  }

  const noteEl = (addrEl.children || []).find(c => c.tag === 'NOTE');
  const noteText = noteEl ? resolveGedcomNoteValue(noteEl.value, noteMap) : '';
  const plac = childValue('PLAC');
  // Prefer PLAC over the RESI label when both exist, because MFT uses PLAC for
  // the detailed address and RESI value as a shorter display name.
  return parseMftResidencePlace(plac || noteText || addrEl.value || '');
}

/* ───── MEDIA UPLOAD UTILITIES ───── */
async function resizeImage(file, maxSize) {
  return new Promise((resolve) => {
    const img = new Image();
    const canvas = document.createElement('canvas');
    img.onload = () => {
      let w = img.width, h = img.height;
      if (w > maxSize || h > maxSize) {
        if (w > h) { h = Math.round(h * maxSize / w); w = maxSize; }
        else { w = Math.round(w * maxSize / h); h = maxSize; }
      }
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      canvas.toBlob(resolve, 'image/jpeg', 0.85);
    };
    img.src = URL.createObjectURL(file);
  });
}

async function uploadToCloudinary(file, folder) {
  const isImage = file.type.startsWith('image/');
  const isPDF = file.type === 'application/pdf';
  // Resize images client-side; PDFs go as-is
  let uploadFile = file;
  if (isImage) {
    const resized = await resizeImage(file, folder === 'profiles' ? 400 : 1200);
    if (resized) uploadFile = resized;
  }
  const formData = new FormData();
  formData.append('file', uploadFile);
  formData.append('upload_preset', CLOUDINARY_PRESET);
  formData.append('folder', `chennamkara/${folder}`);
  const resp = await fetch(CLOUDINARY_UPLOAD_URL, { method: 'POST', body: formData });
  if (!resp.ok) throw new Error('Upload failed: ' + resp.status);
  const data = await resp.json();
  return { url: data.secure_url, publicId: data.public_id, format: data.format, resourceType: data.resource_type };
}

async function sbFetch(path, opts = {}) {
  const url = SUPABASE_URL + '/rest/v1/' + path;
  const headers = { ...SB_HEADERS, ...(opts.headers || {}) };
  if (authSession?.access_token && !(opts.headers && opts.headers.Authorization)) {
    headers.Authorization = 'Bearer ' + authSession.access_token;
  }
  const resp = await fetch(url, { ...opts, headers });
  const text = await resp.text();
  if (!resp.ok) {
    // If 401 on a read operation, clear bad session and retry with anon key
    if (resp.status === 401 && (!opts.method || opts.method === 'GET')) {
      console.warn('401 on read — clearing session and retrying with anon key:', path);
      // Clear stale/invalid session so future requests don't keep failing
      if (authSession) {
        authSession = null;
        authUser = null;
        try { sessionStorage.removeItem('ftls_session'); } catch(e) {}
      }
      const anonHeaders = { ...SB_HEADERS, ...(opts.headers || {}), Authorization: 'Bearer ' + SUPABASE_KEY };
      const retry = await fetch(url, { ...opts, headers: anonHeaders });
      const retryText = await retry.text();
      if (retry.ok) {
        if (!retryText) return [];
        try { return JSON.parse(retryText); } catch(e) { return []; }
      }
    }
    console.error('Supabase request failed', {
      path,
      status: resp.status,
      body: text,
      usingSessionToken: !!authSession?.access_token
    });
    if (resp.status === 401 || resp.status === 403) {
      throw new Error('Permission denied — your session may have expired. Please sign out and sign back in.');
    }
    throw new Error(text || `Supabase ${resp.status}`);
  }
  if (!text) return [];
  try { return JSON.parse(text); } catch(e) { return []; }
}

/* ───── LOAD FROM SUPABASE ───── */
async function loadFromSupabase() {
  try {
    // Fetch all persons and families
    const [persons, families] = await Promise.all([
      sbFetch('persons?select=*&order=display_name'),
      sbFetch('families?select=*'),
    ]);
    console.log(`Loaded ${persons.length} persons, ${families.length} families from Supabase`);
    const result = buildTreeFromDB(persons, families);
    console.log(`Built tree with ${Object.keys(result.personMap).length} persons in personMap`);
    return result;
  } catch (err) {

    return null;
  }
}

function buildTreeFromDB(persons, families) {
  const pMap = {};
  persons.forEach(p => {
    pMap[p.id] = {
      ...personRowToTreePerson(p),
      _fams: [], _famc: [],
    };
  });

  // Build family links
  const fMap = {};
  families.forEach(f => {
    fMap[f.id] = f;
    if (f.husband_id && pMap[f.husband_id]) pMap[f.husband_id]._fams.push(f.id);
    if (f.wife_id && pMap[f.wife_id]) pMap[f.wife_id]._fams.push(f.id);
    (f.children || []).forEach(cid => {
      if (pMap[cid]) pMap[cid]._famc.push(f.id);
    });
  });

  // Find roots (no famc)
  const hasParents = new Set();
  families.forEach(f => (f.children||[]).forEach(c => hasParents.add(c)));
  const roots = Object.keys(pMap).filter(pid => !hasParents.has(pid));

  // Find best root (most descendants, prefer named)
  function countDesc(pid, seen=new Set()) {
    if(seen.has(pid))return 0;seen.add(pid);let c=1;
    const p=pMap[pid];if(!p)return 0;
    for(const fid of p._fams){const f=fMap[fid];if(f)(f.children||[]).forEach(cid=>{c+=countDesc(cid,seen)});}
    return c;
  }
  let bestRoot=null,bestScore=0;
  for(const pid of roots){
    const p=pMap[pid];
    if(!p||(!p.fn&&!p.nk)) continue;
    const c=countDesc(pid);
    if(c>bestScore){bestScore=c;bestRoot=pid;}
  }
  if(!bestRoot){ for(const pid of roots){ const c=countDesc(pid); if(c>bestScore){bestScore=c;bestRoot=pid;} } }
  if(!bestRoot) bestRoot=roots[0];
  console.log('DB tree root:', bestRoot, pMap[bestRoot]?.dn, 'with', bestScore, 'descendants');

  // Clean personMap: remove internal fields, keep all person data
  const personMap = {};
  for (const [id, p] of Object.entries(pMap)) {
    const clean = {...p};
    delete clean._fams; delete clean._famc;
    personMap[id] = clean;
  }

  // Build hierarchical tree
  // node.spouses[] = [{famId, sp, mdate, mplace, divorced, divdate, ch[]}] — one entry per marriage
  // node.sp / node.mdate / node.mplace / node.ch are aliases to primary marriage for backward compat
  function buildNode(pid, visited=new Set()) {
    if(visited.has(pid))return null;visited.add(pid);
    const p=pMap[pid];if(!p)return null;
    const node={...p, sp:null, mdate:'', mplace:'', ch:[], spouses:[]};
    delete node._fams; delete node._famc;

    for(const fid of (p._fams||[])){
      const fam=fMap[fid];if(!fam)continue;
      const spId = fam.husband_id===pid ? fam.wife_id : fam.husband_id;
      let sp=null;
      if(spId&&pMap[spId]&&!visited.has(spId)){
        visited.add(spId);
        sp={...pMap[spId], mdate:fam.marriage_date||'', mplace:fam.marriage_place||''};
        delete sp._fams; delete sp._famc;
      }
      const famCh=[];
      for(const cid of (fam.children||[])){
        const cn=buildNode(cid,visited);
        if(cn)famCh.push(cn);
      }
      famCh.sort((a,b)=>(a.bo||999)-(b.bo||999));
      node.spouses.push({
        famId:fid, sp,
        mdate:fam.marriage_date||fam.mdate||'', mplace:fam.marriage_place||fam.mplace||'',
        divorced:fam.divorced||false, divdate:fam.divorce_date||fam.divdate||'',
        ch:famCh,
      });
    }
    // Primary = first marriage; flatten ch for legacy tree traversal
    if(node.spouses.length>0){
      node.sp=node.spouses[0].sp;
      node.mdate=node.spouses[0].mdate;
      node.mplace=node.spouses[0].mplace;
    }
    node.ch=node.spouses.flatMap(s=>s.ch);
    return node;
  }

  return { tree: buildNode(bestRoot), personMap, familyMap: fMap };
}

function personRowToTreePerson(p) {
  return {
    id:p.id, fn:p.first_name, mn:p.middle_name, ln:p.last_name,
    dn:p.display_name, nk:p.nickname, md:p.maiden_name, sx:getNameSuffixFromNotes(p.notes), g:p.gender,
    dob:p.date_of_birth, dod:p.date_of_death, dec:p.is_deceased, bo:p.birth_order,
    em:p.email, ph:p.phone, a1:p.address1, a2:p.address2,
    ci:p.city, st:p.state, zp:p.zip, co:p.country,
    fb:p.facebook, ig:p.instagram, li:p.linkedin, ws:p.website,
    pp:p.profile_photo, bio:p.bio, loc:p.location, prof:p.profession, emp:p.employer,
    stories:p.stories, notes:p.notes, pgl:p.photo_gallery_link, dl:p.documents_link,
    tp:p.title_prefix, burd:p.burial_date, _xg:p._extra_gedcom,
    primaryFamId:p.primary_family_id||null,
  };
}

/* ───── SAVE TO SUPABASE ───── */
async function savePerson(person, editUser) {
  const row = {
    id: person.id,
    first_name: person.fn||'', middle_name: person.mn||'', last_name: person.ln||'',
    display_name: person.dn||'', nickname: person.nk||'', maiden_name: person.md||'',
    gender: person.g||'', date_of_birth: person.dob||'', date_of_death: person.dod||'',
    is_deceased: !!person.dec, birth_order: person.bo||0,
    email: person.em||'', phone: person.ph||'',
    address1: person.a1||'', address2: person.a2||'', city: person.ci||'',
    state: person.st||'', zip: person.zp||'', country: person.co||'',
    facebook: person.fb||'', instagram: person.ig||'', linkedin: person.li||'',
    website: person.ws||'', profile_photo: person.pp||'', bio: person.bio||'',
    location: person.loc||'', profession: person.prof||'', employer: person.emp||'',
    stories: person.stories||'', notes: dedupeNoteTextLines(upsertNameSuffixIntoNotes(person.notes||'', person.sx||'')),
    photo_gallery_link: person.pgl||'', documents_link: person.dl||'',
    title_prefix: person.tp||'', burial_date: person.burd||'',
    _extra_gedcom: person._xg||'',
    primary_family_id: person.primaryFamId||null,
    updated_by: editUser||'',
  };
  
  // Fetch current state for diff
  let oldRow = null;
  try {
    const cur = await sbFetch(`persons?id=eq.${person.id}&select=*`);
    if (cur.length > 0) oldRow = cur[0];
  } catch(e) {}
  
  // Use UPSERT: POST with on_conflict=id merges into existing row
  await sbFetch('persons?on_conflict=id', {
    method: 'POST',
    body: JSON.stringify(row),
    headers: { 
      'Prefer': 'return=minimal,resolution=merge-duplicates'
    }
  });
  
  // Compute diff: only fields that actually changed
  const diff = {};
  const prev = {};
  const skipLog = new Set(['id','updated_by','updated_at','created_at']);
  if (oldRow) {
    for (const [k, v] of Object.entries(row)) {
      if (skipLog.has(k)) continue;
      const oldVal = (oldRow[k] === null || oldRow[k] === undefined) ? '' : String(oldRow[k]).trim();
      const newVal = (v === null || v === undefined) ? '' : String(v).trim();
      if (oldVal !== newVal) {
        diff[k] = v;
        prev[k] = oldRow[k] || '';
      }
    }
  }
  // Save marriage date/place to families table if provided
  if (person.mdate || person.mplace) {
    try {
      const fams = await sbFetch(`families?select=*&or=(husband_id.eq.${person.id},wife_id.eq.${person.id})`);
      if (fams.length > 0) {
        await sbFetch(`families?id=eq.${fams[0].id}`, {
          method: 'PATCH',
          body: JSON.stringify({ marriage_date: person.mdate||'', marriage_place: person.mplace||'' }),
          headers: { 'Prefer': 'return=minimal' }
        });
      }
    } catch(e) { console.warn('Marriage save failed:', e); }
  }
  // Log edit — only log if something actually changed
  if (Object.keys(diff).length > 0) {
    try {
      await logEditAction({
        personId: person.id,
        action: oldRow ? 'update' : 'create',
        editedBy: editUser || '',
        changes: {
          person_name: row.display_name || row.first_name + ' ' + row.last_name,
          changed_fields: diff,
          previous_values: prev
        }
      });
    } catch(e) { console.warn('Edit log failed:', e); }
  }
}

async function logEditAction({ personId, familyId, action, editedBy, changes }) {
  const payload = {
    action,
    edited_by: editedBy || '',
  };
  if (personId !== undefined) payload.person_id = personId;
  if (familyId !== undefined) payload.family_id = familyId;
  if (changes && Object.keys(changes).length > 0) payload.changes = changes;
  return sbFetch('edit_log', {
    method: 'POST',
    headers: { 'Prefer': 'return=minimal' },
    body: JSON.stringify(payload)
  });
}

async function deletePersonFromDB(personId, editUser) {
  // Remove from family children arrays
  const fams = await sbFetch(`families?select=*&children=cs.{${personId}}`);
  for (const f of fams) {
    const newChildren = (f.children||[]).filter(c=>c!==personId);
    await sbFetch(`families?id=eq.${f.id}`, {
      method: 'PATCH',
      body: JSON.stringify({ children: newChildren })
    });
  }
  // Remove families where this person is husband or wife (if no children).
  // Before deleting any family, null out any primary_family_id references to it
  // so no person is left pointing to a non-existent family record.
  const asFams = await sbFetch(`families?select=*&or=(husband_id.eq.${personId},wife_id.eq.${personId})`);
  for (const f of asFams) {
    if (!f.children || f.children.length === 0) {
      try {
        await sbFetch(`persons?primary_family_id=eq.${f.id}`, {
          method: 'PATCH',
          body: JSON.stringify({ primary_family_id: null })
        });
      } catch(e) { /* non-fatal, UI falls back to date-based resolution */ }
      await sbFetch(`families?id=eq.${f.id}`, { method: 'DELETE' });
    }
  }
  // If this person had a primary_family_id pointing to a family they're still in
  // (i.e., the family has children so it survives), that's someone else's concern.
  // But if this person themselves had a primary_family_id, it goes away with them.
  // Delete person
  await sbFetch(`persons?id=eq.${personId}`, { method: 'DELETE' });
  // Log
  try {
    await sbFetch('edit_log', {
      method: 'POST',
      headers: { 'Prefer': 'return=minimal' },
      body: JSON.stringify({ person_id: personId, action: 'delete', edited_by: editUser||'' })
    });
  } catch(e) {}
}

async function addPersonToDB(person, parentId, editUser, targetFamId=null) {
  // Save the new person
  await savePerson(person, editUser);
  // Find or create family for the parent
  if (parentId) {
    // If a specific family was requested (from "Add child to this marriage"), use it directly
    if (targetFamId) {
      const fam = await sbFetch(`families?id=eq.${targetFamId}&select=*`);
      if (fam.length > 0) {
        const newChildren = [...(fam[0].children||[]), person.id];
        await sbFetch(`families?id=eq.${targetFamId}`, {
          method: 'PATCH',
          body: JSON.stringify({ children: newChildren })
        });
        return;
      }
    }
    const parentFams = await sbFetch(`families?select=*&or=(husband_id.eq.${parentId},wife_id.eq.${parentId})`);
    if (parentFams.length > 0) {
      // Pick the best family: prefer complete (has both spouses) with existing children
      let bestFam = parentFams[0];
      if (parentFams.length > 1) {
        const complete = parentFams.filter(f => f.husband_id && f.wife_id);
        if (complete.length > 0) {
          const withKids = complete.filter(f => (f.children||[]).length > 0);
          bestFam = withKids.length > 0 ? withKids[0] : complete[0];
        }
      }
      const newChildren = [...(bestFam.children||[]), person.id];
      await sbFetch(`families?id=eq.${bestFam.id}`, {
        method: 'PATCH',
        body: JSON.stringify({ children: newChildren })
      });
    } else {
      const parent = await sbFetch(`persons?id=eq.${parentId}&select=gender`);
      const pGender = parent[0]?.gender || 'M';
      await saveFamily(
        '@F' + Date.now() + '@',
        pGender === 'M' ? parentId : null,
        pGender === 'F' ? parentId : null,
        [person.id], '', ''
      );
    }
  }
}

async function saveSpouseToDB(parentId, spouse, editUser, famId=null) {
  // Save spouse person record
  await savePerson(spouse, editUser);
  const parent = await sbFetch(`persons?id=eq.${parentId}&select=gender`);
  const pGender = parent[0]?.gender || 'M';
  // If targeting a specific family (editing existing marriage), patch it directly
  if (famId) {
    const patch = pGender === 'M' ? { wife_id: spouse.id } : { husband_id: spouse.id };
    await sbFetch(`families?id=eq.${famId}`, { method: 'PATCH', body: JSON.stringify(patch) });
    return;
  }
  // Otherwise find parent's family or create a new one
  const parentFams = await sbFetch(`families?select=*&or=(husband_id.eq.${parentId},wife_id.eq.${parentId})`);
  if (parentFams.length > 0) {
    // Prefer a family missing the spouse slot
    const spouseSlot = pGender === 'M' ? 'wife_id' : 'husband_id';
    const incomplete = parentFams.find(f => !f[spouseSlot]);
    const fam = incomplete || parentFams[0];
    const patch = pGender === 'M' ? { wife_id: spouse.id } : { husband_id: spouse.id };
    await sbFetch(`families?id=eq.${fam.id}`, { method: 'PATCH', body: JSON.stringify(patch) });
  } else {
    await saveFamily(
      '@F' + Date.now() + '@',
      pGender === 'M' ? parentId : spouse.id,
      pGender === 'F' ? parentId : spouse.id,
      [], '', ''
    );
  }
}

async function deleteSpouseFromDB(parentId, spouseId, editUser, famId=null) {
  // Remove spouse from specific family (or search all if famId not given)
  if (famId) {
    const fam = await sbFetch(`families?id=eq.${famId}&select=*`);
    if (fam.length > 0) {
      const f = fam[0];
      const patch = f.husband_id === spouseId ? { husband_id: null } : { wife_id: null };
      await sbFetch(`families?id=eq.${famId}`, { method: 'PATCH', body: JSON.stringify(patch) });
    }
    return;
  }
  const fams = await sbFetch(`families?select=*&or=(husband_id.eq.${parentId},wife_id.eq.${parentId})`);
  for (const f of fams) {
    if (f.husband_id === spouseId) {
      await sbFetch(`families?id=eq.${f.id}`, { method: 'PATCH', body: JSON.stringify({ husband_id: null }) });
    } else if (f.wife_id === spouseId) {
      await sbFetch(`families?id=eq.${f.id}`, { method: 'PATCH', body: JSON.stringify({ wife_id: null }) });
    }
  }
}

// Move a person from one parent family to another
async function movePersonBranch(personId, fromFamilyId, toFamilyId, editUser) {
  // fromFamilyId may be null for orphan placement (person has no current family)
  const isOrphanPlace = !fromFamilyId;

  // Fetch families — skip source fetch for orphan placement
  let fromFam = null;
  if (!isOrphanPlace) {
    const fromFams = await sbFetch(`families?id=eq.${fromFamilyId}&select=*`);
    if (fromFams.length === 0) throw new Error('Source family not found');
    fromFam = fromFams[0];
  }
  const toFams = await sbFetch(`families?id=eq.${toFamilyId}&select=*`);
  if (toFams.length === 0) throw new Error('Target family not found');
  const toFam = toFams[0];

  // Remove from old family's children array (skip for orphans — there's nothing to remove)
  if (!isOrphanPlace) {
    const oldChildren = (fromFam.children || []).filter(c => c !== personId);
    await sbFetch(`families?id=eq.${fromFamilyId}`, {
      method: 'PATCH',
      body: JSON.stringify({ children: oldChildren })
    });
  }

  // Add to new family's children array (avoid duplicates)
  const newChildren = [...(toFam.children || [])];
  if (!newChildren.includes(personId)) newChildren.push(personId);
  await sbFetch(`families?id=eq.${toFamilyId}`, {
    method: 'PATCH',
    body: JSON.stringify({ children: newChildren })
  });

  // Update family_members junction table (if it exists)
  try {
    if (!isOrphanPlace) {
      await sbFetch(`family_members?family_id=eq.${fromFamilyId}&person_id=eq.${personId}&role=eq.child`, {
        method: 'DELETE'
      });
    }
    await sbFetch('family_members?on_conflict=family_id,person_id', {
      method: 'POST',
      body: JSON.stringify({ family_id: toFamilyId, person_id: personId, role: 'child' }),
      headers: { 'Prefer': 'return=minimal,resolution=merge-duplicates' }
    });
  } catch(e) { console.warn('family_members update failed (table may not exist yet):', e); }

  // Note: primary_family_id is NOT updated here — it controls which FAMS (marriage)
  // to display as "primary" for multi-marriage persons. It has nothing to do with FAMC
  // (parent family). The FAMC relationship is stored entirely in families.children arrays,
  // which are updated above. Both source and target family rows are patched.

  // Log — distinguish orphan placement from branch move
  try {
    await sbFetch('edit_log', {
      method: 'POST',
      headers: { 'Prefer': 'return=minimal' },
      body: JSON.stringify({
        person_id: personId,
        action: isOrphanPlace ? 'place_orphan' : 'move',
        edited_by: editUser || '',
        changes: {
          from_family: fromFamilyId || null,
          to_family: toFamilyId,
          from_parent: fromFam ? (fromFam.husband_id || fromFam.wife_id || '?') : '(orphan — no previous family)',
          to_parent: toFam.husband_id || toFam.wife_id || '?',
        }
      })
    });
  } catch(e) { console.warn('Move log failed:', e); }
}

/* ───── FALLBACK: GEDCOM file fetch (if Supabase is empty/down) ───── */
const GEDCOM_SOURCE_URL = 'Chennankara_or_Chennamkara.ged';

async function loadSourceGedcom() {
  try {
    const resp = await fetch(GEDCOM_SOURCE_URL + '?t=' + Date.now());
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const text = await resp.text();
    return parseGedcomFile(text);
  } catch (err) {
    console.error('Failed to load source GEDCOM:', err);
    return null;
  }
}

/* ───── BROWSER-BASED GEDCOM → SUPABASE MIGRATION ───── */
async function migrateGedcomToSupabase(gedcomText, onProgress) {
  // Use the canonical shared tokenizer (faithful — preserves whitespace).
  const elements = tokenizeGedcom(gedcomText);
  const noteMap = buildGedcomNoteMap(elements);

  function gv(el, tag) { const ch = el.children.find(c => c.tag === tag); return ch ? ch.value : ''; }
  function gnv(el, pt, ct) { const p = el.children.find(c => c.tag === pt); if (!p) return ''; const c = p.children.find(x => x.tag === ct); return c ? c.value : ''; }

  const persons = [];
  const families = [];

  for (const el of elements) {
    if (el.tag === 'INDI' && el.pointer) {
      let fn='',mn='',ln='',nk='',md='',tp='',sx='',parsedBirthOrder=0;
      const nameEls = el.children.filter(c => c.tag === 'NAME');
      for (const nameEl of nameEls) {
        const typeEl = nameEl.children.find(c => c.tag === 'TYPE');
        const type = typeEl ? typeEl.value : '';
        if (type === 'nick') { nk = nameEl.value.replace(/\//g, '').trim(); }
        else if (type === 'birth') { md = nameEl.value.replace(/\//g, '').trim(); }
        else if (type === 'married') { continue; }
        else if (!fn && !ln) {
          const givnEl = nameEl.children.find(c => c.tag === 'GIVN');
          const surnEl = nameEl.children.find(c => c.tag === 'SURN');
          const secgEl = nameEl.children.find(c => c.tag === 'SECG');
          const npfxEl = nameEl.children.find(c => c.tag === 'NPFX');
          const nsfxEl = nameEl.children.find(c => c.tag === 'NSFX');
          if (npfxEl && !tp) tp = npfxEl.value;
          if (nsfxEl && !sx) sx = nsfxEl.value;
          if (givnEl) { 
            const boMatch = givnEl.value.match(/^(\d+)\.\s*/);
            if (boMatch) parsedBirthOrder = parseInt(boMatch[1]);
            // FAITHFUL: GIVN holds the entire given/personal name. Don't split
            // on whitespace — that fabricates structure that isn't in the data
            // and produces fn="T", mn="O" for inputs like "T O Jacob".
            // Middle name comes from SECG (set below); never invent it from GIVN.
            fn = givnEl.value.replace(/^\d+\.\s*/, '');
          }
          if (surnEl) ln = surnEl.value;
          if (secgEl && !mn) mn = secgEl.value;
          if (!fn && !ln) {
            const nv = nameEl.value.replace(/^\d+\.\s*/,'');
            const sm = nv.match(/^(.*?)\/([^\/]*)\//);
            if (sm) { const gp=sm[1].trim(); ln=sm[2]; const gs=gp.split(' '); fn=gs[0]||''; if(gs.length>1)mn=gs.slice(1).join(' '); }
            else fn = nv.replace(/\//g, '');
          }
        }
      }
      const g = gv(el, 'SEX');
      const dob = gnv(el, 'BIRT', 'DATE');
      const loc = gnv(el, 'BIRT', 'PLAC');
      const dod = gnv(el, 'DEAT', 'DATE');
      const burd = gnv(el, 'BURI', 'DATE');
      const deatEl1 = el.children.find(c => c.tag === 'DEAT');
      const hasDeat = deatEl1 ? (deatEl1.value === 'Y' || !!dod) : false;
      let dn = (fn + (mn ? ' ' + mn : '') + (ln ? ' ' + ln : '')).trim();
      if (!dn) dn = nk || '(Unknown)';
      if (!fn && ln && !mn) dn = 'Mrs. ' + ln + ' (name unknown)';

      // Address / residence. MFT 11 may write RESI value or RESI > PLAC.
      let a1='',a2='',ci='',st='',zp='',co='';
      const addrEl = el.children.find(c => c.tag === 'ADDR' || c.tag === 'RESI');
      if (addrEl) {
        const parsedAddr = parseGedcomResidenceAddress(addrEl, noteMap);
        a1 = parsedAddr.a1 || ''; a2 = parsedAddr.a2 || '';
        ci = parsedAddr.ci || ''; st = parsedAddr.st || '';
        zp = parsedAddr.zp || ''; co = parsedAddr.co || '';
      }

      persons.push({
        id: el.pointer, first_name: fn, middle_name: mn, last_name: ln,
        display_name: dn, nickname: nk, maiden_name: md, gender: g,
        date_of_birth: dob, date_of_death: dod, is_deceased: hasDeat || !!dod, birth_order: parsedBirthOrder,
        email: gv(el,'EMAI')||gv(el,'EMAIL'), phone: gv(el,'PHON'),
        address1:a1, address2:a2, city:ci, state:st, zip:zp, country:co,
        facebook: gv(el,'_FACEBOOK'), instagram: gv(el,'_INSTAGRAM'),
        linkedin: gv(el,'_LINKEDIN'), website: gv(el,'WWW'),
        profile_photo: gv(el,'_PHOTO'), location: loc,
        profession: gv(el,'OCCU'), employer: gv(el,'_EMPLOYER'),
        title_prefix: tp, burial_date: burd,
        photo_gallery_link: gv(el,'_PHOTOGALLERY'), documents_link: gv(el,'_DOCUMENTS'),
        updated_by: 'GEDCOM migration',
      });
      // Parse notes, bio, stories from multiple NOTE tags (after push so we can update).
      // Resolve MFT standalone NOTE pointers and include event-level notes.
      const pRec = persons[persons.length - 1];
      let pNotes = '', pBio = '', pStories = '';
      const notePieces2 = collectGedcomNotes(el, noteMap);
      for (const piece of notePieces2) {
        const val = piece.text || '';
        if (val.startsWith('BIO: ')) { pBio = val.substring(5); }
        else if (val.startsWith('STORY: ')) { pStories = val.substring(7); }
        else if (val) { if (pNotes) pNotes += '\n'; pNotes += val; }
      }
      pRec.notes = dedupeNoteTextLines(upsertNameSuffixIntoNotes(pNotes, sx)); pRec.bio = pBio; pRec.stories = pStories;
      // If this GEDCOM contains an FTLS reconciliation worksheet, use it as
      // fallback data for FTLS-only fields that MFT did not export normally.
      // This keeps destructive GEDCOM → Supabase migration consistent with
      // parseGedcomFile()/Diff & Merge parsing.
      applyFtlsReconciliationSnapshotDefaultsToDbRow(
        pRec,
        (collectFtlsReconciliationSnapshots(el, noteMap)[0] || null)
      );
    } else if (el.tag === 'FAM' && el.pointer) {
      const divEl2 = el.children.find(c => c.tag === 'DIV');
      const divorced2 = divEl2 ? (divEl2.value === 'Y' || divEl2.value === '' || divEl2.children.length > 0) : false;
      const divdate2 = gnv(el,'DIV','DATE') || (divEl2 && divEl2.value !== 'Y' && divEl2.value !== '' ? divEl2.value : '');
      const famRow = {
        id: el.pointer,
        husband_id: gv(el,'HUSB') || null,
        wife_id: gv(el,'WIFE') || null,
        children: [...new Set(el.children.filter(c => c.tag === 'CHIL').map(c => c.value))],
        marriage_date: gnv(el,'MARR','DATE'),
        marriage_place: gnv(el,'MARR','PLAC'),
        divorced: divorced2,
        divorce_date: divdate2,
      };
      applyFtlsFamilyReconciliationSnapshotDefaultsToDbRow(
        famRow,
        (collectFtlsFamilyReconciliationSnapshots(el, noteMap)[0] || null)
      );
      families.push(famRow);
    }
  }

  // Compute birth order
  const pMap = {};
  persons.forEach(p => pMap[p.id] = p);
  families.forEach(f => {
    (f.children||[]).forEach((cid, i) => { if (pMap[cid] && !pMap[cid].birth_order) pMap[cid].birth_order = i + 1; });
  });

  onProgress(`Parsed: ${persons.length} persons, ${families.length} families`);

  // Clear existing data
  onProgress('Clearing existing data...');
  try { await sbFetch('edit_log?id=gt.0', { method: 'DELETE' }); } catch(e) {}
  try { await sbFetch('families?id=neq.', { method: 'DELETE' }); } catch(e) {}
  try { await sbFetch('persons?id=neq.', { method: 'DELETE' }); } catch(e) {}

  // Insert persons in batches
  const batchSize = 30;
  for (let i = 0; i < persons.length; i += batchSize) {
    const batch = persons.slice(i, i + batchSize);
    onProgress(`Inserting persons ${i + 1}-${Math.min(i + batchSize, persons.length)} of ${persons.length}...`);
    try {
      await sbFetch('persons', {
        method: 'POST',
        body: JSON.stringify(batch),
        headers: { 'Prefer': 'resolution=merge-duplicates,return=minimal' }
      });
    } catch (e) {
      // Try one by one
      for (const p of batch) {
        try {
          await sbFetch('persons', {
            method: 'POST',
            body: JSON.stringify(p),
            headers: { 'Prefer': 'resolution=merge-duplicates,return=minimal' }
          });
        } catch (e2) {
          console.warn('Skip person:', p.id, e2);
        }
      }
    }
  }

  // Insert families in batches
  for (let i = 0; i < families.length; i += batchSize) {
    const batch = families.slice(i, i + batchSize);
    onProgress(`Inserting families ${i + 1}-${Math.min(i + batchSize, families.length)} of ${families.length}...`);
    try {
      await sbFetch('families', {
        method: 'POST',
        body: JSON.stringify(batch),
        headers: { 'Prefer': 'resolution=merge-duplicates,return=minimal' }
      });
    } catch (e) {
      for (const f of batch) {
        try {
          await sbFetch('families', {
            method: 'POST',
            body: JSON.stringify(f),
            headers: { 'Prefer': 'resolution=merge-duplicates,return=minimal' }
          });
        } catch (e2) {
          console.warn('Skip family:', f.id, e2);
        }
      }
    }
  }

  onProgress('Verifying...');
  const pCount = await sbFetch('persons?select=id');
  const fCount = await sbFetch('families?select=id');
  return { persons: pCount.length, families: fCount.length };
}

function MigrateDialog({onDone, onCancel}) {
  const [status, setStatus] = useState('');
  const [running, setRunning] = useState(false);
  const [result, setResult] = useState(null);
  const [error, setError] = useState('');
  const inp={width:'100%',background:'#1a1a14',border:'1px solid '+BR,color:TX,padding:'8px 12px',borderRadius:6,fontSize:13,outline:'none',fontFamily:'inherit'};

  const handleFile = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    setRunning(true); setError('');
    setStatus('Reading file...');
    try {
      const text = await file.text();
      const res = await migrateGedcomToSupabase(text, setStatus);
      setResult(res);
      setStatus('');
    } catch (err) {
      setError(err.message);
      setStatus('');
    } finally {
      setRunning(false);
    }
  };

  const handleFromRepo = async () => {
    setRunning(true); setError('');
    setStatus('Fetching GEDCOM from repo...');
    try {
      const resp = await fetch(GEDCOM_SOURCE_URL + '?t=' + Date.now());
      if (!resp.ok) throw new Error('Could not fetch GEDCOM file: ' + resp.status);
      const text = await resp.text();
      const res = await migrateGedcomToSupabase(text, setStatus);
      setResult(res);
      setStatus('');
    } catch (err) {
      setError(err.message);
      setStatus('');
    } finally {
      setRunning(false);
    }
  };

  if (result) return(
    <div style={{position:'fixed',inset:0,zIndex:300,display:'flex',alignItems:'center',justifyContent:'center'}}>
      <div onClick={onDone} style={{position:'absolute',inset:0,background:'rgba(0,0,0,0.7)'}}/>
      <div style={{position:'relative',background:CD,border:'1px solid '+BR,borderRadius:12,width:Math.min(440,window.innerWidth-32),padding:28,zIndex:301,textAlign:'center'}}>
        <div style={{fontSize:48,marginBottom:12}}>✓</div>
        <div style={{fontSize:20,color:GC,fontWeight:300,marginBottom:8}}>Migration Complete</div>
        <div style={{fontSize:14,color:TX}}>{result.persons} persons, {result.families} families loaded into Supabase</div>
        <div style={{fontSize:12,color:DM,marginTop:8,marginBottom:20}}>Refresh the page to load from the database.</div>
        <button onClick={()=>{ onDone(); window.location.reload(); }} style={{background:'rgba(196,163,90,0.15)',border:'1px solid '+GD,color:GC,padding:'10px 24px',borderRadius:6,cursor:'pointer',fontSize:14}}>Reload Page</button>
      </div>
    </div>
  );

  return(
    <div style={{position:'fixed',inset:0,zIndex:300,display:'flex',alignItems:'center',justifyContent:'center'}}>
      <div onClick={onCancel} style={{position:'absolute',inset:0,background:'rgba(0,0,0,0.7)'}}/>
      <div style={{position:'relative',background:CD,border:'1px solid '+BR,borderRadius:12,width:Math.min(480,window.innerWidth-32),padding:28,zIndex:301}}>
        <div style={{fontSize:20,color:GC,fontWeight:300,marginBottom:4}}>Migrate GEDCOM → Supabase</div>
        <div style={{fontSize:12,color:DM,marginBottom:20,lineHeight:1.6}}>
          This will parse a GEDCOM file and load all persons and families into the Supabase database.
          <strong style={{color:'#c05050'}}> This replaces all existing data in the database.</strong>
        </div>
        <div style={{display:'flex',gap:10,marginBottom:16}}>
          <button onClick={handleFromRepo} disabled={running}
            style={{flex:1,background:'rgba(196,163,90,0.1)',border:'1px solid '+GD,color:GC,padding:'12px',borderRadius:6,cursor:'pointer',fontSize:13,opacity:running?0.5:1}}>
            Load from repo<br/><span style={{fontSize:10,color:DM}}>({GEDCOM_SOURCE_URL})</span>
          </button>
          <label style={{flex:1,background:'rgba(107,158,114,0.1)',border:'1px solid '+MC,color:MC,padding:'12px',borderRadius:6,cursor:'pointer',fontSize:13,textAlign:'center',opacity:running?0.5:1}}>
            Upload .ged file<br/><span style={{fontSize:10,color:DM}}>from your computer</span>
            <input type="file" accept=".ged,.gedcom" onChange={handleFile} disabled={running} style={{display:'none'}}/>
          </label>
        </div>
        {status && <div style={{fontSize:12,color:MC,marginBottom:12,display:'flex',alignItems:'center',gap:8}}>
          <div style={{width:12,height:12,border:'2px solid '+BR,borderTopColor:MC,borderRadius:'50%',animation:'spin 0.8s linear infinite',flexShrink:0}}/>
          {status}
        </div>}
        {error && <div style={{fontSize:12,color:'#c05050',marginBottom:12}}>Error: {error}</div>}
        <div style={{display:'flex',justifyContent:'flex-end'}}>
          <button onClick={onCancel} disabled={running} style={{background:'transparent',border:'1px solid '+BR,color:DM,padding:'8px 20px',borderRadius:6,cursor:'pointer',fontSize:13}}>Cancel</button>
        </div>
      </div>
    </div>
  );
}

function escapeFtlsSnapshotValue(value) {
  if (value === null || value === undefined) return '';
  if (Array.isArray(value)) return value.join(', ');
  return String(value).replace(/\r?\n/g, '\\n');
}

function humanFtlsValue(value) {
  if (value === null || value === undefined || value === '') return '(blank in FTLS)';
  if (Array.isArray(value)) return value.length ? value.join(', ') : '(blank in FTLS)';
  return String(value);
}

function buildFtlsReconciliationSnapshot(person, context = {}) {
  const fams = context.fams || person.fams || [];
  const famc = context.famc || person.famc || [];
  const extraLines = person._xg ? String(person._xg).split('\n').filter(x => x.trim()).length : 0;
  const line = (label, value) => `${label}: ${escapeFtlsSnapshotValue(value)}`;
  const show = (label, value) => `${label}: ${escapeFtlsSnapshotValue(humanFtlsValue(value))}`;

  return [
    FTLS_RECON_NOTE_PREFIX,
    'Purpose: This note was created by FTLS so MacFamilyTree admins can see what FTLS currently has stored for this person.',
    'How to use: Read this as a reconciliation worksheet. If something is wrong, update the proper MacFamilyTree field/fact when possible — Name, Birth, Death, Residence/Address, Contact, Occupation, or Notes — instead of only editing this generated note.',
    'Round trip: After updating MacFamilyTree, export a fresh GEDCOM and import/diff it back into FTLS.',
    'FTLS import behavior: FTLS recognizes this worksheet and does not import it as a normal family note, so it stays visible in MFT without cluttering FTLS notes.',
    line('Generated By', `FTLS ${typeof APP_VERSION !== 'undefined' ? APP_VERSION : ''}`.trim()),
    line('Generated At', new Date().toISOString()),
    '',
    '--- Identity fields ---',
    show('FTLS Person ID', person.id),
    show('Display Name', person.dn),
    show('First/Given Name', person.fn),
    show('Middle/Second Name', person.mn),
    show('Last/Surname', person.ln),
    show('Nickname', person.nk),
    show('Maiden Name', person.md),
    show('Title Prefix', person.tp),
    show('Name Suffix', person.sx || getNameSuffixFromNotes(person.notes)),
    show('Gender', person.g),
    show('Birth Order', person.bo),
    'MFT edit location: Person > Names / Facts. Update the actual MFT name fields rather than only this note.',
    '',
    '--- Life events ---',
    show('Birth Date', person.dob),
    show('Birth Place', person.loc),
    show('Death Date', person.dod),
    show('Deceased Flag', person.dec === true ? 'true' : (person.dec === false ? 'false' : '')),
    show('Burial Date', person.burd),
    'MFT edit location: Person > Facts/Events, especially Birth, Death, Burial.',
    '',
    '--- Residence / address ---',
    show('Address 1 / Residence Place', person.a1),
    show('Address 2', person.a2),
    show('City', person.ci),
    show('State', person.st),
    show('Zip / Postal Code', person.zp),
    show('Country', person.co),
    'MFT edit location: Person > Facts > Residence or Address. MFT may export this as RESI/PLAC or ADDR.',
    '',
    '--- Contact and public profile ---',
    show('Phone', person.ph),
    show('Email', person.em),
    show('Website', person.ws),
    show('Facebook', person.fb),
    show('Instagram', person.ig),
    show('LinkedIn', person.li),
    show('Profession / Occupation', person.prof),
    show('Employer', person.emp),
    show('Profile Photo', person.pp),
    show('Photo Gallery Link', person.pgl),
    show('Documents Link', person.dl),
    'MFT edit location: Contact, Internet, Media, Occupation, or Notes depending on the field.',
    '',
    '--- FTLS notes and stories ---',
    show('FTLS Notes', person.notes),
    show('FTLS Bio', person.bio),
    show('FTLS Stories / Memories', person.stories),
    'MFT edit location: Person > Notes, or the note attached to the correct event/fact when the note belongs to a specific event.',
    '',
    '--- Family-link reconciliation IDs ---',
    show('Spouse-family refs (FAMS)', fams),
    show('Parent-family refs (FAMC)', famc),
    show('Primary Family ID', person.primaryFamId),
    'MFT edit location: Relationships/families. These IDs are mainly for FTLS/admin reconciliation; do not change them unless you know the GEDCOM structure.',
    '',
    '--- Technical passthrough ---',
    show('Extra GEDCOM preserved line count', extraLines ? String(extraLines) : '0'),
    'Technical note: OBJE, RESI, CHAN, _CRE, and other MFT-specific lines may be preserved separately by FTLS.',
    FTLS_RECON_NOTE_END
  ].join('\n');
}


function buildFtlsFamilyReconciliationSnapshot(fam, personMap = {}) {
  const hid = fam.husband_id || fam.husb || '';
  const wid = fam.wife_id || fam.wife || '';
  const kids = fam.children || [];
  const nameFor = (id) => id && personMap && personMap[id] ? (personMap[id].dn || personMap[id].fn || id) : '';
  const line = (label, value) => `${label}: ${escapeFtlsSnapshotValue(value)}`;
  const show = (label, value) => `${label}: ${escapeFtlsSnapshotValue(humanFtlsValue(value))}`;
  return [
    FTLS_FAM_RECON_NOTE_PREFIX,
    'Purpose: This note was created by FTLS so MacFamilyTree admins can see what FTLS has stored for this family/marriage record.',
    'How to use: If a marriage date or place is wrong, update the actual MacFamilyTree family/marriage fact when possible, not only this note.',
    'FTLS import behavior: FTLS recognizes this worksheet and uses it only as fallback structured data for family/marriage reconciliation.',
    line('Generated By', `FTLS ${typeof APP_VERSION !== 'undefined' ? APP_VERSION : ''}`.trim()),
    line('Generated At', new Date().toISOString()),
    '',
    '--- Family identity ---',
    show('FTLS Family ID', fam.id),
    show('Husband ID', hid),
    show('Husband Name', nameFor(hid)),
    show('Wife ID', wid),
    show('Wife Name', nameFor(wid)),
    show('Children IDs', kids),
    '',
    '--- Marriage facts ---',
    show('Marriage Date', fam.marriage_date || fam.mdate || ''),
    show('Marriage Place', fam.marriage_place || fam.mplace || ''),
    'MFT edit location: Family/Couple > Marriage event/fact. MFT exports this as FAM > MARR > DATE/PLAC.',
    '',
    '--- Divorce facts ---',
    show('Divorced Flag', fam.divorced === true ? 'true' : ''),
    show('Divorce Date', fam.divorce_date || fam.divdate || ''),
    'MFT edit location: Family/Couple > Divorce event/fact.',
    FTLS_FAM_RECON_NOTE_END
  ].join('\n');
}

function addStandaloneFamilyReconciliationNote(famLines, standaloneNotes, fam, personMap = {}) {
  if (!fam || !fam.id) return;
  const noteId = `@N_FTLS_FAM_${String(fam.id).replace(/@/g, '')}_1@`;
  famLines.push(`1 NOTE ${noteId}`);
  const noteLines = [`0 ${noteId} NOTE`];
  buildFtlsFamilyReconciliationSnapshot(fam, personMap).split('\n').forEach(line => noteLines.push(`1 CONT ${line}`));
  standaloneNotes.push(...noteLines);
}

function buildFamilyMarriageLines(fam) {
  const mdate = fam.marriage_date || fam.mdate || '';
  const mplace = fam.marriage_place || fam.mplace || '';
  if (!mdate && !mplace) return [];
  const lines = ['1 MARR'];
  if (mdate) lines.push(`2 DATE ${mdate}`);
  if (mplace) lines.push(`2 PLAC ${mplace}`);
  return lines;
}

function buildFamilyDivorceLines(fam) {
  const ddate = fam.divorce_date || fam.divdate || '';
  const divorced = !!fam.divorced || !!ddate;
  if (!divorced) return [];
  const lines = ['1 DIV Y'];
  if (ddate) lines.push(`2 DATE ${ddate}`);
  return lines;
}

function insertFamilyFactLinesBeforeChildren(lines, factLines) {
  if (!factLines || factLines.length === 0) return lines;
  const out = lines.slice();
  let insertAt = out.findIndex(l => /^1\s+CHIL\s/.test(l));
  if (insertAt < 0) insertAt = out.length;
  out.splice(insertAt, 0, ...factLines);
  return out;
}

function appendOrReplaceFamilyFactBlocks(lines, fam) {
  const replacements = {
    MARR: buildFamilyMarriageLines(fam),
    DIV: buildFamilyDivorceLines(fam),
  };
  const inserted = { MARR: false, DIV: false };
  const out = [];

  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    const m = line.match(/^1\s+(MARR|DIV)(?:\s|$)/);
    if (m) {
      // Always consume existing MARR/DIV blocks. If replacements[m[1]] is empty
      // (for example, FTLS has un-divorced this family), the old external block
      // is deliberately dropped instead of being preserved as stale data.
      if (!inserted[m[1]] && replacements[m[1]].length > 0) {
        out.push(...replacements[m[1]]);
      }
      inserted[m[1]] = true;
      i++;
      while (i < lines.length && !/^1\s+/.test(lines[i])) i++;
      i--;
      continue;
    }
    out.push(line);
  }

  let finalLines = out;
  if (!inserted.MARR) finalLines = insertFamilyFactLinesBeforeChildren(finalLines, replacements.MARR);
  if (!inserted.DIV) finalLines = insertFamilyFactLinesBeforeChildren(finalLines, replacements.DIV);
  return finalLines;
}

// Backward-compatible name for older callsites; now handles MARR and DIV.
function appendOrReplaceFamilyMarriageBlock(lines, fam) {
  return appendOrReplaceFamilyFactBlocks(lines, fam);
}

/* ───── MACFAMILYTREE NATIVE STORY (_STO/_STS) HELPERS ─────
   FTLS Stories and MacFamilyTree native stories must stay separate to avoid
   duplicate/drift loops:
     - person.stories remains FTLS-owned and exports as a STORY: NOTE.
     - MFT _STO records remain MFT-owned and export back as _STO.
   The edit form can edit _STO records directly, and can intentionally MOVE
   FTLS story text into the first MFT story entry, clearing person.stories.
*/
function safeGedcomIdFragment(value) {
  return String(value || 'UNKNOWN').replace(/@/g, '').replace(/[^A-Za-z0-9_\-]/g, '_') || 'UNKNOWN';
}

function extractMftStoryRefs(person) {
  const refs = new Set();
  const raw = String(person?._xg || '');
  const re = /^1\s+_STO\s+(@[^@]+@)\s*$/gm;
  let m;
  while ((m = re.exec(raw)) !== null) refs.add(m[1]);
  return [...refs];
}

function appendMftStoryRefToExtraGedcom(extra, storyId) {
  const refLine = `1 _STO ${storyId}`;
  const raw = String(extra || '').trim();
  if (raw.split('\n').some(line => line.trim() === refLine)) return raw;
  return raw ? `${raw}\n${refLine}` : refLine;
}

function parseMftStoryRecord(raw, fallbackId = '') {
  const text = String(raw || '').replace(/\r\n/g, '\n').replace(/\r/g, '\n');
  const lines = text.split('\n').filter(l => l.trim());
  const top = lines[0]?.match(/^0\s+(@[^@]+@)\s+_STO(?:\s|$)/);
  const record = { id: top ? top[1] : fallbackId, record_type: '_STO', entries: [], raw_gedcom: text };
  let cur = null;
  let curTextField = null;
  for (const line of lines.slice(1)) {
    const entry = line.match(/^1\s+(@[^@]+@)?\s*_STS(?:\s|$)/);
    if (entry) {
      cur = { entryId: entry[1] || `@STS_${safeGedcomIdFragment(record.id)}_${record.entries.length + 1}@`, title: '', text: '' };
      record.entries.push(cur);
      curTextField = null;
      continue;
    }
    if (!cur) continue;
    const titl = line.match(/^2\s+TITL(?:\s+(.*))?$/);
    if (titl) { cur.title = titl[1] || ''; curTextField = 'title'; continue; }
    const txt = line.match(/^2\s+TEXT(?:\s+(.*))?$/);
    if (txt) { cur.text = txt[1] || ''; curTextField = 'text'; continue; }
    const cont = line.match(/^3\s+(CONT|CONC)(?:\s+(.*))?$/);
    if (cont && curTextField) {
      const v = cont[2] || '';
      if (cont[1] === 'CONT') cur[curTextField] += '\n' + v;
      else cur[curTextField] += v;
    }
  }
  return record;
}

function pushGedcomMultiline(lines, level, tag, value) {
  const vals = String(value || '').replace(/\r\n/g, '\n').replace(/\r/g, '\n').split('\n');
  lines.push(`${level} ${tag}${vals[0] ? ' ' + vals[0] : ''}`);
  for (const v of vals.slice(1)) lines.push(`${level + 1} CONT ${v}`);
}

function buildMftStoryRecordRaw(record) {
  const id = record?.id || `@STO_FTLS_${Date.now()}@`;
  const entries = (record?.entries || []).length ? record.entries : [{ entryId:`@STS_${safeGedcomIdFragment(id)}_1@`, title:'Story', text:'' }];
  const lines = [`0 ${id} _STO`];
  entries.forEach((entry, idx) => {
    const entryId = entry.entryId || `@STS_${safeGedcomIdFragment(id)}_${idx + 1}@`;
    lines.push(`1 ${entryId} _STS`);
    pushGedcomMultiline(lines, 2, 'TITL', entry.title || 'Story');
    pushGedcomMultiline(lines, 2, 'TEXT', entry.text || '');
  });
  return lines.join('\n');
}

function mergeGedcomMetaCache(existing, updates) {
  const map = new Map((existing || []).map(r => [r.id, r]));
  for (const r of (updates || [])) map.set(r.id, r);
  return [...map.values()];
}

async function loadMftStoryRecordsForPerson(person) {
  const refs = extractMftStoryRefs(person);
  if (refs.length === 0) return [];
  let records = [];
  const cached = Array.isArray(window.gedcomMetaRecords) ? window.gedcomMetaRecords : [];
  records = cached.filter(m => refs.includes(m.id) && m.record_type === '_STO');
  const missing = refs.filter(id => !records.some(r => r.id === id));
  if (missing.length > 0) {
    try {
      const fetched = await sbFetch('gedcom_meta?record_type=eq._STO&select=*');
      window.gedcomMetaRecords = mergeGedcomMetaCache(window.gedcomMetaRecords || [], fetched || []);
      records = (fetched || []).filter(m => refs.includes(m.id)).concat(records.filter(r => !fetched.some(f => f.id === r.id)));
    } catch(e) {
      console.warn('Could not load MFT story records:', e);
    }
  }
  return refs.map(id => records.find(r => r.id === id)).filter(Boolean)
    .map(r => parseMftStoryRecord(r.raw_gedcom || '', r.id));
}

function createEmptyMftStoryRecordForPerson(person) {
  const storyId = `@STO_FTLS_${safeGedcomIdFragment(person?.id)}_${Date.now()}@`;
  const entryId = `@STS_FTLS_${safeGedcomIdFragment(person?.id)}_${Date.now()}@`;
  return {
    id: storyId,
    record_type: '_STO',
    entries: [{ entryId, title: 'FTLS Story', text: '' }],
    raw_gedcom: ''
  };
}

function appendTextToFirstMftStoryRecord(records, text) {
  const clean = String(text || '').trim();
  if (!clean) return records;
  const out = (records || []).map(r => ({ ...r, entries: (r.entries || []).map(e => ({...e})) }));
  if (out.length === 0) return out;
  if (!out[0].entries.length) out[0].entries.push({ entryId:`@STS_${safeGedcomIdFragment(out[0].id)}_1@`, title:'FTLS Story', text:'' });
  const first = out[0].entries[0];
  const existing = String(first.text || '').trim();
  const label = '[Moved from FTLS Stories]';
  if (existing.toLowerCase().includes(clean.toLowerCase())) return out;
  first.text = existing ? `${existing}\n\n${label}\n${clean}` : `${label}\n${clean}`;
  if (!first.title) first.title = 'FTLS Story';
  return out;
}

async function saveMftStoryRecords(records) {
  const rows = [];
  for (const r of (records || [])) {
    if (!r?.id) continue;
    const raw = buildMftStoryRecordRaw(r);
    rows.push({ id: r.id, record_type: '_STO', raw_gedcom: raw });
  }
  if (!rows.length) return;
  await sbFetch('gedcom_meta?on_conflict=id', {
    method: 'POST',
    headers: { 'Prefer': 'return=minimal,resolution=merge-duplicates' },
    body: JSON.stringify(rows)
  });
  window.gedcomMetaRecords = mergeGedcomMetaCache(window.gedcomMetaRecords || [], rows);
}

function stripInternalEditFields(person) {
  const out = { ...(person || {}) };
  delete out._mftStoryRecords;
  delete out._mftStoryDirty;
  return out;
}

/* ───── SHARED: Convert person object → GEDCOM INDI lines ───── */
// Used by full export, diff export, and merged export.
// Returns { indi: string[], standalone: string[] }
//   indi: GEDCOM lines for the INDI record (without FAMS/FAMC — caller adds those)
//   standalone: top-level NOTE records referenced by the INDI (MacFamilyTree format)
// Cardinal features (OBJE, RESI, CHAN, _CRE, etc.) come via person._xg.
function personToGedcomLines(person, context = {}) {
  const L = [`0 ${person.id} INDI`];
  const standalone = []; // standalone NOTE records to emit at top level

  // Primary NAME — match MacFamilyTree format:
  //   1 NAME {bo}. {fn} {mn} /{ln}/
  //   2 GIVN {bo}. {fn}
  //   2 SURN {ln}
  //   2 SECG {mn}
  // CRITICAL: GEDCOM 5.5.1 requires NAME values to contain surname slashes
  // (either /Surname/ or empty //). A NAME like "2. Henry" with no slashes is
  // non-conformant and MFT responds by minting a duplicate INDI under a fresh
  // xref, breaking round-trip identity. We always emit slashes — empty // when
  // there is no surname — so MFT can parse the line and recognize the xref.
  const fn = person.fn || '', mn = person.mn || '', ln = person.ln || '';
  const sx = person.sx || getNameSuffixFromNotes(person.notes);
  const bo = person.bo || 0;
  const givnPrefix = bo > 0 ? `${bo}. ` : '';
  const givn = givnPrefix + fn;
  const fullGivn = (givn + (mn ? ' ' + mn : '')).trim();
  // Always emit slashes (// when ln is empty) so the line is GEDCOM-conformant.
  const baseStr = fullGivn || person.dn || '(Unknown)';
  const nameStr = ln ? `${fullGivn} /${ln}/` : `${baseStr} //`;
  L.push(`1 NAME ${nameStr}`);
  if (fn || givnPrefix) L.push(`2 GIVN ${givn.trim()}`);
  if (ln) L.push(`2 SURN ${ln}`);
  if (mn) L.push(`2 SECG ${mn}`);
  // Title prefix (Dr., Rev., etc.)
  if (person.tp) L.push(`2 NPFX ${person.tp}`);
  if (sx) L.push(`2 NSFX ${sx}`);

  // Nickname
  if (person.nk) { L.push(`1 NAME ${person.nk} //`); L.push(`2 TYPE nick`); L.push(`2 GIVN ${person.nk}`); }
  // Maiden name — MacFamilyTree uses TYPE maiden (not TYPE birth)
  if (person.md) { L.push(`1 NAME ${person.md} //`); L.push(`2 TYPE maiden`); }
  // SEX
  if (person.g) L.push(`1 SEX ${person.g}`);
  // BIRT
  if (person.dob || person.loc) { L.push('1 BIRT'); if (person.dob) L.push(`2 DATE ${person.dob}`); if (person.loc) L.push(`2 PLAC ${person.loc}`); }
  // DEAT
  if (person.dod || person.dec) { L.push('1 DEAT'); if (person.dod) L.push(`2 DATE ${person.dod}`); }
  // BURI — FTLS manages burial_date as a first-class field. If present,
  // emit it here and strip any old preserved BURI block to avoid duplicates.
  if (person.burd) {
    L.push('1 BURI');
    L.push(`2 DATE ${person.burd}`);
    if (person._xg && hasGedcomLevel1Block(person._xg, 'BURI')) person._xg = stripGedcomLevel1Block(person._xg, 'BURI');
  }
  // Contact
  if (person.ph) L.push(`1 PHON ${person.ph}`);
  if (person.em) L.push(`1 EMAI ${person.em}`);
  // Address — if FTLS has address data, strip RESI/ADDR from _xg to avoid duplication (#11)
  // FTLS address takes priority over _xg RESI
  if (person.a1 || person.ci || person.st || person.co) {
    L.push(`1 ADDR ${person.a1 || ''}`);
    if (person.a2) L.push(`2 ADR2 ${person.a2}`);
    if (person.ci) L.push(`2 CITY ${person.ci}`);
    if (person.st) L.push(`2 STAE ${person.st}`);
    if (person.zp) L.push(`2 POST ${person.zp}`);
    if (person.co) L.push(`2 CTRY ${person.co}`);
    // Strip RESI/ADDR blocks from _xg so they don't duplicate
    if (person._xg && (/^1 (RESI|ADDR)/m).test(person._xg)) {
      const xgLines = person._xg.split('\n');
      const cleaned = [];
      let skipping = false;
      for (const xl of xgLines) {
        const lvl = xl.match(/^(\d+)\s/);
        if (lvl && lvl[1] === '1') {
          skipping = /^1 (RESI|ADDR)/.test(xl);
        }
        if (!skipping) cleaned.push(xl);
      }
      person._xg = cleaned.join('\n');
    }
  } else if (person._xg && (/^1 (RESI|ADDR)/m).test(person._xg)) {
    // No FTLS address — let _xg RESI/ADDR pass through
  }
  // Occupation
  if (person.prof) L.push(`1 OCCU ${person.prof}`);
  // Website
  if (person.ws) L.push(`1 WWW ${person.ws}`);

  // Helper: create a standalone NOTE record and add pointer to INDI
  // MacFamilyTree uses standalone NOTE records (0-level) referenced by pointer
  let noteCounter = 0;
  const safePersonId = (person.id || 'UNKNOWN').replace(/@/g, '').replace(/[^A-Za-z0-9_\-]/g, '_');
  const addStandaloneNote = (text, kind = 'N') => {
    noteCounter++;
    const prefix = kind === 'FTLS' ? 'FTLSN' : 'N';
    const noteId = `@${prefix}_${safePersonId}_${noteCounter}@`;
    L.push(`1 NOTE ${noteId}`);
    const noteLines = [`0 ${noteId} NOTE`];
    text.split('\n').forEach(line => noteLines.push(`1 CONT ${line}`));
    standalone.push(...noteLines);
  };

  // Person's own notes — detect if it's a pointer to existing NOTE record or actual text
  if (person.notes) {
    if (/^@[^@]+@$/.test(person.notes.trim())) {
      // It's a pointer to an existing standalone NOTE record in gedcom_meta
      L.push(`1 NOTE ${person.notes.trim()}`);
    } else {
      // Dedupe on export — guarantees FTLS never originates duplicated notes
      // in its GEDCOMs, regardless of how dirty the in-memory value is.
      // Belt-and-suspenders with the on-write dedup; if MFT later re-emits
      // the same text duplicated, the import side will catch it again.
      addStandaloneNote(dedupeNoteTextLines(person.notes));
    }
  }
  // Bio as standalone note
  if (person.bio) addStandaloneNote('BIO: ' + dedupeNoteTextLines(person.bio));
