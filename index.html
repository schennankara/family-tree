  // Stories as standalone note
  if (person.stories) addStandaloneNote('STORY: ' + dedupeNoteTextLines(person.stories));

  // Custom tags — for FTLS re-import (machine-readable)
  if (person.fb) L.push(`1 _FACEBOOK ${person.fb}`);
  if (person.ig) L.push(`1 _INSTAGRAM ${person.ig}`);
  if (person.li) L.push(`1 _LINKEDIN ${person.li}`);
  if (person.pp) L.push(`1 _PHOTO ${person.pp}`);
  if (person.emp) L.push(`1 _EMPLOYER ${person.emp}`);
  if (person.pgl) L.push(`1 _PHOTOGALLERY ${person.pgl}`);
  if (person.dl) L.push(`1 _DOCUMENTS ${person.dl}`);

  // Encapsulated FTLS Profile NOTE — human-readable for MacFamilyTree users
  // Contains the same data as custom tags above (no drift)
  const ftlsLines = [];
  if (person.fb) ftlsLines.push(`Facebook: ${person.fb}`);
  if (person.ig) ftlsLines.push(`Instagram: ${person.ig}`);
  if (person.li) ftlsLines.push(`LinkedIn: ${person.li}`);
  if (person.ws) ftlsLines.push(`Website: ${person.ws}`);
  if (person.emp) ftlsLines.push(`Employer: ${person.emp}`);
  if (person.pp) ftlsLines.push(`Profile Photo: ${person.pp}`);
  if (person.pgl) ftlsLines.push(`Photo Gallery: ${person.pgl}`);
  if (person.dl) ftlsLines.push(`Documents: ${person.dl}`);
  if (ftlsLines.length > 0) {
    addStandaloneNote(FTLS_PROFILE_NOTE_PREFIX + '\n' + ftlsLines.join('\n'), 'FTLS');
  }

  // Machine-readable reconciliation snapshot. This intentionally includes even
  // blank FTLS-managed fields so a later import can distinguish "empty in FTLS"
  // from "not exported by FTLS" during two-way reconciliation.
  addStandaloneNote(buildFtlsReconciliationSnapshot(person, context), 'FTLS');

  return { indi: L, standalone };
}

/* ───── GEDCOM 5.5.1 EXPORTER ───── */
function exportTreeToGedcom(tree, personMap, familyMap) {
  const lines = [];
  const indis = [];
  const fams = [];
  const standaloneNotes = []; // standalone NOTE records generated by personToGedcomLines
  const exportedPersons = new Set();
  const exportedFamilies = new Set();

  // Build reverse lookup: person → families they are a child in (FAMC)
  const famcLookup = {}; // personId → [familyId]
  const famsLookup = {}; // personId → [familyId]
  for (const [fid, fam] of Object.entries(familyMap || {})) {
    (fam.children || []).forEach(cid => {
      if (!famcLookup[cid]) famcLookup[cid] = [];
      famcLookup[cid].push(fid);
    });
    if (fam.husband_id) {
      if (!famsLookup[fam.husband_id]) famsLookup[fam.husband_id] = [];
      famsLookup[fam.husband_id].push(fid);
    }
    if (fam.wife_id) {
      if (!famsLookup[fam.wife_id]) famsLookup[fam.wife_id] = [];
      famsLookup[fam.wife_id].push(fid);
    }
  }

  function gedcomDate() {
    const d = new Date();
    const months = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
    return `${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()}`;
  }
  function gedcomTime() {
    const d = new Date();
    return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}`;
  }

  function buildIndi(person) {
    if (exportedPersons.has(person.id)) return null;
    exportedPersons.add(person.id);
    const { indi: L, standalone } = personToGedcomLines(person, { fams: famsLookup[person.id] || [], famc: famcLookup[person.id] || [] });
    if (standalone.length > 0) standaloneNotes.push(...standalone);
    // Add FAMS/FAMC refs
    (famsLookup[person.id] || []).forEach(ref => L.push(`1 FAMS ${ref}`));
    (famcLookup[person.id] || []).forEach(ref => L.push(`1 FAMC ${ref}`));
    // Preserved extra GEDCOM lines (OBJE, RESI, BURI, _CRE, CHAN, etc.)
    if (person._xg) { person._xg.split('\n').forEach(xl => { if (xl.trim()) L.push(xl); }); }
    else { L.push('1 CHAN'); L.push(`2 DATE ${gedcomDate()}`); L.push(`3 TIME ${gedcomTime()}`); }
    return L;
  }

  function buildFam(fam) {
    if (exportedFamilies.has(fam.id)) return null;
    exportedFamilies.add(fam.id);
    const L = [`0 ${fam.id} FAM`];
    if (fam.husband_id) L.push(`1 HUSB ${fam.husband_id}`);
    if (fam.wife_id) L.push(`1 WIFE ${fam.wife_id}`);
    buildFamilyMarriageLines(fam).forEach(line => L.push(line));
    buildFamilyDivorceLines(fam).forEach(line => L.push(line));
    (fam.children || []).forEach(cid => L.push(`1 CHIL ${cid}`));
    // Preserved extra GEDCOM lines for family. MARR/DIV are FTLS-managed now,
    // so strip stale preserved copies before appending passthrough data.
    const xg = stripGedcomLevel1Block(fam._extra_gedcom || '', ['MARR', 'DIV']);
    if (xg) { xg.split('\n').forEach(xl => { if (xl.trim()) L.push(xl); }); }
    addStandaloneFamilyReconciliationNote(L, standaloneNotes, fam, personMap || {});
    return L;
  }

  // Strategy: use familyMap if available (from Supabase), fall back to tree walk
  if (familyMap && Object.keys(familyMap).length > 0 && personMap && Object.keys(personMap).length > 0) {
    // Export ALL persons from personMap (includes unconnected persons)
    for (const [pid, person] of Object.entries(personMap)) {
      const indi = buildIndi(person);
      if (indi) indis.push(indi);
    }
    // Export ALL families using original IDs
    for (const [fid, fam] of Object.entries(familyMap)) {
      const famLines = buildFam(fam);
      if (famLines) fams.push(famLines);
    }
    console.log(`GEDCOM export: ${exportedPersons.size} persons, ${exportedFamilies.size} families from personMap/familyMap`);
  } else {
    // Fallback: walk the tree (for GEDCOM-imported data without maps)
    let fallbackFamCounter = 0;
    function processNode(node, parentFamId) {
      const nodeRefs = [];
      const children = node.ch || [];
      const spouse = node.sp;
      if (spouse || children.length > 0) {
        fallbackFamCounter++;
        const famId = `@F${fallbackFamCounter}@`;
        nodeRefs.push(famId);
        const husbId = node.g === 'M' ? node.id : (spouse ? spouse.id : '');
        const wifeId = node.g === 'F' ? node.id : (spouse ? spouse.id : '');
        const childIds = children.map(c => c.id);
        fams.push([`0 ${famId} FAM`,
          husbId ? `1 HUSB ${husbId}` : null,
          wifeId ? `1 WIFE ${wifeId}` : null,
          ...(node.mdate ? ['1 MARR', `2 DATE ${node.mdate}`] : []),
          ...(node.mplace && !node.mdate ? ['1 MARR'] : []),
          ...(node.mplace ? [`2 PLAC ${node.mplace}`] : []),
          ...childIds.map(cid => `1 CHIL ${cid}`)
        ].filter(Boolean));
        if (spouse && spouse.id && !exportedPersons.has(spouse.id)) {
          exportedPersons.add(spouse.id);
          const { indi: spIndi, standalone: spSt } = personToGedcomLines(spouse, { fams: [famId], famc: [] });
          if (spSt.length > 0) standaloneNotes.push(...spSt);
          spIndi.push(`1 FAMS ${famId}`);
          if (spouse._xg) { spouse._xg.split('\n').forEach(xl => { if (xl.trim()) spIndi.push(xl); }); }
          indis.push(spIndi);
        }
        children.forEach(child => processNode(child, famId));
      }
      if (!exportedPersons.has(node.id)) {
        exportedPersons.add(node.id);
        const { indi: nIndi, standalone: nSt } = personToGedcomLines(node, { fams: nodeRefs, famc: parentFamId ? [parentFamId] : [] });
        if (nSt.length > 0) standaloneNotes.push(...nSt);
        nodeRefs.forEach(ref => nIndi.push(`1 FAMS ${ref}`));
        if (parentFamId) nIndi.push(`1 FAMC ${parentFamId}`);
        if (node._xg) { node._xg.split('\n').forEach(xl => { if (xl.trim()) nIndi.push(xl); }); }
        indis.push(nIndi);
      }
    }
    processNode(tree, null);
    console.log(`GEDCOM export (tree fallback): ${exportedPersons.size} persons, ${fams.length} families`);
  }

  // Assemble
  lines.push('0 HEAD');
  lines.push('1 SOUR FTLS');
  lines.push('2 NAME Chennamkara Family Tree Living Site');
  lines.push('2 VERS 0.3');
  lines.push('1 CHAR UTF-8');
  lines.push('1 GEDC');
  lines.push('2 VERS 5.5.1');
  lines.push('2 FORM LINEAGE-LINKED');
  lines.push('1 SUBM @SUBM1@');
  lines.push('0 @SUBM1@ SUBM');
  lines.push('1 NAME FTLS Export');

  indis.forEach(indi => lines.push(...indi));
  fams.forEach(fam => lines.push(...fam));
  if (standaloneNotes.length > 0) lines.push(...standaloneNotes);
  lines.push('0 TRLR');

  return lines.join('\n') + '\n';
}

async function downloadGedcom(tree, personMap, familyMap) {
  // Load gedcom_meta records for lossless MacFamilyTree round-trip export
  // Person-specific (OBJE, _STO, NOTE, SOUR): only if referenced by a person's _xg
  // App config (_STE, _STF, _PTF, _PTE, LABL, REPO): always included
  // Uses module-level PERSON_SPECIFIC_META const defined near the top of file.
  let metaLines = [];
  try {
    const meta = await sbFetch('gedcom_meta?select=*');
    if (meta && meta.length > 0) {
      // Collect all @pointer@ references from persons' _xg fields AND notes field
      const referencedIds = new Set();
      for (const p of Object.values(personMap)) {
        if (p._xg) {
          const refs = p._xg.match(/@[^@]+@/g);
          if (refs) refs.forEach(r => referencedIds.add(r));
        }
        // Notes field may contain a pointer to a standalone NOTE record
        if (p.notes && /^@[^@]+@$/.test(p.notes.trim())) {
          referencedIds.add(p.notes.trim());
        }
      }
      for (const m of meta) {
        if (PERSON_SPECIFIC_META.has(m.record_type) && !referencedIds.has(m.id)) continue;
        metaLines.push(m.raw_gedcom);
      }
    }
  } catch(e) { console.warn('Could not load gedcom_meta:', e); }

  let content = exportTreeToGedcom(tree, personMap, familyMap);
  // Insert meta records before TRLR
  if (metaLines.length > 0) {
    content = content.replace('0 TRLR', metaLines.join('\n') + '\n0 TRLR');
  }
  const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'Chennamkara_Family_Tree_Export.ged';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* ───── GEDCOM DIFF & MERGE ENGINE ───── */

const PERSON_DIFF_FIELDS = [
  ['fn','First Name'],['mn','Middle Name'],['ln','Last Name'],['dn','Display Name'],
  ['nk','Nickname'],['md','Maiden Name'],['tp','Title Prefix'],['sx','Name Suffix'],['g','Gender'],['bo','Birth Order'],
  ['dob','Birth Date'],['dod','Death Date'],['burd','Burial Date'],['loc','Birth Place'],
  ['prof','Occupation'],['emp','Employer'],['ph','Phone'],['em','Email'],
  ['a1','Address'],['a2','Address 2'],['ci','City'],['st','State'],['co','Country'],['zp','Zip'],
  ['fb','Facebook'],['ig','Instagram'],['li','LinkedIn'],['ws','Website'],
  ['pp','Profile Photo'],['notes','Notes'],['bio','Bio'],['stories','Stories'],
  ['pgl','Photo Gallery'],['dl','Documents'],['_xg','Extra GEDCOM']
];

// Normal Changed tab comparison. Keep _xg out of the ordinary field diff
// because preserved MFT passthrough blocks (OBJE/CHAN/_CRE/RESI/etc.) are noisy,
// but include every FTLS-managed human field. This catches cases where the
// person identity changed only in display_name or birth-order prefix, e.g.
// FTLS "Aabraham Avarachan Mathai" vs MFT "Kochu Avarachan".
const PERSON_VISIBLE_DIFF_FIELDS = PERSON_DIFF_FIELDS.filter(([key]) => key !== '_xg');

function diffPersonFields(left, right, fields=PERSON_DIFF_FIELDS) {
  const diffs = [];
  const isMeaningfulBirthOrder = (v) => {
    if (v === null || v === undefined) return false;
    const s = String(v).trim();
    if (!s || s === '0') return false;
    const n = parseInt(s, 10);
    return Number.isFinite(n) && n > 0;
  };
  const normalizeForDiff = (key, value) => {
    if (key === 'bo') {
      // Birth order is a parser/UI helper, not a GEDCOM fact. Most external
      // files have no order prefix, so parseIndi() yields 0. Treat 0/blank as
      // "not supplied" and only surface a diff when the external GEDCOM has a
      // positive birth-order value that actually conflicts or fills a blank.
      if (!isMeaningfulBirthOrder(value)) return '';
      return String(parseInt(String(value).trim(), 10));
    }
    if (key === 'notes') {
      // Name suffix is preserved in notes only because FTLS has no DB column for it.
      // Compare it via the dedicated sx field instead, so one NSFX import does not
      // also create a duplicate Notes diff. Also normalize duplicate note lines
      // caused by round-tripping the same MFT event note both as person NOTE and
      // as event-level NOTE (e.g. repeated Death note lines).
      return dedupeNoteTextLines((value ?? '').toString()
        .replace(/(^|\n)\s*(?:Name\s+suffix|Suffix)\s*:[^\n]*/ig, '$1'))
        .trim();
    }
    if (typeof value === 'boolean') return String(value);
    return (value ?? '').toString().trim();
  };
  for (const [key, label] of fields) {
    const leftVal = left?.[key];
    const rightVal = right?.[key];
    const leftNorm = normalizeForDiff(key, leftVal);
    const rightNorm = normalizeForDiff(key, rightVal);

    // For birth order specifically, an empty/0 external value means "MFT did
    // not provide this," not "clear FTLS birth_order." Do not create noise for
    // FTLS 1/2/3/etc. versus external 0/blank. If external has a positive
    // order and FTLS is blank or different, show it.
    if (key === 'bo' && !rightNorm) continue;

    if (leftNorm !== rightNorm && (leftNorm || rightNorm)) {
      diffs.push({ key, label, ftls: leftNorm, ext: rightNorm });
    }
  }
  return diffs;
}

// Compare fields between two person objects, return changed fields.
// Use the app's existing parsed person objects; do not re-parse GEDCOM here.
function diffPerson(ftls, ext) {
  return diffPersonFields(ftls, ext, PERSON_VISIBLE_DIFF_FIELDS);
}

function normalizeNameText(value) {
  return (value || '')
    .toLowerCase()
    .replace(/\([^)]*\)/g, ' ')
    .replace(/\bhouse\b/g, ' ')
    .replace(/[^a-z\s]/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
}

function normalizeNameToken(token) {
  return (token || '')
    .toLowerCase()
    .replace(/[^a-z]/g, '')
    .replace(/ny$/g, 'ni')
    .trim();
}

const LOW_SIGNAL_NAME_TOKENS = new Set([
  'ammachi', 'appachan', 'achan', 'amma', 'appa', 'house'
]);

function isOneEditAway(a, b) {
  if (!a || !b) return false;
  if (Math.abs(a.length - b.length) > 1) return false;
  if (a === b) return true;

  let i = 0, j = 0, edits = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) {
      i++;
      j++;
      continue;
    }
    edits++;
    if (edits > 1) return false;
    if (a.length > b.length) i++;
    else if (b.length > a.length) j++;
    else {
      i++;
      j++;
    }
  }
  if (i < a.length || j < b.length) edits++;
  return edits <= 1;
}

function nameTokensEquivalent(a, b) {
  if (!a || !b) return false;
  if (a === b) return true;
  if (a.length >= 4 && b.length >= 4 && (a.startsWith(b) || b.startsWith(a)) && Math.abs(a.length - b.length) <= 2) {
    return true;
  }
  return isOneEditAway(a, b);
}

function getNameSignals(person) {
  const raw = [person?.dn, person?.fn, person?.mn, person?.ln, person?.nk, person?.md]
    .filter(Boolean)
    .map(normalizeNameText)
    .filter(Boolean);
  const tokens = [...new Set(raw.flatMap(v => v.split(' ').map(normalizeNameToken).filter(Boolean)))];
  const coreTokens = tokens.filter(t => !LOW_SIGNAL_NAME_TOKENS.has(t));
  return {
    allKey: tokens.join(''),
    coreKey: coreTokens.join(''),
    tokens,
    coreTokens,
    fn: normalizeNameToken(person?.fn || ''),
    ln: normalizeNameToken(person?.ln || '')
  };
}

function countEquivalentTokens(aTokens, bTokens) {
  if (!aTokens.length || !bTokens.length) return 0;
  const used = new Set();
  let count = 0;
  for (const a of aTokens) {
    const idx = bTokens.findIndex((b, i) => !used.has(i) && nameTokensEquivalent(a, b));
    if (idx >= 0) {
      used.add(idx);
      count++;
    }
  }
  return count;
}

function namesEquivalent(aPerson, bPerson) {
  const a = getNameSignals(aPerson);
  const b = getNameSignals(bPerson);
  if (a.allKey && b.allKey && nameTokensEquivalent(a.allKey, b.allKey)) return true;
  if (a.coreKey && b.coreKey && nameTokensEquivalent(a.coreKey, b.coreKey)) return true;
  const sharedCore = countEquivalentTokens(a.coreTokens, b.coreTokens);
  if (sharedCore >= 2) return true;
  if (sharedCore === 1 && a.coreTokens.length === 1 && b.coreTokens.length === 1) return true;
  return false;
}

function hasStrongDuplicateNameEvidence(aPerson, bPerson) {
  const a = getNameSignals(aPerson);
  const b = getNameSignals(bPerson);
  // For duplicate detection, count only EXACT token matches — no fuzzy/edit-distance.
  // This prevents ron≈mon from counting as a shared token alongside george=george.
  const countExactSharedTokens = (aToks, bToks) => {
    if (!aToks.length || !bToks.length) return 0;
    const used = new Set();
    let count = 0;
    for (const at of aToks) {
      const idx = bToks.findIndex((bt, i) => !used.has(i) && at === bt);
      if (idx >= 0) { used.add(idx); count++; }
    }
    return count;
  };
  const sharedCore = countExactSharedTokens(a.coreTokens, b.coreTokens);
  const duplicateTokenEquivalent = (left, right) => {
    if (!left || !right) return false;
    if (left === right) return true;
    // For duplicate buckets, only allow near-matches on longer names.
    if (Math.min(left.length, right.length) < 5) return false;
    return isOneEditAway(left, right);
  };

  if (a.allKey && b.allKey && a.allKey === b.allKey) return true;
  if (a.coreKey && b.coreKey && a.coreKey === b.coreKey) return true;
  if (sharedCore >= 2) return true;

  // Single-token names need to be much stricter so we don't match short names like Ron/Mon.
  if (sharedCore === 1 && a.coreTokens.length === 1 && b.coreTokens.length === 1) {
    const aTok = a.coreTokens[0] || '';
    const bTok = b.coreTokens[0] || '';
    if (aTok === bTok) return true;
    if (duplicateTokenEquivalent(aTok, bTok)) return true;
    return false;
  }

  const fnMatch = a.fn && b.fn && duplicateTokenEquivalent(a.fn, b.fn);
  const lnMatch = a.ln && b.ln && duplicateTokenEquivalent(a.ln, b.ln);
  if (fnMatch && lnMatch) return true;

  return false;
}

function isStrongDuplicatePersonMatch(aPerson, bPerson, score=0) {
  if (!aPerson || !bPerson) return false;
  if (!hasStrongDuplicateNameEvidence(aPerson, bPerson)) return false;
  if (aPerson.g && bPerson.g && aPerson.g !== bPerson.g) return false;
  if (aPerson.dob && bPerson.dob && aPerson.dob !== bPerson.dob) return false;

  const a = getNameSignals(aPerson);
  const b = getNameSignals(bPerson);
  // Same strict exact-only token count as hasStrongDuplicateNameEvidence
  const countExactSharedTokens = (aToks, bToks) => {
    if (!aToks.length || !bToks.length) return 0;
    const used = new Set();
    let count = 0;
    for (const at of aToks) {
      const idx = bToks.findIndex((bt, i) => !used.has(i) && at === bt);
      if (idx >= 0) { used.add(idx); count++; }
    }
    return count;
  };
  const sharedCore = countExactSharedTokens(a.coreTokens, b.coreTokens);
  const duplicateTokenEquivalent = (left, right) => {
    if (!left || !right) return false;
    if (left === right) return true;
    if (Math.min(left.length, right.length) < 5) return false;
    return isOneEditAway(left, right);
  };
  const fnMatch = a.fn && b.fn && duplicateTokenEquivalent(a.fn, b.fn);
  const lnMatch = a.ln && b.ln && duplicateTokenEquivalent(a.ln, b.ln);
  const dobMatch = !!(aPerson.dob && bPerson.dob && aPerson.dob === bPerson.dob);

  if (dobMatch) return true;
  if (sharedCore >= 2) return true;
  if (fnMatch && lnMatch) return true;
  if (score >= 70 && (sharedCore >= 1 || fnMatch)) return true;

  return false;
}

function isLikelyGedcomPersonId(id) {
  if (!id) return false;
  if (!/^@.*@$/.test(id)) return false;
  return !/^@I\d+@$/i.test(id);
}

// Fuzzy match: try name+gender+DOB when IDs don't match
function fuzzyMatchPerson(person, candidates) {
  const sig = getNameSignals(person);
  if (!sig.allKey && !sig.fn) return null;

  // Normalize DOB once — stored values may have trailing whitespace from
  // MFT; strict equality without trimming would miss valid matches.
  const pDob = normalizedValue(person.dob);

  let bestMatch = null, bestScore = 0;
  for (const c of candidates) {
    if (person.g && c.g && person.g !== c.g) continue;
    const cDob = normalizedValue(c.dob);
    if (pDob && cDob && pDob !== cDob) continue;
    let score = 0;
    const cSig = getNameSignals(c);
    
    if (sig.allKey && cSig.allKey) {
      if (sig.allKey === cSig.allKey) score += 50;
      else if (nameTokensEquivalent(sig.allKey, cSig.allKey)) score += 38;
    }
    if (sig.coreKey && cSig.coreKey) {
      if (sig.coreKey === cSig.coreKey) score += 35;
      else if (nameTokensEquivalent(sig.coreKey, cSig.coreKey)) score += 26;
    }

    const sharedCore = countEquivalentTokens(sig.coreTokens, cSig.coreTokens);
    if (sharedCore > 0) score += Math.min(24, sharedCore * 12);

    if (sig.fn && cSig.fn) {
      if (sig.fn === cSig.fn) score += 25;
      else if (nameTokensEquivalent(sig.fn, cSig.fn)) score += 18;
    }
    if (sig.ln && cSig.ln) {
      if (sig.ln === cSig.ln) score += 15;
      else if (nameTokensEquivalent(sig.ln, cSig.ln)) score += 10;
    }
    if (person.g && c.g && person.g === c.g) score += 5;
    if (pDob && cDob && pDob === cDob) score += 20;
    
    if (score > bestScore && score >= 30) {
      bestScore = score;
      bestMatch = { person: c, score };
    }
  }
  return bestMatch;
}

// Fuzzy match FAMILIES: match by spouse identity and child overlap.
// This needs to survive cross-system ID drift, partial spouse data, and
// newly-created child IDs that only match by fuzzy person identity.
function fuzzyMatchFamily(extFam, ftlsFamilies, extPeople, ftlsPersonMap, personFuzzyMap) {
  const normName = (person) => {
    const sig = getNameSignals(person);
    return sig.coreKey || sig.allKey;
  };

  // personFuzzyMap: { extPersonId: ftlsPersonId } from person fuzzy matches.
  // Resolve ext person ID to FTLS person ID (handles both exact match and fuzzy remap).
  const resolve = (eid) => {
    if (!eid) return null;
    if (ftlsPersonMap[eid]) return eid; // exact match
    return personFuzzyMap[eid] || null; // fuzzy remapped
  };

  const extPersonFor = (eid) => extPeople[eid] || null;
  const ftlsPersonFor = (fid) => ftlsPersonMap[fid] || null;
  const samePerson = (extId, ftlsId) => {
    if (!extId || !ftlsId) return false;
    if (resolve(extId) === ftlsId) return true;
    const extP = extPersonFor(extId);
    const ftlsP = ftlsPersonFor(ftlsId);
    if (!extP || !ftlsP) return false;
    const eName = normName(extP);
    const fName = normName(ftlsP);
    if (!eName || !fName || !namesEquivalent(extP, ftlsP)) return false;
    if (extP.g && ftlsP.g && extP.g !== ftlsP.g) return false;
    if (extP.dob && ftlsP.dob && extP.dob !== ftlsP.dob) return false;
    return true;
  };

  const countChildOverlap = (extKids, ftlsKids) => {
    if (!extKids.length || !ftlsKids.length) return 0;
    let overlap = 0;
    const used = new Set();
    for (const extKid of extKids) {
      for (const ftlsKid of ftlsKids) {
        if (used.has(ftlsKid)) continue;
        if (samePerson(extKid, ftlsKid)) {
          overlap++;
          used.add(ftlsKid);
          break;
        }
      }
    }
    return overlap;
  };

  const extH = resolve(extFam.husb);
  const extW = resolve(extFam.wife);
  const extKids = extFam.children || [];

  let bestMatch = null, bestScore = 0;
  for (const [fid, ftlsFam] of Object.entries(ftlsFamilies)) {
    const fH = ftlsFam.husband_id || ftlsFam.husb || null;
    const fW = ftlsFam.wife_id || ftlsFam.wife || null;
    const fKids = ftlsFam.children || [];

    let score = 0;
    let spouseMatches = 0;

    // Prefer same-role spouse matches, but tolerate husband/wife swaps when
    // external data is incomplete or roles differ between systems.
    if (samePerson(extFam.husb, fH)) { score += 45; spouseMatches++; }
    else if (samePerson(extFam.husb, fW)) { score += 32; spouseMatches++; }

    if (samePerson(extFam.wife, fW)) { score += 45; spouseMatches++; }
    else if (samePerson(extFam.wife, fH)) { score += 32; spouseMatches++; }

    // Give a small bonus when the remapped spouse IDs line up exactly.
    if (extH && fH && extH === fH) score += 5;
    if (extW && fW && extW === fW) score += 5;

    const overlap = countChildOverlap(extKids, fKids);
    const maxKids = Math.max(extKids.length, fKids.length);
    if (overlap > 0 && maxKids > 0) {
      score += Math.round(25 * overlap / maxKids);
    }

    // Accept:
    // - both spouses match, or
    // - one spouse plus a matching child, or
    // - a strong child-only overlap for single-parent/partial families
    const strongEnough =
      spouseMatches >= 2 ||
      (spouseMatches >= 1 && overlap >= 1) ||
      (spouseMatches === 0 && overlap >= 2);

    if (strongEnough && score > bestScore && score >= 45) {
      bestScore = score;
      bestMatch = { family: ftlsFam, id: fid, score };
    }
  }
  return bestMatch;
}

// Main diff function: compare external GEDCOM people/families against FTLS personMap/familyMap
function computeGedcomDiff(extPeople, extFamilies, ftlsPersonMap, ftlsFamilyMap) {
  const results = {
    matched: [],      // same ID, with field diffs
    fuzzyMatched: [],  // different ID but same person (by name)
    duplicateExactMatches: [], // external ID exists, but another FTLS row also looks like the same person
    extOnly: [],       // in external only — can merge into FTLS
    ftlsOnly: [],      // in FTLS only — can export for external
    familyDiffs: [],   // family structure differences
    fuzzyMatchedFamilies: [], // different family ID but same couple
    stats: {}
  };
  
  const ftlsMatched = new Set();
  const extMatched = new Set();
  
  // Helper: find which family a person is a child of
  function findParentFamily(personId, familyMap) {
    for (const [fid, fam] of Object.entries(familyMap)) {
      const kids = fam.children || [];
      if (kids.includes(personId)) {
        const hid = fam.husband_id || fam.husb || '';
        const wid = fam.wife_id || fam.wife || '';
        return { familyId: fid, husband: hid, wife: wid };
      }
    }
    return null;
  }

  function personRelationStatus(personId) {
    let isChild = false;
    let isSpouse = false;
    for (const fam of Object.values(ftlsFamilyMap)) {
      if ((fam.children || []).includes(personId)) isChild = true;
      if ((fam.husband_id || fam.husb || '') === personId) isSpouse = true;
      if ((fam.wife_id || fam.wife || '') === personId) isSpouse = true;
      if (isChild && isSpouse) break;
    }
    if (isChild && isSpouse) return 'child + spouse';
    if (isChild) return 'child';
    if (isSpouse) return 'spouse';
    return 'orphan';
  }

  // Helper: get a readable label for a parent family
  function parentLabel(pf, pMap) {
    if (!pf) return '(none)';
    const hName = pf.husband && pMap[pf.husband] ? (pMap[pf.husband].dn || pMap[pf.husband].fn || pf.husband) : '';
    const wName = pf.wife && pMap[pf.wife] ? (pMap[pf.wife].dn || pMap[pf.wife].fn || pf.wife) : '';
    return [hName, wName].filter(Boolean).join(' & ') || pf.familyId;
  }

  const personFuzzyMap = {};

  const resolveExtToFtls = (eid) => {
    if (!eid) return null;
    if (ftlsPersonMap[eid]) return eid;
    return personFuzzyMap[eid] || null;
  };

  const normPersonName = (person) => {
    const sig = getNameSignals(person);
    return sig.coreKey || sig.allKey;
  };

  const personsEquivalent = (ftlsId, extId) => {
    if (!ftlsId && !extId) return true;
    if (!ftlsId || !extId) return false;
    if (ftlsId === extId) return true;
    if (resolveExtToFtls(extId) === ftlsId) return true;
    const ftlsPerson = ftlsPersonMap[ftlsId];
    const extPerson = extPeople[extId] || (ftlsPersonMap[extId] || null);
    if (!ftlsPerson || !extPerson) return false;
    const fName = normPersonName(ftlsPerson);
    const eName = normPersonName(extPerson);
    if (!fName || !eName || !namesEquivalent(ftlsPerson, extPerson)) return false;
    if (ftlsPerson.g && extPerson.g && ftlsPerson.g !== extPerson.g) return false;
    // Normalized comparison — stored values may contain trailing whitespace
    // preserved from MFT, which must not defeat equality checks.
    const fDob = normalizedValue(ftlsPerson.dob);
    const eDob = normalizedValue(extPerson.dob);
    if (fDob && eDob && fDob !== eDob) return false;
    return true;
  };

  // Helper: are these two parent families actually the same couple (just with different IDs)?
  // Uses fuzzy person identity so parent-family diffs don't light up just because IDs drifted.
  function sameParentFamily(ftlsParent, extParent) {
    if (!ftlsParent && !extParent) return true;
    // If one side has no parent family, that's missing data — not a conflict.
    // A partial GEDCOM import won't include every ancestor's parent family
    // (e.g. importing Luca Joy under his mother Alexa won't necessarily include
    // Alexa's own parents). Treating that as "different parents" generates
    // false-alarm diffs in the Changed Fields tab. Real conflicts (both sides
    // specify a family AND they differ) are still caught below.
    if (!ftlsParent || !extParent) return true;
    if (ftlsParent.familyId === extParent.familyId) return true;
    const hMatch = personsEquivalent(ftlsParent.husband, extParent.husband);
    const wMatch = personsEquivalent(ftlsParent.wife, extParent.wife);
    return hMatch && wMatch;
  }

  // Pass 1: Exact ID match
  for (const [id, ext] of Object.entries(extPeople)) {
    if (ftlsPersonMap[id]) {
      const diffs = diffPerson(ftlsPersonMap[id], ext);
      // Compare parent family (FAMC) — checks ID AND spouse names (handles cross-system ID mismatches)
      const ftlsParent = findParentFamily(id, ftlsFamilyMap);
      const extParent = findParentFamily(id, extFamilies);
      if (!sameParentFamily(ftlsParent, extParent)) {
        const ftlsFamId = ftlsParent?.familyId || '';
        const extFamId = extParent?.familyId || '';
        diffs.push({
          key: '_famc', label: 'Parent Family',
          ftls: ftlsParent ? parentLabel(ftlsParent, ftlsPersonMap) + ' (' + ftlsFamId + ')' : '(none)',
          ext: extParent ? parentLabel(extParent, extPeople) + ' (' + extFamId + ')' : '(none)'
        });
      }
      results.matched.push({ id, ftls: ftlsPersonMap[id], ext, diffs });
      ftlsMatched.add(id);
      extMatched.add(id);
    }
  }
  
  // Pass 2: Fuzzy match unmatched external people
  const unmatchedFtls = Object.values(ftlsPersonMap).filter(p => !ftlsMatched.has(p.id));
  for (const [id, ext] of Object.entries(extPeople)) {
    if (extMatched.has(id)) continue;
    const match = fuzzyMatchPerson(ext, unmatchedFtls);
    if (match) {
      personFuzzyMap[id] = match.person.id;
      const diffs = diffPerson(match.person, ext);
      // Compare parent family (FAMC) for fuzzy matches too — name-aware comparison
      const ftlsParent = findParentFamily(match.person.id, ftlsFamilyMap);
      const extParent = findParentFamily(id, extFamilies);
      if (!sameParentFamily(ftlsParent, extParent)) {
        const ftlsFamId = ftlsParent?.familyId || '';
        const extFamId = extParent?.familyId || '';
        diffs.push({
          key: '_famc', label: 'Parent Family',
          ftls: ftlsParent ? parentLabel(ftlsParent, ftlsPersonMap) + ' (' + ftlsFamId + ')' : '(none)',
          ext: extParent ? parentLabel(extParent, extPeople) + ' (' + extFamId + ')' : '(none)'
        });
      }
      results.fuzzyMatched.push({ extId: id, ftlsId: match.person.id, ext, ftls: match.person, score: match.score, diffs });
      ftlsMatched.add(match.person.id);
      extMatched.add(id);
    }
  }
  
  // Pass 3: Unmatched remainders
  for (const [id, ext] of Object.entries(extPeople)) {
    if (!extMatched.has(id)) results.extOnly.push(ext);
  }
  for (const [id, ftls] of Object.entries(ftlsPersonMap)) {
    if (!ftlsMatched.has(id)) results.ftlsOnly.push(ftls);
  }

  // Pass 3b: Duplicate search for exact-ID matches.
  // This catches cases where an external GEDCOM ID is already in FTLS, but an older
  // FTLS row still exists under a different ID for what is likely the same person.
  //
  // TIGHTENED RULES (v4.7.13):
  //   1. Score threshold 65 (reduces initial-overlap noise in Kerala names)
  //   2. Parent-child exclusion: if A is in B's family (or vice versa) they can't be duplicates
  //   3. Gender gate checks FTLS current vs FTLS duplicate (not ext vs dup)
  //   4. Spouse/children contradiction: if both have spouse families and NONE overlap
  //      (different spouses, different kids) → different people, skip.
  //      Siblings with no spouses/kids (placeholder names like Brother 1/2) are allowed through.
  //   5. Different-parent exclusion: if both have parent families and they differ, skip
  //      (same name + different parents = cousins/namesakes, not duplicates)
  //      When one has no parent (orphan/spouse-only), let through for admin review —
  //      the context panel shows lineage, spouses, children so admin can decide.
  //   6. Match reasoning captured for admin context panel

  function isParentChildRelation(idA, idB) {
    for (const fam of Object.values(ftlsFamilyMap)) {
      const kids = fam.children || [];
      const hid = fam.husband_id || fam.husb || '';
      const wid = fam.wife_id || fam.wife || '';
      if ((hid === idA || wid === idA) && kids.includes(idB)) return true;
      if ((hid === idB || wid === idB) && kids.includes(idA)) return true;
    }
    return false;
  }

  function areSiblings(idA, idB) {
    for (const fam of Object.values(ftlsFamilyMap)) {
      const kids = fam.children || [];
      if (kids.includes(idA) && kids.includes(idB)) return true;
    }
    return false;
  }

  function findSpouseFamilies(personId) {
    const fams = [];
    for (const [fid, fam] of Object.entries(ftlsFamilyMap)) {
      const hid = fam.husband_id || fam.husb || '';
      const wid = fam.wife_id || fam.wife || '';
      if (hid === personId || wid === personId) fams.push(fid);
    }
    return fams;
  }

  // Get the spouse ID(s) for a person from their spouse families
  function getSpouseIds(personId) {
    const spouses = new Set();
    for (const fam of Object.values(ftlsFamilyMap)) {
      const hid = fam.husband_id || fam.husb || '';
      const wid = fam.wife_id || fam.wife || '';
      if (hid === personId && wid) spouses.add(wid);
      if (wid === personId && hid) spouses.add(hid);
    }
    return spouses;
  }

  // Get children across all spouse families
  function getChildIds(personId) {
    const children = new Set();
    for (const fam of Object.values(ftlsFamilyMap)) {
      const hid = fam.husband_id || fam.husb || '';
      const wid = fam.wife_id || fam.wife || '';
      if (hid === personId || wid === personId) {
        for (const cid of (fam.children || [])) children.add(cid);
      }
    }
    return children;
  }

  // Check if two people have contradicting family evidence:
  // both have spouses/children but none overlap → different people
  function hasContradictingFamilyEvidence(idA, idB) {
    const spousesA = getSpouseIds(idA);
    const spousesB = getSpouseIds(idB);
    const childrenA = getChildIds(idA);
    const childrenB = getChildIds(idB);

    // If both have spouse families...
    const bothHaveSpouses = spousesA.size > 0 && spousesB.size > 0;
    const bothHaveChildren = childrenA.size > 0 && childrenB.size > 0;

    if (bothHaveSpouses || bothHaveChildren) {
      // Check for ANY overlap in spouses or children
      const sharedSpouse = [...spousesA].some(s => spousesB.has(s));
      const sharedChild = [...childrenA].some(c => childrenB.has(c));
      // If they share nothing — contradicting evidence
      if (!sharedSpouse && !sharedChild) return true;
    }
    return false;
  }

  function buildMatchReasons(personA, personB, score) {
    const reasons = [];
    const sigA = getNameSignals(personA);
    const sigB = getNameSignals(personB);
    if (sigA.allKey && sigB.allKey && sigA.allKey === sigB.allKey) reasons.push('Exact full name match');
    else if (sigA.coreKey && sigB.coreKey && sigA.coreKey === sigB.coreKey) reasons.push('Core name tokens identical');
    else {
      const shared = countEquivalentTokens(sigA.coreTokens, sigB.coreTokens);
      if (shared >= 2) reasons.push(shared + ' shared core name tokens: ' + sigA.coreTokens.filter(t => sigB.coreTokens.some(bt => nameTokensEquivalent(t, bt))).join(', '));
      if (sigA.fn && sigB.fn && nameTokensEquivalent(sigA.fn, sigB.fn)) reasons.push('First name match: ' + (personA.fn||'') + ' ≈ ' + (personB.fn||''));
      if (sigA.ln && sigB.ln && nameTokensEquivalent(sigA.ln, sigB.ln)) reasons.push('Last name match: ' + (personA.ln||'') + ' ≈ ' + (personB.ln||''));
    }
    if (personA.g && personB.g && personA.g === personB.g) reasons.push('Same gender (' + personA.g + ')');
    if (personA.dob && personB.dob && personA.dob === personB.dob) reasons.push('Same DOB: ' + personA.dob);
    if (personA.nk && personB.nk && normalizeNameToken(personA.nk) === normalizeNameToken(personB.nk)) reasons.push('Nickname match: ' + personA.nk + ' ≈ ' + personB.nk);
    // Note structural evidence
    const parentA = findParentFamily(personA.id, ftlsFamilyMap);
    const parentB = findParentFamily(personB.id, ftlsFamilyMap);
    if (!parentA && !parentB) reasons.push('Neither has a parent family (both disconnected)');
    else if (!parentA || !parentB) reasons.push('One has no parent family — possible spouse stub');
    else if (sameParentFamily(parentA, parentB)) reasons.push('Same parent family');
    const spousesA = getSpouseIds(personA.id);
    const spousesB = getSpouseIds(personB.id);
    if (spousesA.size === 0 && spousesB.size === 0) reasons.push('Neither has a spouse family');
    else if (spousesA.size === 0 || spousesB.size === 0) reasons.push('One has no spouse family');
    reasons.push('Fuzzy score: ' + score);
    return reasons;
  }

  const seenDuplicatePairs = new Set();
  for (const match of results.matched) {
    const duplicateCandidates = Object.values(ftlsPersonMap).filter(p => p.id !== match.id);
    const dup = fuzzyMatchPerson(match.ext, duplicateCandidates);
    if (!dup || dup.score < 65 || !isStrongDuplicatePersonMatch(match.ext, dup.person, dup.score)) continue;

    // Gender gate: check the two FTLS records against each other (not ext vs dup)
    if (match.ftls.g && dup.person.g && match.ftls.g !== dup.person.g) continue;

    // Parent-child exclusion
    if (isParentChildRelation(match.id, dup.person.id)) continue;

    // Spouse/children contradiction: if both have family connections and NONE overlap,
    // they are almost certainly different people (cousins, namesakes, or distinct siblings)
    // Ron George (⚭ Neema, kids: Gabby/Ethan) vs Mon George (⚭ Ammini, kids: Robin) → skip
    // But: Brother 1 vs Brother 2 with no spouses/kids → allowed through (placeholder names)
    if (hasContradictingFamilyEvidence(match.id, dup.person.id)) continue;

    // Different-parent exclusion: if BOTH have parent families and they differ,
    // these are cousins/namesakes, not duplicates.
    // When one has NO parent (orphan/spouse-only), let it through for admin review —
    // this is the classic duplicate pattern (spouse stub + full child record),
    // and the context panel shows enough info for the admin to decide.
    const currentParentFam = findParentFamily(match.id, ftlsFamilyMap);
    const dupParentFam = findParentFamily(dup.person.id, ftlsFamilyMap);
    if (currentParentFam && dupParentFam && !sameParentFamily(currentParentFam, dupParentFam)) continue;

    const pairKey = [match.id, dup.person.id].sort().join('|');
    if (seenDuplicatePairs.has(pairKey)) continue;
    seenDuplicatePairs.add(pairKey);

    const diffs = diffPerson(match.ftls, dup.person);
    if (currentParentFam && dupParentFam && !sameParentFamily(currentParentFam, dupParentFam)) {
      const currentFamId = currentParentFam?.familyId || '';
      const duplicateFamId = dupParentFam?.familyId || '';
      diffs.push({
        key: '_famc',
        label: 'Parent Family',
        ftls: currentParentFam ? parentLabel(currentParentFam, ftlsPersonMap) + ' (' + currentFamId + ')' : '(none)',
        ext: dupParentFam ? parentLabel(dupParentFam, ftlsPersonMap) + ' (' + duplicateFamId + ')' : '(none)'
      });
    }

    // Build match reasoning for admin context
    const matchReasons = buildMatchReasons(match.ftls, dup.person, dup.score);

    results.duplicateExactMatches.push({
      extId: match.id,
      currentId: match.id,
      duplicateId: dup.person.id,
      ext: match.ext,
      current: match.ftls,
      duplicate: dup.person,
      score: dup.score,
      diffs,
      matchReasons,
      currentStatus: personRelationStatus(match.id),
      duplicateStatus: personRelationStatus(dup.person.id)
    });
  }
  
  // Family diffs
  // Phantom family filter (webtrees strategy): skip families with no named spouse AND no named children.
  // These are divorce-placeholder records (e.g. Daine's first marriage with unnamed stub children).
  function isPhantomFamily(fam, pMap) {
    const hid = fam.husband_id || fam.husb || '';
    const wid = fam.wife_id || fam.wife || '';
    const spouseKnown = (hid && pMap[hid] && (pMap[hid].fn || pMap[hid].dn)) ||
                        (wid && pMap[wid] && (pMap[wid].fn || pMap[wid].dn));
    if (spouseKnown) return false; // at least one named spouse → not phantom
    const kids = fam.children || [];
    const anyNamedChild = kids.some(cid => pMap[cid] && (pMap[cid].fn || pMap[cid].dn));
    return !anyNamedChild; // all children unnamed (or no children) → phantom
  }

  for (const [fid, extFam] of Object.entries(extFamilies)) {
    // Silently skip phantom families — no noise in diff, no orphan records
    if (isPhantomFamily(extFam, extPeople)) continue;
    const ftlsFam = ftlsFamilyMap[fid];
    if (!ftlsFam) {
      results.familyDiffs.push({ id: fid, type: 'ext_only', ext: extFam });
    } else {
      const diffs = [];
      if ((extFam.husb||'') !== (ftlsFam.husband_id||ftlsFam.husb||'')) diffs.push({ field:'husband', label:'Husband', ext:extFam.husb, ftls:ftlsFam.husband_id||ftlsFam.husb });
      if ((extFam.wife||'') !== (ftlsFam.wife_id||ftlsFam.wife||'')) diffs.push({ field:'wife', label:'Wife', ext:extFam.wife, ftls:ftlsFam.wife_id||ftlsFam.wife });
      const extKids = (extFam.children||[]).sort().join(',');
      const ftlsKids = (ftlsFam.children||[]).sort().join(',');
      if (extKids !== ftlsKids) diffs.push({ field:'children', label:'Children', ext:extFam.children, ftls:ftlsFam.children });
      const extMdate = normalizedValue(extFam.mdate || extFam.marriage_date || '');
      const ftlsMdate = normalizedValue(ftlsFam.marriage_date || ftlsFam.mdate || '');
      if (extMdate !== ftlsMdate && (extMdate || ftlsMdate)) diffs.push({ field:'mdate', label:'Marriage Date', ext:extMdate, ftls:ftlsMdate });
      const extMplace = normalizedValue(extFam.mplace || extFam.marriage_place || '');
      const ftlsMplace = normalizedValue(ftlsFam.marriage_place || ftlsFam.mplace || '');
      if (extMplace !== ftlsMplace && (extMplace || ftlsMplace)) diffs.push({ field:'mplace', label:'Marriage Place', ext:extMplace, ftls:ftlsMplace });
      const extDiv = normalizedValue(extFam.divdate || extFam.divorce_date || '');
      const ftlsDiv = normalizedValue(ftlsFam.divorce_date || ftlsFam.divdate || '');
      if (extDiv !== ftlsDiv && (extDiv || ftlsDiv)) diffs.push({ field:'divdate', label:'Divorce Date', ext:extDiv, ftls:ftlsDiv });
      if (diffs.length > 0) results.familyDiffs.push({ id: fid, type: 'different', diffs, ext: extFam, ftls: ftlsFam });
    }
  }
  for (const [fid, ftlsFam] of Object.entries(ftlsFamilyMap)) {
    if (!extFamilies[fid]) {
      results.familyDiffs.push({ id: fid, type: 'ftls_only', ftls: ftlsFam });
    }
  }

  // ── Family Fuzzy Match: find ext_only families that match ftls_only families by members ──
  // Build person fuzzy remap: extId → ftlsId (from fuzzy matched persons)
  results.fuzzyMatched.forEach(m => { personFuzzyMap[m.extId] = m.ftlsId; });

  const extOnlyFamDiffs = results.familyDiffs.filter(f => f.type === 'ext_only');
  const ftlsOnlyFamDiffs = results.familyDiffs.filter(f => f.type === 'ftls_only');
  const ftlsOnlyFamMap = {};
  ftlsOnlyFamDiffs.forEach(f => { ftlsOnlyFamMap[f.id] = f.ftls; });

  const famFuzzyMatched = new Set(); // track matched family IDs from both sides
  for (const extDiff of extOnlyFamDiffs) {
    const match = fuzzyMatchFamily(extDiff.ext, ftlsOnlyFamMap, extPeople, ftlsPersonMap, personFuzzyMap);
    if (match) {
      results.fuzzyMatchedFamilies.push({
        extId: extDiff.id,
        ftlsId: match.id,
        ext: extDiff.ext,
        ftls: match.family,
        score: match.score,
      });
      famFuzzyMatched.add(extDiff.id);
      famFuzzyMatched.add(match.id);
    }
  }
  // Remove fuzzy-matched families from ext_only and ftls_only in familyDiffs
  if (famFuzzyMatched.size > 0) {
    results.familyDiffs = results.familyDiffs.filter(f => !famFuzzyMatched.has(f.id));
  }
  
  // Stats
  const totalChanged = results.matched.filter(m => m.diffs.length > 0).length;
  results.stats = {
    extTotal: Object.keys(extPeople).length,
    ftlsTotal: Object.keys(ftlsPersonMap).length,
    exactMatch: results.matched.length,
    fuzzyMatch: results.fuzzyMatched.length,
    duplicateExactMatch: results.duplicateExactMatches.length,
    fuzzyFamilyMatch: results.fuzzyMatchedFamilies.length,
    identical: results.matched.filter(m => m.diffs.length === 0).length,
    changed: totalChanged,
    extOnly: results.extOnly.length,
    ftlsOnly: results.ftlsOnly.length,
    extFamilies: Object.keys(extFamilies).length,
    ftlsFamilies: Object.keys(ftlsFamilyMap).length,
  };
  
  return results;
}

// Merge a single external person into Supabase — ONLY if they don't already exist
async function mergePersonToDb(ext, editUser) {
  // Safety check: does this person already exist?
  try {
    const existing = await sbFetch(`persons?id=eq.${ext.id}&select=id`);
    if (existing.length > 0) {
      console.warn('mergePersonToDb: person already exists, skipping:', ext.id, ext.dn);
      return { skipped: true, reason: 'already exists' };
    }
  } catch(e) {}
  
  const person = { ...ext };
  if (!person.dn) person.dn = ((person.fn||'') + ' ' + (person.ln||'')).trim() || '(Unknown)';
  await savePerson(person, editUser || 'GEDCOM merge');
  return { skipped: false };
}

// Merge a single external family into Supabase — ONLY if it doesn't already exist
// If it exists, only ADD new children (don't overwrite)
async function mergeFamilyToDb(extFam) {
  // ── FK GUARD: verify spouse IDs exist in persons before INSERT/UPDATE ──
  // Prevents FK constraint error 23503 when GEDCOM references persons not yet imported
  const verifyPersonExists = async (pid) => {
    if (!pid) return false;
    try { const r = await sbFetch(`persons?id=eq.${pid}&select=id`); return r.length > 0; }
    catch(e) { return false; }
  };
  const safeHusb = extFam.husb && (await verifyPersonExists(extFam.husb)) ? extFam.husb : null;
  const safeWife = extFam.wife && (await verifyPersonExists(extFam.wife)) ? extFam.wife : null;
  if (extFam.husb && !safeHusb) console.warn('mergeFamilyToDb: husband', extFam.husb, 'not in persons — setting null for family', extFam.id);
  if (extFam.wife && !safeWife) console.warn('mergeFamilyToDb: wife', extFam.wife, 'not in persons — setting null for family', extFam.id);

  try {
    const existing = await sbFetch(`families?id=eq.${extFam.id}&select=*`);
    if (existing.length > 0) {
      // Family exists — update empty spouse slots + add new children
      const patch = {};
      // Fill empty husband/wife slots (don't overwrite existing) — only if person exists
      if (!existing[0].husband_id && safeHusb) patch.husband_id = safeHusb;
      if (!existing[0].wife_id && safeWife) patch.wife_id = safeWife;
      // Fill empty marriage facts from the incoming GEDCOM family. Do not clear
      // existing FTLS values here; explicit conflict resolution stays in the diff/review UI.
      if (!existing[0].marriage_date && extFam.mdate) patch.marriage_date = extFam.mdate;
      if (!existing[0].marriage_place && extFam.mplace) patch.marriage_place = extFam.mplace;
      if (!existing[0].divorce_date && extFam.divdate) patch.divorce_date = extFam.divdate;
      if (!existing[0].divorced && extFam.divorced) patch.divorced = true;
      // Add new children
      const existingKids = new Set(existing[0].children || []);
      const newKids = (extFam.children || []).filter(cid => !existingKids.has(cid));
      if (newKids.length > 0) patch.children = [...(existing[0].children || []), ...newKids];
      // Apply if anything changed
      if (Object.keys(patch).length > 0) {
        await sbFetch(`families?id=eq.${extFam.id}`, {
          method: 'PATCH',
          body: JSON.stringify(patch),
          headers: { 'Prefer': 'return=minimal' }
        });
        const actions = [];
        if (patch.husband_id) actions.push('added husband');
        if (patch.wife_id) actions.push('added wife');
        if (patch.children) actions.push('added ' + newKids.length + ' children');
        if (patch.marriage_date) actions.push('added marriage date');
        if (patch.marriage_place) actions.push('added marriage place');
        if (patch.divorce_date) actions.push('added divorce date');
        if (patch.divorced) actions.push('marked divorced');
        return { skipped: false, action: actions.join(', ') };
      }
      return { skipped: true, reason: 'family exists, no changes needed' };
    }
  } catch(e) {}
  
  // Family doesn't exist — create it (using validated spouse IDs)
  const row = {
    id: extFam.id,
    husband_id: safeHusb,
    wife_id: safeWife,
    children: extFam.children || [],
    marriage_date: extFam.mdate || '',
    marriage_place: extFam.mplace || '',
  };
  await sbFetch('families?on_conflict=id', {
    method: 'POST',
    body: JSON.stringify(row),
    headers: { 'Prefer': 'return=minimal,resolution=merge-duplicates' }
  });
  return { skipped: false, action: 'created' + (extFam.husb && !safeHusb ? ' (husband missing)' : '') + (extFam.wife && !safeWife ? ' (wife missing)' : '') };
}

// Apply specific field updates from external to an existing FTLS person
// SAFE: starts from existing FTLS data, only overwrites selected fields
async function mergeFieldsToDb(ftlsPerson, fieldsToApply, ext, editUser) {
  // Re-fetch current state from DB to be safe (not stale in-memory data)
  let current = ftlsPerson;
  try {
    const rows = await sbFetch(`persons?id=eq.${ftlsPerson.id}&select=*`);
    if (rows.length > 0) {
      const p = rows[0];
      current = {
        id:p.id, fn:p.first_name, mn:p.middle_name, ln:p.last_name,
        dn:p.display_name, nk:p.nickname, md:p.maiden_name, sx:getNameSuffixFromNotes(p.notes), g:p.gender,
        dob:p.date_of_birth, dod:p.date_of_death, dec:p.is_deceased, bo:p.birth_order,
        em:p.email, ph:p.phone, a1:p.address1, a2:p.address2,
        ci:p.city, st:p.state, zp:p.zip, co:p.country,
        fb:p.facebook, ig:p.instagram, li:p.linkedin, ws:p.website,
        pp:p.profile_photo, bio:p.bio, loc:p.location, prof:p.profession, emp:p.employer,
        stories:p.stories, notes:p.notes, pgl:p.photo_gallery_link, dl:p.documents_link,
        tp:p.title_prefix, burd:p.burial_date,
      };
    }
  } catch(e) { console.warn('Could not re-fetch person, using in-memory data'); }

  const merged = { ...current };
  for (const key of fieldsToApply) {
    merged[key] = ext[key] || '';
  }
  merged.dn = ((merged.fn||'') + (merged.mn ? ' '+merged.mn : '') + (merged.ln ? ' '+merged.ln : '')).trim() || merged.nk || '(Unknown)';
  await savePerson(merged, editUser || 'GEDCOM merge');
}

// Remap a person's ID: INSERT new record → UPDATE all references → DELETE old
// Used when fuzzy match confirms same person with different IDs
// Must handle FK constraints: families.husband_id, families.wife_id, users.person_id,
// access_requests.person_id, update_requests.person_id, family_members.person_id
async function remapPersonId(oldId, newId, editUser) {
  if (!isAdmin()) throw new Error('Only admins can remap person IDs');

  const existing = await sbFetch(`persons?id=eq.${newId}&select=id`);
  if (existing.length > 0) throw new Error('Target ID ' + newId + ' already exists in the database');

  const [person] = await sbFetch(`persons?id=eq.${oldId}&select=*`);
  if (!person) throw new Error('Person ' + oldId + ' not found');
  const newPerson = { ...person, id: newId };
  await sbFetch('persons', {
    method: 'POST',
    body: JSON.stringify(newPerson),
    headers: { 'Prefer': 'return=minimal' }
  });

  try {
    const famsH = await sbFetch(`families?husband_id=eq.${oldId}&select=id`);
    for (const f of famsH) {
      await sbFetch(`families?id=eq.${f.id}`, {
        method: 'PATCH', body: JSON.stringify({ husband_id: newId }),
        headers: { 'Prefer': 'return=minimal' }
      });
    }

    const famsW = await sbFetch(`families?wife_id=eq.${oldId}&select=id`);
    for (const f of famsW) {
      await sbFetch(`families?id=eq.${f.id}`, {
        method: 'PATCH', body: JSON.stringify({ wife_id: newId }),
        headers: { 'Prefer': 'return=minimal' }
      });
    }

    const allFams = await sbFetch('families?select=id,children');
    for (const fam of allFams) {
      if ((fam.children || []).includes(oldId)) {
        await sbFetch(`families?id=eq.${fam.id}`, {
          method: 'PATCH',
          body: JSON.stringify({ children: fam.children.map(c => c === oldId ? newId : c) }),
          headers: { 'Prefer': 'return=minimal' }
        });
      }
    }

    for (const tbl of ['users', 'family_members']) {
      try {
        const refs = await sbFetch(`${tbl}?person_id=eq.${oldId}&select=id`);
        for (const r of refs) {
          await sbFetch(`${tbl}?id=eq.${r.id}`, {
            method: 'PATCH', body: JSON.stringify({ person_id: newId }),
            headers: { 'Prefer': 'return=minimal' }
          });
        }
      } catch(e) { console.warn('Could not update ' + tbl + ':', e); }
    }
    for (const tbl of ['access_requests', 'update_requests']) {
      try {
        const refs = await sbFetch(`${tbl}?person_id=eq.${oldId}&select=id`);
        for (const r of refs) {
          await sbFetch(`${tbl}?id=eq.${r.id}`, {
            method: 'PATCH', body: JSON.stringify({ person_id: newId }),
            headers: { 'Prefer': 'return=minimal' }
          });
        }
      } catch(e) { console.warn('Could not update ' + tbl + ':', e); }
    }

    try {
      const allMedia = await sbFetch('media?select=id,tagged_persons');
      for (const m of allMedia) {
        if ((m.tagged_persons || []).includes(oldId)) {
          await sbFetch(`media?id=eq.${m.id}`, {
            method: 'PATCH',
            body: JSON.stringify({ tagged_persons: m.tagged_persons.map(t => t === oldId ? newId : t) }),
            headers: { 'Prefer': 'return=minimal' }
          });
        }
      }
    } catch(e) { console.warn('Could not update media:', e); }

    await sbFetch(`persons?id=eq.${oldId}`, {
      method: 'DELETE',
      headers: { 'Prefer': 'return=minimal' }
    });
  } catch(e) {
    console.error('Remap failed after creating new record, attempting rollback:', e);
    try {
      const famsH2 = await sbFetch(`families?husband_id=eq.${newId}&select=id`);
      for (const f of famsH2) {
        await sbFetch(`families?id=eq.${f.id}`, {
          method:'PATCH',
          body:JSON.stringify({husband_id:oldId}),
          headers:{'Prefer':'return=minimal'}
        });
      }
      const famsW2 = await sbFetch(`families?wife_id=eq.${newId}&select=id`);
      for (const f of famsW2) {
        await sbFetch(`families?id=eq.${f.id}`, {
          method:'PATCH',
          body:JSON.stringify({wife_id:oldId}),
          headers:{'Prefer':'return=minimal'}
        });
      }
      const allFams2 = await sbFetch('families?select=id,children');
      for (const fam of allFams2) {
        if ((fam.children||[]).includes(newId)) {
          await sbFetch(`families?id=eq.${fam.id}`, {
            method:'PATCH',
            body:JSON.stringify({children:fam.children.map(c=>c===newId?oldId:c)}),
            headers:{'Prefer':'return=minimal'}
          });
        }
      }
      await sbFetch(`persons?id=eq.${newId}`, { method:'DELETE', headers:{'Prefer':'return=minimal'} });
      console.log('Rollback successful');
    } catch(rb) { console.error('Rollback also failed — DB may be in inconsistent state:', rb); }
    throw e;
  }

  try {
    await sbFetch('edit_log', {
      method: 'POST',
      body: JSON.stringify({
        person_id: newId,
        action: 'id_remap',
        edited_by: editUser || 'GEDCOM merge',
        changes: {
          changed_fields: { action: 'id_remap', old_id: oldId, new_id: newId },
          previous_values: { id: oldId },
        },
      }),
      headers: { 'Prefer': 'return=minimal' }
    });
  } catch(e) { console.warn('Could not log remap:', e); }
}

async function mergeDuplicatePeople(keepId, removeId, editUser, options={}) {
  if (!isAdmin()) throw new Error('Only admins can merge duplicate people');
  if (!keepId || !removeId || keepId === removeId) throw new Error('Pick two different person IDs to merge');

  const opts = typeof options === 'string' ? { preferSource: options } : (options || {});
  const preferSource = opts.preferSource || 'keep';
  const fieldSelections = opts.fieldSelections || {};
  // Optional: caller can pass an already-parsed external person object as the
  // 'remove' side (e.g. from a GEDCOM parse where that person is not in
  // Supabase). When present, skip the sbFetch for removeId — the object is
  // treated as the source of field values only, and no Supabase row is deleted
  // because there was never a row to begin with.
  const removePersonOverride = opts.removePersonOverride || null;
  // When true (typical for external merges): skip remap of other tables to
  // point at keepId (the external removeId was never referenced anywhere).
  const skipRemap = !!opts.skipRemap;

  const keepRows = await sbFetch(`persons?id=eq.${keepId}&select=*`);
  const keepRow = keepRows[0];
  if (!keepRow) throw new Error('Keep record ' + keepId + ' not found');

  let removeRow = null;
  let removePerson;
  if (removePersonOverride) {
    // External merge: build a dummy "row-like" object for audit logging, but
    // do not try to read it from Supabase.
    removePerson = { ...removePersonOverride };
    removeRow = {
      id: removeId,
      display_name: removePersonOverride.dn || '',
      first_name: removePersonOverride.fn || '',
      last_name: removePersonOverride.ln || '',
      gender: removePersonOverride.g || '',
      city: removePersonOverride.ci || ''
    };
  } else {
    const removeRows = await sbFetch(`persons?id=eq.${removeId}&select=*`);
    removeRow = removeRows[0];
    if (!removeRow) throw new Error('Duplicate record ' + removeId + ' not found');
    removePerson = personRowToTreePerson(removeRow);
  }

  const keepPerson = personRowToTreePerson(keepRow);
  const merged = { ...keepPerson, id: keepId };
  const allKeys = new Set(PERSON_DIFF_FIELDS.map(([key]) => key));

  for (const key of allKeys) {
    const selectedSource = fieldSelections[key];
    if (selectedSource === 'keep') {
      merged[key] = keepPerson[key];
      continue;
    }
    if (selectedSource === 'remove') {
      merged[key] = removePerson[key];
      continue;
    }
    const keepVal = keepPerson[key];
    const removeVal = removePerson[key];
    const keepEmpty = keepVal === null || keepVal === undefined || keepVal === '';
    const removeEmpty = removeVal === null || removeVal === undefined || removeVal === '';
    if (preferSource === 'remove') {
      merged[key] = !removeEmpty ? removeVal : keepVal;
    } else if (keepEmpty && !removeEmpty) {
      merged[key] = removeVal;
    }
  }

  if (!merged.primaryFamId && removePerson.primaryFamId) merged.primaryFamId = removePerson.primaryFamId;
  merged.dec = !!merged.dec;
  if (!merged.dn || (!fieldSelections.dn && (fieldSelections.fn || fieldSelections.mn || fieldSelections.ln))) {
    merged.dn = ((merged.fn||'') + (merged.mn ? ' ' + merged.mn : '') + (merged.ln ? ' ' + merged.ln : '')).trim() || merged.nk || '(Unknown)';
  }

  await savePerson(merged, editUser || 'GEDCOM duplicate merge');

  try {
    await logEditAction({
      personId: keepId,
      action: 'merge_duplicate_person',
      editedBy: editUser || '',
      changes: {
        person_name: merged.dn || keepRow.display_name || keepId,
        kept_id: keepId,
        removed_id: removeId,
        prefer_source: preferSource,
        field_selections: fieldSelections,
        kept_name: keepRow.display_name || keepId,
        removed_name: removeRow.display_name || removeId,
        kept_before: {
          display_name: keepRow.display_name || '',
          first_name: keepRow.first_name || '',
          last_name: keepRow.last_name || '',
          gender: keepRow.gender || '',
          city: keepRow.city || ''
        },
        removed_before: {
          display_name: removeRow.display_name || '',
          first_name: removeRow.first_name || '',
          last_name: removeRow.last_name || '',
          gender: removeRow.gender || '',
          city: removeRow.city || ''
        },
        kept_after: {
          display_name: merged.dn || '',
          first_name: merged.fn || '',
          last_name: merged.ln || '',
          gender: merged.g || '',
          city: merged.ci || ''
        }
      }
    });
  } catch(e) { console.warn('Duplicate merge log failed:', e); }

  // The rest of this function reassigns references from removeId → keepId across
  // families, users, family_members, media, then deletes removeId.
  // For external merges (removeId was never in Supabase), there's nothing to
  // reassign and nothing to delete. skipRemap short-circuits.
  if (skipRemap) return;

  const famsH = await sbFetch(`families?husband_id=eq.${removeId}&select=id`);
  for (const f of famsH) {
    await sbFetch(`families?id=eq.${f.id}`, {
      method: 'PATCH',
      body: JSON.stringify({ husband_id: keepId }),
      headers: { 'Prefer': 'return=minimal' }
    });
  }

  const famsW = await sbFetch(`families?wife_id=eq.${removeId}&select=id`);
  for (const f of famsW) {
    await sbFetch(`families?id=eq.${f.id}`, {
      method: 'PATCH',
      body: JSON.stringify({ wife_id: keepId }),
      headers: { 'Prefer': 'return=minimal' }
    });
  }

  const allFams = await sbFetch('families?select=id,children');
  for (const fam of allFams) {
    if ((fam.children || []).includes(removeId)) {
      const nextChildren = [...new Set((fam.children || []).map(cid => cid === removeId ? keepId : cid))];
      await sbFetch(`families?id=eq.${fam.id}`, {
        method: 'PATCH',
        body: JSON.stringify({ children: nextChildren }),
        headers: { 'Prefer': 'return=minimal' }
      });
    }
  }

  for (const tbl of ['users', 'access_requests', 'update_requests']) {
    try {
      const refs = await sbFetch(`${tbl}?person_id=eq.${removeId}&select=id`);
      for (const r of refs) {
        await sbFetch(`${tbl}?id=eq.${r.id}`, {
          method: 'PATCH',
          body: JSON.stringify({ person_id: keepId }),
          headers: { 'Prefer': 'return=minimal' }
        });
      }
    } catch(e) { console.warn('Could not update ' + tbl + ':', e); }
  }

  try {
    const fmRefs = await sbFetch(`family_members?person_id=eq.${removeId}&select=id,family_id,role`);
    for (const r of fmRefs) {
      try {
        await sbFetch(`family_members?id=eq.${r.id}`, {
          method: 'PATCH',
          body: JSON.stringify({ person_id: keepId }),
          headers: { 'Prefer': 'return=minimal' }
        });
      } catch(e) {
        const msg = e?.message || '';
        if (msg.includes('duplicate') || msg.includes('unique')) {
          await sbFetch(`family_members?id=eq.${r.id}`, {
            method: 'DELETE',
            headers: { 'Prefer': 'return=minimal' }
          });
        } else {
          throw e;
        }
      }
    }
  } catch(e) { console.warn('Could not update family_members:', e); }

  try {
    const allMedia = await sbFetch('media?select=id,tagged_persons');
    for (const m of allMedia) {
      if ((m.tagged_persons || []).includes(removeId)) {
        const nextTags = [...new Set((m.tagged_persons || []).map(t => t === removeId ? keepId : t))];
        await sbFetch(`media?id=eq.${m.id}`, {
          method: 'PATCH',
          body: JSON.stringify({ tagged_persons: nextTags }),
          headers: { 'Prefer': 'return=minimal' }
        });
      }
    }
  } catch(e) { console.warn('Could not update media:', e); }

  await sbFetch(`persons?id=eq.${removeId}`, {
    method: 'DELETE',
    headers: { 'Prefer': 'return=minimal' }
  });
}

// Remap a family ID: change FTLS family ID to match external GEDCOM ID
// Simpler than person remap — families are only referenced by their own ID (PK)
// No other table has FK references to families.id
async function remapFamilyId(oldId, newId, editUser) {
  if (!isAdmin()) throw new Error('Only admins can remap family IDs');

  // Check new ID doesn't already exist
  const existing = await sbFetch(`families?id=eq.${newId}&select=id`);
  if (existing.length > 0) throw new Error('Target family ID ' + newId + ' already exists');

  // Get old family record
  const [fam] = await sbFetch(`families?id=eq.${oldId}&select=*`);
  if (!fam) throw new Error('Family ' + oldId + ' not found');

  // Create new record with new ID
  const newFam = { ...fam, id: newId };
  await sbFetch('families', {
    method: 'POST',
    body: JSON.stringify(newFam),
    headers: { 'Prefer': 'return=minimal' }
  });

  // Delete old record
  try {
    await sbFetch(`families?id=eq.${oldId}`, {
      method: 'DELETE',
      headers: { 'Prefer': 'return=minimal' }
    });
  } catch(e) {
    // Rollback: delete the new record
    console.error('Delete old family failed, rolling back:', e);
    try { await sbFetch(`families?id=eq.${newId}`, { method:'DELETE', headers:{'Prefer':'return=minimal'} }); } catch(rb) {}
    throw e;
  }

  // Log the remap
  try {
    await sbFetch('edit_log', {
      method: 'POST',
      body: JSON.stringify({
        person_id: (fam.husband_id || fam.wife_id || null), // associate with a spouse for traceability
        family_id: newId,
        action: 'family_id_remap',
        edited_by: editUser || 'GEDCOM merge',
        changes: {
          changed_fields: { action: 'family_id_remap', old_id: oldId, new_id: newId },
          previous_values: { family_id: oldId },
        },
      }),
      headers: { 'Prefer': 'return=minimal' }
    });
  } catch(e) { console.warn('Could not log family remap:', e); }
}

/* ───── ORPHAN META PRUNER ─────
   Finds rows in gedcom_meta that are no longer referenced by any live
   person._extra_gedcom, person.notes, or family._extra_gedcom, and optionally
   moves them to gedcom_meta_archive so they can be restored if needed.

   Only person-specific record types are candidates (see PERSON_SPECIFIC_META).
   App-config types (_STE, _STF, _PTE, _PTF, LABL, REPO) are left alone because
   MFT's export format requires them whether or not individual persons reference
   them directly.

   Usage:
     const preview = await pruneOrphanMeta({ dryRun: true });
     // → { candidates: [{id, record_type, preview}], counts: {OBJE: 391, NOTE: 6, ...}, totalCandidates: 399 }

     const result = await pruneOrphanMeta({
       dryRun: false,
       user: 'me@example.com',
       reason: 'manual_admin_prune'
     });
     // → { archived: 399, deleted: 399 }
*/
async function pruneOrphanMeta({ dryRun = true, user = '', reason = 'manual_admin_prune' } = {}) {
  if (!isAdmin()) throw new Error('Only admins can prune orphan records');

  // 1. Pull all gedcom_meta rows that are eligible (person-specific types only)
  const eligibleTypes = [...PERSON_SPECIFIC_META].map(t => `"${t}"`).join(',');
  const allMeta = await sbFetch(`gedcom_meta?record_type=in.(${eligibleTypes})&select=id,record_type,raw_gedcom,created_at`);

  if (allMeta.length === 0) {
    return { candidates: [], counts: {}, totalCandidates: 0, archived: 0, deleted: 0 };
  }

  // 2. Build a set of all xrefs referenced from live persons/families
  //    Pull only the fields we need to keep the payload small
  const [personsRefs, familiesRefs] = await Promise.all([
    sbFetch('persons?select=_extra_gedcom,notes'),
    sbFetch('families?select=_extra_gedcom'),
  ]);

  const referenced = new Set();
  const collectRefs = (text) => {
    if (!text || typeof text !== 'string') return;
    const matches = text.match(/@[^@\s]+@/g);
    if (matches) for (const m of matches) referenced.add(m);
  };
  for (const p of personsRefs) { collectRefs(p._extra_gedcom); collectRefs(p.notes); }
  for (const f of familiesRefs) { collectRefs(f._extra_gedcom); }

  // 3. Partition eligible meta into orphans vs. still-referenced
  const orphans = allMeta.filter(m => !referenced.has(m.id));

  // Build counts for the preview
  const counts = {};
  for (const o of orphans) {
    counts[o.record_type] = (counts[o.record_type] || 0) + 1;
  }

  if (dryRun || orphans.length === 0) {
    return {
      candidates: orphans.map(o => ({
        id: o.id,
        record_type: o.record_type,
        preview: (o.raw_gedcom || '').slice(0, 120)
      })),
      counts,
      totalCandidates: orphans.length,
      archived: 0,
      deleted: 0,
    };
  }

  // 4. Not a dry run — archive, then delete.
  //    Insert in batches to keep request size sane.
  const BATCH = 50;
  let archived = 0, deleted = 0;
  for (let i = 0; i < orphans.length; i += BATCH) {
    const batch = orphans.slice(i, i + BATCH);
    const archiveRows = batch.map(o => ({
      id: o.id,
      record_type: o.record_type,
      raw_gedcom: o.raw_gedcom,
      created_at: o.created_at,
      pruned_by: user || 'unknown',
      prune_reason: reason,
    }));
    // Archive batch
    await sbFetch('gedcom_meta_archive', {
      method: 'POST',
      body: JSON.stringify(archiveRows),
      headers: { 'Prefer': 'return=minimal' }
    });
    archived += batch.length;

    // Delete batch from live table. PostgREST's in.(…) operator takes a
    // parenthesized, comma-separated list; the xref id values contain @ and
    // digits so no quoting/escaping is required beyond URI encoding.
    const idList = batch.map(o => o.id).join(',');
    await sbFetch(`gedcom_meta?id=in.(${encodeURIComponent(idList)})`, {
      method: 'DELETE',
      headers: { 'Prefer': 'return=minimal' }
    });
    deleted += batch.length;
  }

  // 5. Audit-log the prune action so it shows up in the admin log
  try {
    await sbFetch('edit_log', {
      method: 'POST',
      body: JSON.stringify({
        person_id: null,
        family_id: null,
        action: 'prune_orphan_meta',
        changes: { archived, reason, counts },
        edited_by: user || 'unknown',
      }),
      headers: { 'Prefer': 'return=minimal' }
    });
  } catch(e) { console.warn('Could not log prune action:', e); }

  return {
    candidates: orphans.map(o => ({
      id: o.id, record_type: o.record_type,
      preview: (o.raw_gedcom || '').slice(0, 120)
    })),
    counts,
    totalCandidates: orphans.length,
    archived,
    deleted,
  };
}

// Restore a previously-pruned gedcom_meta row from the archive back to the
// live table. Useful if a prune was too aggressive.
async function restorePrunedMeta(archiveId) {
  if (!isAdmin()) throw new Error('Only admins can restore archived records');
  const rows = await sbFetch(`gedcom_meta_archive?archive_id=eq.${archiveId}&select=*`);
  if (rows.length === 0) throw new Error('Archive row not found');
  const r = rows[0];
  // Check it doesn't already exist live (could happen if re-imported since)
  const existing = await sbFetch(`gedcom_meta?id=eq.${encodeURIComponent(r.id)}&select=id`);
  if (existing.length > 0) throw new Error('Live gedcom_meta still has ' + r.id + ' — restore would create duplicate');
  await sbFetch('gedcom_meta', {
    method: 'POST',
    body: JSON.stringify({
      id: r.id, record_type: r.record_type, raw_gedcom: r.raw_gedcom, created_at: r.created_at
    }),
    headers: { 'Prefer': 'return=minimal' }
  });
  // Delete from archive
  await sbFetch(`gedcom_meta_archive?archive_id=eq.${archiveId}`, {
    method: 'DELETE', headers: { 'Prefer': 'return=minimal' }
  });
  return { restored: r.id };
}


function exportDiffGedcom(persons, ftlsFamilyMap, extFamilyIds, extFamiliesMap, allPersonMap, forcedFamilyIds) {
  const extIds = extFamilyIds || new Set();
  const forcedFamIds = forcedFamilyIds instanceof Set ? forcedFamilyIds : new Set(forcedFamilyIds || []);
  const extFams = extFamiliesMap || {};
  const personIds = new Set(persons.map(p => p.id));
  const pMap = {};
  persons.forEach(p => { pMap[p.id] = p; });
  
  // For FAMC/FAMS refs on persons, we need ALL families (including existing ones)
  // We export: (1) brand new FAM records, AND (2) existing FAMs whose children changed
  // but mark which families to actually output as records
  
  // Build the GEDCOM manually to control what FAM records get written
  const lines = [];
  const exportedPersons = new Set();

  // Build reverse lookups from FULL familyMap
  const famcLookup = {}; // personId → [familyId]
  const famsLookup = {}; // personId → [familyId]
  for (const [fid, fam] of Object.entries(ftlsFamilyMap)) {
    const hid = fam.husband_id || fam.husb || '';
    const wid = fam.wife_id || fam.wife || '';
    (fam.children || []).forEach(cid => {
      if (!famcLookup[cid]) famcLookup[cid] = [];
      famcLookup[cid].push(fid);
    });
    if (hid) { if (!famsLookup[hid]) famsLookup[hid] = []; famsLookup[hid].push(fid); }
    if (wid) { if (!famsLookup[wid]) famsLookup[wid] = []; famsLookup[wid].push(fid); }
  }

  function gedcomDate() {
    const d = new Date();
    const months = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
    return `${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()}`;
  }
  function gedcomTime() {
    const d = new Date();
    return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}`;
  }

  // Header
  lines.push('0 HEAD','1 SOUR FTLS','2 NAME Chennamkara Family Tree Living Site','2 VERS 0.3',
    '1 CHAR UTF-8','1 GEDC','2 VERS 5.5.1','2 FORM LINEAGE-LINKED','1 SUBM @SUBM1@',
    '0 @SUBM1@ SUBM','1 NAME FTLS Export');

  // INDI records — for each person, include FAMC/FAMS from ALL families
  const diffStandaloneNotes = [];
  for (const [pid, person] of Object.entries(pMap)) {
    if (exportedPersons.has(pid)) continue;
    exportedPersons.add(pid);
    const { indi: L, standalone } = personToGedcomLines(person, { fams: famsLookup[pid] || [], famc: famcLookup[pid] || [] });
    if (standalone.length > 0) diffStandaloneNotes.push(...standalone);
    // FAMS/FAMC from FULL family map
    (famsLookup[pid] || []).forEach(ref => L.push(`1 FAMS ${ref}`));
    (famcLookup[pid] || []).forEach(ref => L.push(`1 FAMC ${ref}`));
    // Preserved extra GEDCOM lines
    if (person._xg) { person._xg.split('\n').forEach(xl => { if (xl.trim()) L.push(xl); }); }
    else { L.push('1 CHAN'); L.push(`2 DATE ${gedcomDate()}`); L.push(`3 TIME ${gedcomTime()}`); }
    lines.push(...L);
  }

  // Collect all family IDs referenced by exported persons (FAMC + FAMS)
  const referencedFamIds = new Set();
  for (const pid of personIds) {
    (famcLookup[pid] || []).forEach(fid => referencedFamIds.add(fid));
    (famsLookup[pid] || []).forEach(fid => referencedFamIds.add(fid));
  }

  // FAM records — include if: (1) new family, (2) children changed, OR (3) referenced by an exported person
  for (const [fid, fam] of Object.entries(ftlsFamilyMap)) {
    const hid = fam.husband_id || fam.husb || '';
    const wid = fam.wife_id || fam.wife || '';
    const kids = fam.children || [];
    const involvesOur = personIds.has(hid) || personIds.has(wid) || kids.some(k => personIds.has(k));
    const referencedByExport = referencedFamIds.has(fid);
    const forceFamilyExport = forcedFamIds.has(fid);
    if (!involvesOur && !referencedByExport && !forceFamilyExport) continue;
    
    // If family exists in external AND not referenced by any exported person,
    // only include if children list changed — unless the user explicitly selected
    // this FAM record's marriage/divorce facts for export.
    if (extIds.has(fid) && !referencedByExport && !forceFamilyExport) {
      const extFam = extFams[fid];
      if (extFam) {
        const extKids = (extFam.children || []).sort().join(',');
        const ftlsKids = kids.slice().sort().join(',');
        if (extKids === ftlsKids) continue; // same children, not referenced — skip
      } else {
        continue;
      }
    }
    
    const F = [`0 ${fid} FAM`];
    if (hid) F.push(`1 HUSB ${hid}`);
    if (wid) F.push(`1 WIFE ${wid}`);
    const md = fam.marriage_date || fam.mdate || '';
    const mp = fam.marriage_place || fam.mplace || '';
    const dd = fam.divorce_date || fam.divdate || '';
    buildFamilyMarriageLines(fam).forEach(line => F.push(line));
    buildFamilyDivorceLines(fam).forEach(line => F.push(line));
    kids.forEach(c => F.push(`1 CHIL ${c}`));
    addStandaloneFamilyReconciliationNote(F, diffStandaloneNotes, { ...fam, id: fid, husband_id: hid, wife_id: wid, marriage_date: md, marriage_place: mp, divorce_date: dd }, allPersonMap || {});
    lines.push(...F);
  }

  // ── ANCHOR PERSONS: emit minimal INDI stubs for people referenced in FAM ──
  // records (as HUSB, WIFE, or CHIL) but NOT already in the export set.
  // Without these, importing apps see dangling references and the new persons
  // end up in an unconnected branch.
  const anchorMap = allPersonMap || {};
  const emittedFamIds = new Set(); // track which FAM records we actually emitted
  // Re-scan the lines we already pushed to find FAM records we emitted
  for (const l of lines) {
    const fm = l.match(/^0 (@[^@]+@) FAM/);
    if (fm) emittedFamIds.add(fm[1]);
  }
  // Collect all person IDs referenced inside emitted FAM records
  const referencedPersonIds = new Set();
  for (const fid of emittedFamIds) {
    const fam = ftlsFamilyMap[fid];
    if (!fam) continue;
    const hid = fam.husband_id || fam.husb || '';
    const wid = fam.wife_id || fam.wife || '';
    if (hid) referencedPersonIds.add(hid);
    if (wid) referencedPersonIds.add(wid);
    (fam.children || []).forEach(cid => referencedPersonIds.add(cid));
  }
  // Emit stub INDI for anyone referenced but not already exported
  for (const refId of referencedPersonIds) {
    if (exportedPersons.has(refId)) continue;
    exportedPersons.add(refId);
    const anchor = anchorMap[refId];
    if (anchor) {
      // Full INDI from personMap — gives importing app enough to match
      const { indi: L, standalone } = personToGedcomLines(anchor, { fams: famsLookup[refId] || [], famc: famcLookup[refId] || [] });
      if (standalone.length > 0) diffStandaloneNotes.push(...standalone);
      (famsLookup[refId] || []).forEach(ref => L.push(`1 FAMS ${ref}`));
      (famcLookup[refId] || []).forEach(ref => L.push(`1 FAMC ${ref}`));
      if (anchor._xg) { anchor._xg.split('\n').forEach(xl => { if (xl.trim()) L.push(xl); }); }
