function MoveBranchModal({ node, personMap, familyMap, flat, tree, user, onMove, onRequestMove, onResolveDuplicate, onClose }) {
  const [targetSearch, setTargetSearch] = useState('');
  const [selectedTarget, setSelectedTarget] = useState(null);
  const [selectedFamily, setSelectedFamily] = useState(null);
  const [reason, setReason] = useState('');
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState('');
  const [ignoredDuplicateIds, setIgnoredDuplicateIds] = useState([]);
  const [showManualPlacement, setShowManualPlacement] = useState(false);
  const [duplicateReview, setDuplicateReview] = useState(null);
  const nodePerson = personMap[node.id] || node;

  // Find current parent family (the family this person is a child of)
  const currentFamily = useMemo(() => {
    for (const [fid, fam] of Object.entries(familyMap)) {
      const kids = fam.children || [];
      if (kids.includes(nodePerson.id)) {
        const hName = fam.husband_id && personMap[fam.husband_id] ? personMap[fam.husband_id].dn : '';
        const wName = fam.wife_id && personMap[fam.wife_id] ? personMap[fam.wife_id].dn : '';
        return { id: fid, husband: hName, wife: wName, label: [hName, wName].filter(Boolean).join(' & ') || fid };
      }
    }
    return null;
  }, [nodePerson.id, familyMap, personMap]);

  // Search for target parent
  const searchResults = useMemo(() => {
    if (!targetSearch || targetSearch.length < 2) return [];
    const q = targetSearch.toLowerCase();
    return flat.filter(p =>
      p.id !== nodePerson.id &&
      (p.dn||'').toLowerCase().includes(q)
    ).slice(0, 8);
  }, [targetSearch, flat, nodePerson.id]);

  // When a target person is selected, find their families (where they are husband or wife)
  const targetFamilies = useMemo(() => {
    if (!selectedTarget) return [];
    const fams = [];
    for (const [fid, fam] of Object.entries(familyMap)) {
      const hid = fam.husband_id || '';
      const wid = fam.wife_id || '';
      if (hid === selectedTarget.id || wid === selectedTarget.id) {
        const hName = hid && personMap[hid] ? personMap[hid].dn : '';
        const wName = wid && personMap[wid] ? personMap[wid].dn : '';
        const kidCount = (fam.children || []).length;
        fams.push({ id: fid, husband: hName, wife: wName, label: [hName, wName].filter(Boolean).join(' & '), kidCount });
      }
    }
    return fams;
  }, [selectedTarget, familyMap, personMap]);

  // Auto-select if target has exactly one family
  useEffect(() => {
    if (targetFamilies.length === 1) setSelectedFamily(targetFamilies[0]);
    else setSelectedFamily(null);
  }, [targetFamilies]);

  const isOrphan = !currentFamily;
  const canSubmit = selectedFamily && (isOrphan || selectedFamily.id !== currentFamily?.id);
  const isAdmin = user && ['admin', 'super_admin'].includes(user.role);
  const duplicateCandidates = (node.duplicateCandidates || []).filter(c => !ignoredDuplicateIds.includes(c.id));

  const duplicateFamilyOptions = useMemo(() => {
    if (!isOrphan || duplicateCandidates.length === 0) return [];
    const options = [];
    for (const c of duplicateCandidates) {
      for (const [fid, fam] of Object.entries(familyMap)) {
        const kids = fam.children || [];
        const hid = fam.husband_id || '';
        const wid = fam.wife_id || '';
        if (!kids.includes(c.id) && hid !== c.id && wid !== c.id) continue;
        const hName = hid && personMap[hid] ? personMap[hid].dn : '';
        const wName = wid && personMap[wid] ? personMap[wid].dn : '';
        options.push({
          id: fid,
          label: [hName, wName].filter(Boolean).join(' & ') || fid,
          kidCount: kids.length,
          viaPersonId: c.id,
          viaPersonName: c.dn,
          relationship: kids.includes(c.id) ? 'parent family' : 'spouse family'
        });
      }
    }
    return options.filter((opt, idx, arr) => arr.findIndex(other => other.id === opt.id) === idx);
  }, [isOrphan, duplicateCandidates, familyMap, personMap]);

  useEffect(() => {
    if (isOrphan && (node.duplicateCandidates || []).length > 0 && duplicateCandidates.length === 0) {
      setShowManualPlacement(true);
    }
  }, [isOrphan, node.duplicateCandidates, duplicateCandidates.length]);

  const handleSubmit = async () => {
    if (!canSubmit) return;
    setBusy(true); setError('');
    try {
      if (isAdmin) {
        await onMove(nodePerson.id, currentFamily?.id || null, selectedFamily.id);
      } else {
        await onRequestMove(nodePerson.id, nodePerson.dn, currentFamily || { id: null, label: '(orphan — no family)' }, selectedFamily, reason);
      }
      onClose();
    } catch (e) {
      setError(e.message);
      setBusy(false);
    }
  };

  const resolveDuplicate = async ({ keepId, removeId, preferSource, fieldSelections }) => {
    if (!onResolveDuplicate) return;
    setBusy(true);
    setError('');
    try {
      await onResolveDuplicate(keepId, removeId, { preferSource, fieldSelections });
      onClose();
    } catch (e) {
      setError(e.message || 'Duplicate resolution failed');
      setBusy(false);
    }
  };

  const duplicateKeepId = (candidateId, mode) => {
    if (mode === 'gedcom') {
      if (isLikelyGedcomPersonId(nodePerson.id) && !isLikelyGedcomPersonId(candidateId)) return nodePerson.id;
      if (isLikelyGedcomPersonId(candidateId) && !isLikelyGedcomPersonId(nodePerson.id)) return candidateId;
      return nodePerson.id;
    }
    if (mode === 'merge') {
      const candidate = duplicateCandidates.find(c => c.id === candidateId);
      if (candidate && candidate.status !== 'orphan') return candidateId;
      if (isLikelyGedcomPersonId(nodePerson.id) && !isLikelyGedcomPersonId(candidateId)) return nodePerson.id;
      if (isLikelyGedcomPersonId(candidateId) && !isLikelyGedcomPersonId(nodePerson.id)) return candidateId;
      return nodePerson.id;
    }
    return nodePerson.id;
  };

  const showDuplicateWorkflow = isOrphan && duplicateCandidates.length > 0 && !showManualPlacement;

  if (duplicateReview) {
    const candidateMeta = duplicateCandidates.find(c => c.id === duplicateReview.candidateId);
    const candidatePerson = personMap[duplicateReview.candidateId];
    if (candidateMeta && candidatePerson) {
      return (
        <DuplicateResolveModal
          orphanPerson={nodePerson}
          candidatePerson={candidatePerson}
          candidateMeta={candidateMeta}
          personMap={personMap}
          familyMap={familyMap}
          initialKeepId={duplicateReview.initialKeepId}
          busy={busy}
          onBack={() => setDuplicateReview(null)}
          onClose={onClose}
          onConfirm={resolveDuplicate}
        />
      );
    }
  }

  return (
    <div style={{ position:'fixed', inset:0, zIndex:200, display:'flex', alignItems:'center', justifyContent:'center' }}>
      <div style={{ position:'absolute', inset:0, background:'rgba(0,0,0,0.85)' }} onClick={onClose} />
      <div style={{ position:'relative', background:'#141410', border:'1px solid '+GD, borderRadius:12, width:Math.min(480, window.innerWidth-32), zIndex:201, padding:24 }}>
        <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:16 }}>
          <span style={{ fontSize:18, color:GC, fontWeight:500 }}>{isOrphan ? '📌 Place in Family' : '🔀 Move Branch'}</span>
          <span onClick={onClose} style={{ fontSize:20, color:DM, cursor:'pointer' }}>✕</span>
        </div>

        {/* Person being moved */}
        <div style={{ display:'flex', alignItems:'center', gap:8, marginBottom:20, padding:10, background:'rgba(196,163,90,0.06)', borderRadius:8, border:'1px solid '+BR }}>
          <span style={{ width:10, height:10, borderRadius:'50%', background: nodePerson.g==='M'?MC:FC }} />
          <span style={{ color:TX, fontSize:15, fontWeight:500 }}>{nodePerson.dn}</span>
        </div>

        {/* FROM */}
        <div style={{ marginBottom:16 }}>
          <div style={{ fontSize:11, color:DM, textTransform:'uppercase', letterSpacing:2, marginBottom:6 }}>From (current parent)</div>
          {currentFamily ? (
            <div style={{ padding:10, background:'rgba(192,80,80,0.06)', border:'1px solid rgba(192,80,80,0.2)', borderRadius:8 }}>
              <div style={{ fontSize:14, color:TX }}>{currentFamily.label}</div>
              <div style={{ fontSize:10, color:DM, marginTop:2 }}>{currentFamily.id}</div>
            </div>
          ) : (
            <div style={{ padding:10, background:'rgba(196,163,90,0.08)', border:'1px solid rgba(196,163,90,0.25)', borderRadius:8 }}>
              <div style={{ fontSize:13, color:'#c4a35a', fontWeight:500 }}>⚠ Orphan — not connected to any family</div>
              <div style={{ fontSize:11, color:DM, marginTop:4 }}>This person exists in the database but isn't listed as a child, husband, or wife in any family record. Choose a family below to place them.</div>
            </div>
          )}
        </div>

        {/* TO */}
        <div style={{ marginBottom:16 }}>
          <div style={{ fontSize:11, color:DM, textTransform:'uppercase', letterSpacing:2, marginBottom:6 }}>To (new parent)</div>
          {showDuplicateWorkflow && (
            <div style={{ marginBottom:12, padding:12, background:'rgba(208,160,126,0.05)', border:'1px solid rgba(208,160,126,0.18)', borderRadius:8 }}>
              <div style={{ fontSize:13, color:'#d0a07e', fontWeight:500, marginBottom:4 }}>Possible Duplicate Found</div>
              <div style={{ fontSize:12, color:DM, lineHeight:1.5, marginBottom:10 }}>
                This orphan looks like someone already in FTLS. Reconcile the duplicate here first, or ignore it and place the person manually.
              </div>
              {duplicateCandidates.map(c => {
                const keepGedcomId = duplicateKeepId(c.id, 'gedcom');
                const keepMergeId = duplicateKeepId(c.id, 'merge');
                return (
                  <div key={c.id} style={{ marginTop:8, padding:10, background:'rgba(255,255,255,0.02)', border:'1px solid '+BR, borderRadius:8 }}>
                    <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', gap:10 }}>
                      <div>
                        <div style={{ color:TX, fontSize:13 }}>{c.dn}</div>
                        <div style={{ color:DM, fontSize:10, marginTop:2 }}>{c.id} · score {c.score} · {c.status}</div>
                      </div>
                      <div style={{ display:'flex', gap:6, flexWrap:'wrap', justifyContent:'flex-end' }}>
                        <button disabled={busy} onClick={() => setDuplicateReview({ candidateId: c.id, initialKeepId: keepMergeId })}
                          style={{ background:'rgba(107,158,114,0.12)', border:'1px solid rgba(107,158,114,0.3)', color:MC, padding:'4px 10px', borderRadius:5, cursor:'pointer', fontSize:11 }}>

/* ───── PRUNE ORPHAN META MODAL ─────
   Lets an admin find and archive rows in gedcom_meta (OBJE photo refs, orphan
   NOTEs, etc.) that are no longer referenced by any live person/family record.
   Runs a dry-run first so the admin sees exactly what will be archived before
   committing. Archived rows land in gedcom_meta_archive and can be restored. */
function PruneOrphanMetaModal({ onClose, user }) {
  const [phase, setPhase] = useState('idle'); // idle | scanning | preview | running | done | error

  const [result, setResult] = useState(null);
  const [error, setError] = useState('');
  const [expanded, setExpanded] = useState(false);

  const runDryRun = async () => {
    setPhase('scanning');
    setError('');
    try {
      const p = await pruneOrphanMeta({ dryRun: true });
      setPreview(p);
      setPhase(p.totalCandidates === 0 ? 'done' : 'preview');
    } catch (e) {
      setError(e.message);
      setPhase('error');
    }
  };

  const runPrune = async () => {
    if (!confirm(`Archive ${preview.totalCandidates} orphan gedcom_meta row${preview.totalCandidates === 1 ? '' : 's'}?\n\nRows will be moved to gedcom_meta_archive and can be restored individually if needed. This is not a hard delete.\n\nContinue?`)) return;
    setPhase('running');
    setError('');
    try {
      const r = await pruneOrphanMeta({
        dryRun: false,
        user: user?.email || 'admin',
        reason: 'manual_admin_prune'
      });
      setResult(r);
      setPhase('done');
    } catch (e) {
      setError(e.message);
      setPhase('error');

  // Kick off dry-run on first open
  useEffect(() => { runDryRun(); /* eslint-disable-line */ }, []);

  const btn = { padding: '8px 18px', borderRadius: 6, cursor: 'pointer', fontSize: 13, border: '1px solid' };
  const cardCount = preview?.counts || {};

  return (
    <div style={{ position:'fixed', inset:0, background:'rgba(10,10,8,0.85)', zIndex:200, display:'flex', alignItems:'center', justifyContent:'center', padding:20 }}>
      <div style={{ background:'#141410', border:'1px solid '+BR, borderRadius:10, maxWidth:640, width:'100%', maxHeight:'85vh', display:'flex', flexDirection:'column' }}>

          <div style={{ fontSize:12, color:DM, lineHeight:1.6, marginBottom:16 }}>

            Matches are moved to <code style={{ color:TX }}>gedcom_meta_archive</code> — not hard-deleted —
            so they can be restored one at a time if needed.
          </div>

          {phase === 'scanning' && (
            <div style={{ color:DM, fontSize:13, padding:20, textAlign:'center' }}>Scanning…</div>

          {phase === 'error' && (
            <div style={{ color:'#c45a5a', fontSize:13, padding:12, background:'rgba(196,90,90,0.08)', borderRadius:6 }}>
              Error: {error}

          {preview && phase !== 'scanning' && (<>
            <div style={{ fontSize:14, color:TX, marginBottom:10 }}>
              Found <span style={{ color:GC, fontWeight:500 }}>{preview.totalCandidates}</span> orphan record{preview.totalCandidates === 1 ? '' : 's'}
              {phase === 'done' && result && ` — archived ${result.archived}`}
            </div>
            {preview.totalCandidates > 0 && (
              <div style={{ background:'rgba(196,163,90,0.04)', border:'1px solid '+BR, borderRadius:6, padding:12, marginBottom:12 }}>
                <div style={{ display:'grid', gridTemplateColumns:'1fr auto', gap:'4px 12px', fontSize:12 }}>
                  {Object.entries(cardCount).map(([type, n]) => (

function BackfillModal({onClose, onComplete}) {
  const [status, setStatus] = useState('idle'); // idle | parsing | preview | running | done
  const [log, setLog] = useState([]);
  const [preview, setPreview] = useState(null);
  const [progress, setProgress] = useState('');
  const fileRef = useRef(null);

  const addLog = (msg) => setLog(prev => [...prev, msg]);

  // Parse address from GEDCOM RESI data
  function parseAddress(addr) {
    if (!addr) return null;
    addr = addr.trim();
    let m = addr.match(/^(.+?),(.+?),,([A-Z]{2})-(\d{5}(?:-\d{4})?),USA$/);
    if (m) return {a1:m[1].trim(),ci:m[2].trim(),st:m[3],zp:m[4],co:'US'};
    m = addr.match(/^(.+?),\s*(.+?),\s*([A-Z]{2})\s+(\d{5}(?:-\d{4})?)$/);
    if (m) return {a1:m[1].trim(),ci:m[2].trim(),st:m[3],zp:m[4],co:'US'};
    m = addr.match(/^(.+?),\s*(.+?),\s*([A-Z]{2})\s*(\d{5})$/);
    if (m) return {a1:m[1].trim(),ci:m[2].trim(),st:m[3],zp:m[4],co:'US'};
    m = addr.match(/^(.+?),\s*(.+?),\s*([A-Z]{2}\d+\s+\d[A-Z]{2})\s+UK$/);
    if (m) return {a1:m[1].trim(),ci:m[2].trim(),zp:m[3],co:'GB'};
    if (addr.includes('India')) return {a1:addr,co:'IN'};
    if (!addr.includes(',') && addr.length < 30) return {ci:addr};
    return {a1:addr};
  }

  async function handleFile(e) {
    const file = e.target.files[0];
    if (!file) return;
    setStatus('parsing');
    setLog([]);
    addLog(`Reading ${file.name}...`);

    const text = await file.text();
    const raw = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
    const lines = raw.split('\n').filter(l => l.trim());

    // ─── Parse ALL standalone top-level records (NOTE, OBJE, REPO, SOUR, ───
    // ─── _STO, _STE, _STF, _PTF, _PTE, LABL, and any future types)     ───
    // Skip: INDI (persons), FAM (families), HEAD, TRLR, SUBM (structural)
    const SKIP_TOP_LEVEL = new Set(['INDI','FAM','HEAD','TRLR','SUBM']);
    const metaRecords = []; // {id, record_type, raw}
    const notes = {};       // id → {text, raw} for NOTE records (also used for inline note refs)
    let curMetaId = null, curMetaType = null, curMetaRaw = [];
    let noteTextLines = []; // for building notes text
    for (const line of lines) {
      const trimmed = line.trim();
      const parts = trimmed.split(' ', 3);
      if (parts[0] === '0') {
        // Flush previous record
        if (curMetaId && curMetaType) {
          const rawStr = curMetaRaw.join('\n');
          metaRecords.push({id: curMetaId, record_type: curMetaType, raw: rawStr});
          if (curMetaType === 'NOTE') notes[curMetaId] = {text: noteTextLines.join('\n'), raw: rawStr};
        }
        curMetaId = null; curMetaType = null; curMetaRaw = []; noteTextLines = [];
        // Check if this is a top-level record we should capture
        const m = trimmed.match(/^0\s+(@[^@]+@)\s+(\S+)(.*)/);
        if (m && !SKIP_TOP_LEVEL.has(m[2])) {
          curMetaId = m[1]; curMetaType = m[2]; curMetaRaw = [trimmed];
          if (curMetaType === 'NOTE' && m[3]) noteTextLines.push(m[3].trim());
        }
      } else if (curMetaId) {
        curMetaRaw.push(trimmed);
        // Build note text for NOTE records
        if (curMetaType === 'NOTE' && parts.length > 1 && (parts[1] === 'CONT' || parts[1] === 'CONC')) {
          const v = trimmed.split(' ', 3)[2] || '';
          if (parts[1] === 'CONT') noteTextLines.push(v);
          else if (noteTextLines.length) noteTextLines[noteTextLines.length-1] += v; else noteTextLines.push(v);
        }
      }
    }
    // Flush last record
    if (curMetaId && curMetaType) {
      const rawStr = curMetaRaw.join('\n');
      metaRecords.push({id: curMetaId, record_type: curMetaType, raw: rawStr});
      if (curMetaType === 'NOTE') notes[curMetaId] = {text: noteTextLines.join('\n'), raw: rawStr};
    }
    // Build objeRecords lookup for backward compat (used by _xg OBJE reference check)
    const objeRecords = {};
    metaRecords.filter(r => r.record_type === 'OBJE').forEach(r => { objeRecords[r.id] = r.raw; });

    // ─── Parse INDI records for extra data ───
    // Uses module-level KNOWN_INDI_L1 const defined near the top of file.

    const personExtras = {}; // pid → {extraLines, address, titlePrefix, burialDate, prof}
    let inIndi = false, curPid = null, curBlock = [];

    function processBlock(pid, block) {
      const result = {extraLines:[], address:null, titlePrefix:'', burialDate:'', prof:''};
      let i = 0;
      while (i < block.length) {
        const p = block[i].trim().split(' ', 3);
        const lv = p[0], tag = p[1] || '', val = p[2] || '';
        
        function collectBlock(startI) {
          const out = [block[startI].trim()];
          let j = startI + 1;
          while (j < block.length) {
            const np = block[j].trim().split(' ', 3);
            if (np[0] === '1' || np[0] === '0') break;
            out.push(block[j].trim());
            j++;
          }
          return [out, j];
        }

        if (lv === '1') {
          if (tag === 'OBJE') {
            const [bl, ni] = collectBlock(i); result.extraLines.push(...bl); i = ni; continue;
          }
          if (tag === 'BURI') {
            const [bl, ni] = collectBlock(i); result.extraLines.push(...bl);
            for (const cl of bl) { const cp = cl.trim().split(' ',3); if (cp[1]==='DATE'&&cp[2]) result.burialDate=cp[2]; }
            i = ni; continue;
          }
          if (tag === 'RESI') {
            const [bl, ni] = collectBlock(i); result.extraLines.push(...bl);
            for (const cl of bl) {
              const cp = cl.trim().split(' ', 3);
              if (cp[1]==='NOTE' && cp[2] && cp[2].startsWith('@') && notes[cp[2]]) {
                result.address = parseAddress(notes[cp[2]].text);
              } else if (cp[1]==='PLAC' && cp[2] && !result.address) {
                result.address = parseAddress(cp[2]);
              }
            }
            i = ni; continue;
          }
          if (tag === 'NAME') {
            i++;
            while (i < block.length) {
              const np = block[i].trim().split(' ', 3);
              if (np[0]==='1'||np[0]==='0') break;
              if (np[1]==='NPFX'&&np[2]) result.titlePrefix = np[2];
              if (np[1]==='_CRE') { const [bl2,ni2]=collectBlock(i); result.extraLines.push(...bl2); i=ni2; continue; }
              i++;
            }
            continue;
          }
          if (['_CRE','_STP','_STO','CHAN'].includes(tag)) {
            const [bl, ni] = collectBlock(i); result.extraLines.push(...bl); i = ni; continue;
          }
          if (tag === 'OCCU') {
            result.prof = val;
            const [bl, ni] = collectBlock(i);
            for (const cl of bl.slice(1)) result.extraLines.push(cl);
            i = ni; continue;
          }
          if (!KNOWN_INDI_L1.has(tag)) {
            const [bl, ni] = collectBlock(i); result.extraLines.push(...bl); i = ni; continue;
          }
        }
        i++;
      }
      return result;
    }

    for (const line of lines) {
      const stripped = line.trim();
      const parts = stripped.split(' ', 3);
      if (parts[0] === '0') {
        if (inIndi && curPid && curBlock.length) personExtras[curPid] = processBlock(curPid, curBlock);
        const im = stripped.match(/^0 (@[^@]+@) INDI/);
        inIndi = !!im; curPid = im ? im[1] : null; curBlock = [];
      } else if (inIndi) { curBlock.push(stripped); }
    }
    if (inIndi && curPid && curBlock.length) personExtras[curPid] = processBlock(curPid, curBlock);

    // ─── Parse FAM extra data ───
    // Uses module-level KNOWN_FAM_L1 const defined near the top of file.
    const famExtras = {};
    let inFam = false, famId = null, famBlock = [];
    for (const line of lines) {
      const stripped = line.trim();
      const parts = stripped.split(' ', 3);
      if (parts[0] === '0') {
        if (inFam && famId && famBlock.length) {
          const extra = [];
          let fi = 0;
          while (fi < famBlock.length) {
            const fp = famBlock[fi].trim().split(' ',3);
            if (fp[0]==='1' && !KNOWN_FAM_L1.has(fp[1])) {
              extra.push(famBlock[fi].trim());
              fi++;
              while (fi < famBlock.length) { const np=famBlock[fi].trim().split(' ',3); if(np[0]==='1')break; extra.push(famBlock[fi].trim()); fi++; }
              continue;
            }
            fi++;
          }
          if (extra.length) famExtras[famId] = extra.join('\n');
        }
        const fm = stripped.match(/^0 (@[^@]+@) FAM/);
        inFam = !!fm; famId = fm ? fm[1] : null; famBlock = [];
      } else if (inFam) { famBlock.push(stripped); }
    }

    // ─── Match against existing DB ───
    addLog('Loading current persons from Supabase...');
    let dbPersons, dbFamilies;
    try {
      dbPersons = await sbFetch('persons?select=id,display_name,address1,city,state,zip,country,profession,title_prefix,burial_date,_extra_gedcom');
      dbFamilies = await sbFetch('families?select=id,_extra_gedcom');
    } catch(e) { addLog('ERROR: ' + e.message); setStatus('idle'); return; }

    const dbPMap = {};
    dbPersons.forEach(p => dbPMap[p.id] = p);
    const dbFMap = {};
    dbFamilies.forEach(f => dbFMap[f.id] = f);

    // Build preview
    const updates = { persons: [], families: [], meta: [] };

    for (const [pid, data] of Object.entries(personExtras)) {
      if (!dbPMap[pid]) continue; // Not in DB — skip (don't add new people)
      const db = dbPMap[pid];
      const changes = {};
      
      // Only fill _extra_gedcom if currently empty
      if (data.extraLines.length > 0 && (!db._extra_gedcom || db._extra_gedcom === '')) {
        changes._extra_gedcom = data.extraLines.join('\n');
      }
      // Fill address fields only if currently empty
      if (data.address) {
        if (data.address.a1 && (!db.address1 || db.address1 === '')) changes.address1 = data.address.a1;
        if (data.address.ci && (!db.city || db.city === '')) changes.city = data.address.ci;
        if (data.address.st && (!db.state || db.state === '')) changes.state = data.address.st;
        if (data.address.zp && (!db.zip || db.zip === '')) changes.zip = data.address.zp;
        if (data.address.co && (!db.country || db.country === '')) changes.country = data.address.co;
      }
      if (data.titlePrefix && (!db.title_prefix || db.title_prefix === '')) changes.title_prefix = data.titlePrefix;
      if (data.burialDate && (!db.burial_date || db.burial_date === '')) changes.burial_date = data.burialDate;
      if (data.prof && (!db.profession || db.profession === '')) changes.profession = data.prof;

      if (Object.keys(changes).length > 0) {
        updates.persons.push({id: pid, name: db.display_name, changes});
      }
    }

    for (const [fid, extra] of Object.entries(famExtras)) {
      if (!dbFMap[fid]) continue;
      if (!dbFMap[fid]._extra_gedcom || dbFMap[fid]._extra_gedcom === '') {
        updates.families.push({id: fid, changes: {_extra_gedcom: extra}});
      }
    }

    for (const rec of metaRecords) updates.meta.push(rec);

    const hasAddr = updates.persons.filter(p => p.changes.address1 || p.changes.city).length;
    const hasExtra = updates.persons.filter(p => p.changes._extra_gedcom).length;
    const hasTitle = updates.persons.filter(p => p.changes.title_prefix).length;
    const hasBuri = updates.persons.filter(p => p.changes.burial_date).length;

    addLog(`Parsed: ${Object.keys(personExtras).length} persons, ${Object.keys(famExtras).length} families`);
    addLog(`Matched to DB: ${updates.persons.length} persons with changes, ${updates.families.length} families`);
    addLog(`  → ${hasAddr} addresses, ${hasTitle} titles, ${hasBuri} burial dates, ${hasExtra} extra GEDCOM blocks`);
    const metaByType = {};
    updates.meta.forEach(m => { metaByType[m.record_type] = (metaByType[m.record_type]||0) + 1; });
    const metaSummary = Object.entries(metaByType).map(([t,c]) => `${c} ${t}`).join(', ');
    addLog(`  → ${updates.meta.length} meta records (${metaSummary})`);


    setPreview(updates);
    setStatus('preview');
  }

  async function runBackfill() {
    if (!preview) return;
    setStatus('running');
    let successP = 0, successF = 0, successM = 0, errors = 0;

    // Update persons in batches
    for (let i = 0; i < preview.persons.length; i++) {
      const {id, changes} = preview.persons[i];
      try {
        await sbFetch(`persons?id=eq.${encodeURIComponent(id)}`, {
          method: 'PATCH',
          body: JSON.stringify(changes),
          headers: {'Prefer': 'return=minimal'}
        });
        successP++;
      } catch(e) { errors++; if (errors <= 5) addLog(`Error ${id}: ${e.message}`); }
      if (i % 20 === 0) setProgress(`Persons: ${i+1}/${preview.persons.length}`);
    }
    addLog(`Persons updated: ${successP} (${errors} errors)`);

    // Update families
    setProgress('Updating families...');
    for (const {id, changes} of preview.families) {
      try {
        await sbFetch(`families?id=eq.${encodeURIComponent(id)}`, {
          method: 'PATCH',
          body: JSON.stringify(changes),
          headers: {'Prefer': 'return=minimal'}
        });
        successF++;
      } catch(e) { errors++; }
    }
    addLog(`Families updated: ${successF}`);

    // Insert gedcom_meta (all top-level records: OBJE, NOTE, SOUR, _STO, _STE, _STF, _PTF, _PTE, LABL, REPO, etc.)
    setProgress('Inserting meta records...');
    const allMeta = preview.meta.map(m => ({id: m.id, record_type: m.record_type, raw_gedcom: m.raw}));
    // Batch insert
    for (let i = 0; i < allMeta.length; i += 20) {
      const batch = allMeta.slice(i, i + 20);
      try {
        await sbFetch('gedcom_meta?on_conflict=id', {
          method: 'POST',
          body: JSON.stringify(batch),
          headers: {'Prefer': 'return=minimal,resolution=merge-duplicates'}
        });
        successM += batch.length;
      } catch(e) { 
        // Fall back to individual inserts
        for (const item of batch) {
          try {
            await sbFetch('gedcom_meta?on_conflict=id', {
              method: 'POST', body: JSON.stringify(item),
              headers: {'Prefer': 'return=minimal,resolution=merge-duplicates'}
            });
            successM++;
          } catch(e2) { errors++; }
        }
      }
    }
    addLog(`Gedcom_meta inserted: ${successM}`);
    addLog(`Done! ${successP} persons, ${successF} families, ${successM} meta records. ${errors} errors.`);
    setProgress('');
    setStatus('done');
  }

  const overlay = {position:'fixed',top:0,left:0,right:0,bottom:0,background:'rgba(0,0,0,0.7)',zIndex:400,display:'flex',alignItems:'center',justifyContent:'center'};
  const modal = {background:'#141410',border:'1px solid rgba(90,163,196,0.2)',borderRadius:12,width:Math.min(600,window.innerWidth-32),maxHeight:'80vh',overflow:'auto',padding:28};
  const btnPrimary = {background:'rgba(90,163,196,0.15)',border:'1px solid rgba(90,163,196,0.4)',color:'#5aa3c4',padding:'10px 24px',borderRadius:6,cursor:'pointer',fontSize:14,fontWeight:500};

  return (
    <div style={overlay} onClick={onClose}>
      <div style={modal} onClick={e=>e.stopPropagation()}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>
          <div style={{fontSize:18,color:'#5aa3c4',fontWeight:300}}>📦 Backfill GEDCOM Extras</div>
          <span onClick={onClose} style={{color:'#7a7568',cursor:'pointer',fontSize:20}}>✕</span>
        </div>
        <div style={{fontSize:12,color:'#7a7568',lineHeight:1.6,marginBottom:16}}>
          Upload the original GEDCOM file. This will safely populate <strong style={{color:'#d4cfc0'}}>_extra_gedcom</strong> (OBJE, RESI, BURI, CHAN, _CRE),
          plus address, title prefix, burial date, and profession fields — <strong style={{color:'#6b9e72'}}>only where the DB field is currently empty</strong>. 
          It matches by person ID and never touches names, family links, or existing data.
        </div>

        {status==='idle'&&<div>
          <input ref={fileRef} type="file" accept=".ged,.GED" onChange={handleFile} style={{display:'none'}}/>
          <button onClick={()=>fileRef.current?.click()} style={btnPrimary}>Choose GEDCOM File</button>
        </div>}

        {log.length > 0 && <div style={{background:'#0a0a08',border:'1px solid rgba(90,163,196,0.1)',borderRadius:6,padding:12,marginTop:12,maxHeight:200,overflow:'auto',fontSize:12,fontFamily:'monospace',color:'#8a8578',lineHeight:1.8}}>
          {log.map((l,i) => <div key={i}>{l}</div>)}
        </div>}

        {progress && <div style={{fontSize:12,color:'#5aa3c4',marginTop:8}}>{progress}</div>}

        {status==='preview'&&preview&&<div style={{marginTop:16}}>
          <div style={{fontSize:14,color:'#d4cfc0',marginBottom:8}}>Preview — {preview.persons.length} persons, {preview.families.length} families, {preview.meta.length} meta records</div>
          <div style={{maxHeight:200,overflow:'auto',fontSize:11,fontFamily:'monospace',background:'#0a0a08',borderRadius:6,padding:10,border:'1px solid rgba(196,163,90,0.1)'}}>
            {preview.persons.slice(0,30).map((p,i) => {
              const fields = Object.keys(p.changes).filter(k => k !== '_extra_gedcom');
              const hasXg = !!p.changes._extra_gedcom;
              return <div key={i} style={{color:'#8a8578',marginBottom:2}}>
                <span style={{color:'#c4a35a'}}>{p.name || p.id}</span>: {fields.length > 0 ? fields.join(', ') : ''}{hasXg ? (fields.length > 0 ? ' + ' : '') + '_extra_gedcom' : ''}
              </div>;
            })}
            {preview.persons.length > 30 && <div style={{color:'#5a5548'}}>... and {preview.persons.length - 30} more</div>}
          </div>
          <div style={{display:'flex',gap:12,marginTop:16}}>
            <button onClick={runBackfill} style={btnPrimary}>✓ Run Backfill ({preview.persons.length} persons)</button>
            <button onClick={onClose} style={{...btnPrimary,background:'transparent',color:'#7a7568',borderColor:'rgba(122,117,104,0.3)'}}>Cancel</button>
          </div>
        </div>}

        {status==='done'&&<div style={{marginTop:16}}>
          <button onClick={onComplete} style={btnPrimary}>✓ Close &amp; Refresh Tree</button>
        </div>}
      </div>
    </div>
  );
}

function App(){
  const [tree,setTree]=useState(null);
  const [personMap,setPersonMap]=useState({});
  const [familyMap,setFamilyMap]=useState({});
  const [loading,setLoading]=useState(true);
  const [exp,setExp]=useState(new Set());
  const [sel,setSel]=useState(null);
  const [search,setSearch]=useState('');
  const [hl,setHl]=useState(null);
  const [editing,setEditing]=useState(null);
  const [adding,setAdding]=useState(null);
  const [spouseEditing,setSpouseEditing]=useState(null); // {parentId, famId, spouse}
  const [addingToFam,setAddingToFam]=useState(null); // famId when adding child to specific marriage
  const [choosingFamFor,setChoosingFamFor]=useState(null); // node whose + was clicked but has >1 marriage
  const [msg,setMsg]=useState('');
  const [showLogin,setShowLogin]=useState(false);
  const [showRequestAccount,setShowRequestAccount]=useState(false);
  const [showMigrate,setShowMigrate]=useState(false);
  const [pendingAction,setPendingAction]=useState(null);
  const [user,setUser]=useState(()=>authUser||null); // restore from session
  const [activeTab,setActiveTab]=useState('tree');
  const [viewerGate,setViewerGate]=useState(()=>!authUser); // false if already signed in
  const [gatePassword,setGatePassword]=useState('');
  const [gateError,setGateError]=useState('');
  const [gateChecking,setGateChecking]=useState(false);
  const [showPasswordReset,setShowPasswordReset]=useState(false);
  const [resetToken,setResetToken]=useState(null);
  const [showDiff,setShowDiff]=useState(false);
  const [showBackfill,setShowBackfill]=useState(false);
  const [showPrune,setShowPrune]=useState(false);
  const [movingBranch,setMovingBranch]=useState(null); // person node to move
  const flat=useMemo(()=>tree?flattenAll(tree):[],[tree]);
  const currentRole = user?.role || authUser?.role || null;
  const userIsAdmin = ['admin','super_admin'].includes(currentRole);
  const userIsEditor = currentRole === 'editor';
  const userIsViewer = currentRole === 'viewer';

  useEffect(()=>{
    if (!authSession?.access_token) return;
    let cancelled = false;
    const refresh = async () => {
      const fresh = await refreshAuthUserProfile();
      if (!cancelled && fresh) {
        setUser(fresh);
        setViewerGate(false);
      }
    };
    refresh();
    const onFocus = () => refresh();
    const onVisibility = () => { if (!document.hidden) refresh(); };
    window.addEventListener('focus', onFocus);
    document.addEventListener('visibilitychange', onVisibility);
    return () => {
      cancelled = true;
      window.removeEventListener('focus', onFocus);
      document.removeEventListener('visibilitychange', onVisibility);
    };
  },[]);

  // Detect password recovery token in URL on load
  useEffect(()=>{
    try {
      // Check hash params first (Supabase implicit flow)
      const hash = window.location.hash;
      if (hash && hash.length > 1) {
        const params = new URLSearchParams(hash.substring(1));
        const type = params.get('type');
        const accessToken = params.get('access_token');
        if (type === 'recovery' && accessToken) {
          setResetToken(accessToken);
          setShowPasswordReset(true);
          setViewerGate(false);
          window.history.replaceState(null, '', window.location.pathname);
          return;
        }
      }
      // Check query params (Supabase PKCE flow sends ?code=...&type=recovery)
      const urlParams = new URLSearchParams(window.location.search);
      const qType = urlParams.get('type');
      const qCode = urlParams.get('code');
      if (qType === 'recovery' && qCode) {
        // Exchange the code for a session token
        (async()=>{
          try {
            const data = await sbAuthFetch('/token?grant_type=pkce', {
              method: 'POST',
              body: JSON.stringify({ auth_code: qCode, code_verifier: sessionStorage.getItem('code_verifier') || '' })
            });
            if (data.access_token) {
              setResetToken(data.access_token);
              setShowPasswordReset(true);
              setViewerGate(false);
              window.history.replaceState(null, '', window.location.pathname);
            }
          } catch(e) {
            // Fallback: if PKCE exchange fails, try using the code directly as a token
            // Some Supabase configs pass access_token in query params too
            const qToken = urlParams.get('access_token');
            if (qToken) {
              setResetToken(qToken);
              setShowPasswordReset(true);
              setViewerGate(false);
              window.history.replaceState(null, '', window.location.pathname);
            } else {
              console.error('Recovery code exchange failed:', e);
            }
          }
        })();
      }
    } catch(e) { console.error('Recovery detection error:', e); }
  },[]);

  // Auth gate: require login for edit actions
  const requireAuth = useCallback((action) => {
    if (user && (canEdit() || user.role === 'viewer')) {
      // Viewers AND editors/admins can open edit forms
      // The save handler routes differently based on role
      action();
    } else {
      setPendingAction(() => action);
      setShowLogin(true);
    }
  }, [user]);

  const handleLoginSuccess = (u) => {
    setUser(u);
    setShowLogin(false);
    setViewerGate(false); // signed-in users bypass the gate
    if (u.role !== 'viewer') {
      setMsg('Signed in as ' + (u.name || u.email));
    }
    setTimeout(()=>setMsg(''),3000);
    if (pendingAction) { pendingAction(); setPendingAction(null); }
  };

  const handleSignOut = async () => {
    await signOut();
    setUser(null);
    setActiveTab('tree');
    setViewerGate(true); // re-lock on sign out
    setMsg('Signed out');
    setTimeout(()=>setMsg(''),2000);
  };

  const handleViewerGate = async () => {
    if (!gatePassword) { setGateError('Enter the family password'); return; }
    setGateChecking(true); setGateError('');
    try {
      const settings = await sbFetch("settings?key=eq.viewer_password&select=value");
      if (settings[0]?.value === gatePassword) {
        setViewerGate(false);
        setUser({ role: 'viewer', name: 'Viewer' });
      } else {
        setGateError('Incorrect password. Ask a family member for access.');
      }
    } catch (e) {
      setGateError('Could not verify. Try again.');
    }
    setGateChecking(false);
  };

  // Reusable tree loader
  const reloadTree = useCallback(async (silent=false) => {
    let result = await loadFromSupabase();
    let source = 'Supabase';
    if(!result){
      result = await loadSourceGedcom();
      source = 'GEDCOM file';
    }
    if(result){
      // result can be {tree, personMap, familyMap} or just a tree node (from GEDCOM)
      const treeNode = result.tree || result;
      const pMap = result.personMap || {};
      const fMap = result.familyMap || {};
      setTree(treeNode);
      setPersonMap(pMap);
      setFamilyMap(fMap);
      const s=new Set();
      const add=(n,d)=>{if(d<2&&n.ch?.length){s.add(n.id);n.ch.forEach(c=>add(c,d+1))}};
      add(treeNode,0);
      setExp(s);
      if(!silent){
        const totalPeople = Object.keys(pMap).length || cnt(treeNode);
        setMsg('Loaded '+totalPeople+' people from '+source);
        setTimeout(()=>setMsg(''),3000);
      }
    } else if(!silent) {
      setMsg('Failed to load family tree');
    }
    return result;
  },[]);

  // Load on mount
  useEffect(()=>{
    reloadTree().then(()=>setLoading(false));
  },[]);

  const findNodeById=useCallback((root,id)=>{
    if(!root)return null;
    if(root.id===id)return root;
    // Search all marriages' spouses
    for(const m of root.spouses||[]){
      if(m.sp?.id===id)return m.sp;
    }
    if(!root.spouses&&root.sp?.id===id)return root.sp;
    for(const c of root.ch||[]){
      const found=findNodeById(c,id);
      if(found)return found;
    }
    return null;
  },[]);

  const getAncestorIds=useCallback((root,id)=>{
    const path=findPath(root,id)||[];
    return path.slice(0,-1).map(n=>n.id);
  },[]);

  const updateNode=useCallback((root,id,updater)=>{
    if(root.id===id)return updater(root);
    if(!root.ch)return root;
    return {...root,ch:root.ch.map(c=>updateNode(c,id,updater))};
  },[]);

  const removeNode=useCallback((root,targetId)=>{
    if(!root.ch)return root;
    return {...root,ch:root.ch.filter(c=>c.id!==targetId).map(c=>removeNode(c,targetId))};
  },[]);

  const toggle=useCallback(id=>{
    setExp(p=>{const n=new Set(p);n.has(id)?n.delete(id):n.add(id);return n});
  },[]);

  const expandAll=()=>{const s=new Set();flat.forEach(n=>{if(n.ch?.length)s.add(n.id)});setExp(s)};
  const collapseAll=()=>setExp(new Set());
  const expandTo=d=>{const s=new Set();const add=(n,depth)=>{if(depth<d&&n.ch?.length){s.add(n.id);n.ch.forEach(c=>add(c,depth+1))}};add(tree,0);setExp(s)};

  const matches=useMemo(()=>{
    if(search.length<2)return[];
    const q=search.toLowerCase();
    return flat.filter(n=>(n.dn||'').toLowerCase().includes(q)||(n.nk||'').toLowerCase().includes(q))
      .map(n=>({...n, _matchType: n._isSpouse ? 'spouse' : 'person', _spouseOf: n._spouseOfName || ''}))
      .slice(0,15);
  },[search,flat]);

  const revealNode=useCallback((nodeId,opts={})=>{
    const ancestorIds=getAncestorIds(tree,nodeId);
    setExp(p=>{
      const s=new Set(p);
      ancestorIds.forEach(id=>s.add(id));
      return s;
    });
    setHl(nodeId);
    if(opts.select){
      const latest=findNodeById(tree,nodeId);
      if(latest)setSel(latest);
    }
    setTimeout(()=>setHl(null),2000);
  },[tree,getAncestorIds,findNodeById]);

  const navigateTo=useCallback(node=>{
    // If this is a spouse result, reveal/select the parent node that contains them
    const targetId = node._isSpouse ? (node._spouseOfId || node.id) : node.id;
    revealNode(targetId,{select:true});
    setSearch('');
  },[revealNode]);

  // State for viewer submission flow
  const [viewerSubmitData, setViewerSubmitData] = useState(null); // {personId, personName, changes, type}
  const [showViewerIdentity, setShowViewerIdentity] = useState(false);

  // Returns true if this edit should go to approval queue instead of direct DB.
  // Use the refreshed React user role here, not only the module-level cached
  // authUser, so a promoted admin does not keep behaving like an editor.
  const needsApproval = (targetPersonId) => {
    if (userIsAdmin) return false; // admins always direct
    if (userIsViewer) return true; // viewers always request
    // Editors: check scope
    if (userIsEditor && !canEditorDirectEdit(targetPersonId, tree, personMap, familyMap)) return true;
    return false;
  };

  const openEditForNode = (node) => {
    if (!node) return;
    setEditing(findNodeById(tree,node.id)||node);
  };

  const handleSaveEdit=(data)=>{
    const dataToSave = stripInternalEditFields(data);
    if (needsApproval(data.id)) {
      const node = findNodeById(tree, data.id);
      // Compute diff: only fields that actually changed
      const skipKeys = new Set(['id','ch','sp','gen','_fams','_famc','_p','_n','_matchType','_spouseOf','_isSpouse','_spouseOfId','_spouseOfName','_mt','_spOf','dn','_mftStoryRecords','_mftStoryDirty']);
      const changedFields = {};
      const prevFields = {};
      for (const [k, v] of Object.entries(data)) {
        if (skipKeys.has(k)) continue;
        const oldRaw = node?.[k];
        const newRaw = v;
        // Normalize both to strings for comparison, treating undefined/null/0/false as ''
        const oldVal = (oldRaw === undefined || oldRaw === null || oldRaw === false || oldRaw === 0) ? '' : String(oldRaw).trim();
        const newVal = (newRaw === undefined || newRaw === null || newRaw === false || newRaw === 0) ? '' : String(newRaw).trim();
        if (oldVal !== newVal && (oldVal || newVal)) {
          changedFields[k] = v;
          prevFields[k] = oldRaw || '';
        }
      }
      if (Object.keys(changedFields).length === 0) {
        setMsg('No changes detected');
        setTimeout(()=>setMsg(''),2000);
        setEditing(null);
        return;
      }
      setViewerSubmitData({ personId: data.id, personName: node?.dn || data.dn || data.id, changes: changedFields, previous: prevFields, type: 'edit' });
      setShowViewerIdentity(true);
      setEditing(null);
      return;
    }
    let updatedNodeId=dataToSave.id;
    setTree(prev=>{
      const next=updateNode(prev,dataToSave.id,(existing)=>({...existing,...dataToSave,ch:existing.ch||[],sp:existing.sp}));
      return next;
    });
    // Keep personMap in sync
    setPersonMap(prev=>({...prev, [dataToSave.id]: {...(prev[dataToSave.id]||{}), ...dataToSave}}));
    setEditing(null);
    // Snapshot before save (for undo), then save
    (async()=>{
      try {
        if (authSession?.access_token) {
          await sbFetch('rpc/snapshot_person', {
            method:'POST',
            headers:{'Authorization':'Bearer '+authSession.access_token},
            body:JSON.stringify({p_person_id:dataToSave.id, p_reason:'before_direct_edit'})
          });
        }
      } catch(e) { console.warn('Snapshot failed:', e); }
      try {
        if (data._mftStoryDirty) await saveMftStoryRecords(data._mftStoryRecords || []);
        await savePerson(dataToSave, user?.name||user?.email||"");
        setMsg(data._mftStoryDirty ? 'Saved person and MacFamilyTree stories!' : 'Saved to database!');
      } catch(e) {
        console.error('Save error:', e, e?.message);
        setMsg('DB save failed: ' + (e?.message || 'unknown error'));
      }
    })();
    setTimeout(()=>{revealNode(updatedNodeId,{select:false})},0);
    setTimeout(()=>setMsg(''),2000);
  };

  // Called when user clicks + on a tree row. If the person has multiple marriages,
  // show a chooser so they can pick which marriage the new child belongs to.
  // Single-marriage / no-marriage nodes skip the chooser and go straight to EditForm.
  const handleTreeAdd=(id)=>{
    const node=findNodeById(tree,id);
    const marriages=(node?.spouses||[]).filter(m=>m); // defensive
    if(marriages.length>1){
      setChoosingFamFor(node);
    }else{
      // Single marriage or none — use best-guess (famId=null). addPersonToDB will
      // attach to the only family, or create one if there are none.
      setAdding(id);
      setAddingToFam(null);
    }
  };

  const handleAdd=(data)=>{
    if (needsApproval(adding)) {
      const parentNode = findNodeById(tree, adding);
      setViewerSubmitData({ personId: adding, personName: parentNode?.dn || adding, changes: {...data, _action: 'add_child'}, type: 'add' });
      setShowViewerIdentity(true);
      setAdding(null);
      setAddingToFam(null);
      return;
    }
    const parentId=adding;
    const targetFamId=addingToFam;
    const newNode={...data,ch:[]};
    setTree(prev=>updateNode(prev,parentId,p=>({...p,ch:[...(p.ch||[]),newNode]})));
    setPersonMap(prev=>({...prev, [data.id]: {...data}}));
    setAdding(null);
    setAddingToFam(null);
    setSel(newNode);
    addPersonToDB(data, parentId, user?.name||user?.email||"", targetFamId).then(()=>{
      setMsg('Added to database!');
    }).catch(e=>{
      console.error('Add error:',e);
      setMsg('Added locally (DB sync failed)');
    });
    setTimeout(()=>revealNode(newNode.id,{select:false}),0);
    setTimeout(()=>setMsg(''),2000);
  };

  const handleDelete=(id)=>{
    if (needsApproval(id)) {
      const node = findNodeById(tree, id);
      setViewerSubmitData({ personId: id, personName: node?.dn || id, changes: { _action: 'delete' }, type: 'delete' });
      setShowViewerIdentity(true);
      return;
    }
    const node=findNodeById(tree,id);
    if(node?.ch?.length){
      setMsg('Cannot delete: has descendants');
      setTimeout(()=>setMsg(''),3000);
      return;
    }
    if(!confirm(`Delete ${node?.dn||'this person'}?`))return;
    const parentIds=getAncestorIds(tree,id);
    const parentId=parentIds[parentIds.length-1]||null;
    setTree(prev=>removeNode(prev,id));
    // Keep personMap in sync
    setPersonMap(prev=>{const next={...prev};delete next[id];return next;});
    if(sel?.id===id)setSel(parentId?findNodeById(tree,parentId):null);
    if(editing?.id===id)setEditing(null);
    if(adding===id){setAdding(null);setAddingToFam(null);}
    setExp(p=>{const s=new Set(p); s.delete(id); return s;});
    // Delete from Supabase
    deletePersonFromDB(id, user?.name||user?.email||"").then(()=>{
      setMsg('Deleted from database');
    }).catch(e=>{
      console.error('Delete error:',e);
      setMsg('Deleted locally (DB sync failed)');
    });
    setTimeout(()=>{if(parentId) revealNode(parentId,{select:true})},0);
    setTimeout(()=>setMsg(''),2000);
  };

  // Move branch: admin direct move
  const handleMove = async (personId, fromFamilyId, toFamilyId) => {
    // Snapshot before move
    try {
      const h = authSession?.access_token ? { 'Authorization': 'Bearer ' + authSession.access_token } : {};
      await sbFetch('rpc/snapshot_person', {
        method: 'POST', headers: h,
        body: JSON.stringify({ p_person_id: personId, p_reason: 'before_move_branch' })
      });
    } catch(e) { console.warn('Snapshot failed:', e); }

    await movePersonBranch(personId, fromFamilyId, toFamilyId, user?.name || user?.email || '');
    setMovingBranch(null);
    setMsg(fromFamilyId ? 'Branch moved — refreshing...' : 'Orphan placed in family — refreshing...');
    await reloadTree(false);
    setTimeout(() => setMsg(''), 3000);
  };

  const handleResolveDuplicate = async (keepId, removeId, options) => {
    await mergeDuplicatePeople(keepId, removeId, user?.name || user?.email || 'GEDCOM duplicate merge', options || { preferSource: 'keep' });
    setMovingBranch(null);
    setMsg('Duplicate reconciled — refreshing...');
    await reloadTree(false);
    setTimeout(() => setMsg(''), 3000);
  };

  // Move branch: viewer/editor request
  const handleRequestMove = async (personId, personName, fromFamily, toFamily, reason) => {
    await submitUpdateRequest(
      personId,
      personName,
      {
        _action: 'move_branch',
        _from_family: fromFamily.id,
        _from_label: fromFamily.label,
        _to_family: toFamily.id,
        _to_label: toFamily.label,
        _context: reason || 'Move branch request'
      },
      user?.name || 'Viewer',
      user?.email || '',
      {}
    );
    setMovingBranch(null);
    setMsg('Move request submitted for admin approval');
    setTimeout(() => setMsg(''), 3000);
  };

  const handleSaveSpouse=(data)=>{
    if(!spouseEditing?.parentId)return;
    const parentId=spouseEditing.parentId;
    const famId=spouseEditing.famId||null;
    const spouseTargetId=(spouseEditing.spouse&&spouseEditing.spouse.id) || data.id || parentId;
    if (needsApproval(spouseTargetId)) {
      const parentNode = findNodeById(tree, parentId);
      const spouseId = (spouseEditing.spouse&&spouseEditing.spouse.id) || data.id || ('@I'+Date.now()+'@');
      const spouseName = data.dn || 'Spouse';
      const existingSp = spouseEditing.spouse || {};
      const skipKeys = new Set(['id','ch','sp','spouses','gen','_fams','_famc','_p','_n','_matchType','_spouseOf','_isSpouse','_spouseOfId','_spouseOfName','_mt','_spOf','dn','_mftStoryRecords','_mftStoryDirty']);
      const changedFields = { _action: 'edit_spouse' };
      const prevFields = {};
      for (const [k, v] of Object.entries(data)) {
        if (skipKeys.has(k)) continue;
        const oldRaw = existingSp[k];
        const newRaw = v;
        const oldVal = (oldRaw === undefined || oldRaw === null || oldRaw === false || oldRaw === 0) ? '' : String(oldRaw).trim();
        const newVal = (newRaw === undefined || newRaw === null || newRaw === false || newRaw === 0) ? '' : String(newRaw).trim();
        if (oldVal !== newVal && (oldVal || newVal)) {
          changedFields[k] = v;
          prevFields[k] = oldRaw || '';
        }
      }
      setViewerSubmitData({ personId: spouseId, personName: spouseName + ' (spouse of ' + (parentNode?.dn||'') + ')', changes: {...changedFields, id: spouseId}, previous: prevFields, type: 'spouse' });
      setShowViewerIdentity(true);
      setSpouseEditing(null);
      return;
    }
    const spouseId=(spouseEditing.spouse&&spouseEditing.spouse.id)||data.id||('@I'+Date.now()+'@');
    const spouseData={...data, id:spouseId};
    // Update tree: patch the specific marriage entry if famId known, else legacy path
    setTree(prev=>updateNode(prev,parentId,(existing)=>{
      if(existing.spouses&&existing.spouses.length>0){
        const updated=existing.spouses.map(m=>
          (m.famId===famId||(famId===null&&!m.sp)) ? {...m,sp:spouseData} : m
        );
        // If no match found (new marriage), append
        const matched=updated.some(m=>m.famId===famId||(famId===null&&!m.sp));
        const final=matched?updated:[...existing.spouses,{famId,sp:spouseData,mdate:'',mplace:'',divorced:false,divdate:'',ch:[]}];
        return {...existing, spouses:final, sp:final[0].sp};
      }
      return {...existing, sp:{...(existing.sp||{}),...spouseData}};
    }));
    setPersonMap(prev=>({...prev, [spouseId]: {...(prev[spouseId]||{}), ...spouseData}}));
    setSpouseEditing(null);
    saveSpouseToDB(parentId, spouseData, user?.name||user?.email||"", famId).then(()=>{
      setMsg('Spouse saved!');
      reloadTree(false);
    }).catch(e=>{
      console.error('Spouse save error:', e, e?.message);
      setMsg('Spouse DB save failed: ' + (e?.message || 'unknown error'));
    });
    setTimeout(()=>setMsg(''),2000);
  };

  const handleDeleteSpouse=(parentId, famId=null)=>{
    const parent=findNodeById(tree,parentId);
    // Find the specific marriage being deleted
    const targetMarriage = famId && parent?.spouses
      ? parent.spouses.find(m=>m.famId===famId)
      : null;
    const sp = targetMarriage?.sp || parent?.sp;
    if (needsApproval(parentId)) {
      setViewerSubmitData({ personId: parentId, personName: parent?.dn || parentId, changes: { _action: 'delete_spouse', spouse_name: sp?.dn }, type: 'delete_spouse' });
      setShowViewerIdentity(true);
      return;
    }
    if(!sp){
      setMsg('No spouse to remove');
      setTimeout(()=>setMsg(''),2000);
      return;
    }
    if(!confirm(`Remove ${sp.dn||'this partner'} from this marriage?`))return;
    setTree(prev=>updateNode(prev,parentId,(existing)=>{
      if(existing.spouses&&famId){
        const updated=existing.spouses.map(m=>m.famId===famId ? {...m,sp:null} : m);
        return {...existing, spouses:updated, sp:updated[0]?.sp||null};
      }
      return {...existing, sp:null};
    }));
    if(spouseEditing?.parentId===parentId)setSpouseEditing(null);
    if(sp?.id){
      deleteSpouseFromDB(parentId, sp.id, user?.name||user?.email||"", famId).catch(e=>{
        console.error('Spouse delete error:',e);
      });
    }
    setMsg('Partner removed from marriage');
    setTimeout(()=>setMsg(''),2000);
  };

  // Add a brand-new marriage for an existing person:
  // 1. Creates a new FAM record in Supabase (person as husb or wife, no spouse yet)
  // 2. Opens the spouse EditForm so user can immediately name the partner
  const handleAddMarriage=(node)=>{
    requireAuth(async()=>{
    const pGender=node.g||'M';
    const newFamId='@F'+Date.now()+'@';
    try{
      await saveFamily(
        newFamId,
        pGender==='M'?node.id:null,
        pGender==='F'?node.id:null,
        [],'',''
      );
      // Reload tree so the new family appears in spouses[]
      await reloadTree(false);
      // Now open spouse EditForm targeting the new family
      setSpouseEditing({parentId:node.id, famId:newFamId, spouse:null});
      setMsg('New marriage created — add a partner below');
      setTimeout(()=>setMsg(''),3000);
    }catch(e){
      console.error('Add marriage error:',e);
      setMsg('Failed to create marriage: '+(e?.message||'unknown error'));
      setTimeout(()=>setMsg(''),3000);
    }
    });
  };

  // Mark a specific marriage as the person's primary (display-only preference).
  // Stored as persons.primary_family_id. Null means "use date-based fallback."
  const handleSetPrimary=(personId, famId)=>{
    requireAuth(async()=>{
      const prevPrimary = findNodeById(tree,personId)?.primaryFamId || null;
      // Optimistic tree update
      setTree(prev=>updateNode(prev,personId,(existing)=>({...existing, primaryFamId:famId})));
      setPersonMap(prev=>({...prev, [personId]:{...(prev[personId]||{}), primaryFamId:famId}}));
      try{
        await sbFetch(`persons?id=eq.${personId}`, {
          method: 'PATCH',
          body: JSON.stringify({ primary_family_id: famId })
        });
        // Log the change for audit
        try{
          await sbFetch('edit_log', {
            method: 'POST',
            headers: { 'Prefer': 'return=minimal' },
            body: JSON.stringify({
              person_id: personId,
              action: 'set_primary_marriage',
              edited_by: user?.name||user?.email||'',
              diff: { primary_family_id: famId, previous: prevPrimary }
            })
          });
        }catch(e){/* non-fatal */}
        setMsg('Primary marriage updated');
        setTimeout(()=>setMsg(''),2000);
      }catch(e){
        console.error('Set primary error:',e);
        // Rollback
        setTree(prev=>updateNode(prev,personId,(existing)=>({...existing, primaryFamId:prevPrimary})));
        setPersonMap(prev=>({...prev, [personId]:{...(prev[personId]||{}), primaryFamId:prevPrimary}}));
        setMsg('Failed to update primary: '+(e?.message||'unknown error'));
        setTimeout(()=>setMsg(''),3000);
      }
    });
  };

  const total=tree?cnt(tree):0;
  const btnS={background:CD,border:`1px solid ${BR}`,color:DM,padding:'6px 12px',borderRadius:5,fontSize:12,cursor:'pointer',whiteSpace:'nowrap'};
  const gateInp={width:'100%',background:'#1a1a14',border:'1px solid '+BR,color:TX,padding:'10px 14px',borderRadius:6,fontSize:15,outline:'none',fontFamily:'inherit',textAlign:'center',letterSpacing:1};

  // ─── PASSWORD RESET: Show if user clicked reset link from email ───
  if(showPasswordReset&&resetToken) return(
    <PasswordResetForm token={resetToken} onDone={()=>{setShowPasswordReset(false);setResetToken(null);setViewerGate(true);setShowLogin(true)}}/>
  );

  // ─── VIEWER GATE: Must enter family password to see anything ───
  if(viewerGate) return(
    <div style={{background:BG,minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',flexDirection:'column',gap:16}}>
      <style>{'@keyframes spin{to{transform:rotate(360deg)}}'}</style>
      <span style={{fontSize:36,color:GC,fontWeight:300,letterSpacing:2}}>Chennamkara</span>
      <span style={{fontSize:11,color:DM,letterSpacing:4,textTransform:'uppercase',marginBottom:8}}>Family Tree</span>
      <span style={{fontSize:9,color:'#3a3830',letterSpacing:1}}>{APP_VERSION}</span>
      <div style={{width:Math.min(340,window.innerWidth-48),textAlign:'center'}}>
        <div style={{fontSize:13,color:DM,marginBottom:16,lineHeight:1.6}}>Enter the family password to view the tree</div>
        <input type="password" value={gatePassword} onChange={e=>{setGatePassword(e.target.value);setGateError('')}}
          placeholder="Family password" style={gateInp}
          onKeyDown={e=>{if(e.key==='Enter')handleViewerGate()}}/>
        {gateError&&<div style={{fontSize:12,color:'#c05050',marginTop:8}}>{gateError}</div>}
        <button onClick={handleViewerGate} disabled={gateChecking}
          style={{width:'100%',marginTop:12,background:'rgba(196,163,90,0.15)',border:'1px solid '+GD,color:GC,padding:'10px',borderRadius:6,cursor:'pointer',fontSize:14}}>
          {gateChecking?'Checking...':'Enter'}
        </button>
        <div style={{marginTop:20,borderTop:'1px solid '+BR,paddingTop:16}}>
          <span style={{fontSize:12,color:DM}}>Have an account? </span>
          <span onClick={()=>{setShowLogin(true)}} style={{fontSize:12,color:GC,cursor:'pointer',textDecoration:'underline'}}>Sign in</span>
        </div>
      </div>
      {showLogin&&<LoginModal onSuccess={handleLoginSuccess} onCancel={()=>setShowLogin(false)} onRequestAccount={()=>{setShowLogin(false);setShowRequestAccount(true)}}/>}
      {showRequestAccount&&<RequestAccountModal flat={flat} onDone={()=>setShowRequestAccount(false)} onCancel={()=>setShowRequestAccount(false)}/>}
    </div>
  );

  if(loading) return(
    <div style={{background:BG,minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',flexDirection:'column',gap:16}}>
      <span style={{fontSize:28,color:GC,fontWeight:300,letterSpacing:1}}>Chennamkara</span>
      <span style={{fontSize:13,color:DM}}>Loading family tree...</span>
      <div style={{width:40,height:40,border:'2px solid '+BR,borderTopColor:GC,borderRadius:'50%',animation:'spin 1s linear infinite'}}/>
      <style>{'@keyframes spin{to{transform:rotate(360deg)}}'}</style>
    </div>
  );

  if(!tree) return(
    <div style={{background:BG,minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',flexDirection:'column',gap:16}}>
      <span style={{fontSize:28,color:GC,fontWeight:300}}>Chennamkara</span>
      <span style={{fontSize:13,color:'#a05050'}}>Could not load family tree.</span>
      <button onClick={()=>triggerImportGedcom((result,fileName)=>{setTree(result.tree||result);setPersonMap(result.personMap||{});setFamilyMap(result.familyMap||{});setMsg('Imported: '+fileName)})}
        style={{...btnS,background:'rgba(107,158,114,0.1)',borderColor:MC,color:MC,padding:'10px 20px'}}>⬆ Import GEDCOM File</button>
    </div>
  );

  return(
    <div style={{background:BG,minHeight:'100vh',color:TX,fontFamily:'system-ui,-apple-system,sans-serif'}}>
      <div style={{position:'sticky',top:0,zIndex:50,background:`linear-gradient(180deg,${BG} 80%,transparent)`,padding:'16px 16px 24px'}}>
        <div style={{maxWidth:1200,margin:'0 auto'}}>
          <div style={{display:'flex',alignItems:'baseline',gap:12,marginBottom:4}}>
            <span style={{fontSize:28,color:GC,fontWeight:300,letterSpacing:1,cursor:'pointer'}} onClick={()=>setActiveTab('tree')}>Chennamkara</span>
            <span style={{fontSize:11,color:DM,letterSpacing:3,textTransform:'uppercase'}}>Family Tree</span>
            <span style={{fontSize:9,color:DM,opacity:0.5,letterSpacing:1,marginLeft:4}} title={`Build: ${BUILD_DATE}`}>{APP_VERSION}</span>
            {user&&userIsAdmin&&<>
              <span onClick={()=>setActiveTab('tree')} style={{fontSize:12,color:activeTab==='tree'?GC:DM,cursor:'pointer',padding:'2px 8px',borderRadius:4,background:activeTab==='tree'?'rgba(196,163,90,0.1)':'transparent'}}>🌳 Tree</span>
              <span onClick={()=>setActiveTab('photos')} style={{fontSize:12,color:activeTab==='photos'?GC:DM,cursor:'pointer',padding:'2px 8px',borderRadius:4,background:activeTab==='photos'?'rgba(196,163,90,0.1)':'transparent'}}>📷 Photos</span>
              <span onClick={()=>setActiveTab('admin')} style={{fontSize:12,color:activeTab==='admin'?GC:DM,cursor:'pointer',padding:'2px 8px',borderRadius:4,background:activeTab==='admin'?'rgba(196,163,90,0.1)':'transparent'}}>👤 Admin</span>
            </>}
            {user&&!userIsAdmin&&<>
              <span onClick={()=>setActiveTab('tree')} style={{fontSize:12,color:activeTab==='tree'?GC:DM,cursor:'pointer',padding:'2px 8px',borderRadius:4,background:activeTab==='tree'?'rgba(196,163,90,0.1)':'transparent'}}>🌳 Tree</span>
              <span onClick={()=>setActiveTab('photos')} style={{fontSize:12,color:activeTab==='photos'?GC:DM,cursor:'pointer',padding:'2px 8px',borderRadius:4,background:activeTab==='photos'?'rgba(196,163,90,0.1)':'transparent'}}>📷 Photos</span>
            </>}
            <span style={{flex:1}}/>
            {user?
              <span style={{display:'flex',alignItems:'center',gap:8,fontSize:12}}>
                <span style={{width:6,height:6,borderRadius:'50%',background:user.role==='viewer'?DM:MC}}/>
                <span style={{color:TX}}>{user.name||user.email||'Viewer'}</span>
                <span style={{fontSize:10,color:DM,textTransform:'uppercase'}}>{user.role==='viewer'?'viewing':user.role}</span>
                {user.role==='viewer'&&<span onClick={()=>setShowLogin(true)} style={{color:GC,cursor:'pointer',textDecoration:'underline',marginLeft:4}}>Sign in</span>}
                {user.role!=='viewer'&&<span onClick={handleSignOut} style={{color:DM,cursor:'pointer',textDecoration:'underline',marginLeft:4}}>Sign out</span>}
              </span>
            :
              <span onClick={()=>setShowLogin(true)} style={{fontSize:12,color:GC,cursor:'pointer',padding:'4px 12px',border:'1px solid '+GD,borderRadius:5}}>🔒 Sign In</span>
            }
            {msg&&<span style={{fontSize:12,color:'#6b9e72',marginLeft:8,animation:'fadeIn 0.3s'}}>{msg}</span>}
          </div>
          <div style={{display:'flex',gap:20,fontSize:12,color:DM,marginBottom:12,alignItems:'center'}}>
            <span><strong style={{color:GD}}>{total}</strong> people</span>
            <span style={{color:'rgba(196,163,90,0.3)'}}>·</span>
            <span style={{fontSize:10,color:'#5a5548',letterSpacing:1}}>{APP_VERSION}</span>
            <span onClick={()=>{setMsg('Refreshing...');reloadTree(false)}} title="Refresh tree data from database" style={{cursor:'pointer',fontSize:13,color:DM,padding:'2px 6px',borderRadius:4,background:'rgba(196,163,90,0.06)',border:'1px solid rgba(196,163,90,0.1)'}}>↻ Refresh</span>
          </div>
          <div style={{display:'flex',gap:8,flexWrap:'wrap',alignItems:'center'}}>
            <div style={{position:'relative',flex:1,minWidth:180,maxWidth:360}}>
              <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search by name..."
                style={{width:'100%',background:CD,border:`1px solid ${BR}`,color:TX,padding:'7px 12px',borderRadius:6,fontSize:13,outline:'none'}}/>
              {matches.length>0&&<div style={{position:'absolute',top:'100%',left:0,right:0,background:CD,border:`1px solid rgba(196,163,90,0.25)`,
                borderTop:'none',borderRadius:'0 0 6px 6px',maxHeight:280,overflowY:'auto',zIndex:60}}>
                {matches.map((m,mi)=>{
                  const path = findPath(tree, m.id);
                  const lineage = path && path.length > 1 ? path.map(n=>n.dn||'?').join(' › ') : '';
                  return <div key={m.id+'_'+mi} onClick={()=>navigateTo(m)}
                  style={{padding:'8px 12px',cursor:'pointer',fontSize:13}}
                  onMouseEnter={e=>e.currentTarget.style.background='rgba(255,255,255,0.04)'}
                  onMouseLeave={e=>e.currentTarget.style.background='transparent'}>
                  <div style={{display:'flex',alignItems:'center',gap:6}}>
                    <span style={{width:6,height:6,borderRadius:'50%',background:m.g==='M'?MC:FC}}/><span>{m._n}</span>
                    {m._matchType==='spouse'&&<span style={{fontSize:10,color:DM,fontStyle:'italic'}}>⚭ spouse of {m._spouseOf}</span>}
                  </div>
                  {lineage && <div style={{fontSize:10,color:DM,marginLeft:12,marginTop:2}}>{lineage}</div>}
                </div>})}
              </div>}
            </div>
            {[['Expand All',expandAll],['Collapse',collapseAll],['2 Lvls',()=>expandTo(2)],['3 Lvls',()=>expandTo(3)]].map(([l,f])=>
              <button key={l} onClick={f} style={btnS}>{l}</button>)}
            <button onClick={()=>{downloadGedcom(tree,personMap,familyMap);setMsg('GEDCOM exported!')}} title="Download the family tree as a GEDCOM file" style={{...btnS,background:'rgba(196,163,90,0.1)',borderColor:GD,color:GC}}>⬇ Export GEDCOM</button>
            <button onClick={()=>triggerImportGedcom((result,fileName)=>{setTree(result.tree||result);setPersonMap(result.personMap||{});setFamilyMap(result.familyMap||{});setMsg('Imported: '+fileName);expandTo(2)})} title="Import a GEDCOM file to view (does not save to database)" style={{...btnS,background:'rgba(107,158,114,0.1)',borderColor:MC,color:MC}}>⬆ Import GEDCOM</button>
          </div>
        </div>
      </div>
      {activeTab==='tree'&&<>
      <div style={{maxWidth:1200,margin:'0 auto',padding:'0 16px 60px'}}>
        <TreeNode node={tree} exp={exp} onTog={toggle}
          onSel={(node)=>setSel(findNodeById(tree,node.id)||node)}
          onEdit={(node)=>requireAuth(()=>openEditForNode(node))}
          onAdd={(id)=>requireAuth(()=>handleTreeAdd(id))}
          onDel={(id)=>requireAuth(()=>handleDelete(id))}
          onEditSpouse={(node,famId,sp)=>requireAuth(()=>setSpouseEditing({parentId:node.id,famId:famId||null,spouse:sp||null}))}
          onDelSpouse={(id,famId)=>requireAuth(()=>handleDeleteSpouse(id,famId))}
          onAddMarriage={(node)=>handleAddMarriage(node)}
          onAddChild={(parentId,famId)=>requireAuth(()=>{setAdding(parentId);setAddingToFam(famId||null);})}
          onSetPrimary={(personId,famId)=>handleSetPrimary(personId,famId)}
          hl={hl}/>
      </div>
      {sel&&!editing&&<Detail
          node={findNodeById(tree,sel.id)||sel} root={tree}
          onClose={()=>setSel(null)}
          onEdit={(node)=>requireAuth(()=>openEditForNode(node))}
          onMove={(node)=>requireAuth(()=>setMovingBranch(node))}
          onEditSpouse={(node,famId,sp)=>requireAuth(()=>setSpouseEditing({parentId:node.id,famId:famId||null,spouse:sp||null}))}
          onDelSpouse={(id,famId)=>requireAuth(()=>handleDeleteSpouse(id,famId))}
          onAddChild={(parentId,famId)=>requireAuth(()=>{setAdding(parentId);setAddingToFam(famId||null);})}
          onAddMarriage={(node)=>handleAddMarriage(node)}
          onSetPrimary={(personId,famId)=>handleSetPrimary(personId,famId)}
        />}
      {editing&&<EditForm node={findNodeById(tree,editing.id)||editing} onSave={handleSaveEdit} onCancel={()=>setEditing(null)} isNew={false} canEditMftStories={userIsAdmin}/>}
      {spouseEditing&&<EditForm node={spouseEditing.spouse||empty()} onSave={handleSaveSpouse} onCancel={()=>setSpouseEditing(null)} isNew={false}/>}
      {adding&&<EditForm node={empty()} onSave={handleAdd} onCancel={()=>{setAdding(null);setAddingToFam(null);}} isNew={true} parentId={adding} parentName={flat.find(n=>n.id===adding)?._n}/>}
      {choosingFamFor&&(()=>{
        const node=choosingFamFor;
        const marriages=node.spouses||[];
        const close=()=>setChoosingFamFor(null);
        const pick=(famId)=>{close();setAdding(node.id);setAddingToFam(famId);};
        return <>
          <div onClick={close} style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.55)',zIndex:200}}/>
          <div style={{position:'fixed',top:'50%',left:'50%',transform:'translate(-50%,-50%)',zIndex:201,
            background:'#1a1a14',border:`1px solid ${BR}`,borderRadius:10,padding:20,minWidth:320,maxWidth:'90vw',
            boxShadow:'0 8px 40px rgba(0,0,0,0.6)'}}>
            <div style={{fontSize:13,color:GC,marginBottom:4}}>Add a child to {node.dn}</div>
            <div style={{fontSize:12,color:DM,marginBottom:14}}>Which marriage does this child belong to?</div>
            {marriages.map((m,i)=>{
              const cur = currentMarriage(marriages, node.primaryFamId);
              const isCurrent = m === cur;
              const label = isCurrent ? 'Current' : 'Former';
              return (
              <div key={m.famId||i} onClick={()=>pick(m.famId)}
                style={{padding:'10px 12px',borderRadius:6,marginBottom:6,background:'rgba(255,255,255,0.03)',
                  border:`1px solid ${BR}`,cursor:'pointer',transition:'background 0.15s'}}
                onMouseEnter={e=>e.currentTarget.style.background='rgba(196,163,90,0.1)'}
                onMouseLeave={e=>e.currentTarget.style.background='rgba(255,255,255,0.03)'}>
                <div style={{fontSize:11,color:DM,fontWeight:400,textTransform:'uppercase',letterSpacing:1.2}}>
                  {label}
                </div>
                <div style={{fontSize:14,color:TX,marginTop:3}}>
                  {m.sp?.dn || <span style={{color:DM,fontStyle:'italic'}}>unknown partner</span>}
                </div>
                <div style={{fontSize:11,color:DM,marginTop:2}}>
                  {m.mdate && 'm. '+m.mdate+' · '}
                  {m.divorced && m.divdate && 'ended '+(marriageYear(m.divdate)||m.divdate)+' · '}
                  {m.ch?.length||0} {(m.ch?.length||0)===1?'child':'children'}
                </div>
              </div>
              );
            })}
            <button onClick={close} style={{width:'100%',marginTop:8,background:'none',border:`1px solid ${BR}`,
              color:DM,padding:'6px',borderRadius:6,cursor:'pointer',fontSize:12}}>Cancel</button>
          </div>
        </>;
      })()}
      </>}
      {activeTab==='admin'&&user&&userIsAdmin&&<AdminPanel onReloadTree={()=>reloadTree(true)} onShowMigrate={()=>setShowMigrate(true)} onShowDiff={()=>setShowDiff(true)} onShowBackfill={()=>setShowBackfill(true)} onShowPrune={()=>setShowPrune(true)} personMap={personMap} familyMap={familyMap} flat={flat} tree={tree} user={user} onPlaceOrphan={(person)=>setMovingBranch(person)}/>}
      
      {/* ───── PHOTOS GALLERY TAB ───── */}
      {activeTab==='photos'&&user&&<PhotoGallery flat={flat} user={user}/>}
      {showLogin&&<LoginModal onSuccess={handleLoginSuccess} onCancel={()=>{setShowLogin(false);setPendingAction(null)}} onRequestAccount={()=>{setShowLogin(false);setShowRequestAccount(true)}}/>}
      {showRequestAccount&&<RequestAccountModal flat={flat} onDone={()=>setShowRequestAccount(false)} onCancel={()=>setShowRequestAccount(false)}/>}
      {showViewerIdentity&&viewerSubmitData&&<ViewerIdentityModal submitData={viewerSubmitData} flat={flat} onDone={()=>{setShowViewerIdentity(false);setViewerSubmitData(null);setMsg('Update request submitted!')}} onCancel={()=>{setShowViewerIdentity(false);setViewerSubmitData(null)}}/>}
      {showMigrate&&<MigrateDialog onDone={()=>setShowMigrate(false)} onCancel={()=>setShowMigrate(false)}/>}
      {showDiff&&<GedcomDiffModal onClose={()=>setShowDiff(false)} personMap={personMap} familyMap={familyMap} user={user} onMergeComplete={()=>{setShowDiff(false);setMsg('Merging complete — refreshing...');reloadTree(false)}} onSilentRefresh={()=>{reloadTree(true)}}/>}
      {showBackfill&&<BackfillModal onClose={()=>setShowBackfill(false)} onComplete={()=>{setShowBackfill(false);setMsg('Backfill complete — refreshing...');reloadTree(false)}}/>}
      {showPrune&&<PruneOrphanMetaModal onClose={()=>setShowPrune(false)} user={user}/>}
      {movingBranch&&<MoveBranchModal node={movingBranch} personMap={personMap} familyMap={familyMap} flat={flat} tree={tree} user={user} onMove={handleMove} onRequestMove={handleRequestMove} onResolveDuplicate={handleResolveDuplicate} onClose={()=>setMovingBranch(null)}/>}
      {user&&user.role!=='viewer'&&<div style={{position:'fixed',bottom:16,right:16,background:CD,border:'1px solid '+BR,borderRadius:8,padding:'8px 14px',fontSize:11,color:DM,zIndex:80,display:'flex',alignItems:'center',gap:8}}>
        <span style={{width:6,height:6,borderRadius:'50%',background:MC}}/>
        <span>Signed in as <strong style={{color:TX}}>{user.name||user.email}</strong></span>
        <span style={{color:GD}}>·</span>
        <span>{userIsAdmin?'Admin':'Editor'} — changes save to database</span>
      </div>}
    </div>
  );
}

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);

    // Show DEV banner when in dev mode
    if (DEV_MODE) {
      const banner = document.createElement('div');
      banner.style.cssText = 'position:fixed;bottom:0;left:0;right:0;background:#c4a35a;color:#0a0805;text-align:center;font-size:11px;font-weight:700;padding:4px;z-index:9999;letter-spacing:1px;';
      banner.textContent = '⚠ DEV MODE — connected to dev database (miaiqlrhnzjqzciegbij)';
      document.body.appendChild(banner);
    }
  </script>
</body>
</html>
