                  <div style={{ fontSize:11, color:'#5a4040', marginBottom:4 }}>Records with no name — likely data entry placeholders. Not importable.</div>
                  {unnamed.map(p => (<div key={p.id} style={{ ...rowSt, color:'#5a4040', fontSize:11 }}>
                    {p.id} — {p.g==='M'?'Male':'Female'} {getRole(p)}
                  </div>))}
                </>}
                
                {/* ── AUTO-INCLUDED FAMILIES (info only) ── */}
                {neededFams.length > 0 && <div style={{ marginTop:16, padding:'8px 12px', background:'rgba(126,184,208,0.04)', borderRadius:6, border:'1px solid '+BR }}>
                  <div style={{ fontSize:11, color:'#7eb8d0', marginBottom:4 }}>📎 {neededFams.length} families will be auto-imported with the selected persons:</div>
                  {neededFams.map(f => (<div key={f.id} style={{ fontSize:11, color:DM, paddingLeft:8 }}>
                    {extName(f.ext.husb)} ⚭ {extName(f.ext.wife)} — {(f.ext.children||[]).length} children
                  </div>))}
                </div>}
              </div>);
            })()}

            {/* ──── FTLS ONLY ──── */}
            {tab==='ftls_only' && (()=>{
              const persons = diffResult.ftlsOnly;
              return (<div style={{ padding:'12px 0' }}>
                <div style={{ fontSize:12, color:DM, marginBottom:8 }}>Mark for export to include in GEDCOM for Rolson/Abey.</div>
                <div style={selBar}>
                  <button style={lnkBtn} onClick={()=>{ const d={}; persons.forEach(p=>{d[p.id]='export'}); setFtlsDir(d); }}>⬆ All Export</button>
                  <button style={lnkBtn} onClick={()=>setFtlsDir({})}>Clear All</button>
                  <span style={{ fontSize:11, color:DM }}>{Object.values(ftlsDir).filter(v=>v==='export').length} marked</span>
                </div>
                {persons.map(p => (<div key={p.id} style={{ ...rowSt }}>
                  <div style={{ display:'flex', alignItems:'center', gap:8 }}>
                    <DirBtn dir={ftlsDir[p.id]||null} onSet={(d)=>setFtlsDir(prev=>({...prev,[p.id]:d}))} allowImport={false} />
                    <span style={{ width:8, height:8, borderRadius:'50%', background:p.g==='M'?MC:FC, flexShrink:0 }} />
                    <span style={{ color:TX, flex:1 }}>{p.dn||'(Unknown)'}</span>
                    {p.dob && <span style={{ color:DM, fontSize:11 }}>b.{p.dob}</span>}
                    <span style={{ color:'#5a5548', fontSize:10 }}>{p.id}</span>
                  </div>
                  <FamilyPath personId={p.id} showFtls={true} showExt={false} />
                </div>))}
              </div>);
            })()}

            {/* ──── FUZZY ──── */}
            {tab==='fuzzy' && (<div style={{ padding:'12px 0' }}>
              <div style={{ padding:'10px 14px', background:'rgba(208,160,126,0.08)', borderRadius:8, border:'1px solid rgba(208,160,126,0.2)', marginBottom:16 }}>
                <div style={{ fontSize:13, color:'#d0a07e', fontWeight:500, marginBottom:4 }}>⚠ Possible Duplicates</div>
                <div style={{ fontSize:12, color:DM, lineHeight:1.5 }}>
                  These people exist in BOTH systems but with different IDs — matched by name and birth date.
                  They were likely added independently. They will NOT appear in External Only (already excluded).
                  Review the differences below. If they are the same person and the external has newer data, you can import the changed fields.
                </div>
              </div>
              {/* Related matches: follow-on candidates queued by previous merges
                  in this session. Each entry lets the user walk one hop at a
                  time — merge, skip, or open the full comparison dialog. */}
              {(() => {
                const pending = followOnMatches.filter(m => !followOnResolved[m.key]);
                if (pending.length === 0) return null;
                return (
                  <div style={{ padding:'12px 14px', marginBottom:16, background:'rgba(159,126,178,0.08)', border:'1px solid rgba(159,126,178,0.3)', borderRadius:8 }}>
                    <div style={{ fontSize:13, color:'#b89fcc', fontWeight:500, marginBottom:6 }}>🔗 Related Matches ({pending.length})</div>
                    <div style={{ fontSize:12, color:DM, lineHeight:1.5, marginBottom:10 }}>
                      These follow-on candidates came up because of merges you just did. Each one is reviewed separately — nothing happens unless you click.
                    </div>
                    {pending.map(entry => {
                      if (entry.kind === 'person') {
                        const fDn = entry.ftlsPerson?.dn || entry.ftlsId;
                        const eDn = entry.extPerson?.dn || entry.extId;
                        const fDob = entry.ftlsPerson?.dob || '';
                        const eDob = entry.extPerson?.dob || '';
                        return (
                          <div key={entry.key} style={{ padding:'8px 10px', marginBottom:6, background:'rgba(255,255,255,0.03)', border:'1px solid rgba(159,126,178,0.15)', borderRadius:6 }}>
                            <div style={{ fontSize:11, color:'#b89fcc', marginBottom:4 }}>{entry.reason} · from merge of {entry.originLabel}</div>
                            <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', gap:10, flexWrap:'wrap' }}>
                              <div style={{ fontSize:12, color:TX }}>
                                <span style={{ color:'#7eb8d0' }}>FTLS: {fDn}</span>
                                {fDob && <span style={{ color:DM, marginLeft:4 }}>b.{fDob}</span>}
                                <span style={{ color:DM }}> ↔ </span>
                                <span style={{ color:GC }}>Ext: {eDn}</span>
                                {eDob && <span style={{ color:DM, marginLeft:4 }}>b.{eDob}</span>}
                              </div>
                              <div style={{ display:'flex', gap:6 }}>
                                <button onClick={() => {
                                  setExtMergeReview({
                                    ftlsId: entry.ftlsId,
                                    extId: entry.extId,
                                    ftlsPerson: entry.ftlsPerson,
                                    extPerson: entry.extPerson,
                                    matchReasons: [entry.reason],
                                    score: null,
                                    followOnKey: entry.key
                                  });
                                }} style={{ background:'rgba(107,158,114,0.15)', border:'1px solid rgba(107,158,114,0.4)', color:MC, padding:'3px 10px', borderRadius:4, cursor:'pointer', fontSize:11 }}>
                                  🧬 Merge
                                </button>
                                <button onClick={() => setFollowOnResolved(prev => ({ ...prev, [entry.key]: 'skipped' }))}
                                  style={{ background:'transparent', border:'1px solid '+BR, color:DM, padding:'3px 10px', borderRadius:4, cursor:'pointer', fontSize:11 }}>
                                  Skip
                                </button>
                              </div>
                            </div>
                          </div>
                        );
                      }
                      // kind === 'family'
                      const ff = entry.ftlsFam;
                      const ef = entry.extFam;
                      const fH = ff.husband_id ? (personMap[ff.husband_id]?.dn || ff.husband_id) : '—';
                      const fW = ff.wife_id ? (personMap[ff.wife_id]?.dn || ff.wife_id) : '—';
                      const eH = (ef.husband_id || ef.husb) ? (extPeopleMap[ef.husband_id || ef.husb]?.dn || personMap[ef.husband_id || ef.husb]?.dn || (ef.husband_id || ef.husb)) : '—';
                      const eW = (ef.wife_id || ef.wife) ? (extPeopleMap[ef.wife_id || ef.wife]?.dn || personMap[ef.wife_id || ef.wife]?.dn || (ef.wife_id || ef.wife)) : '—';
                      return (
                        <div key={entry.key} style={{ padding:'8px 10px', marginBottom:6, background:'rgba(255,255,255,0.03)', border:'1px solid rgba(159,126,178,0.15)', borderRadius:6 }}>
                          <div style={{ fontSize:11, color:'#b89fcc', marginBottom:4 }}>{entry.reason} · from merge of {entry.originLabel}</div>
                          <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', gap:10, flexWrap:'wrap' }}>
                            <div style={{ fontSize:12, color:TX }}>
                              📎 <span style={{ color:'#7eb8d0' }}>FTLS: {fH} ⚭ {fW}</span>
                              <span style={{ color:DM }}> ↔ </span>
                              <span style={{ color:GC }}>Ext: {eH} ⚭ {eW}</span>
                            </div>
                            <div style={{ display:'flex', gap:6 }}>
                              <button onClick={() => {
                                setFamilyReview({ extFam: ef, ftlsFamId: entry.ftlsFamId, source: 'followon', followOnKey: entry.key });
                              }} style={{ background:'rgba(126,184,208,0.12)', border:'1px solid rgba(126,184,208,0.3)', color:'#7eb8d0', padding:'3px 10px', borderRadius:4, cursor:'pointer', fontSize:11 }}>
                                Review Family
                              </button>
                              <button onClick={() => setFollowOnResolved(prev => ({ ...prev, [entry.key]: 'skipped' }))}
                                style={{ background:'transparent', border:'1px solid '+BR, color:DM, padding:'3px 10px', borderRadius:4, cursor:'pointer', fontSize:11 }}>
                                Skip
                              </button>
                            </div>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                );
              })()}
              {/* Bulk auto-remap for high-confidence fuzzy matches.
                  Why: without this, users remap one person at a time, skip some, and
                  duplicate xrefs accumulate silently across future imports. High-confidence
                  matches (score ≥ 70) are ones the scoring rubric considers safe — typically
                  same first+last name AND either same DOB or same gender+parent family. */}
              {(() => {
                const HIGH_CONF = 70;
                const eligible = (diffResult.fuzzyMatched || []).filter(m =>
                  m.score >= HIGH_CONF && !fuzzyResolved[m.extId]
                );
                if (eligible.length === 0) return null;
                return (
                  <div style={{ padding:'10px 14px', marginBottom:10, background:'rgba(107,158,114,0.08)', border:'1px solid rgba(107,158,114,0.3)', borderRadius:8, display:'flex', alignItems:'center', justifyContent:'space-between', gap:12 }}>
                    <div style={{ fontSize:12, color:TX, lineHeight:1.5 }}>
                      <span style={{ color:MC, fontWeight:500 }}>⚡ {eligible.length} high-confidence match{eligible.length === 1 ? '' : 'es'}</span>
                      <span style={{ color:DM }}> (score ≥ {HIGH_CONF}). Remap them all to the GEDCOM IDs so this import and all future ones from this source round-trip cleanly.</span>
                    </div>
                    <button
                      onClick={async () => {
                        if (!confirm(`Remap ${eligible.length} FTLS ID${eligible.length === 1 ? '' : 's'} to match the incoming GEDCOM?\n\nThis updates all family references. It cannot be undone automatically, though every remap is recorded in the audit log.\n\nContinue?`)) return;
                        let ok = 0, fail = 0;
                        for (const m of eligible) {
                          try {
                            await remapPersonId(m.ftlsId, m.extId, user?.email || 'GEDCOM bulk merge');
                            setFuzzyResolved(prev => ({ ...prev, [m.extId]: 'remapped' }));
                            setMergeLog(prev => [...prev, '✓ Remapped ' + (m.ext.dn || '?') + ': ' + m.ftlsId + ' → ' + m.extId]);
                            ok++;
                          } catch (e) {
                            setMergeLog(prev => [...prev, '✗ Remap failed for ' + (m.ext.dn || '?') + ': ' + e.message]);
                            fail++;
                          }
                        }
                        alert(`Done. Remapped ${ok}${fail > 0 ? ', ' + fail + ' failed (see merge log)' : ''}.`);
                        if (ok > 0 && onSilentRefresh) onSilentRefresh();
                      }}
                      style={{ background:'rgba(107,158,114,0.18)', border:'1px solid rgba(107,158,114,0.5)', color:MC, padding:'6px 14px', borderRadius:6, cursor:'pointer', fontSize:12, fontWeight:500, whiteSpace:'nowrap' }}>
                      ⚡ Remap all ({eligible.length})
                    </button>
                  </div>
                );
              })()}
              {diffResult.fuzzyMatched.length === 0 && (diffResult.duplicateExactMatches||[]).length === 0 && (diffResult.fuzzyMatchedFamilies||[]).length === 0 && <div style={{ textAlign:'center', padding:20, color:DM }}>No fuzzy matches found.</div>}
              {diffResult.fuzzyMatched.map(m => (<div key={m.extId} style={{ marginBottom:10, border:'1px solid rgba(208,160,126,0.3)', borderRadius:8, overflow:'hidden' }}>
                <div style={{ padding:'10px 14px', background:'rgba(208,160,126,0.06)', display:'flex', alignItems:'center', justifyContent:'space-between' }}>
                  <div>
                    <div style={{ fontSize:13, color:TX, fontWeight:500 }}>{m.ext.dn||'?'} <span style={{ fontSize:10, color:DM, fontWeight:400 }}>match score: {m.score}</span></div>
                    <div style={{ fontSize:11, color:DM, marginTop:2 }}>
                      FTLS ID: <span style={{ color:GC }}>{m.ftlsId}</span> ← Ext ID: <span style={{ color:'#7eb8d0' }}>{m.extId}</span>
                    </div>
                  </div>
                  {m.diffs.length > 0 && <span style={{ fontSize:11, color:'#d0a07e' }}>{m.diffs.length} diff{m.diffs.length>1?'s':''}</span>}
                </div>
                <div style={{ padding:'4px 14px 8px' }}>
                  {(() => {
                    const fbc = ftlsBreadcrumb(m.ftlsId);
                    const ebc = extBreadcrumb(m.extId);
                    // Normalize names for comparison: lowercase, strip non-letters
                    const norm = s => (s||'').toLowerCase().replace(/[^a-z]/g,'');
                    const fNames = fbc.ids.map(id => norm(personMap[id]?.dn || ''));
                    const eNames = ebc.ids.map(id => norm(extPeopleMap[id]?.dn || personMap[id]?.dn || ''));
                    // Lineages differ if normalized name sequences don't share significant overlap
                    const sameLen = fNames.length === eNames.length;
                    let sameLineage = sameLen && fNames.length > 0;
                    if (sameLineage) {
                      for (let i = 0; i < fNames.length; i++) {
                        // Accept if one name contains the other (handles "GeeVarghese" vs "GeeVarghese Mathai")
                        if (!fNames[i] || !eNames[i]) { sameLineage = false; break; }
                        if (fNames[i] !== eNames[i] && !fNames[i].includes(eNames[i]) && !eNames[i].includes(fNames[i])) {
                          sameLineage = false; break;
                        }
                      }
                    }
                    return (<div style={{fontSize:10, lineHeight:1.6, paddingLeft:20}}>
                      {fbc.text && <div style={{color:'#8a8578'}}><span style={{color:'#c4a35a',fontSize:9}}>FTLS</span> {fbc.text}</div>}
                      {ebc.text && <div style={{color:'#6a8a70'}}><span style={{color:'#7eb8d0',fontSize:9}}>EXT</span> {ebc.text}</div>}
                      {fbc.text && ebc.text && !sameLineage && <div style={{color:'#d08050',fontSize:9,fontWeight:500}}>⚠ Lineages don't align — review carefully</div>}
                    </div>);
                  })()}
                </div>
                {m.diffs.length > 0 && <div style={{ padding:'0 14px 10px' }}>
                  <table style={{ width:'100%', borderCollapse:'collapse', fontSize:12 }}>
                    <thead><tr style={{ borderBottom:'1px solid '+BR }}>
                      <th style={{ textAlign:'left', padding:'4px 0', color:DM, fontWeight:400, width:'30%' }}>Field</th>
                      <th style={{ textAlign:'left', padding:'4px 0', color:GC, fontWeight:400, width:'35%' }}>FTLS</th>
                      <th style={{ textAlign:'left', padding:'4px 0', color:'#6b9e72', fontWeight:400, width:'35%' }}>External</th>
                    </tr></thead>
                    <tbody>{m.diffs.map(d => (<tr key={d.key} style={{ borderBottom:'1px solid rgba(255,255,255,0.03)' }}>
                      <td style={{ padding:'3px 0', color:DM }}>{d.label}</td>
                      <td style={{ padding:'3px 0', color:d.ftls?TX:'#5a5548' }}>{d.ftls || '(empty)'}</td>
                      <td style={{ padding:'3px 0', color:d.ext?'#6b9e72':'#5a5548', background:d.ext&&!d.ftls?'rgba(107,158,114,0.06)':'transparent' }}>{d.ext || '(empty)'}</td>
                    </tr>))}</tbody>
                  </table>
                </div>}
                {m.diffs.length === 0 && <div style={{ padding:'4px 14px 10px', fontSize:11, color:'#6b9e72' }}>✓ All fields match — just different IDs.</div>}
                {/* Action buttons */}
                <div style={{ padding:'6px 14px 10px', display:'flex', gap:8, alignItems:'center' }}>
                  {fuzzyResolved[m.extId] === 'remapped' ? (
                    <span style={{ fontSize:12, color:'#6b9e72' }}>✓ ID aligned to {m.extId}</span>
                  ) : fuzzyResolved[m.extId] === 'merged_ftls' ? (
                    <span style={{ fontSize:12, color:'#6b9e72' }}>✓ Merged into FTLS {m.ftlsId}</span>
                  ) : fuzzyResolved[m.extId] === 'ignored' ? (
                    <span style={{ fontSize:12, color:DM }}>— Ignored</span>
                  ) : (<>
                    {/* Keep FTLS ID: opens the per-field merge dialog with
                        keepId = FTLS xref. External person acts as the source
                        of new field values (name corrections, DOBs, etc.) but
                        the FTLS xref is preserved so nothing downstream breaks. */}
                    <button onClick={() => {
                      setExtMergeReview({
                        ftlsId: m.ftlsId,
                        extId: m.extId,
                        ftlsPerson: personMap[m.ftlsId] || m.ftls,
                        extPerson: m.ext,
                        matchReasons: m.matchReasons || [],
                        score: m.score
                      });
                    }} style={{ background:'rgba(107,158,114,0.15)', border:'1px solid rgba(107,158,114,0.4)', color:MC, padding:'4px 12px', borderRadius:5, cursor:'pointer', fontSize:11 }}>
                      🧬 Keep FTLS ID, merge fields
                    </button>
                    <button onClick={async () => {
                      if (!confirm(`This will change the FTLS ID from ${m.ftlsId} to ${m.extId} and update all family references.\n\nThis ensures future GEDCOM imports from Rolson won't create duplicates.\n\nContinue?`)) return;
                      try {
                        await remapPersonId(m.ftlsId, m.extId, user?.email || 'GEDCOM merge');
                        setFuzzyResolved(prev => ({...prev, [m.extId]: 'remapped'}));
                        setMergeLog(prev => [...prev, '✓ Remapped ' + (m.ext.dn||'?') + ': ' + m.ftlsId + ' → ' + m.extId]);
                        if (onSilentRefresh) onSilentRefresh();
                      } catch(e) {
                        alert('Remap failed: ' + e.message);
                        setMergeLog(prev => [...prev, '✗ Remap failed for ' + (m.ext.dn||'?') + ': ' + e.message]);
                      }
                    }} style={{ background:'rgba(126,184,208,0.12)', border:'1px solid rgba(126,184,208,0.3)', color:'#7eb8d0', padding:'4px 12px', borderRadius:5, cursor:'pointer', fontSize:11 }}>
                      🔄 Keep GEDCOM ID
                    </button>
                    <button onClick={() => setFuzzyResolved(prev => ({...prev, [m.extId]: 'ignored'}))} 
                      style={{ background:'transparent', border:'1px solid '+BR, color:DM, padding:'4px 12px', borderRadius:5, cursor:'pointer', fontSize:11 }}>
                      Ignore
                    </button>
                  </>)}
                </div>
              </div>))}

              {diffResult.duplicateExactMatches && diffResult.duplicateExactMatches.length > 0 && (<>
                <div style={{ padding:'10px 14px', background:'rgba(208,160,126,0.06)', borderRadius:8, border:'1px solid rgba(208,160,126,0.2)', marginTop:20, marginBottom:16 }}>
                  <div style={{ fontSize:13, color:'#d0a07e', fontWeight:500, marginBottom:4 }}>🧬 Duplicate People Already In FTLS ({diffResult.duplicateExactMatches.length})</div>
                  <div style={{ fontSize:12, color:DM, lineHeight:1.5 }}>
                    These external GEDCOM IDs already exist in FTLS, but another FTLS row also looks like the same person.
                    This usually means an older import created a duplicate before fuzzy matching caught it.
                    Review each pair and merge if they are truly the same person.
                  </div>
                </div>
                {diffResult.duplicateExactMatches.map(m => {
                  const isResolved = fuzzyResolved[m.currentId + '|' + m.duplicateId];
                  const isExpanded = expandedDiffs.has('dup|' + m.currentId + '|' + m.duplicateId);
                  return (<div key={m.currentId + '|' + m.duplicateId} style={{ marginBottom:10, border:'1px solid rgba(208,160,126,0.3)', borderRadius:8, overflow:'hidden' }}>
                  <div style={{ padding:'10px 14px', background:'rgba(208,160,126,0.04)', display:'flex', alignItems:'center', justifyContent:'space-between', cursor:'pointer' }}
                    onClick={() => toggleExpand('dup|' + m.currentId + '|' + m.duplicateId)}>
                    <div>
                      <div style={{ fontSize:13, color:TX, fontWeight:500 }}>{m.current.dn||m.ext.dn||'?'} <span style={{ fontSize:10, color:DM, fontWeight:400 }}>score: {m.score}</span></div>
                      <div style={{ fontSize:11, color:DM, marginTop:2 }}>
                        Current: <span style={{ color:'#7eb8d0' }}>{m.currentId}</span> · Duplicate: <span style={{ color:GC }}>{m.duplicateId}</span>
                      </div>
                    </div>
                    <div style={{ display:'flex', alignItems:'center', gap:8 }}>
                      {isResolved && <span style={{ fontSize:11, color:'#6b9e72' }}>✓ Merged</span>}
                      <span style={{ fontSize:11, color:'#d0a07e' }}>{m.currentStatus} ↔ {m.duplicateStatus}</span>
                      <span style={{ color:DM, fontSize:14 }}>{isExpanded ? '▾' : '▸'}</span>
                    </div>
                  </div>
                  {isExpanded && !isResolved && (<div style={{ padding:'0 14px 10px' }}>
                    {/* Match reasoning */}
                    {m.matchReasons && m.matchReasons.length > 0 && (
                      <div style={{ padding:'8px 10px', marginBottom:10, background:'rgba(196,163,90,0.06)', border:'1px solid rgba(196,163,90,0.15)', borderRadius:6 }}>
                        <div style={{ fontSize:10, color:'#c4a35a', textTransform:'uppercase', letterSpacing:1.2, marginBottom:4 }}>Why Flagged</div>
                        {m.matchReasons.map((r, i) => (
                          <div key={i} style={{ fontSize:11, color:DM, lineHeight:1.6 }}>• {r}</div>
                        ))}
                      </div>
                    )}

                    {/* Side-by-side context cards */}
                    {(() => {
                      const ctxA = buildPersonContext(m.currentId);
                      const ctxB = buildPersonContext(m.duplicateId);
                      return (
                        <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:8, marginBottom:10 }}>
                          {[{ ctx: ctxA, label: 'Current FTLS Record', id: m.currentId, color: '#7eb8d0', person: m.current },
                            { ctx: ctxB, label: 'Possible Duplicate', id: m.duplicateId, color: GC, person: m.duplicate }].map((side, si) => (
                            <div key={si} style={{ padding:10, border:'1px solid '+BR, borderRadius:8, background:'rgba(255,255,255,0.02)', fontSize:11 }}>
                              <div style={{ fontSize:10, color:side.color, textTransform:'uppercase', letterSpacing:1.2, marginBottom:6 }}>{side.label}</div>
                              <div style={{ color:TX, fontSize:13, fontWeight:500, marginBottom:2 }}>{side.person.dn || '?'}</div>
                              <div style={{ color:DM, marginBottom:6 }}>{side.id}</div>
                              {side.person.dob && <div style={{ color:DM }}>Born: <span style={{ color:TX }}>{side.person.dob}</span>{side.person.loc ? ' · ' + side.person.loc : ''}</div>}
                              {side.person.dod && <div style={{ color:DM }}>Died: <span style={{ color:TX }}>{side.person.dod}</span></div>}
                              {(side.person.nk) && <div style={{ color:DM }}>Nick: <span style={{ color:TX }}>{side.person.nk}</span></div>}
                              {(side.person.ci || side.person.co) && <div style={{ color:DM }}>Location: <span style={{ color:TX }}>{[side.person.ci, side.person.st, side.person.co].filter(Boolean).join(', ')}</span></div>}
                              {side.person.prof && <div style={{ color:DM }}>Occupation: <span style={{ color:TX }}>{side.person.prof}</span></div>}
                              {side.ctx && side.ctx.parentFamily && (
                                <div style={{ marginTop:6, paddingTop:6, borderTop:'1px solid rgba(255,255,255,0.05)' }}>
                                  <div style={{ color:'#c4a35a', fontSize:10, textTransform:'uppercase', letterSpacing:1, marginBottom:2 }}>Parents</div>
                                  <div style={{ color:TX }}>{side.ctx.parentFamily.father || '?'} & {side.ctx.parentFamily.mother || '?'}</div>
                                  <div style={{ color:DM, fontSize:10 }}>{side.ctx.parentFamily.id}</div>
                                </div>
                              )}
                              {side.ctx && !side.ctx.parentFamily && (
                                <div style={{ marginTop:6, paddingTop:6, borderTop:'1px solid rgba(255,255,255,0.05)' }}>
                                  <div style={{ color:'#c49a6c', fontSize:10 }}>No parent family linked</div>
                                </div>
                              )}
                              {side.ctx && side.ctx.siblings.length > 0 && (
                                <div style={{ marginTop:4 }}>
                                  <div style={{ color:DM, fontSize:10 }}>Siblings: <span style={{ color:TX }}>{side.ctx.siblings.map(s => s.name).join(', ')}</span></div>
                                </div>
                              )}
                              {side.ctx && side.ctx.spouseFamilies.length > 0 && (
                                <div style={{ marginTop:6, paddingTop:6, borderTop:'1px solid rgba(255,255,255,0.05)' }}>
                                  <div style={{ color:'#c4a35a', fontSize:10, textTransform:'uppercase', letterSpacing:1, marginBottom:2 }}>Spouse & Children</div>
                                  {side.ctx.spouseFamilies.map(sf => (
                                    <div key={sf.id} style={{ marginBottom:4 }}>
                                      <div style={{ color:TX }}>⚭ {sf.spouseName || '(unknown)'}</div>
                                      {sf.children.length > 0 && <div style={{ color:DM, fontSize:10, marginLeft:10 }}>{sf.children.map(c => c.name).join(', ')}</div>}
                                    </div>
                                  ))}
                                </div>
                              )}
                              {side.ctx && side.ctx.lineagePath.length > 1 && (
                                <div style={{ marginTop:6, paddingTop:6, borderTop:'1px solid rgba(255,255,255,0.05)' }}>
                                  <div style={{ color:'#c4a35a', fontSize:10, textTransform:'uppercase', letterSpacing:1, marginBottom:2 }}>Lineage</div>
                                  <div style={{ color:DM, fontSize:10 }}>{side.ctx.lineagePath.map(l => l.name).join(' → ')}</div>
                                </div>
                              )}
                            </div>
                          ))}
                        </div>
                      );
                    })()}

                    {/* Field diff table */}
                    {m.diffs.length > 0 && (
                      <table style={{ width:'100%', borderCollapse:'collapse', fontSize:12, marginBottom:10 }}>
                        <thead><tr style={{ borderBottom:'1px solid '+BR }}>
                          <th style={{ textAlign:'left', padding:'4px 0', color:DM, fontWeight:400, width:'30%' }}>Field</th>
                          <th style={{ textAlign:'left', padding:'4px 0', color:'#7eb8d0', fontWeight:400, width:'35%' }}>Current</th>
                          <th style={{ textAlign:'left', padding:'4px 0', color:GC, fontWeight:400, width:'35%' }}>Duplicate</th>
                        </tr></thead>
                        <tbody>{m.diffs.map(d => (<tr key={d.key} style={{ borderBottom:'1px solid rgba(255,255,255,0.03)' }}>
                          <td style={{ padding:'3px 0', color:DM }}>{d.label}</td>
                          <td style={{ padding:'3px 0', color:d.ftls?TX:'#5a5548' }}>{d.ftls || '(empty)'}</td>
                          <td style={{ padding:'3px 0', color:d.ext?GC:'#5a5548' }}>{d.ext || '(empty)'}</td>
                        </tr>))}</tbody>
                      </table>
                    )}
                    {m.diffs.length === 0 && <div style={{ paddingTop:4, paddingBottom:8, fontSize:11, color:'#6b9e72' }}>✓ These two FTLS rows look identical apart from the ID.</div>}

                    {/* Action buttons */}
                    <div style={{ display:'flex', gap:8, alignItems:'center', flexWrap:'wrap' }}>
                      <button onClick={() => setFtlsDupReview({
                        currentId: m.currentId, duplicateId: m.duplicateId,
                        current: m.current, duplicate: m.duplicate,
                        matchReasons: m.matchReasons, score: m.score
                      })}
                        style={{ background:'rgba(107,158,114,0.12)', border:'1px solid rgba(107,158,114,0.3)', color:MC, padding:'5px 14px', borderRadius:5, cursor:'pointer', fontSize:11 }}>
                        🧬 Merge Duplicate
                      </button>
                      <button onClick={() => setFuzzyResolved(prev => ({...prev, [m.currentId + '|' + m.duplicateId]: 'ignored'}))}
                        style={{ background:'transparent', border:'1px solid '+BR, color:DM, padding:'5px 14px', borderRadius:5, cursor:'pointer', fontSize:11 }}>
                        Not a Duplicate
                      </button>
                    </div>
                  </div>)}
                </div>);
                })}
              </>)}

              {/* ── FAMILY FUZZY MATCHES ── */}
              {diffResult.fuzzyMatchedFamilies && diffResult.fuzzyMatchedFamilies.length > 0 && (<>
                <div style={{ padding:'10px 14px', background:'rgba(126,184,208,0.06)', borderRadius:8, border:'1px solid rgba(126,184,208,0.2)', marginTop:20, marginBottom:16 }}>
                  <div style={{ fontSize:13, color:'#7eb8d0', fontWeight:500, marginBottom:4 }}>📎 Family ID Mismatches ({diffResult.fuzzyMatchedFamilies.length})</div>
                  <div style={{ fontSize:12, color:DM, lineHeight:1.5 }}>
                    These families have different IDs but the same husband/wife. They represent the same family unit in both systems.
                    Review them here, then choose whether to keep the FTLS family ID or the GEDCOM family ID so future imports stay aligned.
                  </div>
                </div>
                {diffResult.fuzzyMatchedFamilies.map(m => {
                  const extH = m.ext.husb ? (extPeopleMap[m.ext.husb]?.dn || personMap[m.ext.husb]?.dn || m.ext.husb) : '—';
                  const extW = m.ext.wife ? (extPeopleMap[m.ext.wife]?.dn || personMap[m.ext.wife]?.dn || m.ext.wife) : '—';
                  const ftlsH = (m.ftls.husband_id||m.ftls.husb) ? (personMap[m.ftls.husband_id||m.ftls.husb]?.dn || (m.ftls.husband_id||m.ftls.husb)) : '—';
                  const ftlsW = (m.ftls.wife_id||m.ftls.wife) ? (personMap[m.ftls.wife_id||m.ftls.wife]?.dn || (m.ftls.wife_id||m.ftls.wife)) : '—';
                  const extKidCount = (m.ext.children||[]).length;
                  const ftlsKidCount = (m.ftls.children||[]).length;
                  return (<div key={m.extId} style={{ marginBottom:10, border:'1px solid rgba(126,184,208,0.25)', borderRadius:8, overflow:'hidden' }}>
                    <div style={{ padding:'10px 14px', background:'rgba(126,184,208,0.04)', display:'flex', alignItems:'center', justifyContent:'space-between' }}>
                      <div>
                        <div style={{ fontSize:13, color:TX, fontWeight:500 }}>{extH} ⚭ {extW} <span style={{ fontSize:10, color:DM, fontWeight:400 }}>score: {m.score}</span></div>
                        <div style={{ fontSize:11, color:DM, marginTop:2 }}>
                          FTLS: <span style={{ color:GC }}>{m.ftlsId}</span> ← Ext: <span style={{ color:'#7eb8d0' }}>{m.extId}</span>
                        </div>
                      </div>
                      <span style={{ fontSize:11, color:DM }}>{ftlsKidCount} / {extKidCount} children</span>
                    </div>
                    <div style={{ padding:'4px 14px 8px' }}>
                      <table style={{ width:'100%', borderCollapse:'collapse', fontSize:12 }}>
                        <thead><tr style={{ borderBottom:'1px solid '+BR }}>
                          <th style={{ textAlign:'left', padding:'4px 0', color:DM, fontWeight:400, width:'25%' }}></th>
                          <th style={{ textAlign:'left', padding:'4px 0', color:GC, fontWeight:400, width:'37%' }}>FTLS</th>
                          <th style={{ textAlign:'left', padding:'4px 0', color:'#7eb8d0', fontWeight:400, width:'38%' }}>External</th>
                        </tr></thead>
                        <tbody>
                          <tr style={{ borderBottom:'1px solid rgba(255,255,255,0.03)' }}>
                            <td style={{ padding:'3px 0', color:DM }}>Husband</td>
                            <td style={{ padding:'3px 0', color:TX }}>{ftlsH}</td>
                            <td style={{ padding:'3px 0', color:TX }}>{extH}</td>
                          </tr>
                          <tr style={{ borderBottom:'1px solid rgba(255,255,255,0.03)' }}>
                            <td style={{ padding:'3px 0', color:DM }}>Wife</td>
                            <td style={{ padding:'3px 0', color:TX }}>{ftlsW}</td>
                            <td style={{ padding:'3px 0', color:TX }}>{extW}</td>
                          </tr>
                          <tr>
                            <td style={{ padding:'3px 0', color:DM }}>Children</td>
                            <td style={{ padding:'3px 0', color:TX }}>{ftlsKidCount}</td>
                            <td style={{ padding:'3px 0', color:TX }}>{extKidCount}</td>
                          </tr>
                        </tbody>
                      </table>
                    </div>
                    <div style={{ padding:'6px 14px 10px', display:'flex', gap:8, alignItems:'center' }}>
                      {fuzzyFamResolved[m.extId] === 'remapped' ? (
                        <span style={{ fontSize:12, color:'#6b9e72' }}>✓ Reconciled to {m.extId}</span>
                      ) : fuzzyFamResolved[m.extId] === 'ignored' ? (
                        <span style={{ fontSize:12, color:DM }}>— Ignored</span>
                      ) : (<>
                        <button onClick={() => setFamilyReview({ extFam: m.ext, ftlsFamId: m.ftlsId, source: 'fuzzy' })}
                          style={{ background:'rgba(126,184,208,0.12)', border:'1px solid rgba(126,184,208,0.3)', color:'#7eb8d0', padding:'4px 12px', borderRadius:5, cursor:'pointer', fontSize:11 }}>
                          Review Duplicate
                        </button>
                        <button onClick={() => setFuzzyFamResolved(prev => ({...prev, [m.extId]: 'ignored'}))}
                          style={{ background:'transparent', border:'1px solid '+BR, color:DM, padding:'4px 12px', borderRadius:5, cursor:'pointer', fontSize:11 }}>
                          Ignore
                        </button>
                        <span style={{ fontSize:10, color:DM }}>Choose merge, keep FTLS ID, keep GEDCOM ID, or ignore</span>
                      </>)}
                    </div>
                  </div>);
                })}
              </>)}
            </div>)}

            {/* ──── BASKET ──── */}
            {tab==='basket' && (<div style={{ padding:'12px 0' }}>
              {basket.imports.length===0 && basket.exports.length===0 && basket.importFams.length===0 && (basket.familyFactImports||[]).length===0 && repairableOrphanFams.length===0 && orphanFamilyCandidates.length===0 ? (
                <div style={{ textAlign:'center', padding:'40px 20px', color:DM }}>
                  <div style={{ fontSize:36, marginBottom:12 }}>🧺</div>
                  <div style={{ fontSize:14 }}>Basket is empty</div>
                  <div style={{ fontSize:12, marginTop:8 }}>Go to Changed, External Only, or FTLS Only tabs and mark items for Import or Export.</div>
                </div>
              ) : (<>
                {/* ORPHAN FAMILY REPAIR — shown automatically, no selection needed */}
                {repairableOrphanFams.length > 0 && (<>
                  <div style={{ fontSize:13, fontWeight:600, color:'#c49a6c', marginBottom:8, marginTop:8, display:'flex', alignItems:'center', gap:8 }}>
                    🔧 Orphan Family Repair
                    <span style={{ fontSize:10, fontWeight:400, color:DM }}>({repairableOrphanFams.length} families missing from DB)</span>
                  </div>
                  <div style={{ fontSize:12, color:DM, marginBottom:12, lineHeight:1.6, background:'rgba(196,154,108,0.06)', border:'1px solid rgba(196,154,108,0.15)', borderRadius:6, padding:12 }}>
                    These families exist in the GEDCOM and their members are already in the database, but the family records were never created (likely from a previous import that failed with FK constraint errors). This will create the missing family links.
                  </div>
                  {repairableOrphanFams.map((fam, i) => {
                    const hName = fam.husb ? (extPeopleMap[fam.husb]?.dn || personMap[fam.husb]?.dn || fam.husb) : '—';
                    const wName = fam.wife ? (extPeopleMap[fam.wife]?.dn || personMap[fam.wife]?.dn || fam.wife) : '—';
                    return (<div key={'orf'+i} style={{ ...rowSt, fontSize:12, color:TX, display:'flex', alignItems:'center', gap:8 }}>
                      <span style={{ color:'#c49a6c' }}>📎</span> {hName} ⚭ {wName} — {(fam.children||[]).length} children <span style={badge('rgba(196,154,108,0.5)')}>orphan</span>
                    </div>);
                  })}
                  <div style={{ marginTop:12, display:'flex', gap:10, alignItems:'center' }}>
                    <button onClick={()=>{
                      if (confirm(`This will create ${repairableOrphanFams.length} missing family records in the database.\n\nThe persons already exist — this just creates the family links (husband/wife/children) that failed to import previously.\n\nContinue?`)) {
                        repairOrphanFamilies(repairableOrphanFams);
                      }
                    }} disabled={merging} style={{ background:'rgba(196,154,108,0.15)', border:'1px solid rgba(196,154,108,0.5)', color:'#c49a6c', padding:'8px 20px', borderRadius:6, cursor:'pointer', fontSize:13 }}>
                      {merging ? 'Repairing...' : '🔧 Repair ' + repairableOrphanFams.length + ' Orphan Families'}
                    </button>
                    <span style={{ fontSize:10, color:DM }}>⚠ Creates family records in database</span>
                  </div>
                </>)}

                {orphanFamilyCandidates.length > 0 && (<>
                  <div style={{ fontSize:13, fontWeight:600, color:'#7eb8d0', marginBottom:8, marginTop:20, display:'flex', alignItems:'center', gap:8 }}>
                    📎 Duplicate / Out-of-Sync Families Already In FTLS
                    <span style={{ fontSize:10, fontWeight:400, color:DM }}>({orphanFamilyCandidates.length} likely duplicates)</span>
                  </div>
                  <div style={{ fontSize:12, color:DM, marginBottom:12, lineHeight:1.6, background:'rgba(126,184,208,0.06)', border:'1px solid rgba(126,184,208,0.18)', borderRadius:6, padding:12 }}>
                    These GEDCOM families are missing as family rows under their external IDs, but they already look like an existing FTLS family. Review them here instead of blindly creating another family record.
                  </div>
                  {orphanFamilyCandidates.map((item, i) => {
                    const fam = item.ext;
                    const match = item.match;
                    const hName = fam.husb ? (extPeopleMap[fam.husb]?.dn || personMap[fam.husb]?.dn || fam.husb) : '—';
                    const wName = fam.wife ? (extPeopleMap[fam.wife]?.dn || personMap[fam.wife]?.dn || fam.wife) : '—';
                    const ftlsFam = familyMap[match.id] || match.family;
                    const ftlsH = ftlsFam?.husband_id ? (personMap[ftlsFam.husband_id]?.dn || ftlsFam.husband_id) : '—';
                    const ftlsW = ftlsFam?.wife_id ? (personMap[ftlsFam.wife_id]?.dn || ftlsFam.wife_id) : '—';
                    return (
                      <div key={'orfdup'+i} style={{ marginBottom:10, border:'1px solid rgba(126,184,208,0.25)', borderRadius:8, overflow:'hidden' }}>
                        <div style={{ padding:'10px 14px', background:'rgba(126,184,208,0.04)', display:'flex', alignItems:'center', justifyContent:'space-between', gap:10 }}>
                          <div>
                            <div style={{ fontSize:13, color:TX, fontWeight:500 }}>{hName} ⚭ {wName} <span style={{ fontSize:10, color:DM, fontWeight:400 }}>score: {match.score}</span></div>
                            <div style={{ fontSize:11, color:DM, marginTop:2 }}>FTLS likely match: <span style={{ color:GC }}>{match.id}</span> · GEDCOM/orphan family: <span style={{ color:'#7eb8d0' }}>{fam.id}</span></div>
                          </div>
                          <button onClick={() => setFamilyReview({ extFam: fam, ftlsFamId: match.id, source: 'basket' })}
                            style={{ background:'rgba(126,184,208,0.12)', border:'1px solid rgba(126,184,208,0.3)', color:'#7eb8d0', padding:'4px 12px', borderRadius:5, cursor:'pointer', fontSize:11 }}>
                            Review Duplicate
                          </button>
                        </div>
                        <div style={{ padding:'8px 14px', fontSize:12, color:DM }}>
                          FTLS family: {ftlsH} ⚭ {ftlsW} · {(ftlsFam?.children||[]).length} children
                        </div>
                      </div>
                    );
                  })}
                </>)}

                {/* IMPORT SECTION */}
                {(basket.imports.length>0 || basket.importFams.length>0 || (basket.familyFactImports||[]).length>0) && (<>
                  <div style={hdr}>⬇ Import into FTLS ({basket.imports.length + basket.importFams.length + (basket.familyFactImports||[]).length} items)</div>
                  {basket.imports.map((item, i) => (<div key={i} style={{ ...rowSt, display:'flex', alignItems:'center', gap:8 }}>
                    <span style={{ width:8, height:8, borderRadius:'50%', background:item.person.g==='M'?MC:FC, flexShrink:0 }} />
                    <span style={{ color:TX, flex:1 }}>
                      {item.person.dn||'?'}
                      {item.type==='changed_fields' && <span style={{ color:DM, fontSize:11, marginLeft:6 }}>({item.fields.map(f=>f.label).join(', ')})</span>}
                      {item.type==='ext_person' && <span style={badge('rgba(126,184,208,0.5)')}>new</span>}
                    </span>
                  </div>))}
                  {basket.importFams.map((fam, i) => {
                    const hName = fam.husb ? (extPeopleMap[fam.husb]?.dn || personMap[fam.husb]?.dn || fam.husb) : '?';
                    const wName = fam.wife ? (extPeopleMap[fam.wife]?.dn || personMap[fam.wife]?.dn || fam.wife) : '?';
                    return (<div key={'f'+i} style={{ ...rowSt, fontSize:12, color:TX }}>
                      📎 {hName} ⚭ {wName} — {(fam.children||[]).length} children <span style={badge('rgba(126,184,208,0.5)')}>new family</span>
                    </div>);
                  })}
                  {(basket.familyFactImports||[]).map((item, i) => {
                    const fam = item.ftls || {};
                    const hid = fam.husband_id || fam.husb || item.ext?.husb || '';
                    const wid = fam.wife_id || fam.wife || item.ext?.wife || '';
                    const hName = personMap[hid]?.dn || extPeopleMap[hid]?.dn || hid || '—';
                    const wName = personMap[wid]?.dn || extPeopleMap[wid]?.dn || wid || '—';
                    return (<div key={'ffi'+i} style={{ ...rowSt, fontSize:12, color:TX }}>
                      💍 {hName} ⚭ {wName} <span style={{ color:DM, fontSize:11, marginLeft:6 }}>({item.fields.map(f=>f.label||f.field).join(', ')})</span> <span style={badge('rgba(107,158,114,0.5)')}>family facts</span>
                    </div>);
                  })}
                  <div style={{ marginTop:12, display:'flex', gap:10, alignItems:'center' }}>
                    <button onClick={()=>{
                      const count = basket.imports.length + basket.importFams.length + (basket.familyFactImports||[]).length;
                      if (confirm(`This will write ${count} item${count>1?'s':''} to the FTLS database. New persons will be added; existing persons will have selected fields updated.\n\nContinue?`)) {
                        batchImport();
                      }
                    }} disabled={merging} style={{ background:'rgba(107,158,114,0.15)', border:'1px solid '+MC, color:MC, padding:'8px 20px', borderRadius:6, cursor:'pointer', fontSize:13 }}>
                      {merging ? 'Merging...' : '⬇ Write to FTLS Database'}
                    </button>
                    <span style={{ fontSize:10, color:DM }}>⚠ This modifies your database</span>
                  </div>
                </>)}

                {/* EXPORT SECTION */}
                {basket.exports.length>0 && (<>
                  <div style={{...hdr, marginTop: (basket.imports.length>0||basket.importFams.length>0)?24:0}}>⬆ Export from FTLS ({basket.exports.length} items)</div>
                  {basket.exports.map((item, i) => {
                    if (item.type === 'family_facts') {
                      const fam = item.family || {};
                      const hid = fam.husband_id || fam.husb || item.ext?.husb || '';
                      const wid = fam.wife_id || fam.wife || item.ext?.wife || '';
                      const hName = personMap[hid]?.dn || extPeopleMap[hid]?.dn || hid || '—';
                      const wName = personMap[wid]?.dn || extPeopleMap[wid]?.dn || wid || '—';
                      return (<div key={'famx'+i} style={{ ...rowSt, display:'flex', alignItems:'center', gap:8 }}>
                        <span style={{ width:8, height:8, borderRadius:'50%', background:GC, flexShrink:0 }} />
                        <span style={{ color:TX, flex:1 }}>
                          💍 {hName} ⚭ {wName}
                          <span style={{ color:DM, fontSize:11, marginLeft:6 }}>({item.fields.map(f=>f.label||f.field).join(', ')})</span>
                          <span style={badge('rgba(196,163,90,0.5)')}>family facts</span>
                        </span>
                      </div>);
                    }
                    return (<div key={i} style={{ ...rowSt, display:'flex', alignItems:'center', gap:8 }}>
                      <span style={{ width:8, height:8, borderRadius:'50%', background:item.person.g==='M'?MC:FC, flexShrink:0 }} />
                      <span style={{ color:TX, flex:1 }}>
                        {item.person.dn||'?'}
                        {item.type==='changed_fields' && <span style={{ color:DM, fontSize:11, marginLeft:6 }}>({item.fields.map(f=>f.label).join(', ')})</span>}
                        {item.type==='ftls_person' && <span style={badge('rgba(155,130,196,0.5)')}>new</span>}
                      </span>
                    </div>);
                  })}
                  <div style={{ marginTop:12, display:'flex', gap:10, flexWrap:'wrap' }}>
                    <button onClick={batchExportGedcom} style={{ background:'rgba(196,163,90,0.1)', border:'1px solid '+GD, color:GC, padding:'8px 20px', borderRadius:6, cursor:'pointer', fontSize:13 }}>
                      📄 Download as New GEDCOM
                    </button>
                    {extGedcomText && <button onClick={batchMergeIntoGedcom} style={{ background:'rgba(155,130,196,0.1)', border:'1px solid '+FC, color:FC, padding:'8px 20px', borderRadius:6, cursor:'pointer', fontSize:13 }}>
                      📄 Download Merged into {fileName}
                    </button>}
                  </div>
                  <div style={{ fontSize:10, color:DM, marginTop:6 }}>These buttons download GEDCOM files — they do not modify your database.</div>
                </>)}
              </>)}
            </div>)}

            {/* ──── LOG ──── */}
            {tab==='log' && (<div style={{ padding:'12px 0' }}>
              <div style={{ fontSize:12, color:DM, marginBottom:8 }}>Operations this session.</div>
              {mergeLog.map((e,i)=><div key={i} style={{ padding:'3px 0', fontSize:12, color:e.startsWith('✓')?'#6b9e72':e.startsWith('⬆')?GC:'#c45050' }}>{e}</div>)}
              {mergeLog.some(l=>l.startsWith('✓')) && <button onClick={onMergeComplete} style={{ marginTop:16, background:'rgba(196,163,90,0.12)', border:'1px solid '+GD, color:GC, padding:'8px 20px', borderRadius:6, cursor:'pointer', fontSize:13 }}>↻ Reload Tree</button>}
            </div>)}
          </>)}
        </div>
      </div>
      {familyReview && (() => {
        const ftlsFam = familyMap[familyReview.ftlsFamId];
        if (!ftlsFam) return null;
        return (
          <FamilyDuplicateReviewModal
            extFam={familyReview.extFam}
            ftlsFam={ftlsFam}
            extPeopleMap={extPeopleMap}
            personMap={personMap}
            busy={merging}
            onClose={() => setFamilyReview(null)}
            onConfirm={async ({ keepMode, fieldSelections }) => {
              try {
                setMerging(true);
                const result = await reconcileExternalFamily(familyReview.extFam, familyReview.ftlsFamId, { keepMode, fieldSelections });
                setFuzzyFamResolved(prev => ({ ...prev, [familyReview.extFam.id]: 'remapped' }));
                // If this family review was opened from a follow-on card, mark
                // that follow-on resolved so it stops appearing in the list.
                if (familyReview.followOnKey) {
                  setFollowOnResolved(prev => ({ ...prev, [familyReview.followOnKey]: 'merged' }));
                }
                const hName = familyReview.extFam.husb ? (extPeopleMap[familyReview.extFam.husb]?.dn || personMap[familyReview.extFam.husb]?.dn || familyReview.extFam.husb) : '—';
                const wName = familyReview.extFam.wife ? (extPeopleMap[familyReview.extFam.wife]?.dn || personMap[familyReview.extFam.wife]?.dn || familyReview.extFam.wife) : '—';
                setMergeLog(prev => [...prev, '✓ Family duplicate merged: ' + familyReview.ftlsFamId + ' → ' + result.targetId + ' (' + hName + ' ⚭ ' + wName + ')']);
                setFamilyReview(null);
                if (onSilentRefresh) onSilentRefresh();
              } catch (e) {
                alert('Family reconcile failed: ' + e.message);
                setMergeLog(prev => [...prev, '✗ Family reconcile failed: ' + e.message]);
              } finally {
                setMerging(false);
              }
            }}
          />
        );
      })()}
      {ftlsDupReview && (() => {
        const currentPerson = personMap[ftlsDupReview.currentId];
        const dupPerson = personMap[ftlsDupReview.duplicateId];
        if (!currentPerson || !dupPerson) return null;
        return (
          <DuplicateResolveModal
            orphanPerson={dupPerson}
            candidatePerson={currentPerson}
            candidateMeta={{ score: ftlsDupReview.score, status: 'duplicate' }}
            personMap={personMap}
            familyMap={familyMap}
            initialKeepId={currentPerson.id}
            busy={merging}
            matchReasons={ftlsDupReview.matchReasons}
            buildPersonContext={buildPersonContext}
            onBack={() => setFtlsDupReview(null)}
            onClose={() => setFtlsDupReview(null)}
            onConfirm={async ({ keepId, removeId, preferSource, fieldSelections }) => {
              try {
                setMerging(true);
                await mergeDuplicatePeople(keepId, removeId, user?.email || 'GEDCOM duplicate merge', { preferSource, fieldSelections });
                setFuzzyResolved(prev => ({...prev, [ftlsDupReview.currentId + '|' + ftlsDupReview.duplicateId]: 'merged'}));
                setMergeLog(prev => [...prev, '✓ Duplicate merged: ' + (currentPerson.dn||'?') + ' — kept ' + keepId + ', removed ' + removeId]);
                setFtlsDupReview(null);
                if (onSilentRefresh) onSilentRefresh();
              } catch(e) {
                alert('Duplicate merge failed: ' + e.message);
                setMergeLog(prev => [...prev, '✗ Duplicate merge failed: ' + e.message]);
              } finally {
                setMerging(false);
              }
            }}
          />
        );
      })()}
      {/* External merge review: FTLS ↔ external fuzzy match, user keeps FTLS id
          and picks which fields to take from the external side. This is the
          Option-A flow — after the merge completes, follow-on candidates are
          computed and surfaced at the top of the Fuzzy tab for the next step. */}
      {extMergeReview && (() => {
        // orphanPerson = external side (treated as merge source), candidatePerson = FTLS
        const candidate = extMergeReview.ftlsPerson;
        const orphan = { ...extMergeReview.extPerson }; // clone to avoid mutating extPeopleMap
        return (
          <DuplicateResolveModal
            orphanPerson={orphan}
            candidatePerson={candidate}
            candidateMeta={{ score: extMergeReview.score, status: 'external_merge' }}
            personMap={personMap}
            familyMap={familyMap}
            initialKeepId={extMergeReview.ftlsId}
            busy={merging}
            matchReasons={extMergeReview.matchReasons || []}
            buildPersonContext={buildPersonContext}
            onBack={() => setExtMergeReview(null)}
            onClose={() => setExtMergeReview(null)}
            onConfirm={async ({ keepId, removeId, preferSource, fieldSelections }) => {
              try {
                setMerging(true);
                // Force keepId to FTLS — the external side has no Supabase row,
                // so we cannot flip direction here. The modal's "keep" buttons
                // are still shown for consistency, but only keepId = ftlsId is
                // valid in this code path. If the user happened to pick the
                // other direction, fall back to the GEDCOM-ID remap instead.
                if (keepId !== extMergeReview.ftlsId) {
                  await remapPersonId(extMergeReview.ftlsId, extMergeReview.extId, user?.email || 'GEDCOM merge');
                  setFuzzyResolved(prev => ({ ...prev, [extMergeReview.extId]: 'remapped' }));
                  setMergeLog(prev => [...prev, '✓ Remapped ' + (orphan.dn || '?') + ': ' + extMergeReview.ftlsId + ' → ' + extMergeReview.extId]);
                } else {
                  // External-source merge: orphan's field values overlay onto
                  // the FTLS record (where field selection says so). The
                  // external record itself is not in Supabase, so skipRemap
                  // prevents the merge function from trying to reassign
                  // references that don't exist.
                  await mergeDuplicatePeople(
                    keepId,
                    extMergeReview.extId,
                    user?.email || 'GEDCOM external merge',
                    {
                      preferSource,
                      fieldSelections,
                      removePersonOverride: orphan,
                      skipRemap: true
                    }
                  );
                  setFuzzyResolved(prev => ({ ...prev, [extMergeReview.extId]: 'merged_ftls' }));
                  // If this merge was triggered by clicking Merge on a follow-on
                  // card, mark that card resolved so it disappears from the list.
                  if (extMergeReview.followOnKey) {
                    setFollowOnResolved(prev => ({ ...prev, [extMergeReview.followOnKey]: 'merged' }));
                  }
                  setMergeLog(prev => [...prev, '✓ Merged external ' + extMergeReview.extId + ' into FTLS ' + extMergeReview.ftlsId + ' (' + (candidate.dn || '?') + ')']);
                  // Compute follow-on candidates and queue them
                  const originLabel = candidate.dn || extMergeReview.ftlsId;
                  const followOns = computeFollowOnMatches(extMergeReview.ftlsId, extMergeReview.extId, originLabel);
                  if (followOns.length > 0) {
                    setFollowOnMatches(prev => {
                      const existingKeys = new Set(prev.map(e => e.key));
                      const novel = followOns.filter(f => !existingKeys.has(f.key));
                      return [...prev, ...novel];
                    });
                    setMergeLog(prev => [...prev, '  → ' + followOns.length + ' follow-on match' + (followOns.length === 1 ? '' : 'es') + ' queued for review']);
                  }
                  if (onSilentRefresh) onSilentRefresh();
                }
                setExtMergeReview(null);
              } catch(e) {
                alert('External merge failed: ' + e.message);
                setMergeLog(prev => [...prev, '✗ External merge failed: ' + e.message]);
              } finally {
                setMerging(false);
              }
            }}
          />
        );
      })()}
    </div>
  );
}

/* ───── MOVE BRANCH MODAL ───── */
function DuplicateResolveModal({ orphanPerson, candidatePerson, candidateMeta, personMap, familyMap, initialKeepId, matchReasons, buildPersonContext, onConfirm, onBack, onClose, busy }) {
  const [keepId, setKeepId] = useState(initialKeepId || candidatePerson.id);
  const [defaultSource, setDefaultSource] = useState(initialKeepId === orphanPerson.id ? 'orphan' : 'existing');
  const [fieldSource, setFieldSource] = useState({});

  const duplicateDiffs = useMemo(() => diffPersonFields(candidatePerson, orphanPerson), [candidatePerson, orphanPerson]);

  // Build context for both sides (if buildPersonContext is available)
  const candidateCtx = useMemo(() => buildPersonContext ? buildPersonContext(candidatePerson.id) : null, [candidatePerson.id, buildPersonContext]);
  const orphanCtx = useMemo(() => buildPersonContext ? buildPersonContext(orphanPerson.id) : null, [orphanPerson.id, buildPersonContext]);

  // Fallback: basic related families (used when buildPersonContext is not provided)
  const relatedFamilies = useMemo(() => {
    if (candidateCtx) return []; // skip when rich context is available
    const items = [];
    for (const [fid, fam] of Object.entries(familyMap)) {
      const kids = fam.children || [];
      const hid = fam.husband_id || '';
      const wid = fam.wife_id || '';
      if (!kids.includes(candidatePerson.id) && hid !== candidatePerson.id && wid !== candidatePerson.id) continue;
      const hName = hid && personMap[hid] ? personMap[hid].dn : '';
      const wName = wid && personMap[wid] ? personMap[wid].dn : '';
      items.push({
        id: fid,
        label: [hName, wName].filter(Boolean).join(' & ') || fid,
        role: kids.includes(candidatePerson.id) ? 'child in parent family' : 'spouse in family',
        kidCount: kids.length
      });
    }
    return items;
  }, [candidatePerson.id, familyMap, personMap, candidateCtx]);

  const getUiSource = (key) => fieldSource[key] || defaultSource;
  const mapUiSourceToMergeSource = (source) => {
    if (source === 'existing') return keepId === candidatePerson.id ? 'keep' : 'remove';
    return keepId === orphanPerson.id ? 'keep' : 'remove';
  };

  const handleConfirm = () => {
    const removeId = keepId === candidatePerson.id ? orphanPerson.id : candidatePerson.id;
    const selections = {};
    duplicateDiffs.forEach(d => {
      selections[d.key] = mapUiSourceToMergeSource(getUiSource(d.key));
    });
    onConfirm({
      keepId,
      removeId,
      preferSource: mapUiSourceToMergeSource(defaultSource),
      fieldSelections: selections
    });
  };

  const pickerBtn = (active, accent=MC) => ({
    padding:'6px 10px',
    borderRadius:6,
    cursor:'pointer',
    fontSize:11,
    border:'1px solid ' + (active ? accent : BR),
    background: active ? 'rgba(107,158,114,0.14)' : 'rgba(255,255,255,0.03)',
    color: active ? accent : DM
  });

  return (
    <div style={{ position:'fixed', inset:0, zIndex:210, display:'flex', alignItems:'center', justifyContent:'center' }}>
      <div style={{ position:'absolute', inset:0, background:'rgba(0,0,0,0.88)' }} onClick={onClose} />
      <div style={{ position:'relative', background:'#141410', border:'1px solid '+GD, borderRadius:12, width:Math.min(920, window.innerWidth-32), maxHeight:'90vh', overflow:'hidden', display:'flex', flexDirection:'column', zIndex:211 }}>
        <div style={{ padding:'16px 20px', borderBottom:'1px solid '+BR, display:'flex', alignItems:'center', justifyContent:'space-between' }}>
          <div>
            <div style={{ fontSize:18, color:GC, fontWeight:500 }}>🧬 Review Duplicate Before Merge</div>
            <div style={{ fontSize:12, color:DM, marginTop:4 }}>
              {candidateMeta?.score ? `Match score ${candidateMeta.score} · ` : ''}Choose the final ID and which values to keep for each field.
            </div>
          </div>
          <span onClick={onClose} style={{ fontSize:20, color:DM, cursor:'pointer' }}>✕</span>
        </div>

        <div style={{ flex:1, overflowY:'auto', padding:20 }}>
          {/* ── MATCH REASONING ── */}
          {matchReasons && matchReasons.length > 0 && (
            <div style={{ padding:'10px 12px', marginBottom:16, background:'rgba(196,163,90,0.06)', border:'1px solid rgba(196,163,90,0.15)', borderRadius:8 }}>
              <div style={{ fontSize:10, color:'#c4a35a', textTransform:'uppercase', letterSpacing:1.2, marginBottom:4 }}>Why These Were Flagged as Duplicates</div>
              {matchReasons.map((r, i) => (
                <div key={i} style={{ fontSize:11, color:DM, lineHeight:1.6 }}>• {r}</div>
              ))}
            </div>
          )}

          {/* ── SIDE-BY-SIDE CONTEXT CARDS ── */}
          <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:12, marginBottom:16 }}>
            {[{ person: candidatePerson, ctx: candidateCtx, label: 'Existing FTLS / Tree Record', color: MC, bgAccent: 'rgba(255,255,255,0.02)' },
              { person: orphanPerson, ctx: orphanCtx, label: 'Duplicate / Orphan / Import', color: '#7eb8d0', bgAccent: 'rgba(126,184,208,0.05)' }].map((side, si) => (
              <div key={si} style={{ padding:12, border:'1px solid '+BR, borderRadius:8, background:side.bgAccent }}>
                <div style={{ fontSize:10, color:side.color, textTransform:'uppercase', letterSpacing:1.4, marginBottom:6 }}>{side.label}</div>
                <div style={{ fontSize:15, color:TX, fontWeight:500 }}>{side.person.dn || side.person.fn || side.person.id}</div>
                <div style={{ fontSize:11, color:DM, marginTop:4 }}>{side.person.id}</div>
                {side.person.g && <div style={{ fontSize:11, color:DM, marginTop:4 }}>Gender: <span style={{ color:TX }}>{side.person.g === 'M' ? 'Male' : side.person.g === 'F' ? 'Female' : side.person.g}</span></div>}
                {side.person.dob && <div style={{ fontSize:11, color:DM }}>Born: <span style={{ color:TX }}>{side.person.dob}</span>{side.person.loc ? ' · ' + side.person.loc : ''}</div>}
                {side.person.dod && <div style={{ fontSize:11, color:DM }}>Died: <span style={{ color:TX }}>{side.person.dod}</span></div>}
                {side.person.nk && <div style={{ fontSize:11, color:DM }}>Nickname: <span style={{ color:TX }}>{side.person.nk}</span></div>}
                {(side.person.ci || side.person.st || side.person.co) && <div style={{ fontSize:11, color:DM }}>Address: <span style={{ color:TX }}>{[side.person.a1, side.person.ci, side.person.st, side.person.co].filter(Boolean).join(', ')}</span></div>}
                {side.person.prof && <div style={{ fontSize:11, color:DM }}>Occupation: <span style={{ color:TX }}>{side.person.prof}</span></div>}

                {/* Parents */}
                {side.ctx && side.ctx.parentFamily && (
                  <div style={{ marginTop:8, paddingTop:8, borderTop:'1px solid rgba(255,255,255,0.06)' }}>
                    <div style={{ color:'#c4a35a', fontSize:10, textTransform:'uppercase', letterSpacing:1, marginBottom:3 }}>Parents</div>
                    <div style={{ fontSize:12, color:TX }}>{side.ctx.parentFamily.father || '?'} & {side.ctx.parentFamily.mother || '?'}</div>
                    <div style={{ fontSize:10, color:DM }}>{side.ctx.parentFamily.id}</div>
                  </div>
                )}
                {side.ctx && !side.ctx.parentFamily && (
                  <div style={{ marginTop:8, paddingTop:8, borderTop:'1px solid rgba(255,255,255,0.06)' }}>
                    <div style={{ fontSize:10, color:'#c49a6c' }}>No parent family linked</div>
                  </div>
                )}

                {/* Siblings */}
                {side.ctx && side.ctx.siblings.length > 0 && (
                  <div style={{ marginTop:4 }}>
                    <div style={{ fontSize:10, color:DM }}>Siblings: <span style={{ color:TX }}>{side.ctx.siblings.map(s => s.name).join(', ')}</span></div>
                  </div>
                )}

                {/* Spouse & Children */}
                {side.ctx && side.ctx.spouseFamilies.length > 0 && (
                  <div style={{ marginTop:8, paddingTop:8, borderTop:'1px solid rgba(255,255,255,0.06)' }}>
                    <div style={{ color:'#c4a35a', fontSize:10, textTransform:'uppercase', letterSpacing:1, marginBottom:3 }}>Spouse & Children</div>
                    {side.ctx.spouseFamilies.map(sf => (
                      <div key={sf.id} style={{ marginBottom:4 }}>
                        <div style={{ fontSize:12, color:TX }}>⚭ {sf.spouseName || '(unknown)'}</div>
                        {sf.children.length > 0 && <div style={{ fontSize:10, color:DM, marginLeft:12 }}>{sf.children.map(c => c.name).join(', ')}</div>}
                      </div>
                    ))}
                  </div>
                )}

                {/* Lineage path */}
                {side.ctx && side.ctx.lineagePath.length > 1 && (
                  <div style={{ marginTop:8, paddingTop:8, borderTop:'1px solid rgba(255,255,255,0.06)' }}>
                    <div style={{ color:'#c4a35a', fontSize:10, textTransform:'uppercase', letterSpacing:1, marginBottom:3 }}>Lineage</div>
                    <div style={{ fontSize:10, color:DM }}>{side.ctx.lineagePath.map(l => l.name).join(' → ')}</div>
                  </div>
                )}

                {/* Fallback: basic linked families count (when no buildPersonContext) */}
                {!side.ctx && si === 0 && relatedFamilies.length > 0 && (
                  <div style={{ fontSize:11, color:DM, marginTop:8 }}>{relatedFamilies.length} linked family record{relatedFamilies.length===1?'':'s'}</div>
                )}
                {!side.ctx && si === 1 && (
                  <div style={{ fontSize:11, color:DM, marginTop:8 }}>This is the record to be merged/removed.</div>
                )}
              </div>
            ))}
          </div>

          <div style={{ marginBottom:16, padding:12, border:'1px solid '+BR, borderRadius:8, background:'rgba(196,163,90,0.05)' }}>
            <div style={{ fontSize:11, color:DM, textTransform:'uppercase', letterSpacing:1.4, marginBottom:8 }}>Final ID After Merge</div>
            <div style={{ display:'flex', gap:8, flexWrap:'wrap' }}>
              <button type="button" onClick={() => setKeepId(candidatePerson.id)} style={pickerBtn(keepId === candidatePerson.id)}>
                Keep FTLS/tree ID: {candidatePerson.id}
              </button>
              <button type="button" onClick={() => setKeepId(orphanPerson.id)} style={pickerBtn(keepId === orphanPerson.id, '#7eb8d0')}>
                Keep orphan/import ID: {orphanPerson.id}
              </button>
            </div>
            <div style={{ fontSize:11, color:DM, marginTop:8 }}>
              Family links, media tags, requests, and other references will be repointed to the kept ID automatically.
            </div>
          </div>

          <div style={{ marginBottom:16, padding:12, border:'1px solid '+BR, borderRadius:8, background:'rgba(255,255,255,0.02)' }}>
            <div style={{ fontSize:11, color:DM, textTransform:'uppercase', letterSpacing:1.4, marginBottom:8 }}>Default Field Preference</div>
            <div style={{ display:'flex', gap:8, flexWrap:'wrap' }}>
              <button type="button" onClick={() => { setDefaultSource('existing'); setFieldSource({}); }} style={pickerBtn(defaultSource === 'existing')}>
                Prefer existing FTLS values
              </button>
              <button type="button" onClick={() => { setDefaultSource('orphan'); setFieldSource({}); }} style={pickerBtn(defaultSource === 'orphan', '#7eb8d0')}>
                Prefer orphan / import values
              </button>
            </div>
          </div>

          {relatedFamilies.length > 0 && !candidateCtx && (
            <div style={{ marginBottom:16, padding:12, border:'1px solid '+BR, borderRadius:8, background:'rgba(255,255,255,0.02)' }}>
              <div style={{ fontSize:11, color:DM, textTransform:'uppercase', letterSpacing:1.4, marginBottom:8 }}>Existing Family Context</div>
              {relatedFamilies.map(f => (
                <div key={f.id} style={{ fontSize:12, color:TX, marginTop:6 }}>
                  {f.label} <span style={{ color:DM }}>· {f.role} · {f.kidCount} children · {f.id}</span>
                </div>
              ))}
            </div>
          )}

          {duplicateDiffs.length > 0 ? (
            <table style={{ width:'100%', borderCollapse:'collapse', fontSize:12 }}>
              <thead>
                <tr>
                  <th style={{ textAlign:'left', color:DM, padding:'6px 8px', width:150 }}>Choose</th>

              {busy ? 'Merging...' : 'Merge Duplicate'}
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}
