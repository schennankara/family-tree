      else { L.push('1 CHAN'); L.push(`2 DATE ${gedcomDate()}`); L.push(`3 TIME ${gedcomTime()}`); }
      lines.push(...L);
    } else {
      // Bare minimum stub so the FAM reference doesn't dangle
      lines.push(`0 ${refId} INDI`, `1 NAME (Unknown) //`);
    }
  }

  // Include meta records for MacFamilyTree round-trip
  // Person-specific (OBJE, _STO, NOTE, SOUR): only if referenced by exported persons
  // App config (_STE, _STF, _PTF, _PTE, LABL, REPO): always included — MacFT needs them to parse the file
  // Uses module-level PERSON_SPECIFIC_META const defined near the top of file.
  if (window.gedcomMetaRecords && window.gedcomMetaRecords.length > 0) {
    // Collect all @pointer@ references from exported persons' _xg AND notes fields
    const referencedIds = new Set();
    for (const pid of exportedPersons) {
      const person = pMap[pid] || anchorMap[pid];
      if (person && person._xg) {
        const refs = person._xg.match(/@[^@]+@/g);
        if (refs) refs.forEach(r => referencedIds.add(r));
      }
      // Notes field may contain a pointer to a standalone NOTE record
      if (person && person.notes && /^@[^@]+@$/.test((person.notes||'').trim())) {
        referencedIds.add(person.notes.trim());
      }
    }
    for (const meta of window.gedcomMetaRecords) {
      if (PERSON_SPECIFIC_META.has(meta.record_type) && !referencedIds.has(meta.id)) continue;
      lines.push(meta.raw_gedcom);
    }
  }

  // Include standalone NOTE records generated by personToGedcomLines
  if (diffStandaloneNotes.length > 0) lines.push(...diffStandaloneNotes);

  lines.push('0 TRLR');
  return lines.join('\n') + '\n';
}

// Merge FTLS additions into the original external GEDCOM text
function buildMergedGedcom(originalText, exportPersons, exportFields, ftlsFamilyMap, extFamilyIds, forcedFamilyIds) {
  const forcedFamIds = forcedFamilyIds instanceof Set ? forcedFamilyIds : new Set(forcedFamilyIds || []);
  const originalElements = tokenizeGedcom(originalText);
  const originalNoteMap = buildGedcomNoteMap(originalElements);
  const generatedNoteIds = findGeneratedFtlsNoteIds(originalElements, originalNoteMap);
  const lines = stripGeneratedFtlsNoteRecordsFromGedcomLines(
    originalText.replace(/\r\n/g, '\n').replace(/\r/g, '\n').split('\n'),
    generatedNoteIds
  );
  let trlrIdx = lines.length - 1;
  for (let i = lines.length - 1; i >= 0; i--) { if (lines[i].trim() === '0 TRLR') { trlrIdx = i; break; } }
  const before = lines.slice(0, trlrIdx);
  const newLines = [];
  const extIds = extFamilyIds || new Set();

  // Build set of person IDs that already exist in the original
  const existingPIds = new Set();
  for (const line of before) {
    const m = line.match(/^0 (@[^@]+@) INDI/);
    if (m) existingPIds.add(m[1]);
  }

  // Split export persons into new vs existing
  const newPersons = exportPersons.filter(p => !existingPIds.has(p.id));
  const existingPersons = exportPersons.filter(p => existingPIds.has(p.id));
  const newPIds = new Set(newPersons.map(p => p.id));

  // Add ONLY truly new INDI records
  const mergedStandaloneNotes = [];
  for (const p of newPersons) {
    const pFams = [];
    const pFamc = [];
    for (const [fid, fam] of Object.entries(ftlsFamilyMap)) {
      if ((fam.husband_id||fam.husb) === p.id || (fam.wife_id||fam.wife) === p.id) pFams.push(fid);
      if ((fam.children||[]).includes(p.id)) pFamc.push(fid);
    }
    const { indi: L, standalone } = personToGedcomLines(p, { fams: pFams, famc: pFamc });
    if (standalone.length > 0) mergedStandaloneNotes.push(...standalone);
    // Add FAMS/FAMC refs
    pFams.forEach(fid => L.push(`1 FAMS ${fid}`));
    pFamc.forEach(fid => L.push(`1 FAMC ${fid}`));
    // Preserved extra GEDCOM lines
    if (p._xg) { p._xg.split('\n').forEach(xl => { if (xl.trim()) L.push(xl); }); }
    newLines.push(...L);
  }

  // Add new FAM records (families not in external)
  for (const [fid, fam] of Object.entries(ftlsFamilyMap)) {
    if (extIds.has(fid)) continue;
    const hid = fam.husband_id || fam.husb || '';
    const wid = fam.wife_id || fam.wife || '';
    const kids = fam.children || [];
    if (forcedFamIds.has(fid) || newPIds.has(hid) || newPIds.has(wid) || kids.some(k => newPIds.has(k))) {
      const F = [`0 ${fid} FAM`];
      if (hid) F.push(`1 HUSB ${hid}`);
      if (wid) F.push(`1 WIFE ${wid}`);
      const md = fam.marriage_date || fam.mdate || '';
      const mp = fam.marriage_place || fam.mplace || '';
      const dd = fam.divorce_date || fam.divdate || '';
      buildFamilyMarriageLines(fam).forEach(line => F.push(line));
      buildFamilyDivorceLines(fam).forEach(line => F.push(line));
      kids.forEach(c => F.push(`1 CHIL ${c}`));
      addStandaloneFamilyReconciliationNote(F, mergedStandaloneNotes, { ...fam, id: fid, husband_id: hid, wife_id: wid, marriage_date: md, marriage_place: mp, divorce_date: dd }, {});
      newLines.push(...F);
    }
  }

  // Patch existing FAMs: add CHIL lines for new children only
  for (const p of newPersons) {
    for (const [fid, fam] of Object.entries(ftlsFamilyMap)) {
      if (!extIds.has(fid)) continue;
      if (!(fam.children||[]).includes(p.id)) continue;
      for (let i = 0; i < before.length; i++) {
        if (before[i].trim() === `0 ${fid} FAM`) {
          let j = i + 1;
          while (j < before.length && !before[j].trim().startsWith('0 ')) j++;
          if (!before.slice(i, j).some(l => l.includes(`1 CHIL ${p.id}`))) {
            before.splice(j, 0, `1 CHIL ${p.id}`);
          }
          break;
        }
      }
    }
  }



  // Patch marriage facts on existing external FAM records when a selected/exported
  // FTLS person belongs to that family. Marriage date/place live on FAM, not INDI,
  // so person replacement alone cannot carry them across.
  const exportPersonIdsForFamilies = new Set(exportPersons.map(p => p.id));
  const exportPersonNameMapForFamilies = {};
  exportPersons.forEach(p => { exportPersonNameMapForFamilies[p.id] = p; });
  const familyIdsToSync = new Set(forcedFamIds);
  for (const [fid, fam] of Object.entries(ftlsFamilyMap)) {
    const hid = fam.husband_id || fam.husb || '';
    const wid = fam.wife_id || fam.wife || '';
    const kids = fam.children || [];
    if (exportPersonIdsForFamilies.has(hid) || exportPersonIdsForFamilies.has(wid) || kids.some(k => exportPersonIdsForFamilies.has(k))) {
      familyIdsToSync.add(fid);
    }
  }
  for (let i = before.length - 1; i >= 0; i--) {
    const m = before[i].match(/^0\s+(@[^@]+@)\s+FAM/);
    if (!m || !familyIdsToSync.has(m[1])) continue;
    const fam = ftlsFamilyMap[m[1]];
    if (!fam) continue;
    let j = i + 1;
    while (j < before.length && !before[j].trim().startsWith('0 ')) j++;
    const header = before[i];
    let body = before.slice(i + 1, j);
    body = appendOrReplaceFamilyMarriageBlock(body, fam);
    // Existing generated FTLS notes were already stripped at the whole-file level.
    addStandaloneFamilyReconciliationNote(body, mergedStandaloneNotes, { ...fam, id: m[1] }, exportPersonNameMapForFamilies);
    before.splice(i, j - i, header, ...body);
  }

  // For existing persons, decide: field-level patch or full INDI replacement
  // If exportFields specifies fields for a person → patch only those fields
  // If person is in export basket but NOT in exportFields → full INDI replacement
  
  // Build FAMC/FAMS lookups from full familyMap
  const famcLookup2 = {}, famsLookup2 = {};
  for (const [fid, fam] of Object.entries(ftlsFamilyMap)) {
    (fam.children || []).forEach(cid => { if (!famcLookup2[cid]) famcLookup2[cid] = []; famcLookup2[cid].push(fid); });
    const hid = fam.husband_id || fam.husb || '';
    const wid = fam.wife_id || fam.wife || '';
    if (hid) { if (!famsLookup2[hid]) famsLookup2[hid] = []; famsLookup2[hid].push(fid); }
    if (wid) { if (!famsLookup2[wid]) famsLookup2[wid] = []; famsLookup2[wid].push(fid); }
  }
  
  function buildReplacementIndi(p) {
    const { indi: L, standalone } = personToGedcomLines(p, { fams: famsLookup2[p.id] || [], famc: famcLookup2[p.id] || [] });
    if (standalone.length > 0) mergedStandaloneNotes.push(...standalone);
    // Add FAMS/FAMC refs from the family map
    (famsLookup2[p.id] || []).forEach(ref => L.push(`1 FAMS ${ref}`));
    (famcLookup2[p.id] || []).forEach(ref => L.push(`1 FAMC ${ref}`));
    // Preserved extra GEDCOM lines (OBJE, RESI, BURI, _CRE, CHAN, etc.)
    if (p._xg) { p._xg.split('\n').forEach(xl => { if (xl.trim()) L.push(xl); }); }
    return L;
  }

  // ── ONE PATH: Replace INDI blocks for all exported existing persons ──
  // For each person: extract cardinal features from original, build fresh FTLS INDI, append cardinal.
  const exportPMap = {};
  for (const p of existingPersons) exportPMap[p.id] = p;
  const existingExportIds = new Set(existingPersons.map(p => p.id));

  // Tags that FTLS manages (everything else is "cardinal" and gets preserved).
  // Uses module-level KNOWN_INDI_L1 const defined near the top of file.

  for (let i = before.length - 1; i >= 0; i--) {
    const m = before[i].match(/^0 (@[^@]+@) INDI/);
    if (!m || !existingExportIds.has(m[1])) continue;
    const p = exportPMap[m[1]];
    if (!p) continue;
    let j = i + 1;
    while (j < before.length && !before[j].trim().startsWith('0 ')) j++;
    // Extract cardinal features from original block (OBJE, RESI, BURI, _CRE, CHAN, DIV, etc.)
    if (!p._xg) {
      const origLines = before.slice(i+1, j);
      const preserved = [];
      let k = 0;
      while (k < origLines.length) {
        const op = origLines[k].trim().split(' ', 2);
        if (op[0] === '1' && !KNOWN_INDI_L1.has(op[1])) {
          preserved.push(origLines[k].trim());
          k++;
          while (k < origLines.length && origLines[k].trim().split(' ',2)[0] !== '1') {
            preserved.push(origLines[k].trim()); k++;
          }
          continue;
        }
        k++;
      }
      if (preserved.length > 0) p._xg = preserved.join('\n');
    }
    before.splice(i, j - i, ...buildReplacementIndi(p));
  }


  return [...before, ...newLines, ...mergedStandaloneNotes, '0 TRLR'].join('\n') + '\n';
}


/* ───── GEDCOM Link Repair: Cross-reference FAMC/FAMS ───── */
// After parsing, ensure bidirectional links:
// - If FAM has CHIL → INDI must have FAMC
// - If FAM has HUSB/WIFE → INDI must have FAMS
function repairGedcomLinks(people, families) {
  let repaired = 0;
  for (const [fid, fam] of Object.entries(families)) {
    // Repair FAMC for children
    for (const cid of (fam.children || [])) {
      const p = people[cid];
      if (p && !(p.famc || []).includes(fid)) {
        if (!p.famc) p.famc = [];
        p.famc.push(fid);
        repaired++;
      }
    }
    // Repair FAMS for husband
    if (fam.husb && people[fam.husb]) {
      const p = people[fam.husb];
      if (!(p.fams || []).includes(fid)) {
        if (!p.fams) p.fams = [];
        p.fams.push(fid);
        repaired++;
      }
    }
    // Repair FAMS for wife
    if (fam.wife && people[fam.wife]) {
      const p = people[fam.wife];
      if (!(p.fams || []).includes(fid)) {
        if (!p.fams) p.fams = [];
        p.fams.push(fid);
        repaired++;
      }
    }
  }
  if (repaired > 0) console.log(`repairGedcomLinks: repaired ${repaired} missing FAMC/FAMS links`);
  return repaired;
}

/* ───── GEDCOM 5.5.1 IMPORTER / PARSER ───── */
function parseGedcomFile(text) {
  // Use the canonical shared tokenizer (faithful — preserves whitespace).
  const elements = tokenizeGedcom(text);
  const noteMap = buildGedcomNoteMap(elements);

  // Check character encoding (#13)
  const headEl = elements.find(e => e.tag === 'HEAD');
  if (headEl) {
    const charEl = headEl.children.find(c => c.tag === 'CHAR');
    if (charEl && charEl.value && charEl.value.toUpperCase() !== 'UTF-8' && charEl.value.toUpperCase() !== 'UNICODE') {
      console.warn('GEDCOM encoding is ' + charEl.value + ', not UTF-8. Some characters may display incorrectly.');
    }
    // Check GEDCOM version (#19)
    const gedcEl = headEl.children.find(c => c.tag === 'GEDC');
    if (gedcEl) {
      const versEl = gedcEl.children.find(c => c.tag === 'VERS');
      if (versEl && versEl.value && versEl.value.startsWith('7.')) {
        console.warn('GEDCOM 7.x detected. This parser supports 5.5.1. Some features may not parse correctly.');
      }
    }
  }

  // Extract individuals
  const people = {};
  const families = {};

  for (const el of elements) {
    if (el.tag === 'INDI' && el.pointer) {
      const p = parseIndi(el, noteMap);
      people[p.id] = p;
    } else if (el.tag === 'FAM' && el.pointer) {
      const f = parseFam(el, noteMap);
      families[f.id] = f;
    }
  }

  // Repair missing FAMC/FAMS links (#1/#6)
  repairGedcomLinks(people, families);

  // Compute generations & build tree
  return buildTreeFromFlat(people, families);
}

function getChildValue(el, tag) {
  const ch = el.children.find(c => c.tag === tag);
  return ch ? ch.value : '';
}

function getNestedValue(el, parentTag, childTag) {
  const parent = el.children.find(c => c.tag === parentTag);
  if (!parent) return '';
  const child = parent.children.find(c => c.tag === childTag);
  return child ? child.value : '';
}

function parseIndi(el, noteMap = {}) {
  const id = el.pointer;

  // Primary name
  let fn = '', mn = '', ln = '', nk = '', md = '', tp = '', sx = '', parsedBirthOrder = 0;
  const nameEls = el.children.filter(c => c.tag === 'NAME');

  for (const nameEl of nameEls) {
    const typeEl = nameEl.children.find(c => c.tag === 'TYPE');
    const type = typeEl ? typeEl.value : '';

    if (type === 'nick') {
      // FAITHFUL: strip slashes plus the single space MFT puts between name and
      // // delimiter (e.g. "Baby //" → "Baby" not "Baby "). The space before //
      // is GEDCOM syntactic delimiter, not user data. Internal whitespace is
      // still preserved.
      nk = nameEl.value.replace(/\s*\/\/\s*$/, '').replace(/\//g, '');
    } else if (type === 'birth') {
      md = nameEl.value.replace(/\s*\/\/\s*$/, '').replace(/\//g, '');
    } else if (type === 'married') {
      // Skip married-name-only entries (the "George married to George" issue)
      continue;
    } else if (!fn && !ln) {
      // Primary name - parse from structured value or sub-tags
      const givnEl = nameEl.children.find(c => c.tag === 'GIVN');
      const surnEl = nameEl.children.find(c => c.tag === 'SURN');
      const secgEl = nameEl.children.find(c => c.tag === 'SECG');
      const npfxEl = nameEl.children.find(c => c.tag === 'NPFX');
      const nsfxEl = nameEl.children.find(c => c.tag === 'NSFX');
      if (npfxEl && !tp) tp = npfxEl.value;
      if (nsfxEl && !sx) sx = nsfxEl.value;

      if (givnEl) {
        // Strip leading birth-order number prefix like "4. Samuel" → "Samuel"
        const boMatch = givnEl.value.match(/^(\d+)\.\s*/);
        if (boMatch) parsedBirthOrder = parseInt(boMatch[1]);
        fn = givnEl.value.replace(/^\d+\.\s*/, '');
      }
      if (surnEl) ln = surnEl.value;
      if (secgEl && !mn) mn = secgEl.value;
      
      // Extract middle name from NAME string: compare given portion with fn
      // NAME "Steve S /Chennankara/" → givenPart="Steve S", fn="Steve" → mn="S"
      // NAME "Brother 3" → no surname → fn stays "Brother 3", mn=""
      if (fn && ln && !mn) {
        const nameVal = nameEl.value.replace(/^\d+\.\s*/, '');
        const slashMatch = nameVal.match(/^(.*?)\/([^\/]*)\//);
        if (slashMatch) {
          const givenPart = slashMatch[1].trim();
          if (givenPart.length > fn.length && givenPart.startsWith(fn)) {
            mn = givenPart.substring(fn.length).trim();
          }
        }
      }

      // Fallback: parse "Given /Surname/" format
      if (!fn && !ln) {
        // Strip leading birth-order number prefix
        const nameVal = nameEl.value.replace(/^\d+\.\s*/, '');
        const slashMatch = nameVal.match(/^(.*?)\/([^\/]*)\//);
        if (slashMatch) {
          const givenPart = slashMatch[1].trim();  // used internally for split, OK to trim
          // FAITHFUL: preserve whitespace on the stored surname itself.
          ln = slashMatch[2];
          const gParts = givenPart.split(' ');
          fn = gParts[0] || '';
          if (gParts.length > 1) mn = gParts.slice(1).join(' ');
        } else {
          // FAITHFUL: preserve whitespace; slashes are GEDCOM syntax only.
          fn = nameVal.replace(/\//g, '');
        }
      }
    }
  }

  const g = getChildValue(el, 'SEX');
  const dob = getNestedValue(el, 'BIRT', 'DATE');
  const loc = getNestedValue(el, 'BIRT', 'PLAC');
  const dod = getNestedValue(el, 'DEAT', 'DATE');
  const burd = getNestedValue(el, 'BURI', 'DATE');
  const deatEl2 = el.children.find(c => c.tag === 'DEAT');
  const hasDeat = deatEl2 ? (deatEl2.value === 'Y' || !!dod) : false;

  // Contact
  const ph = getChildValue(el, 'PHON');
  const em = getChildValue(el, 'EMAI') || getChildValue(el, 'EMAIL');
  const ws = getChildValue(el, 'WWW');

  // Address / residence. MFT 11 uses RESI value for simple places and
  // RESI > PLAC for detailed addresses. Parse both.
  let a1='',a2='',ci='',st='',zp='',co='';
  const addrEl = el.children.find(c => c.tag === 'ADDR' || c.tag === 'RESI');
  if (addrEl) {
    const parsedAddr = parseGedcomResidenceAddress(addrEl, noteMap);
    a1 = parsedAddr.a1 || ''; a2 = parsedAddr.a2 || '';
    ci = parsedAddr.ci || ''; st = parsedAddr.st || '';
    zp = parsedAddr.zp || ''; co = parsedAddr.co || '';
  }

  // Other fields
  const prof = getChildValue(el, 'OCCU');
  
  // Notes, Bio, Stories — resolve MFT standalone NOTE pointers and capture
  // event-level notes (BIRT/DEAT/ADOP/etc.) so they are not silently lost.
  let notes = '', bio = '', stories = '';
  const notePieces = collectGedcomNotes(el, noteMap);
  const ftlsSnapshots = collectFtlsReconciliationSnapshots(el, noteMap);
  for (const piece of notePieces) {
    const val = piece.text || '';
    if (val.startsWith('BIO: ')) {
      bio = val.substring(5);
    } else if (val.startsWith('STORY: ')) {
      stories = val.substring(7);
    } else if (val) {
      if (notes) notes += '\n';
      notes += val;
    }
  }

  // Custom tags
  const fb = getChildValue(el, '_FACEBOOK');
  const ig = getChildValue(el, '_INSTAGRAM');
  const li = getChildValue(el, '_LINKEDIN');
  const pp = getChildValue(el, '_PHOTO');
  const emp = getChildValue(el, '_EMPLOYER');
  const pgl = getChildValue(el, '_PHOTOGALLERY');
  const dl = getChildValue(el, '_DOCUMENTS');

  // Family links
  const fams = el.children.filter(c => c.tag === 'FAMS').map(c => c.value);
  const famc = el.children.filter(c => c.tag === 'FAMC').map(c => c.value);

  // Build display name
  let dn = (fn + (mn ? ' ' + mn : '') + (ln ? ' ' + ln : '')).trim();
  if (!dn) dn = nk || '(Unknown)';

  // Handle the "surname only" spouse issue - if no first name and only surname
  if (!fn && ln && !mn) {
    dn = `Mrs. ${ln} (name unknown)`;
  }

  notes = dedupeNoteTextLines(upsertNameSuffixIntoNotes(notes, sx));

  const parsedPerson = {
    id, fn, mn, ln, dn, nk, md, tp, sx, g,
    dob, dod, burd, dec: hasDeat || !!dod, bo: parsedBirthOrder,
    em, ph, a1, a2, ci, st, zp, co,
    fb, ig, li, ws, pp, bio, loc,
    prof, emp, stories, notes, pgl, dl,
    fams, famc,
    _ftlsSnapshot: ftlsSnapshots[0] || null,
  };

  // Reconciliation worksheet fallback:
  // Normal GEDCOM/MFT fields above are authoritative. The worksheet only
  // refills fields that MFT did not export in a structured GEDCOM tag.
  return applyFtlsReconciliationSnapshotDefaults(parsedPerson, ftlsSnapshots[0] || null);
}

function parseFam(el, noteMap = {}) {
  // Detect divorce: DIV tag present with value 'Y', or DIVF tag present
  const divEl = el.children.find(c => c.tag === 'DIV');
  const divorced = divEl ? (divEl.value === 'Y' || divEl.children.length > 0 || divEl.value === '') : false;
  const divdate = getNestedValue(el, 'DIV', 'DATE') || (divEl ? divEl.value : '');
  const parsedFamily = {
    id: el.pointer,
    husb: getChildValue(el, 'HUSB'),
    wife: getChildValue(el, 'WIFE'),
    children: [...new Set(el.children.filter(c => c.tag === 'CHIL').map(c => c.value))],
    mdate: getNestedValue(el, 'MARR', 'DATE'),
    mplace: getNestedValue(el, 'MARR', 'PLAC'),
    divorced,
    divdate: divdate === 'Y' ? '' : divdate,
  };
  return applyFtlsFamilyReconciliationSnapshotDefaults(
    parsedFamily,
    (collectFtlsFamilyReconciliationSnapshots(el, noteMap)[0] || null)
  );
}

function parseDateSort(d) {
  if (!d) return 99999999;
  const months = {JAN:1,FEB:2,MAR:3,APR:4,MAY:5,JUN:6,JUL:7,AUG:8,SEP:9,OCT:10,NOV:11,DEC:12};
  // MM/DD/YYYY
  let m = d.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if (m) return parseInt(m[3])*10000 + parseInt(m[1])*100 + parseInt(m[2]);
  // DD MON YYYY
  m = d.match(/(\d{1,2})\s+(\w{3})\s+(\d{4})/);
  if (m) return parseInt(m[3])*10000 + (months[m[2].toUpperCase()]||0)*100 + parseInt(m[1]);
  return 99999999;
}

function buildTreeFromFlat(people, families) {
  // Compute birth order per family
  for (const fam of Object.values(families)) {
    const kids = fam.children.filter(cid => people[cid]);
    kids.sort((a, b) => parseDateSort(people[a].dob) - parseDateSort(people[b].dob));
    kids.forEach((cid, i) => { if (people[cid]) people[cid].bo = i + 1; });
  }

  // BFS to assign generations
  const hasParents = new Set();
  for (const fam of Object.values(families)) {
    fam.children.forEach(c => hasParents.add(c));
  }
  const roots = Object.keys(people).filter(pid => !hasParents.has(pid));

  const genMap = {};
  const visited = new Set();
  const queue = roots.map(pid => [pid, 0]);

  while (queue.length > 0) {
    const [pid, gen] = queue.shift();
    if (visited.has(pid)) continue;
    visited.add(pid);
    genMap[pid] = gen;

    const person = people[pid];
    if (!person) continue;

    for (const famId of person.fams) {
      const fam = families[famId];
      if (!fam) continue;
      // Spouse gets same gen
      const spouseId = fam.husb === pid ? fam.wife : fam.husb;
      if (spouseId && !visited.has(spouseId)) queue.push([spouseId, gen]);
      // Children get gen+1
      for (const cid of fam.children) {
        if (!visited.has(cid)) queue.push([cid, gen + 1]);
      }
    }
  }

  // Find the person with most descendants as root
  function countDesc(pid, seen = new Set()) {
    if (seen.has(pid)) return 0;
    seen.add(pid);
    let count = 1;
    const p = people[pid];
    if (!p) return 0;
    for (const famId of p.fams) {
      const fam = families[famId];
      if (!fam) continue;
      for (const cid of fam.children) {
        count += countDesc(cid, seen);
      }
    }
    return count;
  }

  let bestRoot = null;
  let bestCount = 0;
  for (const pid of roots) {
    const p = people[pid];
    // Skip unnamed people entirely as root candidates
    if (!p || (!p.fn && !p.nk)) continue;
    const c = countDesc(pid);
    if (c > bestCount) { bestCount = c; bestRoot = pid; }
  }
  // If no named root found, fall back to most descendants
  if (!bestRoot) {
    for (const pid of roots) {
      const c = countDesc(pid);
      if (c > bestCount) { bestCount = c; bestRoot = pid; }
    }
  }
  if (!bestRoot) bestRoot = roots[0];
  console.log('Tree root:', bestRoot, people[bestRoot]?.dn, 'with', bestCount, 'descendants');

  // Build hierarchical tree
  // node.spouses[] = [{famId, sp, mdate, mplace, divorced, divdate, ch[]}]
  // node.sp / node.mdate / node.mplace / node.ch aliased from primary marriage for backward compat
  function buildNode(pid, visitedNodes = new Set()) {
    if (visitedNodes.has(pid)) return null;
    visitedNodes.add(pid);

    const p = people[pid];
    if (!p) return null;

    const node = { ...p, gen: genMap[pid] || 0, sp: null, mdate: '', mplace: '', ch: [], spouses: [] };
    delete node.fams;
    delete node.famc;

    for (const famId of (p.fams || [])) {
      const fam = families[famId];
      if (!fam) continue;

      const spId = fam.husb === pid ? fam.wife : fam.husb;
      let sp = null;
      if (spId && people[spId] && !visitedNodes.has(spId)) {
        visitedNodes.add(spId);
        sp = { ...people[spId], mdate: fam.mdate || '', mplace: fam.mplace || '' };
        delete sp.fams;
        delete sp.famc;
      }
      const famCh = [];
      for (const cid of fam.children) {
        const childNode = buildNode(cid, visitedNodes);
        if (childNode) famCh.push(childNode);
      }
      famCh.sort((a, b) => (a.bo || 999) - (b.bo || 999));
      node.spouses.push({
        famId,
        sp,
        mdate: fam.mdate || '',
        mplace: fam.mplace || '',
        divorced: fam.divorced || false,
        divdate: fam.divdate || '',
        ch: famCh,
      });
    }
    if (node.spouses.length > 0) {
      node.sp = node.spouses[0].sp;
      node.mdate = node.spouses[0].mdate;
      node.mplace = node.spouses[0].mplace;
    }
    node.ch = node.spouses.flatMap(s => s.ch);

    return node;
  }

  // Build personMap from people (same format as Supabase version)
  const personMap = {};
  for (const [id, p] of Object.entries(people)) {
    const clean = {...p};
    delete clean.fams; delete clean.famc;
    personMap[id] = clean;
  }

  return { tree: buildNode(bestRoot), personMap, familyMap: families };
}

function triggerImportGedcom(onImport) {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.ged,.gedcom';
  input.onchange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (evt) => {
      try {
        const result = parseGedcomFile(evt.target.result);
        if (result && result.tree) {
          onImport(result, file.name);
        } else {
          alert('Could not parse the GEDCOM file. No valid records found.');
        }
      } catch (err) {
        alert('Error parsing GEDCOM file: ' + err.message);
        console.error(err);
      }
    };
    reader.readAsText(file, 'utf-8');
  };
  input.click();
}

const MC='#6b9e72', FC='#9b82c4', GC='#c4a35a', GD='#8a7340', BG='#0a0a08', CD='#141410', TX='#d4cfc0', DM='#7a7568', BR='rgba(196,163,90,0.12)';
const flattenAll=(n,p='')=>{
  const arr=[];const nm=n.dn||'?';const fp=p?p+' › '+nm:nm;
  arr.push({...n,_p:fp,_n:nm});
  // Include ALL spouses from all marriages
  (n.spouses||[]).forEach(m=>{
    if(m.sp&&m.sp.id){
      const spNm=m.sp.dn||'?';
      arr.push({...m.sp,_p:fp+' ⚭ '+spNm,_n:spNm,_isSpouse:true,_spouseOfId:n.id,_spouseOfName:nm,_famId:m.famId});
    }
  });
  // Fallback for legacy node.sp without spouses[]
  if((!n.spouses||n.spouses.length===0)&&n.sp&&n.sp.id){
    const spNm=n.sp.dn||'?';
    arr.push({...n.sp,_p:fp+' ⚭ '+spNm,_n:spNm,_isSpouse:true,_spouseOfId:n.id,_spouseOfName:nm});
  }
  (n.ch||[]).forEach(c=>arr.push(...flattenAll(c,fp)));
  return arr;
};
const cnt=n=>{if(!n)return 0;let c=1+((n.spouses||[]).filter(m=>m.sp).length||(n.sp?1:0));(n.ch||[]).forEach(x=>{c+=cnt(x)});return c};
const findPath=(r,id,p=[])=>{
  if(r.id===id)return[...p,r];
  // Search all spouses
  if((r.spouses||[]).some(m=>m.sp?.id===id))return[...p,r];
  if(!r.spouses&&r.sp?.id===id)return[...p,r];
  for(const c of r.ch||[]){const res=findPath(c,id,[...p,r]);if(res)return res}
  return null;
};

const SB_AUTH_URL = SUPABASE_URL + '/auth/v1';

async function sbAuthFetch(path, opts = {}) {
  const url = SB_AUTH_URL + path;
  const resp = await fetch(url, {
    ...opts,
    headers: { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json', ...(opts.headers||{}) }
  });
  const data = await resp.json();
  if (!resp.ok) throw new Error(data.error_description || data.msg || data.message || 'Auth error');
  return data;
}

// Auth state — persisted in sessionStorage
let authSession = null;
let authUser = null;

// Restore session on load
try {
  const stored = sessionStorage.getItem('ftls_session');
  if (stored) {
    const parsed = JSON.parse(stored);
    authSession = parsed.session;
    authUser = parsed.user;
  }
} catch(e) {}

function persistAuth() {
  try {
    if (authSession && authUser) {
      sessionStorage.setItem('ftls_session', JSON.stringify({ session: authSession, user: authUser }));
    } else {
      sessionStorage.removeItem('ftls_session');
    }
  } catch(e) {}
}

async function refreshAuthUserProfile() {
  if (!authSession?.access_token || !authSession?.user?.id) return authUser;
  try {
    const users = await sbFetch(`users?id=eq.${authSession.user.id}&select=*`, {
      headers: { 'Authorization': 'Bearer ' + authSession.access_token }
    });
    if (users && users.length > 0) {
      authUser = users[0];
      persistAuth();
      return authUser;
    }
  } catch(e) {
    console.warn('Could not refresh auth user profile:', e);
  }
  return authUser;
}

async function signIn(email, password) {
  const data = await sbAuthFetch('/token?grant_type=password', {
    method: 'POST',
    body: JSON.stringify({ email, password })
  });
  authSession = data;
  // Fetch user profile from users table. Always refresh from DB so role changes
  // made by a super_admin take effect after the next sign-in.
  authUser = await refreshAuthUserProfile();
  persistAuth();
  return { session: data, user: authUser };
}

async function signOut() {
  if (authSession?.access_token) {
    try { await sbAuthFetch('/logout', { method: 'POST', headers: { 'Authorization': 'Bearer ' + authSession.access_token } }); } catch(e) {}
  }
  authSession = null;
  authUser = null;
  persistAuth();
}

async function createUserAccount(email, name, personId, role) {
  // Generate a secure random temporary password (user will reset via email)
  const tempPwd = 'Tmp!' + crypto.getRandomValues(new Uint8Array(16)).reduce((s,b)=>s+b.toString(36),'').slice(0,20);
  
  // Create auth user via public signup endpoint
  const data = await sbAuthFetch('/signup', {
    method: 'POST',
    body: JSON.stringify({ 
      email, 
      password: tempPwd,
      data: { name }  // stored in auth.users.raw_user_meta_data
    })
  });
  
  // /signup returns { id, ... } on success or { user: { id, ... } } depending on confirm setting
  const userId = data.id || data.user?.id;
  if (!userId) throw new Error('Signup did not return a user ID. The email may already be registered.');

  await sbFetch('users', {

  });
  
  return { id: userId, email };
}

function canEdit() { return authUser && ['editor','admin','super_admin'].includes(authUser.role); }
function isAdmin() { return authUser && ['admin','super_admin'].includes(authUser.role); }

// Check if an editor can directly edit a target person
// Allowed: self, spouse, siblings, parents, parents-in-law, and all descendants
// Uses personMap + familyMap for flat lookup — works correctly for spouse-based users
function canEditorDirectEdit(targetId, tree, pMap, fMap) {
  if (!authUser?.person_id) return false;
  if (isAdmin()) return true;
  if (!isEditor()) return false;
  // If no personMap available, fall back to tree-based check
  if (!pMap || !fMap || Object.keys(pMap).length === 0) {
    return canEditorDirectEditTreeFallback(targetId, tree);
  }

  const myId = authUser.person_id;
  if (targetId === myId) return true;

  // Helper: find families where a person is husband or wife
  const familiesOf = (pid) => Object.values(fMap).filter(f => f.husband_id === pid || f.wife_id === pid);
  // Helper: get spouse ID from a family
  const spouseIn = (fam, pid) => fam.husband_id === pid ? fam.wife_id : fam.husband_id;
  // Helper: get parent family (family where person is a child)
  const parentFamilyOf = (pid) => Object.values(fMap).find(f => (f.children||[]).includes(pid));

  // My spouse
  const myFams = familiesOf(myId);
  const mySpouseIds = myFams.map(f => spouseIn(f, myId)).filter(Boolean);
  if (mySpouseIds.includes(targetId)) return true;

  // My descendants (children, grandchildren, etc. + their spouses)
  const descIds = new Set();
  const collectDesc = (pids) => {
    for (const pid of pids) {
      familiesOf(pid).forEach(f => {
        (f.children||[]).forEach(cid => {
          if (!descIds.has(cid)) {
            descIds.add(cid);
            // Also add this child's spouse
            familiesOf(cid).forEach(cf => {
              const csp = spouseIn(cf, cid);
              if (csp) descIds.add(csp);
            });
            collectDesc([cid]);
          }
        });
      });
    }
  };
  collectDesc([myId, ...mySpouseIds]);
  if (descIds.has(targetId)) return true;

  // My parents + parents' spouses
  const myParentFam = parentFamilyOf(myId);
  if (myParentFam) {
    if (myParentFam.husband_id === targetId || myParentFam.wife_id === targetId) return true;
    // My siblings + their spouses + their full descendants
    for (const sibId of (myParentFam.children||[])) {
      if (sibId === targetId) return true;
      // Sibling's spouse — use for loop to allow proper return
      const sibFams = familiesOf(sibId);
      for (const sf of sibFams) {
        const sibSp = spouseIn(sf, sibId);
        if (sibSp && sibSp === targetId) return true;
      }
      // Siblings' full descendants
      const sibDescIds = new Set();
      const collectSibDesc = (pids) => {
        for (const pid of pids) {
          familiesOf(pid).forEach(f => {
            (f.children||[]).forEach(cid => {
              if (!sibDescIds.has(cid)) {
                sibDescIds.add(cid);
                collectSibDesc([cid]);
              }
            });
          });
        }
      };
      collectSibDesc([sibId]);
      if (sibDescIds.has(targetId)) return true;
    }
  }

  // Parents-in-law + siblings-in-law + their spouses + their full descendants
  for (const spId of mySpouseIds) {
    const spParentFam = parentFamilyOf(spId);
    if (spParentFam) {
      if (spParentFam.husband_id === targetId || spParentFam.wife_id === targetId) return true;
      for (const silId of (spParentFam.children||[])) {
        if (silId === targetId) return true;
        // Sibling-in-law's spouse — use for loop to allow proper return
        const silFams = familiesOf(silId);
        for (const sf of silFams) {
          const silSp = spouseIn(sf, silId);
          if (silSp && silSp === targetId) return true;
        }
        // Sibling-in-law's full descendants
        const silDescIds = new Set();
        const collectSilDesc = (pids) => {
          for (const pid of pids) {
            familiesOf(pid).forEach(f => {
              (f.children||[]).forEach(cid => {
                if (!silDescIds.has(cid)) {
                  silDescIds.add(cid);
                  collectSilDesc([cid]);
                }
              });
            });
          }
        };
        collectSilDesc([silId]);
        if (silDescIds.has(targetId)) return true;
      }
    }
  }

  return false;
}

// Fallback for when personMap/familyMap aren't available (e.g. GEDCOM preview)
function canEditorDirectEditTreeFallback(targetId, tree) {
  const myId = authUser.person_id;
  if (targetId === myId) return true;
  const myFamilyNode = findFamilyNodeContaining(tree, myId);
  if (!myFamilyNode) return false;
  const spouseId = myFamilyNode.id === myId ? myFamilyNode.sp?.id : myFamilyNode.id;
  if (spouseId === targetId) return true;
  if (isDescendant(myFamilyNode, targetId)) return true;
  return false;
}

function findNodeInTree(node, id) {
  if (!node) return null;
  if (node.id === id) return node;
  if (node.sp?.id === id) return node.sp;
  for (const c of node.ch || []) {
    const found = findNodeInTree(c, id);
    if (found) return found;
  }
  return null;
}

function findFamilyNodeContaining(node, personId) {
  if (!node) return null;
  if (node.id === personId || node.sp?.id === personId) return node;
  for (const c of node.ch || []) {
    const found = findFamilyNodeContaining(c, personId);
    if (found) return found;
  }
  return null;
}

function findParentOf(node, childId) {
  if (!node) return null;
  if (node.ch?.some(c => c.id === childId || c.sp?.id === childId)) return node;
  for (const c of node.ch || []) {
    const found = findParentOf(c, childId);
    if (found) return found;
  }
  return null;
}

function findParentFamilyOf(node, personId) {
  return findParentOf(node, personId);
}

function isDescendant(node, targetId) {
  if (!node) return false;
  for (const c of node.ch || []) {
    if (c.id === targetId) return true;
    if (c.sp?.id === targetId) return true;
    if (isDescendant(c, targetId)) return true;
  }
  return false;
}

async function submitUpdateRequest(personId, personName, changes, requesterName, requesterEmail, previousValues) {
  const payload = {
    person_id: personId, person_name: personName,
    requester_name: requesterName, requester_email: requesterEmail,
    request_type: 'update', changes, status: 'pending'
  };
  if (previousValues) payload.changes = { ...changes, _previous: previousValues };
  await sbFetch('update_requests', {
    method: 'POST',
    body: JSON.stringify(payload),
    headers: { 'Prefer': 'return=minimal' }
  });
}
