/* ───── MEDIA UPLOAD UTILITIES ───── */
async function resizeImage(file, maxSize) {
  return new Promise((resolve) => {
    const img = new Image();
    const canvas = document.createElement('canvas');
    img.onload = () => {
      let w = img.width, h = img.height;
      if (w > maxSize || h > maxSize) {
        if (w > h) { h = Math.round(h * maxSize / w); w = maxSize; }
        else { w = Math.round(w * maxSize / h); h = maxSize; }
      }
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      canvas.toBlob(resolve, 'image/jpeg', 0.85);
    };
    img.src = URL.createObjectURL(file);
  });
}

async function uploadToCloudinary(file, folder) {
  const isImage = file.type.startsWith('image/');
  const isPDF = file.type === 'application/pdf';
  // Resize images client-side; PDFs go as-is
  let uploadFile = file;
  if (isImage) {
    const resized = await resizeImage(file, folder === 'profiles' ? 400 : 1200);
    if (resized) uploadFile = resized;
  }
  const formData = new FormData();
  formData.append('file', uploadFile);
  formData.append('upload_preset', CLOUDINARY_PRESET);
  formData.append('folder', `chennamkara/${folder}`);
  const resp = await fetch(CLOUDINARY_UPLOAD_URL, { method: 'POST', body: formData });
  if (!resp.ok) throw new Error('Upload failed: ' + resp.status);
  const data = await resp.json();
  return { url: data.secure_url, publicId: data.public_id, format: data.format, resourceType: data.resource_type };
}

async function sbFetch(path, opts = {}) {
  const url = SUPABASE_URL + '/rest/v1/' + path;
  const headers = { ...SB_HEADERS, ...(opts.headers || {}) };
  if (authSession?.access_token && !(opts.headers && opts.headers.Authorization)) {
    headers.Authorization = 'Bearer ' + authSession.access_token;
  }
  const resp = await fetch(url, { ...opts, headers });
  const text = await resp.text();
  if (!resp.ok) {
    console.error('Supabase request failed', {
      path,
      status: resp.status,
      body: text,
      usingSessionToken: !!authSession?.access_token
    });
    throw new Error(text || `Supabase ${resp.status}`);
  }
  if (!text) return [];
  try { return JSON.parse(text); } catch(e) { return []; }
}

function buildTreeFromDB(persons, families) {
  const pMap = {};
  persons.forEach(p => {
    pMap[p.id] = {
      id:p.id, fn:p.first_name, mn:p.middle_name, ln:p.last_name,
      dn:p.display_name, nk:p.nickname, md:p.maiden_name, g:p.gender,
      dob:p.date_of_birth, dod:p.date_of_death, dec:p.is_deceased, bo:p.birth_order,
      em:p.email, ph:p.phone, a1:p.address1, a2:p.address2,
      ci:p.city, st:p.state, zp:p.zip, co:p.country,
      fb:p.facebook, ig:p.instagram, li:p.linkedin, ws:p.website,
      pp:p.profile_photo, bio:p.bio, loc:p.location, prof:p.profession, emp:p.employer,
      stories:p.stories, notes:p.notes, pgl:p.photo_gallery_link, dl:p.documents_link,
      _fams: [], _famc: [],
    };
  });

  // Build family links
  const fMap = {};
  families.forEach(f => {
    fMap[f.id] = f;
    if (f.husband_id && pMap[f.husband_id]) pMap[f.husband_id]._fams.push(f.id);
    if (f.wife_id && pMap[f.wife_id]) pMap[f.wife_id]._fams.push(f.id);
    (f.children || []).forEach(cid => {
      if (pMap[cid]) pMap[cid]._famc.push(f.id);
    });
  });

  // Find roots (no famc)
  const hasParents = new Set();
  families.forEach(f => (f.children||[]).forEach(c => hasParents.add(c)));
  const roots = Object.keys(pMap).filter(pid => !hasParents.has(pid));

  // Find best root (most descendants, prefer named)
  function countDesc(pid, seen=new Set()) {
    if(seen.has(pid))return 0;seen.add(pid);let c=1;
    const p=pMap[pid];if(!p)return 0;
    for(const fid of p._fams){const f=fMap[fid];if(f)(f.children||[]).forEach(cid=>{c+=countDesc(cid,seen)});}
    return c;
  }
  let bestRoot=null,bestScore=0;
  for(const pid of roots){
    const p=pMap[pid];
    if(!p||(!p.fn&&!p.nk)) continue;
    const c=countDesc(pid);
    if(c>bestScore){bestScore=c;bestRoot=pid;}
  }
  if(!bestRoot){ for(const pid of roots){ const c=countDesc(pid); if(c>bestScore){bestScore=c;bestRoot=pid;} } }
  if(!bestRoot) bestRoot=roots[0];
  console.log('DB tree root:', bestRoot, pMap[bestRoot]?.dn, 'with', bestScore, 'descendants');

  // Clean personMap: remove internal fields, keep all person data
  const personMap = {};
  for (const [id, p] of Object.entries(pMap)) {
    const clean = {...p};
    delete clean._fams; delete clean._famc;
    personMap[id] = clean;
  }

  // Build hierarchical tree (node.sp retained for display rendering)
  function buildNode(pid, visited=new Set()) {
    if(visited.has(pid))return null;visited.add(pid);
    const p=pMap[pid];if(!p)return null;
    const node={...p, sp:null, ch:[]};
    delete node._fams; delete node._famc;

    for(const fid of (p._fams||[])){
      const fam=fMap[fid];if(!fam)continue;
      const spId = fam.husband_id===pid ? fam.wife_id : fam.husband_id;
      if(spId&&pMap[spId]&&!visited.has(spId)){
        visited.add(spId);
        const sp={...pMap[spId], mdate:fam.marriage_date||'', mplace:fam.marriage_place||''};
        delete sp._fams; delete sp._famc;
        node.sp=sp;
      }
      node.mdate=fam.marriage_date||'';
      node.mplace=fam.marriage_place||'';
      for(const cid of (fam.children||[])){
        const cn=buildNode(cid,visited);
        if(cn)node.ch.push(cn);
      }
      node.ch.sort((a,b)=>(a.bo||999)-(b.bo||999));
    }
    return node;
  }

  return { tree: buildNode(bestRoot), personMap, familyMap: fMap };
}

async function savePerson(person, editUser) {
  const row = {
    id: person.id,
    first_name: person.fn||'', middle_name: person.mn||'', last_name: person.ln||'',
    display_name: person.dn||'', nickname: person.nk||'', maiden_name: person.md||'',
    gender: person.g||'', date_of_birth: person.dob||'', date_of_death: person.dod||'',
    is_deceased: !!person.dec, birth_order: person.bo||0,
    email: person.em||'', phone: person.ph||'',
    address1: person.a1||'', address2: person.a2||'', city: person.ci||'',
    state: person.st||'', zip: person.zp||'', country: person.co||'',
    facebook: person.fb||'', instagram: person.ig||'', linkedin: person.li||'',
    website: person.ws||'', profile_photo: person.pp||'', bio: person.bio||'',
    location: person.loc||'', profession: person.prof||'', employer: person.emp||'',
    stories: person.stories||'', notes: person.notes||'',
    photo_gallery_link: person.pgl||'', documents_link: person.dl||'',
    updated_by: editUser||'',
  };
  
  // Fetch current state for diff
  let oldRow = null;
  try {
    const cur = await sbFetch(`persons?id=eq.${person.id}&select=*`);
    if (cur.length > 0) oldRow = cur[0];
  } catch(e) {}
  
  // Use UPSERT: POST with on_conflict=id merges into existing row
  await sbFetch('persons?on_conflict=id', {
    method: 'POST',
    body: JSON.stringify(row),
    headers: { 
      'Prefer': 'return=minimal,resolution=merge-duplicates',
      'Authorization': 'Bearer ' + SUPABASE_KEY 
    }
  });
  
  // Compute diff: only fields that actually changed
  const diff = {};
  const prev = {};
  const skipLog = new Set(['id','updated_by','updated_at','created_at']);
  if (oldRow) {
    for (const [k, v] of Object.entries(row)) {
      if (skipLog.has(k)) continue;
      const oldVal = (oldRow[k] === null || oldRow[k] === undefined) ? '' : String(oldRow[k]).trim();
      const newVal = (v === null || v === undefined) ? '' : String(v).trim();
      if (oldVal !== newVal) {
        diff[k] = v;
        prev[k] = oldRow[k] || '';
      }
    }
  }
  // Save marriage date/place to families table if provided
  if (person.mdate || person.mplace) {
    try {
      const fams = await sbFetch(`families?select=*&or=(husband_id.eq.${person.id},wife_id.eq.${person.id})`);
      if (fams.length > 0) {
        await sbFetch(`families?id=eq.${fams[0].id}`, {
          method: 'PATCH',
          body: JSON.stringify({ marriage_date: person.mdate||'', marriage_place: person.mplace||'' }),
          headers: { 'Prefer': 'return=minimal' }
        });
      }
    } catch(e) { console.warn('Marriage save failed:', e); }
  }
  // Log edit — only log if something actually changed
  if (Object.keys(diff).length > 0) {
    try {
      await sbFetch('edit_log', {
        method: 'POST',
        body: JSON.stringify({ 
          person_id: person.id, 
          action: oldRow ? 'update' : 'create', 
          edited_by: editUser||'', 
          changes: { 
            person_name: row.display_name || row.first_name + ' ' + row.last_name,
            changed_fields: diff, 
            previous_values: prev 
          } 
        }),
        headers: { 'Authorization': 'Bearer ' + SUPABASE_KEY }
      });
    } catch(e) { console.warn('Edit log failed:', e); }
  }
}

async function deletePersonFromDB(personId, editUser) {
  // Remove from family children arrays
  const fams = await sbFetch(`families?select=*&children=cs.{${personId}}`);
  for (const f of fams) {
    const newChildren = (f.children||[]).filter(c=>c!==personId);
    await sbFetch(`families?id=eq.${f.id}`, {
      method: 'PATCH',
      body: JSON.stringify({ children: newChildren })
    });
  }
  // Remove families where this person is husband or wife (if no children)
  const asFams = await sbFetch(`families?select=*&or=(husband_id.eq.${personId},wife_id.eq.${personId})`);
  for (const f of asFams) {
    if (!f.children || f.children.length === 0) {
      await sbFetch(`families?id=eq.${f.id}`, { method: 'DELETE' });
    }
  }
  // Delete person
  await sbFetch(`persons?id=eq.${personId}`, { method: 'DELETE' });
  // Log
  try {
    await sbFetch('edit_log', {
      method: 'POST',
      body: JSON.stringify({ person_id: personId, action: 'delete', edited_by: editUser||'' })
    });
  } catch(e) {}
}

async function addPersonToDB(person, parentId, editUser) {
  // Save the new person
  await savePerson(person, editUser);
  // Find or create family for the parent
  if (parentId) {
    const parentFams = await sbFetch(`families?select=*&or=(husband_id.eq.${parentId},wife_id.eq.${parentId})`);
    if (parentFams.length > 0) {
      // Add to first family's children
      const fam = parentFams[0];
      const newChildren = [...(fam.children||[]), person.id];
      await sbFetch(`families?id=eq.${fam.id}`, {
        method: 'PATCH',
        body: JSON.stringify({ children: newChildren })
      });
    } else {
      // Create new family with parent + child
      const parent = await sbFetch(`persons?id=eq.${parentId}&select=gender`);
      const pGender = parent[0]?.gender || 'M';
      await saveFamily(
        '@F' + Date.now() + '@',
        pGender === 'M' ? parentId : null,
        pGender === 'F' ? parentId : null,
        [person.id], '', ''
      );
    }
  }
}

async function saveSpouseToDB(parentId, spouse, editUser) {
  // Save spouse person record
  await savePerson(spouse, editUser);
  // Find parent's family or create one
  const parentFams = await sbFetch(`families?select=*&or=(husband_id.eq.${parentId},wife_id.eq.${parentId})`);
  const parent = await sbFetch(`persons?id=eq.${parentId}&select=gender`);
  const pGender = parent[0]?.gender || 'M';
  if (parentFams.length > 0) {
    const fam = parentFams[0];
    const patch = pGender === 'M' ? { wife_id: spouse.id } : { husband_id: spouse.id };
    await sbFetch(`families?id=eq.${fam.id}`, { method: 'PATCH', body: JSON.stringify(patch) });
  } else {
    await saveFamily(
      '@F' + Date.now() + '@',
      pGender === 'M' ? parentId : spouse.id,
      pGender === 'F' ? parentId : spouse.id,
      [], '', ''
    );
  }
}

async function deleteSpouseFromDB(parentId, spouseId, editUser) {
  // Remove spouse from family, don't delete the person record
  const fams = await sbFetch(`families?select=*&or=(husband_id.eq.${parentId},wife_id.eq.${parentId})`);
  for (const f of fams) {
    if (f.husband_id === spouseId) {
      await sbFetch(`families?id=eq.${f.id}`, { method: 'PATCH', body: JSON.stringify({ husband_id: null }) });
    } else if (f.wife_id === spouseId) {
      await sbFetch(`families?id=eq.${f.id}`, { method: 'PATCH', body: JSON.stringify({ wife_id: null }) });
    }
  }
}

/* ───── BROWSER-BASED GEDCOM → SUPABASE MIGRATION ───── */
async function migrateGedcomToSupabase(gedcomText, onProgress) {
  // Parse GEDCOM into flat persons/families
  const raw = gedcomText.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
  const lines = raw.split('\n').filter(l => l.trim());
  const elements = [];
  const stack = [{ children: elements, level: -1 }];
  for (const line of lines) {
    const m = line.match(/^(\d+)\s+(@[^@]+@)?\s*(\S+)\s*(.*)?$/);
    if (!m) continue;
    const level = parseInt(m[1]);
    const pointer = (m[2] || '').trim();
    const tag = m[3].trim();
    const value = (m[4] || '').trim();
    const el = { level, pointer, tag, value, children: [] };
    while (stack.length > 1 && stack[stack.length - 1].level >= level) stack.pop();
    stack[stack.length - 1].children.push(el);
    stack.push(el);
  }

  function gv(el, tag) { const ch = el.children.find(c => c.tag === tag); return ch ? ch.value : ''; }
  function gnv(el, pt, ct) { const p = el.children.find(c => c.tag === pt); if (!p) return ''; const c = p.children.find(x => x.tag === ct); return c ? c.value : ''; }

  const persons = [];
  const families = [];

  for (const el of elements) {
    if (el.tag === 'INDI' && el.pointer) {
      let fn='',mn='',ln='',nk='',md='';
      const nameEls = el.children.filter(c => c.tag === 'NAME');
      for (const nameEl of nameEls) {
        const typeEl = nameEl.children.find(c => c.tag === 'TYPE');
        const type = typeEl ? typeEl.value : '';
        if (type === 'nick') { nk = nameEl.value.replace(/\//g, '').trim(); }
        else if (type === 'birth') { md = nameEl.value.replace(/\//g, '').trim(); }
        else if (type === 'married') { continue; }
        else if (!fn && !ln) {
          const givnEl = nameEl.children.find(c => c.tag === 'GIVN');
          const surnEl = nameEl.children.find(c => c.tag === 'SURN');
          const secgEl = nameEl.children.find(c => c.tag === 'SECG');
          if (givnEl) { let v=givnEl.value.replace(/^\d+\.\s*/,''); const parts=v.split(' '); fn=parts[0]||''; if(parts.length>1&&!mn)mn=parts.slice(1).join(' '); }
          if (surnEl) ln = surnEl.value;
          if (secgEl && !mn) mn = secgEl.value;
          if (!fn && !ln) {
            const nv = nameEl.value.replace(/^\d+\.\s*/,'');
            const sm = nv.match(/^(.*?)\/([^\/]*)\//);
            if (sm) { const gp=sm[1].trim(); ln=sm[2].trim(); const gs=gp.split(' '); fn=gs[0]||''; if(gs.length>1)mn=gs.slice(1).join(' '); }
            else fn = nv.replace(/\//g, '').trim();
          }
        }
      }
      const g = gv(el, 'SEX');
      const dob = gnv(el, 'BIRT', 'DATE');
      const loc = gnv(el, 'BIRT', 'PLAC');
      const dod = gnv(el, 'DEAT', 'DATE');
      const deatEl1 = el.children.find(c => c.tag === 'DEAT');
      const hasDeat = deatEl1 ? (deatEl1.value === 'Y' || !!dod) : false;
      let dn = (fn + (mn ? ' ' + mn : '') + (ln ? ' ' + ln : '')).trim();
      if (!dn) dn = nk || '(Unknown)';
      if (!fn && ln && !mn) dn = 'Mrs. ' + ln + ' (name unknown)';

      // Address
      let a1='',a2='',ci='',st='',zp='',co='';
      const addrEl = el.children.find(c => c.tag === 'ADDR' || c.tag === 'RESI');
      if (addrEl) {
        a1 = addrEl.value || gv(addrEl, 'ADR1') || '';
        a2 = gv(addrEl, 'ADR2'); ci = gv(addrEl, 'CITY');
        st = gv(addrEl, 'STAE'); zp = gv(addrEl, 'POST'); co = gv(addrEl, 'CTRY');
      }

      persons.push({
        id: el.pointer, first_name: fn, middle_name: mn, last_name: ln,
        display_name: dn, nickname: nk, maiden_name: md, gender: g,
        date_of_birth: dob, date_of_death: dod, is_deceased: hasDeat || !!dod, birth_order: 0,
        email: gv(el,'EMAI')||gv(el,'EMAIL'), phone: gv(el,'PHON'),
        address1:a1, address2:a2, city:ci, state:st, zip:zp, country:co,
        facebook: gv(el,'_FACEBOOK'), instagram: gv(el,'_INSTAGRAM'),
        linkedin: gv(el,'_LINKEDIN'), website: gv(el,'WWW'),
        profile_photo: gv(el,'_PHOTO'), bio: '', location: loc,
        profession: gv(el,'OCCU'), employer: gv(el,'_EMPLOYER'),
        stories: '', notes: gv(el,'NOTE'),
        photo_gallery_link: gv(el,'_PHOTOGALLERY'), documents_link: gv(el,'_DOCUMENTS'),
        updated_by: 'GEDCOM migration',
      });
    } else if (el.tag === 'FAM' && el.pointer) {
      families.push({
        id: el.pointer,
        husband_id: gv(el,'HUSB') || null,
        wife_id: gv(el,'WIFE') || null,
        children: el.children.filter(c => c.tag === 'CHIL').map(c => c.value),
        marriage_date: gnv(el,'MARR','DATE'),
        marriage_place: gnv(el,'MARR','PLAC'),
      });
    }
  }

  // Compute birth order
  const pMap = {};
  persons.forEach(p => pMap[p.id] = p);
  families.forEach(f => {
    (f.children||[]).forEach((cid, i) => { if (pMap[cid]) pMap[cid].birth_order = i + 1; });
  });

  onProgress(`Parsed: ${persons.length} persons, ${families.length} families`);

  // Clear existing data
  onProgress('Clearing existing data...');
  try { await sbFetch('edit_log?id=gt.0', { method: 'DELETE' }); } catch(e) {}
  try { await sbFetch('families?id=neq.', { method: 'DELETE' }); } catch(e) {}
  try { await sbFetch('persons?id=neq.', { method: 'DELETE' }); } catch(e) {}

  // Insert persons in batches
  const batchSize = 30;
  for (let i = 0; i < persons.length; i += batchSize) {
    const batch = persons.slice(i, i + batchSize);
    onProgress(`Inserting persons ${i + 1}-${Math.min(i + batchSize, persons.length)} of ${persons.length}...`);
    try {
      await sbFetch('persons', {
        method: 'POST',
        body: JSON.stringify(batch),
        headers: { 'Prefer': 'resolution=merge-duplicates,return=minimal' }
      });
    } catch (e) {
      // Try one by one
      for (const p of batch) {
        try {
          await sbFetch('persons', {
            method: 'POST',
            body: JSON.stringify(p),
            headers: { 'Prefer': 'resolution=merge-duplicates,return=minimal' }
          });
        } catch (e2) {
          console.warn('Skip person:', p.id, e2);
        }
      }
    }
  }

  // Insert families in batches
  for (let i = 0; i < families.length; i += batchSize) {
    const batch = families.slice(i, i + batchSize);
    onProgress(`Inserting families ${i + 1}-${Math.min(i + batchSize, families.length)} of ${families.length}...`);
    try {
      await sbFetch('families', {
        method: 'POST',
        body: JSON.stringify(batch),
        headers: { 'Prefer': 'resolution=merge-duplicates,return=minimal' }
      });
    } catch (e) {
      for (const f of batch) {
        try {
          await sbFetch('families', {
            method: 'POST',
            body: JSON.stringify(f),
            headers: { 'Prefer': 'resolution=merge-duplicates,return=minimal' }
          });
        } catch (e2) {
          console.warn('Skip family:', f.id, e2);
        }
      }
    }
  }

  onProgress('Verifying...');
  const pCount = await sbFetch('persons?select=id');
  const fCount = await sbFetch('families?select=id');
  return { persons: pCount.length, families: fCount.length };
}

/* ───── GEDCOM 5.5.1 EXPORTER ───── */
function exportTreeToGedcom(tree, personMap, familyMap) {
  const lines = [];
  const indis = [];
  const fams = [];
  const exportedPersons = new Set();
  const exportedFamilies = new Set();

  // Build reverse lookup: person → families they are a child in (FAMC)
  const famcLookup = {}; // personId → [familyId]
  const famsLookup = {}; // personId → [familyId]
  for (const [fid, fam] of Object.entries(familyMap || {})) {
    (fam.children || []).forEach(cid => {
      if (!famcLookup[cid]) famcLookup[cid] = [];
      famcLookup[cid].push(fid);
    });
    if (fam.husband_id) {
      if (!famsLookup[fam.husband_id]) famsLookup[fam.husband_id] = [];
      famsLookup[fam.husband_id].push(fid);
    }
    if (fam.wife_id) {
      if (!famsLookup[fam.wife_id]) famsLookup[fam.wife_id] = [];
      famsLookup[fam.wife_id].push(fid);
    }
  }

  function gedcomDate() {
    const d = new Date();
    const months = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
    return `${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()}`;
  }
  function gedcomTime() {
    const d = new Date();
    return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}`;
  }

  function buildIndi(person) {
    if (exportedPersons.has(person.id)) return null;
    exportedPersons.add(person.id);
    const L = [];
    const pid = person.id;
    L.push(`0 ${pid} INDI`);

    // Primary NAME
    const fn = person.fn || '';
    const mn = person.mn || '';
    const ln = person.ln || '';
    const givn = (fn + (mn ? ' ' + mn : '')).trim();
    const nameStr = ln ? `${givn} /${ln}/` : (givn || person.dn || '(Unknown)');
    L.push(`1 NAME ${nameStr}`);
    if (fn) L.push(`2 GIVN ${fn}`);
    if (ln) L.push(`2 SURN ${ln}`);

    // Nickname
    if (person.nk) {
      L.push(`1 NAME ${person.nk} //`);
      L.push(`2 TYPE nick`);
      L.push(`2 GIVN ${person.nk}`);
    }

    // Maiden name
    if (person.md) {
      L.push(`1 NAME ${person.md} //`);
      L.push(`2 TYPE birth`);
    }

    // SEX
    if (person.g) L.push(`1 SEX ${person.g}`);

    // BIRT
    if (person.dob || person.loc) {
      L.push('1 BIRT');
      if (person.dob) L.push(`2 DATE ${person.dob}`);
      if (person.loc) L.push(`2 PLAC ${person.loc}`);
    }

    // DEAT
    if (person.dod || person.dec) {
      L.push('1 DEAT');
      if (person.dod) L.push(`2 DATE ${person.dod}`);
    }

    // Contact
    if (person.ph) L.push(`1 PHON ${person.ph}`);
    if (person.em) L.push(`1 EMAI ${person.em}`);

    // Address
    if (person.a1 || person.ci || person.st || person.co) {
      L.push(`1 ADDR ${person.a1 || ''}`);
      if (person.a2) L.push(`2 ADR2 ${person.a2}`);
      if (person.ci) L.push(`2 CITY ${person.ci}`);
      if (person.st) L.push(`2 STAE ${person.st}`);
      if (person.zp) L.push(`2 POST ${person.zp}`);
      if (person.co) L.push(`2 CTRY ${person.co}`);
    }

    // Occupation
    if (person.prof) L.push(`1 OCCU ${person.prof}`);

    // Website
    if (person.ws) L.push(`1 WWW ${person.ws}`);

    // Notes
    if (person.notes) L.push(`1 NOTE ${person.notes}`);
    if (person.bio) L.push(`1 NOTE BIO: ${person.bio}`);
    if (person.stories) L.push(`1 NOTE STORY: ${person.stories}`);

    // Custom tags for rich fields
    if (person.fb) L.push(`1 _FACEBOOK ${person.fb}`);
    if (person.ig) L.push(`1 _INSTAGRAM ${person.ig}`);
    if (person.li) L.push(`1 _LINKEDIN ${person.li}`);
    if (person.pp) L.push(`1 _PHOTO ${person.pp}`);
    if (person.emp) L.push(`1 _EMPLOYER ${person.emp}`);
    if (person.pgl) L.push(`1 _PHOTOGALLERY ${person.pgl}`);
    if (person.dl) L.push(`1 _DOCUMENTS ${person.dl}`);

    // FAMS refs (families where this person is husband/wife)
    (famsLookup[pid] || []).forEach(ref => L.push(`1 FAMS ${ref}`));
    // FAMC refs (families where this person is a child)
    (famcLookup[pid] || []).forEach(ref => L.push(`1 FAMC ${ref}`));

    // CHAN
    L.push('1 CHAN');
    L.push(`2 DATE ${gedcomDate()}`);
    L.push(`3 TIME ${gedcomTime()}`);

    return L;
  }

  function buildFam(fam) {
    if (exportedFamilies.has(fam.id)) return null;
    exportedFamilies.add(fam.id);
    const L = [`0 ${fam.id} FAM`];
    if (fam.husband_id) L.push(`1 HUSB ${fam.husband_id}`);
    if (fam.wife_id) L.push(`1 WIFE ${fam.wife_id}`);
    const mdate = fam.marriage_date || fam.mdate || '';
    const mplace = fam.marriage_place || fam.mplace || '';
    if (mdate || mplace) {
      L.push('1 MARR');
      if (mdate) L.push(`2 DATE ${mdate}`);
      if (mplace) L.push(`2 PLAC ${mplace}`);
    }
    (fam.children || []).forEach(cid => L.push(`1 CHIL ${cid}`));
    return L;
  }

  // Strategy: use familyMap if available (from Supabase), fall back to tree walk
  if (familyMap && Object.keys(familyMap).length > 0 && personMap && Object.keys(personMap).length > 0) {
    // Export ALL persons from personMap (includes unconnected persons)
    for (const [pid, person] of Object.entries(personMap)) {
      const indi = buildIndi(person);
      if (indi) indis.push(indi);
    }
    // Export ALL families using original IDs
    for (const [fid, fam] of Object.entries(familyMap)) {
      const famLines = buildFam(fam);
      if (famLines) fams.push(famLines);
    }
    console.log(`GEDCOM export: ${exportedPersons.size} persons, ${exportedFamilies.size} families from personMap/familyMap`);
  } else {
    // Fallback: walk the tree (for GEDCOM-imported data without maps)
    let fallbackFamCounter = 0;
    function processNode(node, parentFamId) {
      const nodeRefs = [];
      const children = node.ch || [];
      const spouse = node.sp;
      if (spouse || children.length > 0) {
        fallbackFamCounter++;
        const famId = `@F${fallbackFamCounter}@`;
        nodeRefs.push(famId);
        const husbId = node.g === 'M' ? node.id : (spouse ? spouse.id : '');
        const wifeId = node.g === 'F' ? node.id : (spouse ? spouse.id : '');
        const childIds = children.map(c => c.id);
        fams.push([`0 ${famId} FAM`,
          husbId ? `1 HUSB ${husbId}` : null,
          wifeId ? `1 WIFE ${wifeId}` : null,
          ...(node.mdate ? ['1 MARR', `2 DATE ${node.mdate}`] : []),
          ...(node.mplace && !node.mdate ? ['1 MARR'] : []),
          ...(node.mplace ? [`2 PLAC ${node.mplace}`] : []),
          ...childIds.map(cid => `1 CHIL ${cid}`)
        ].filter(Boolean));
        if (spouse && spouse.id && !exportedPersons.has(spouse.id)) {
          exportedPersons.add(spouse.id);
          const spIndi = [`0 ${spouse.id} INDI`];
          const spGivn = ((spouse.fn||'') + (spouse.mn ? ' '+spouse.mn : '')).trim();
          const spName = spouse.ln ? `${spGivn} /${spouse.ln}/` : (spGivn || spouse.dn || '?');
          spIndi.push(`1 NAME ${spName}`);
          if (spouse.g) spIndi.push(`1 SEX ${spouse.g}`);
          if (spouse.dob) { spIndi.push('1 BIRT'); spIndi.push(`2 DATE ${spouse.dob}`); }
          if (spouse.dod || spouse.dec) { spIndi.push('1 DEAT'); if(spouse.dod) spIndi.push(`2 DATE ${spouse.dod}`); }
          spIndi.push(`1 FAMS ${famId}`);
          indis.push(spIndi);
        }
        children.forEach(child => processNode(child, famId));
      }
      if (!exportedPersons.has(node.id)) {
        exportedPersons.add(node.id);
        const nIndi = [`0 ${node.id} INDI`];
        const nGivn = ((node.fn||'') + (node.mn ? ' '+node.mn : '')).trim();
        const nName = node.ln ? `${nGivn} /${node.ln}/` : (nGivn || node.dn || '?');
        nIndi.push(`1 NAME ${nName}`);
        if (node.g) nIndi.push(`1 SEX ${node.g}`);
        if (node.dob) { nIndi.push('1 BIRT'); nIndi.push(`2 DATE ${node.dob}`); }
        if (node.dod || node.dec) { nIndi.push('1 DEAT'); if(node.dod) nIndi.push(`2 DATE ${node.dod}`); }
        nodeRefs.forEach(ref => nIndi.push(`1 FAMS ${ref}`));
        if (parentFamId) nIndi.push(`1 FAMC ${parentFamId}`);
        indis.push(nIndi);
      }
    }
    processNode(tree, null);
    console.log(`GEDCOM export (tree fallback): ${exportedPersons.size} persons, ${fams.length} families`);
  }

  // Assemble
  lines.push('0 HEAD');
  lines.push('1 SOUR FTLS');
  lines.push('2 NAME Chennamkara Family Tree Living Site');
  lines.push('2 VERS 0.3');
  lines.push('1 CHAR UTF-8');
  lines.push('1 GEDC');
  lines.push('2 VERS 5.5.1');
  lines.push('2 FORM LINEAGE-LINKED');
  lines.push('1 SUBM @SUBM1@');
  lines.push('0 @SUBM1@ SUBM');
  lines.push('1 NAME FTLS Export');

  indis.forEach(indi => lines.push(...indi));
  fams.forEach(fam => lines.push(...fam));
  lines.push('0 TRLR');

  return lines.join('\n') + '\n';
}

function downloadGedcom(tree, personMap, familyMap) {
  const content = exportTreeToGedcom(tree, personMap, familyMap);
  const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'Chennamkara_Family_Tree_Export.ged';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* ───── GEDCOM DIFF & MERGE ENGINE ───── */

// Compare fields between two person objects, return changed fields
function diffPerson(ftls, ext) {
  const fields = [
    ['fn','First Name'],['mn','Middle Name'],['ln','Last Name'],['nk','Nickname'],
    ['md','Maiden Name'],['g','Gender'],['dob','Birth Date'],['dod','Death Date'],
    ['loc','Birth Place'],['ph','Phone'],['em','Email'],['prof','Occupation'],
    ['a1','Address'],['ci','City'],['st','State'],['co','Country'],['zp','Zip'],
    ['notes','Notes'],['bio','Bio']
  ];
  const diffs = [];
  for (const [key, label] of fields) {
    const fVal = (ftls[key]||'').toString().trim();
    const eVal = (ext[key]||'').toString().trim();
    if (fVal !== eVal && (fVal || eVal)) {
      diffs.push({ key, label, ftls: fVal, ext: eVal });
    }
  }
  return diffs;
}

// Fuzzy match: try name+gender+DOB when IDs don't match
function fuzzyMatchPerson(person, candidates) {
  const name = (person.dn||'').toLowerCase().replace(/[^a-z]/g,'');
  const fn = (person.fn||'').toLowerCase();
  const ln = (person.ln||'').toLowerCase();
  if (!name && !fn) return null;
  
  let bestMatch = null, bestScore = 0;
  for (const c of candidates) {
    let score = 0;
    const cName = (c.dn||'').toLowerCase().replace(/[^a-z]/g,'');
    const cFn = (c.fn||'').toLowerCase();
    const cLn = (c.ln||'').toLowerCase();
    
    if (name && cName && name === cName) score += 50;
    else {
      if (fn && cFn && fn === cFn) score += 25;
      if (ln && cLn && ln === cLn) score += 15;
    }
    if (person.g && c.g && person.g === c.g) score += 5;
    if (person.dob && c.dob && person.dob === c.dob) score += 20;
    
    if (score > bestScore && score >= 30) {
      bestScore = score;
      bestMatch = { person: c, score };
    }
  }
  return bestMatch;
}

// Main diff function: compare external GEDCOM people/families against FTLS personMap/familyMap
function computeGedcomDiff(extPeople, extFamilies, ftlsPersonMap, ftlsFamilyMap) {
  const results = {
    matched: [],      // same ID, with field diffs
    fuzzyMatched: [],  // different ID but same person (by name)
    extOnly: [],       // in external only — can merge into FTLS
    ftlsOnly: [],      // in FTLS only — can export for external
    familyDiffs: [],   // family structure differences
    stats: {}
  };
  
  const ftlsMatched = new Set();
  const extMatched = new Set();
  
  // Pass 1: Exact ID match
  for (const [id, ext] of Object.entries(extPeople)) {
    if (ftlsPersonMap[id]) {
      const diffs = diffPerson(ftlsPersonMap[id], ext);
      results.matched.push({ id, ftls: ftlsPersonMap[id], ext, diffs });
      ftlsMatched.add(id);
      extMatched.add(id);
    }
  }
  
  // Pass 2: Fuzzy match unmatched external people
  const unmatchedFtls = Object.values(ftlsPersonMap).filter(p => !ftlsMatched.has(p.id));
  for (const [id, ext] of Object.entries(extPeople)) {
    if (extMatched.has(id)) continue;
    const match = fuzzyMatchPerson(ext, unmatchedFtls);
    if (match) {
      const diffs = diffPerson(match.person, ext);
      results.fuzzyMatched.push({ extId: id, ftlsId: match.person.id, ext, ftls: match.person, score: match.score, diffs });
      ftlsMatched.add(match.person.id);
      extMatched.add(id);
    }
  }
  
  // Pass 3: Unmatched remainders
  for (const [id, ext] of Object.entries(extPeople)) {
    if (!extMatched.has(id)) results.extOnly.push(ext);
  }
  for (const [id, ftls] of Object.entries(ftlsPersonMap)) {
    if (!ftlsMatched.has(id)) results.ftlsOnly.push(ftls);
  }
  
  // Family diffs
  for (const [fid, extFam] of Object.entries(extFamilies)) {
    const ftlsFam = ftlsFamilyMap[fid];
    if (!ftlsFam) {
      results.familyDiffs.push({ id: fid, type: 'ext_only', ext: extFam });
    } else {
      const diffs = [];
      if ((extFam.husb||'') !== (ftlsFam.husband_id||ftlsFam.husb||'')) diffs.push({ field:'husband', ext:extFam.husb, ftls:ftlsFam.husband_id||ftlsFam.husb });
      if ((extFam.wife||'') !== (ftlsFam.wife_id||ftlsFam.wife||'')) diffs.push({ field:'wife', ext:extFam.wife, ftls:ftlsFam.wife_id||ftlsFam.wife });
      const extKids = (extFam.children||[]).sort().join(',');
      const ftlsKids = (ftlsFam.children||[]).sort().join(',');
      if (extKids !== ftlsKids) diffs.push({ field:'children', ext:extFam.children, ftls:ftlsFam.children });
      if (diffs.length > 0) results.familyDiffs.push({ id: fid, type: 'different', diffs, ext: extFam, ftls: ftlsFam });
    }
  }
  for (const [fid, ftlsFam] of Object.entries(ftlsFamilyMap)) {
    if (!extFamilies[fid]) {
      results.familyDiffs.push({ id: fid, type: 'ftls_only', ftls: ftlsFam });
    }
  }
  
  // Stats
  const totalChanged = results.matched.filter(m => m.diffs.length > 0).length;
  results.stats = {
    extTotal: Object.keys(extPeople).length,
    ftlsTotal: Object.keys(ftlsPersonMap).length,
    exactMatch: results.matched.length,
    fuzzyMatch: results.fuzzyMatched.length,
    identical: results.matched.filter(m => m.diffs.length === 0).length,
    changed: totalChanged,
    extOnly: results.extOnly.length,
    ftlsOnly: results.ftlsOnly.length,
    extFamilies: Object.keys(extFamilies).length,
    ftlsFamilies: Object.keys(ftlsFamilyMap).length,
  };
  
  return results;
}

// Merge a single external person into Supabase
async function mergePersonToDb(ext, editUser) {
  const person = { ...ext };
  // Ensure display name
  if (!person.dn) person.dn = ((person.fn||'') + ' ' + (person.ln||'')).trim() || '(Unknown)';
  await savePerson(person, editUser || 'GEDCOM merge');
}

// Apply specific field updates from external to an existing FTLS person
async function mergeFieldsToDb(ftlsPerson, fieldsToApply, ext, editUser) {

  }
  merged.dn = ((merged.fn||'') + (merged.mn ? ' '+merged.mn : '') + (merged.ln ? ' '+merged.ln : '')).trim() || merged.nk || '(Unknown)';
  await savePerson(merged, editUser || 'GEDCOM merge');
}

// Export FTLS-only persons as a GEDCOM fragment for import into external tools
function exportDiffGedcom(ftlsOnlyPersons, ftlsFamilyMap) {
  // Collect families that involve FTLS-only persons
  const personIds = new Set(ftlsOnlyPersons.map(p => p.id));
  const relevantFamilies = {};
  for (const [fid, fam] of Object.entries(ftlsFamilyMap)) {
    const hid = fam.husband_id || fam.husb || '';
    const wid = fam.wife_id || fam.wife || '';
    const kids = fam.children || [];
    if (personIds.has(hid) || personIds.has(wid) || kids.some(k => personIds.has(k))) {
      relevantFamilies[fid] = fam;
    }
  }
  
  // Build a minimal personMap/familyMap for export
  const pMap = {};
  ftlsOnlyPersons.forEach(p => { pMap[p.id] = p; });
  const fMap = {};
  for (const [fid, fam] of Object.entries(relevantFamilies)) {
    fMap[fid] = {
      id: fid,
      husband_id: fam.husband_id || fam.husb || '',
      wife_id: fam.wife_id || fam.wife || '',
      children: fam.children || [],
      marriage_date: fam.marriage_date || fam.mdate || '',
      marriage_place: fam.marriage_place || fam.mplace || '',
    };
  }
  
  return exportTreeToGedcom(null, pMap, fMap);
}

/* ───── GEDCOM 5.5.1 IMPORTER / PARSER ───── */
function parseGedcomFile(text) {
  // Normalize line endings
  const raw = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
  const lines = raw.split('\n').filter(l => l.trim());

  // Parse into elements: {level, pointer, tag, value, children[]}
  const elements = [];
  const stack = [{ children: elements, level: -1 }];

  for (const line of lines) {
    const m = line.match(/^(\d+)\s+(@[^@]+@)?\s*(\S+)\s*(.*)?$/);
    if (!m) continue;
    const level = parseInt(m[1]);
    const pointer = (m[2] || '').trim();
    const tag = m[3].trim();
    const value = (m[4] || '').trim();
    const el = { level, pointer, tag, value, children: [] };

    // Pop stack to find parent
    while (stack.length > 1 && stack[stack.length - 1].level >= level) {
      stack.pop();
    }
    stack[stack.length - 1].children.push(el);
    stack.push(el);
  }

  // Extract individuals
  const people = {};
  const families = {};

  for (const el of elements) {
    if (el.tag === 'INDI' && el.pointer) {
      const p = parseIndi(el);
      people[p.id] = p;
    } else if (el.tag === 'FAM' && el.pointer) {
      const f = parseFam(el);
      families[f.id] = f;
    }
  }

  // Compute generations & build tree
  return buildTreeFromFlat(people, families);
}

function getChildValue(el, tag) {
  const ch = el.children.find(c => c.tag === tag);
  return ch ? ch.value : '';
}

function getNestedValue(el, parentTag, childTag) {
  const parent = el.children.find(c => c.tag === parentTag);
  if (!parent) return '';
  const child = parent.children.find(c => c.tag === childTag);
  return child ? child.value : '';
}

function parseIndi(el) {
  const id = el.pointer;

  // Primary name
  let fn = '', mn = '', ln = '', nk = '', md = '';
  const nameEls = el.children.filter(c => c.tag === 'NAME');

  for (const nameEl of nameEls) {
    const typeEl = nameEl.children.find(c => c.tag === 'TYPE');
    const type = typeEl ? typeEl.value : '';

    if (type === 'nick') {
      nk = nameEl.value.replace(/\//g, '').trim();
    } else if (type === 'birth') {
      md = nameEl.value.replace(/\//g, '').trim();
    } else if (type === 'married') {
      // Skip married-name-only entries (the "George married to George" issue)
      continue;
    } else if (!fn && !ln) {
      // Primary name - parse from structured value or sub-tags
      const givnEl = nameEl.children.find(c => c.tag === 'GIVN');
      const surnEl = nameEl.children.find(c => c.tag === 'SURN');
      const secgEl = nameEl.children.find(c => c.tag === 'SECG');

      if (givnEl) {
        // Strip leading birth-order number prefix like "4. Samuel" → "Samuel"
        let givnVal = givnEl.value.replace(/^\d+\.\s*/, '');
        const parts = givnVal.split(' ');
        fn = parts[0] || '';
        if (parts.length > 1 && !mn) mn = parts.slice(1).join(' ');
      }
      if (surnEl) ln = surnEl.value;
      if (secgEl && !mn) mn = secgEl.value;

      // Fallback: parse "Given /Surname/" format
      if (!fn && !ln) {
        // Strip leading birth-order number prefix
        const nameVal = nameEl.value.replace(/^\d+\.\s*/, '');
        const slashMatch = nameVal.match(/^(.*?)\/([^\/]*)\//);
        if (slashMatch) {
          const givenPart = slashMatch[1].trim();
          ln = slashMatch[2].trim();
          const gParts = givenPart.split(' ');
          fn = gParts[0] || '';
          if (gParts.length > 1) mn = gParts.slice(1).join(' ');
        } else {
          fn = nameVal.replace(/\//g, '').trim();
        }
      }
    }
  }

  const g = getChildValue(el, 'SEX');
  const dob = getNestedValue(el, 'BIRT', 'DATE');
  const loc = getNestedValue(el, 'BIRT', 'PLAC');
  const dod = getNestedValue(el, 'DEAT', 'DATE');
  const deatEl2 = el.children.find(c => c.tag === 'DEAT');
  const hasDeat = deatEl2 ? (deatEl2.value === 'Y' || !!dod) : false;

  // Contact
  const ph = getChildValue(el, 'PHON');
  const em = getChildValue(el, 'EMAI') || getChildValue(el, 'EMAIL');
  const ws = getChildValue(el, 'WWW');

  // Address
  let a1='',a2='',ci='',st='',zp='',co='';
  const addrEl = el.children.find(c => c.tag === 'ADDR' || c.tag === 'RESI');
  if (addrEl) {
    a1 = addrEl.value || getChildValue(addrEl, 'ADR1') || '';
    a2 = getChildValue(addrEl, 'ADR2');
    ci = getChildValue(addrEl, 'CITY');
    st = getChildValue(addrEl, 'STAE');
    zp = getChildValue(addrEl, 'POST');
    co = getChildValue(addrEl, 'CTRY');
  }

  // Other fields
  const prof = getChildValue(el, 'OCCU');
  const notes = getChildValue(el, 'NOTE');

  // Custom tags
  const fb = getChildValue(el, '_FACEBOOK');
  const ig = getChildValue(el, '_INSTAGRAM');
  const li = getChildValue(el, '_LINKEDIN');
  const pp = getChildValue(el, '_PHOTO');
  const emp = getChildValue(el, '_EMPLOYER');
  const pgl = getChildValue(el, '_PHOTOGALLERY');
  const dl = getChildValue(el, '_DOCUMENTS');

  // Family links
  const fams = el.children.filter(c => c.tag === 'FAMS').map(c => c.value);
  const famc = el.children.filter(c => c.tag === 'FAMC').map(c => c.value);

  // Build display name
  let dn = (fn + (mn ? ' ' + mn : '') + (ln ? ' ' + ln : '')).trim();
  if (!dn) dn = nk || '(Unknown)';

  // Handle the "surname only" spouse issue - if no first name and only surname
  if (!fn && ln && !mn) {
    dn = `Mrs. ${ln} (name unknown)`;
  }

  return {
    id, fn, mn, ln, dn, nk, md, g,
    dob, dod, dec: hasDeat || !!dod, bo: 0,
    em, ph, a1, a2, ci, st, zp, co,
    fb, ig, li, ws, pp, bio: '', loc,
    prof, emp, stories: '', notes, pgl, dl,
    fams, famc,
  };
}

function parseFam(el) {
  return {
    id: el.pointer,
    husb: getChildValue(el, 'HUSB'),
    wife: getChildValue(el, 'WIFE'),
    children: el.children.filter(c => c.tag === 'CHIL').map(c => c.value),
    mdate: getNestedValue(el, 'MARR', 'DATE'),
    mplace: getNestedValue(el, 'MARR', 'PLAC'),
  };
}

function parseDateSort(d) {
  if (!d) return 99999999;
  const months = {JAN:1,FEB:2,MAR:3,APR:4,MAY:5,JUN:6,JUL:7,AUG:8,SEP:9,OCT:10,NOV:11,DEC:12};
  // MM/DD/YYYY
  let m = d.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if (m) return parseInt(m[3])*10000 + parseInt(m[1])*100 + parseInt(m[2]);
  // DD MON YYYY
  m = d.match(/(\d{1,2})\s+(\w{3})\s+(\d{4})/);
  if (m) return parseInt(m[3])*10000 + (months[m[2].toUpperCase()]||0)*100 + parseInt(m[1]);
  return 99999999;
}

function buildTreeFromFlat(people, families) {
  // Compute birth order per family
  for (const fam of Object.values(families)) {
    const kids = fam.children.filter(cid => people[cid]);
    kids.sort((a, b) => parseDateSort(people[a].dob) - parseDateSort(people[b].dob));
    kids.forEach((cid, i) => { if (people[cid]) people[cid].bo = i + 1; });
  }

  // BFS to assign generations
  const hasParents = new Set();
  for (const fam of Object.values(families)) {
    fam.children.forEach(c => hasParents.add(c));
  }
  const roots = Object.keys(people).filter(pid => !hasParents.has(pid));

  const genMap = {};
  const visited = new Set();
  const queue = roots.map(pid => [pid, 0]);

  while (queue.length > 0) {
    const [pid, gen] = queue.shift();
    if (visited.has(pid)) continue;
    visited.add(pid);
    genMap[pid] = gen;

    const person = people[pid];
    if (!person) continue;

    for (const famId of person.fams) {
      const fam = families[famId];
      if (!fam) continue;
      // Spouse gets same gen
      const spouseId = fam.husb === pid ? fam.wife : fam.husb;
      if (spouseId && !visited.has(spouseId)) queue.push([spouseId, gen]);
      // Children get gen+1
      for (const cid of fam.children) {
        if (!visited.has(cid)) queue.push([cid, gen + 1]);
      }
    }
  }

  // Find the person with most descendants as root
  function countDesc(pid, seen = new Set()) {
    if (seen.has(pid)) return 0;
    seen.add(pid);
    let count = 1;
    const p = people[pid];
    if (!p) return 0;
    for (const famId of p.fams) {
      const fam = families[famId];
      if (!fam) continue;
      for (const cid of fam.children) {
        count += countDesc(cid, seen);
      }
    }
    return count;
  }

  let bestRoot = null;
  let bestCount = 0;
  for (const pid of roots) {
    const p = people[pid];
    // Skip unnamed people entirely as root candidates
    if (!p || (!p.fn && !p.nk)) continue;
    const c = countDesc(pid);
    if (c > bestCount) { bestCount = c; bestRoot = pid; }
  }
  // If no named root found, fall back to most descendants
  if (!bestRoot) {
    for (const pid of roots) {
      const c = countDesc(pid);
      if (c > bestCount) { bestCount = c; bestRoot = pid; }
    }
  }
  if (!bestRoot) bestRoot = roots[0];
  console.log('Tree root:', bestRoot, people[bestRoot]?.dn, 'with', bestCount, 'descendants');

  // Build hierarchical tree
  function buildNode(pid, visitedNodes = new Set()) {
    if (visitedNodes.has(pid)) return null;
    visitedNodes.add(pid);

    const p = people[pid];
    if (!p) return null;

    const node = { ...p, gen: genMap[pid] || 0, sp: null, ch: [] };
    // Remove flat refs from display node
    delete node.fams;
    delete node.famc;

    for (const famId of (p.fams || [])) {
      const fam = families[famId];
      if (!fam) continue;

      // Spouse
      const spId = fam.husb === pid ? fam.wife : fam.husb;
      if (spId && people[spId] && !visitedNodes.has(spId)) {
        visitedNodes.add(spId);
        const sp = { ...people[spId], mdate: fam.mdate || '', mplace: fam.mplace || '' };
        delete sp.fams;
        delete sp.famc;
        node.sp = sp;
      }
      node.mdate = fam.mdate || '';
      node.mplace = fam.mplace || '';

      // Children
      for (const cid of fam.children) {
        const childNode = buildNode(cid, visitedNodes);
        if (childNode) node.ch.push(childNode);
      }
      // Sort children by birth order
      node.ch.sort((a, b) => (a.bo || 999) - (b.bo || 999));
    }

    return node;
  }

  // Build personMap from people (same format as Supabase version)
  const personMap = {};
  for (const [id, p] of Object.entries(people)) {
    const clean = {...p};
    delete clean.fams; delete clean.famc;
    personMap[id] = clean;
  }

  return { tree: buildNode(bestRoot), personMap, familyMap: families };
}

function triggerImportGedcom(onImport) {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.ged,.gedcom';
  input.onchange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (evt) => {
      try {
        const result = parseGedcomFile(evt.target.result);
        if (result && result.tree) {
          onImport(result, file.name);
        } else {
          alert('Could not parse the GEDCOM file. No valid records found.');
        }
      } catch (err) {
        alert('Error parsing GEDCOM file: ' + err.message);
        console.error(err);
      }
    };
    reader.readAsText(file, 'utf-8');
  };
  input.click();
}

const SB_AUTH_URL = SUPABASE_URL + '/auth/v1';

async function sbAuthFetch(path, opts = {}) {
  const url = SB_AUTH_URL + path;
  const resp = await fetch(url, {
    ...opts,
    headers: { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json', ...(opts.headers||{}) }
  });
  const data = await resp.json();
  if (!resp.ok) throw new Error(data.error_description || data.msg || data.message || 'Auth error');
  return data;
}

// Auth state — persisted in sessionStorage
let authSession = null;
let authUser = null;

// Restore session on load
try {
  const stored = sessionStorage.getItem('ftls_session');
  if (stored) {
    const parsed = JSON.parse(stored);
    authSession = parsed.session;
    authUser = parsed.user;
  }
} catch(e) {}

function persistAuth() {
  try {
    if (authSession && authUser) {
      sessionStorage.setItem('ftls_session', JSON.stringify({ session: authSession, user: authUser }));
    } else {
      sessionStorage.removeItem('ftls_session');
    }
  } catch(e) {}
}

    method: 'POST',

  });
  authSession = data;
  // Fetch user profile from users table

  });
  authUser = users[0] || null;
  persistAuth();
  return { session: data, user: authUser };

  }

async function createUserAccount(email, name, personId, role) {

  const tempPwd = 'Tmp!' + crypto.getRandomValues(new Uint8Array(16)).reduce((s,b)=>s+b.toString(36),'').slice(0,20);
  
  // Create auth user via public signup endpoint
  const data = await sbAuthFetch('/signup', {
    method: 'POST',
    body: JSON.stringify({ 
      email, 
      password: tempPwd,
      data: { name }  // stored in auth.users.raw_user_meta_data

function canEdit() { return authUser && ['editor','admin','super_admin'].includes(authUser.role); }
function isAdmin() { return authUser && ['admin','super_admin'].includes(authUser.role); }
function isSuperAdmin() { return authUser && authUser.role === 'super_admin'; }
function isEditor() { return authUser && authUser.role === 'editor'; }

// Check if an editor can directly edit a target person
// Allowed: self, spouse, siblings, parents, parents-in-law, and all descendants
// Uses personMap + familyMap for flat lookup — works correctly for spouse-based users
function canEditorDirectEdit(targetId, tree, pMap, fMap) {
  if (!authUser?.person_id) return false;
  if (isAdmin()) return true;
  if (!isEditor()) return false;
  // If no personMap available, fall back to tree-based check
  if (!pMap || !fMap || Object.keys(pMap).length === 0) {
    return canEditorDirectEditTreeFallback(targetId, tree);
  }

  const myId = authUser.person_id;
  if (targetId === myId) return true;

  // Helper: find families where a person is husband or wife
  const familiesOf = (pid) => Object.values(fMap).filter(f => f.husband_id === pid || f.wife_id === pid);
  // Helper: get spouse ID from a family
  const spouseIn = (fam, pid) => fam.husband_id === pid ? fam.wife_id : fam.husband_id;
  // Helper: get parent family (family where person is a child)
  const parentFamilyOf = (pid) => Object.values(fMap).find(f => (f.children||[]).includes(pid));

  // My spouse
  const myFams = familiesOf(myId);
  const mySpouseIds = myFams.map(f => spouseIn(f, myId)).filter(Boolean);
  if (mySpouseIds.includes(targetId)) return true;

  // My descendants (children, grandchildren, etc. + their spouses)
  const descIds = new Set();
  const collectDesc = (pids) => {
    for (const pid of pids) {
      familiesOf(pid).forEach(f => {
        (f.children||[]).forEach(cid => {
          if (!descIds.has(cid)) {
            descIds.add(cid);
            // Also add this child's spouse
            familiesOf(cid).forEach(cf => {
              const csp = spouseIn(cf, cid);
              if (csp) descIds.add(csp);
            });
            collectDesc([cid]);
          }
        });
      });
    }
  };
  collectDesc([myId, ...mySpouseIds]);
  if (descIds.has(targetId)) return true;

  // My parents + parents' spouses
  const myParentFam = parentFamilyOf(myId);
  if (myParentFam) {
    if (myParentFam.husband_id === targetId || myParentFam.wife_id === targetId) return true;
    // My siblings + their spouses
    for (const sibId of (myParentFam.children||[])) {
      if (sibId === targetId) return true;
      familiesOf(sibId).forEach(sf => {
        const sibSp = spouseIn(sf, sibId);
        if (sibSp === targetId) return true;
      });
      // Siblings' descendants
      const sibDescIds = new Set();
      const collectSibDesc = (pids) => {
        for (const pid of pids) {
          familiesOf(pid).forEach(f => {
            (f.children||[]).forEach(cid => {
              if (!sibDescIds.has(cid)) {
                sibDescIds.add(cid);
                collectSibDesc([cid]);
              }
            });
          });
        }
      };
      collectSibDesc([sibId]);
      if (sibDescIds.has(targetId)) return true;
    }
  }

  // Parents-in-law (spouse's parents + their children/spouses)
  for (const spId of mySpouseIds) {
    const spParentFam = parentFamilyOf(spId);
    if (spParentFam) {
      if (spParentFam.husband_id === targetId || spParentFam.wife_id === targetId) return true;
      for (const silId of (spParentFam.children||[])) {
        if (silId === targetId) return true;
        familiesOf(silId).forEach(sf => {
          const silSp = spouseIn(sf, silId);
          if (silSp === targetId) return true;
        });
      }
    }
  }

  return false;
}

// Fallback for when personMap/familyMap aren't available (e.g. GEDCOM preview)
function canEditorDirectEditTreeFallback(targetId, tree) {
  const myId = authUser.person_id;
  if (targetId === myId) return true;
  const myFamilyNode = findFamilyNodeContaining(tree, myId);
  if (!myFamilyNode) return false;
  const spouseId = myFamilyNode.id === myId ? myFamilyNode.sp?.id : myFamilyNode.id;
  if (spouseId === targetId) return true;
  if (isDescendant(myFamilyNode, targetId)) return true;
  return false;
}

function findNodeInTree(node, id) {
  if (!node) return null;
  if (node.id === id) return node;
  if (node.sp?.id === id) return node.sp;
  for (const c of node.ch || []) {
    const found = findNodeInTree(c, id);
    if (found) return found;
  }
  return null;
}

function findFamilyNodeContaining(node, personId) {
  if (!node) return null;
  if (node.id === personId || node.sp?.id === personId) return node;
  for (const c of node.ch || []) {
    const found = findFamilyNodeContaining(c, personId);
    if (found) return found;
  }
  return null;
}

function findParentOf(node, childId) {
  if (!node) return null;
  if (node.ch?.some(c => c.id === childId || c.sp?.id === childId)) return node;
  for (const c of node.ch || []) {
    const found = findParentOf(c, childId);
    if (found) return found;
  }
  return null;
}

function findParentFamilyOf(node, personId) {
  return findParentOf(node, personId);
}

function isDescendant(node, targetId) {
  if (!node) return false;
  for (const c of node.ch || []) {
    if (c.id === targetId) return true;
    if (c.sp?.id === targetId) return true;
    if (isDescendant(c, targetId)) return true;
  }
  return false;
}
