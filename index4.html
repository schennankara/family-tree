                                {merging[key] ? 'Merging...' : '⬇ Merge Selected Fields into FTLS'}
                              </button>
                            )}
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              )}

              {/* External Only Tab */}
              {tab === 'ext_only' && (
                <div style={{ padding: '12px 0' }}>
                  <div style={{ fontSize: 12, color: DM, marginBottom: 8 }}>People in the external GEDCOM that don't exist in FTLS. Merge them into your database.</div>
                  <div style={{ marginBottom: 12, display: 'flex', gap: 8 }}>
                    <button onClick={mergeAllExtPersons} style={{ background: 'rgba(107,158,114,0.15)', border: `1px solid ${MC}`, color: MC, padding: '8px 16px', borderRadius: 6, cursor: 'pointer', fontSize: 12 }}>
                      ⬇ Merge All {diffResult.extOnly.length} into FTLS
                    </button>
                  </div>
                  {diffResult.extOnly.map(p => {
                    const key = 'ext_person_' + p.id;
                    return (
                      <div key={p.id} style={{ ...rowS, display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                        <span>
                          <span style={{ width: 8, height: 8, borderRadius: '50%', background: p.g === 'M' ? MC : FC, display: 'inline-block', marginRight: 6 }} />
                          <span style={{ color: TX }}>{p.dn || p.fn + ' ' + p.ln || '(Unknown)'}</span>
                          {p.dob && <span style={{ color: DM, fontSize: 11, marginLeft: 8 }}>b. {p.dob}</span>}
                          <span style={{ color: '#5a5548', fontSize: 10, marginLeft: 8 }}>{p.id}</span>
                        </span>
                        {merged.has(key) ? <span style={{ fontSize: 11, color: '#6b9e72' }}>✓ merged</span> :
                          <button onClick={() => doMerge('ext_person', p)} disabled={merging[key]}
                            style={{ background: 'rgba(107,158,114,0.1)', border: `1px solid rgba(107,158,114,0.3)`, color: MC, padding: '4px 12px', borderRadius: 5, cursor: 'pointer', fontSize: 11 }}>
                            {merging[key] ? '...' : '⬇ Merge'}
                          </button>
                        }
                      </div>
                    );
                  })}
                  {/* Also show external-only families */}
                  {diffResult.familyDiffs.filter(f => f.type === 'ext_only').length > 0 && <>
                    <div style={{ ...sectionHdr, marginTop: 20 }}>External-Only Families</div>
                    {diffResult.familyDiffs.filter(f => f.type === 'ext_only').map(f => {
                      const key = 'ext_family_' + f.id;
                      const fam = f.ext;
                      return (
                        <div key={f.id} style={{ ...rowS, display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                          <span style={{ color: TX, fontSize: 12 }}>
                            {f.id} — H: {fam.husb || '?'}, W: {fam.wife || '?'}, {(fam.children || []).length} children
                          </span>
                          {merged.has(key) ? <span style={{ fontSize: 11, color: '#6b9e72' }}>✓ merged</span> :
                            <button onClick={() => doMerge('ext_family', fam)} disabled={merging[key]}
                              style={{ background: 'rgba(107,158,114,0.1)', border: `1px solid rgba(107,158,114,0.3)`, color: MC, padding: '4px 12px', borderRadius: 5, cursor: 'pointer', fontSize: 11 }}>
                              {merging[key] ? '...' : '⬇ Merge'}
                            </button>
                          }
                        </div>
                      );
                    })}
                  </>}
                </div>
              )}

              {/* FTLS Only Tab */}
              {tab === 'ftls_only' && (
                <div style={{ padding: '12px 0' }}>
                  <div style={{ fontSize: 12, color: DM, marginBottom: 8 }}>People in FTLS that don't exist in the external GEDCOM. Export as a GEDCOM fragment for Rolson/Abey to import.</div>
                  <div style={{ marginBottom: 12 }}>
                    <button onClick={downloadFtlsOnly} style={{ background: 'rgba(155,130,196,0.12)', border: `1px solid ${FC}`, color: FC, padding: '8px 16px', borderRadius: 6, cursor: 'pointer', fontSize: 12 }}>
                      ⬇ Download FTLS-Only as GEDCOM ({diffResult.ftlsOnly.length} persons)
                    </button>
                  </div>
                  {diffResult.ftlsOnly.map(p => (
                    <div key={p.id} style={{ ...rowS, display: 'flex', alignItems: 'center', gap: 6 }}>
                      <span style={{ width: 8, height: 8, borderRadius: '50%', background: p.g === 'M' ? MC : FC, display: 'inline-block' }} />
                      <span style={{ color: TX }}>{p.dn || '(Unknown)'}</span>
                      {p.dob && <span style={{ color: DM, fontSize: 11 }}>b. {p.dob}</span>}
                      <span style={{ color: '#5a5548', fontSize: 10 }}>{p.id}</span>
                    </div>
                  ))}
                </div>
              )}

              {/* Fuzzy Matches Tab */}
              {tab === 'fuzzy' && (
                <div style={{ padding: '12px 0' }}>
                  <div style={{ fontSize: 12, color: DM, marginBottom: 12 }}>People matched by name/DOB but with different IDs. These may be the same person added independently on each side.</div>
                  {diffResult.fuzzyMatched.map(m => (
                    <div key={m.extId} style={{ marginBottom: 8, border: `1px solid rgba(208,160,126,0.3)`, borderRadius: 8, padding: 12 }}>
                      <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 13, marginBottom: 6 }}>
                        <span style={{ color: TX }}>{m.ext.dn || '?'} <span style={{ fontSize: 10, color: DM }}>score: {m.score}</span></span>
                      </div>
                      <div style={{ fontSize: 11, color: DM }}>
                        External ID: <span style={{ color: '#7eb8d0' }}>{m.extId}</span> → FTLS ID: <span style={{ color: GC }}>{m.ftlsId}</span>
                      </div>
                      {m.diffs.length > 0 && <div style={{ fontSize: 11, color: '#d0a07e', marginTop: 4 }}>{m.diffs.length} field difference{m.diffs.length > 1 ? 's' : ''}: {m.diffs.map(d => d.label).join(', ')}</div>}
                    </div>
                  ))}
                </div>
              )}

              {/* Merge Log Tab */}
              {tab === 'log' && (
                <div style={{ padding: '12px 0' }}>
                  <div style={{ fontSize: 12, color: DM, marginBottom: 8 }}>Merge operations performed this session.</div>
                  {mergeLog.map((entry, i) => (
                    <div key={i} style={{ padding: '4px 0', fontSize: 12, color: entry.startsWith('✓') ? '#6b9e72' : '#c45050' }}>{entry}</div>
                  ))}
                  {mergeLog.length > 0 && (
                    <button onClick={() => { onMergeComplete(); }}
                      style={{ marginTop: 16, background: 'rgba(196,163,90,0.12)', border: `1px solid ${GD}`, color: GC, padding: '8px 20px', borderRadius: 6, cursor: 'pointer', fontSize: 13 }}>
                      ↻ Reload Tree to See Changes
                    </button>
                  )}
                </div>
              )}
            </>
          )}
        </div>
      </div>
    </div>
  );
}

/* ───── APP ───── */
function App(){
  const [tree,setTree]=useState(null);
  const [personMap,setPersonMap]=useState({});
  const [familyMap,setFamilyMap]=useState({});
  const [loading,setLoading]=useState(true);
  const [exp,setExp]=useState(new Set());
  const [sel,setSel]=useState(null);
  const [search,setSearch]=useState('');
  const [hl,setHl]=useState(null);
  const [editing,setEditing]=useState(null);
  const [adding,setAdding]=useState(null);
  const [spouseEditing,setSpouseEditing]=useState(null);
  const [msg,setMsg]=useState('');
  const [showLogin,setShowLogin]=useState(false);
  const [showRequestAccount,setShowRequestAccount]=useState(false);
  const [showMigrate,setShowMigrate]=useState(false);
  const [pendingAction,setPendingAction]=useState(null);
  const [user,setUser]=useState(()=>authUser||null); // restore from session
  const [activeTab,setActiveTab]=useState('tree');
  const [viewerGate,setViewerGate]=useState(()=>!authUser); // false if already signed in
  const [gatePassword,setGatePassword]=useState('');
  const [gateError,setGateError]=useState('');
  const [gateChecking,setGateChecking]=useState(false);
  const [showPasswordReset,setShowPasswordReset]=useState(false);
  const [resetToken,setResetToken]=useState(null);
  const [showDiff,setShowDiff]=useState(false);
  const flat=useMemo(()=>tree?flattenAll(tree):[],[tree]);

  // Detect password recovery token in URL on load
  useEffect(()=>{
    try {
      // Check hash params first (Supabase implicit flow)
      const hash = window.location.hash;
      if (hash && hash.length > 1) {
        const params = new URLSearchParams(hash.substring(1));
        const type = params.get('type');
        const accessToken = params.get('access_token');
        if (type === 'recovery' && accessToken) {
          setResetToken(accessToken);
          setShowPasswordReset(true);
          setViewerGate(false);
          window.history.replaceState(null, '', window.location.pathname);
          return;
        }
      }
      // Check query params (Supabase PKCE flow sends ?code=...&type=recovery)
      const urlParams = new URLSearchParams(window.location.search);
      const qType = urlParams.get('type');
      const qCode = urlParams.get('code');
      if (qType === 'recovery' && qCode) {
        // Exchange the code for a session token
        (async()=>{
          try {
            const data = await sbAuthFetch('/token?grant_type=pkce', {
              method: 'POST',
              body: JSON.stringify({ auth_code: qCode, code_verifier: sessionStorage.getItem('code_verifier') || '' })
            });
            if (data.access_token) {
              setResetToken(data.access_token);
              setShowPasswordReset(true);
              setViewerGate(false);
              window.history.replaceState(null, '', window.location.pathname);
            }
          } catch(e) {
            // Fallback: if PKCE exchange fails, try using the code directly as a token
            // Some Supabase configs pass access_token in query params too
            const qToken = urlParams.get('access_token');
            if (qToken) {
              setResetToken(qToken);
              setShowPasswordReset(true);
              setViewerGate(false);
              window.history.replaceState(null, '', window.location.pathname);
            } else {
              console.error('Recovery code exchange failed:', e);
            }
          }
        })();
      }
    } catch(e) { console.error('Recovery detection error:', e); }
  },[]);

  // Auth gate: require login for edit actions
  const requireAuth = useCallback((action) => {
    if (user && (canEdit() || user.role === 'viewer')) {
      // Viewers AND editors/admins can open edit forms
      // The save handler routes differently based on role
      action();
    } else {
      setPendingAction(() => action);
      setShowLogin(true);
    }
  }, [user]);

  const handleLoginSuccess = (u) => {
    setUser(u);
    setShowLogin(false);
    setViewerGate(false); // signed-in users bypass the gate
    if (u.role !== 'viewer') {
      setMsg('Signed in as ' + (u.name || u.email));
    }
    setTimeout(()=>setMsg(''),3000);
    if (pendingAction) { pendingAction(); setPendingAction(null); }
  };

  const handleSignOut = async () => {
    await signOut();
    setUser(null);
    setActiveTab('tree');
    setViewerGate(true); // re-lock on sign out
    setMsg('Signed out');
    setTimeout(()=>setMsg(''),2000);
  };

  const handleViewerGate = async () => {
    if (!gatePassword) { setGateError('Enter the family password'); return; }
    setGateChecking(true); setGateError('');
    try {
      const settings = await sbFetch("settings?key=eq.viewer_password&select=value");
      if (settings[0]?.value === gatePassword) {
        setViewerGate(false);
        setUser({ role: 'viewer', name: 'Viewer' });
      } else {
        setGateError('Incorrect password. Ask a family member for access.');
      }
    } catch (e) {
      setGateError('Could not verify. Try again.');
    }
    setGateChecking(false);
  };

  // Reusable tree loader
  const reloadTree = useCallback(async (silent=false) => {
    let result = await loadFromSupabase();
    let source = 'Supabase';
    if(!result){
      result = await loadSourceGedcom();
      source = 'GEDCOM file';
    }
    if(result){
      // result can be {tree, personMap, familyMap} or just a tree node (from GEDCOM)
      const treeNode = result.tree || result;
      const pMap = result.personMap || {};
      const fMap = result.familyMap || {};
      setTree(treeNode);
      setPersonMap(pMap);
      setFamilyMap(fMap);
      const s=new Set();
      const add=(n,d)=>{if(d<2&&n.ch?.length){s.add(n.id);n.ch.forEach(c=>add(c,d+1))}};
      add(treeNode,0);
      setExp(s);
      if(!silent){
        const totalPeople = Object.keys(pMap).length || cnt(treeNode);
        setMsg('Loaded '+totalPeople+' people from '+source);
        setTimeout(()=>setMsg(''),3000);
      }
    } else if(!silent) {
      setMsg('Failed to load family tree');
    }
    return result;
  },[]);

  // Load on mount
  useEffect(()=>{
    reloadTree().then(()=>setLoading(false));
  },[]);

  const findNodeById=useCallback((root,id)=>{
    if(!root)return null;
    if(root.id===id)return root;
    if(root.sp?.id===id)return root.sp;
    for(const c of root.ch||[]){
      const found=findNodeById(c,id);
      if(found)return found;
    }
    return null;
  },[]);

  const getAncestorIds=useCallback((root,id)=>{
    const path=findPath(root,id)||[];
    return path.slice(0,-1).map(n=>n.id);
  },[]);

  const updateNode=useCallback((root,id,updater)=>{
    if(root.id===id)return updater(root);
    if(!root.ch)return root;
    return {...root,ch:root.ch.map(c=>updateNode(c,id,updater))};
  },[]);

  const removeNode=useCallback((root,targetId)=>{
    if(!root.ch)return root;
    return {...root,ch:root.ch.filter(c=>c.id!==targetId).map(c=>removeNode(c,targetId))};
  },[]);

  const toggle=useCallback(id=>{
    setExp(p=>{const n=new Set(p);n.has(id)?n.delete(id):n.add(id);return n});
  },[]);

  const expandAll=()=>{const s=new Set();flat.forEach(n=>{if(n.ch?.length)s.add(n.id)});setExp(s)};
  const collapseAll=()=>setExp(new Set());
  const expandTo=d=>{const s=new Set();const add=(n,depth)=>{if(depth<d&&n.ch?.length){s.add(n.id);n.ch.forEach(c=>add(c,depth+1))}};add(tree,0);setExp(s)};

  const matches=useMemo(()=>{
    if(search.length<2)return[];
    const q=search.toLowerCase();
    return flat.filter(n=>(n.dn||'').toLowerCase().includes(q)||(n.nk||'').toLowerCase().includes(q))
      .map(n=>({...n, _matchType: n._isSpouse ? 'spouse' : 'person', _spouseOf: n._spouseOfName || ''}))
      .slice(0,15);
  },[search,flat]);

  const revealNode=useCallback((nodeId,opts={})=>{
    const ancestorIds=getAncestorIds(tree,nodeId);
    setExp(p=>{
      const s=new Set(p);
      ancestorIds.forEach(id=>s.add(id));
      return s;
    });
    setHl(nodeId);
    if(opts.select){
      const latest=findNodeById(tree,nodeId);
      if(latest)setSel(latest);
    }
    setTimeout(()=>setHl(null),2000);
  },[tree,getAncestorIds,findNodeById]);

  const navigateTo=useCallback(node=>{
    // If this is a spouse result, reveal/select the parent node that contains them
    const targetId = node._isSpouse ? (node._spouseOfId || node.id) : node.id;
    revealNode(targetId,{select:true});
    setSearch('');
  },[revealNode]);

  // State for viewer submission flow
  const [viewerSubmitData, setViewerSubmitData] = useState(null); // {personId, personName, changes, type}
  const [showViewerIdentity, setShowViewerIdentity] = useState(false);

  const isViewer = () => user && user.role === 'viewer';
  // Returns true if this edit should go to approval queue instead of direct DB
  const needsApproval = (targetPersonId) => {
    if (isAdmin()) return false; // admins always direct
    if (isViewer()) return true; // viewers always request
    // Editors: check scope
    if (isEditor() && !canEditorDirectEdit(targetPersonId, tree, personMap, familyMap)) return true;
    return false;
  };

  const openEditForNode = (node) => {
    if (!node) return;
    setEditing(findNodeById(tree,node.id)||node);
  };

  const handleSaveEdit=(data)=>{
    if (needsApproval(data.id)) {
      const node = findNodeById(tree, data.id);
      // Compute diff: only fields that actually changed
      const skipKeys = new Set(['id','ch','sp','gen','_fams','_famc','_p','_n','_matchType','_spouseOf','_isSpouse','_spouseOfId','_spouseOfName','_mt','_spOf','dn']);
      const changedFields = {};
      const prevFields = {};
      for (const [k, v] of Object.entries(data)) {
        if (skipKeys.has(k)) continue;
        const oldRaw = node?.[k];
        const newRaw = v;
        // Normalize both to strings for comparison, treating undefined/null/0/false as ''
        const oldVal = (oldRaw === undefined || oldRaw === null || oldRaw === false || oldRaw === 0) ? '' : String(oldRaw).trim();
        const newVal = (newRaw === undefined || newRaw === null || newRaw === false || newRaw === 0) ? '' : String(newRaw).trim();
        if (oldVal !== newVal && (oldVal || newVal)) {
          changedFields[k] = v;
          prevFields[k] = oldRaw || '';
        }
      }
      if (Object.keys(changedFields).length === 0) {
        setMsg('No changes detected');
        setTimeout(()=>setMsg(''),2000);
        setEditing(null);
        return;
      }
      setViewerSubmitData({ personId: data.id, personName: node?.dn || data.dn || data.id, changes: changedFields, previous: prevFields, type: 'edit' });
      setShowViewerIdentity(true);
      setEditing(null);
      return;
    }
    let updatedNodeId=data.id;
    setTree(prev=>{
      const next=updateNode(prev,data.id,(existing)=>({...existing,...data,ch:existing.ch||[],sp:existing.sp}));
      return next;
    });
    // Keep personMap in sync
    setPersonMap(prev=>({...prev, [data.id]: {...(prev[data.id]||{}), ...data}}));
    setEditing(null);
    // Snapshot before save (for undo), then save
    (async()=>{
      try {
        if (authSession?.access_token) {
          await sbFetch('rpc/snapshot_person', {
            method:'POST',
            headers:{'Authorization':'Bearer '+authSession.access_token},
            body:JSON.stringify({p_person_id:data.id, p_reason:'before_direct_edit'})
          });
        }
      } catch(e) { console.warn('Snapshot failed:', e); }
      savePerson(data, user?.name||user?.email||"").then(()=>{
        setMsg('Saved to database!');
      }).catch(e=>{
        console.error('Save error:', e, e?.message);
        setMsg('DB save failed: ' + (e?.message || 'unknown error'));
      });
    })();
    setTimeout(()=>{revealNode(updatedNodeId,{select:false})},0);
    setTimeout(()=>setMsg(''),2000);
  };

  const handleAdd=(data)=>{
    if (needsApproval(adding)) {
      const parentNode = findNodeById(tree, adding);
      setViewerSubmitData({ personId: adding, personName: parentNode?.dn || adding, changes: {...data, _action: 'add_child'}, type: 'add' });
      setShowViewerIdentity(true);
      setAdding(null);
      return;
    }
    const parentId=adding;
    const newNode={...data,ch:[]};
    setTree(prev=>updateNode(prev,parentId,p=>({...p,ch:[...(p.ch||[]),newNode]})));
    // Keep personMap in sync
    setPersonMap(prev=>({...prev, [data.id]: {...data}}));
    setAdding(null);
    setSel(newNode);
    addPersonToDB(data, parentId, user?.name||user?.email||"").then(()=>{
      setMsg('Added to database!');
    }).catch(e=>{
      console.error('Add error:',e);
      setMsg('Added locally (DB sync failed)');
    });
    setTimeout(()=>revealNode(newNode.id,{select:false}),0);
    setTimeout(()=>setMsg(''),2000);
  };

  const handleDelete=(id)=>{
    if (needsApproval(id)) {
      const node = findNodeById(tree, id);
      setViewerSubmitData({ personId: id, personName: node?.dn || id, changes: { _action: 'delete' }, type: 'delete' });
      setShowViewerIdentity(true);
      return;
    }
    const node=findNodeById(tree,id);
    if(node?.ch?.length){
      setMsg('Cannot delete: has descendants');
      setTimeout(()=>setMsg(''),3000);
      return;
    }
    if(!confirm(`Delete ${node?.dn||'this person'}?`))return;
    const parentIds=getAncestorIds(tree,id);
    const parentId=parentIds[parentIds.length-1]||null;
    setTree(prev=>removeNode(prev,id));
    // Keep personMap in sync
    setPersonMap(prev=>{const next={...prev};delete next[id];return next;});
    if(sel?.id===id)setSel(parentId?findNodeById(tree,parentId):null);
    if(editing?.id===id)setEditing(null);
    if(adding===id)setAdding(null);
    setExp(p=>{const s=new Set(p); s.delete(id); return s;});
    // Delete from Supabase
    deletePersonFromDB(id, user?.name||user?.email||"").then(()=>{
      setMsg('Deleted from database');
    }).catch(e=>{
      console.error('Delete error:',e);
      setMsg('Deleted locally (DB sync failed)');
    });
    setTimeout(()=>{if(parentId) revealNode(parentId,{select:true})},0);
    setTimeout(()=>setMsg(''),2000);
  };

  const handleSaveSpouse=(data)=>{
    if(!spouseEditing?.parentId)return;
    const parentId=spouseEditing.parentId;
    const spouseTargetId=(spouseEditing.spouse&&spouseEditing.spouse.id) || data.id || parentId;
    if (needsApproval(spouseTargetId)) {
      const parentNode = findNodeById(tree, parentId);
      const spouseId = (spouseEditing.spouse&&spouseEditing.spouse.id) || data.id || ('@I'+Date.now()+'@');
      const spouseName = parentNode?.sp?.dn || data.dn || 'Spouse';
      const existingSp = parentNode?.sp || {};
      // Compute diff
      const skipKeys = new Set(['id','ch','sp','gen','_fams','_famc','_p','_n','_matchType','_spouseOf','_isSpouse','_spouseOfId','_spouseOfName','_mt','_spOf','dn']);
      const changedFields = { _action: 'edit_spouse' };
      const prevFields = {};
      for (const [k, v] of Object.entries(data)) {
        if (skipKeys.has(k)) continue;
        const oldRaw = existingSp[k];
        const newRaw = v;
        const oldVal = (oldRaw === undefined || oldRaw === null || oldRaw === false || oldRaw === 0) ? '' : String(oldRaw).trim();
        const newVal = (newRaw === undefined || newRaw === null || newRaw === false || newRaw === 0) ? '' : String(newRaw).trim();
        if (oldVal !== newVal && (oldVal || newVal)) {
          changedFields[k] = v;
          prevFields[k] = oldRaw || '';
        }
      }
      setViewerSubmitData({ personId: spouseId, personName: spouseName + ' (spouse of ' + (parentNode?.dn||'') + ')', changes: {...changedFields, id: spouseId}, previous: prevFields, type: 'spouse' });
      setShowViewerIdentity(true);
      setSpouseEditing(null);
      return;
    }
    const spouseId=(spouseEditing.spouse&&spouseEditing.spouse.id)||data.id||('@I'+Date.now()+'@');
    const spouseData={...data, id:spouseId};
    setTree(prev=>updateNode(prev,parentId,(existing)=>({...existing,sp:{...(existing.sp||{}),...spouseData}})));
    // Keep personMap in sync
    setPersonMap(prev=>({...prev, [spouseId]: {...(prev[spouseId]||{}), ...spouseData}}));
    setSpouseEditing(null);
    saveSpouseToDB(parentId, spouseData, user?.name||user?.email||"").then(()=>{
      setMsg('Spouse saved to database!');
    }).catch(e=>{
      console.error('Spouse save error:', e, e?.message);
      setMsg('Spouse DB save failed: ' + (e?.message || 'unknown error'));
    });
    setTimeout(()=>setMsg(''),2000);
  };

  const handleDeleteSpouse=(parentId)=>{
    if (needsApproval(parentId)) {
      const parent = findNodeById(tree, parentId);
      setViewerSubmitData({ personId: parentId, personName: parent?.dn || parentId, changes: { _action: 'delete_spouse', spouse_name: parent?.sp?.dn }, type: 'delete_spouse' });
      setShowViewerIdentity(true);
      return;
    }
    const parent=findNodeById(tree,parentId);
    if(!parent?.sp){
      setMsg('No spouse to delete');
      setTimeout(()=>setMsg(''),2000);
      return;
    }
    const spouseId=parent.sp.id;
    if(!confirm(`Delete spouse ${parent.sp.dn||'record'}?`))return;
    setTree(prev=>updateNode(prev,parentId,(existing)=>({...existing,sp:null})));
    if(spouseEditing?.parentId===parentId)setSpouseEditing(null);
    // Delete from Supabase
    if(spouseId){
      deleteSpouseFromDB(parentId, spouseId, user?.name||user?.email||"").catch(e=>{
        console.error('Spouse delete error:',e);
      });
    }
    setMsg('Spouse deleted');
    setTimeout(()=>setMsg(''),2000);
  };

  const total=tree?cnt(tree):0;
  const btnS={background:CD,border:`1px solid ${BR}`,color:DM,padding:'6px 12px',borderRadius:5,fontSize:12,cursor:'pointer',whiteSpace:'nowrap'};
  const gateInp={width:'100%',background:'#1a1a14',border:'1px solid '+BR,color:TX,padding:'10px 14px',borderRadius:6,fontSize:15,outline:'none',fontFamily:'inherit',textAlign:'center',letterSpacing:1};

  // ─── PASSWORD RESET: Show if user clicked reset link from email ───
  if(showPasswordReset&&resetToken) return(
    <PasswordResetForm token={resetToken} onDone={()=>{setShowPasswordReset(false);setResetToken(null);setViewerGate(true);setShowLogin(true)}}/>
  );

  // ─── VIEWER GATE: Must enter family password to see anything ───
  if(viewerGate) return(
    <div style={{background:BG,minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',flexDirection:'column',gap:16}}>
      <style>{'@keyframes spin{to{transform:rotate(360deg)}}'}</style>
      <span style={{fontSize:36,color:GC,fontWeight:300,letterSpacing:2}}>Chennamkara</span>
      <span style={{fontSize:11,color:DM,letterSpacing:4,textTransform:'uppercase',marginBottom:8}}>Family Tree</span>
      <span style={{fontSize:9,color:'#3a3830',letterSpacing:1}}>{APP_VERSION}</span>
      <div style={{width:Math.min(340,window.innerWidth-48),textAlign:'center'}}>
        <div style={{fontSize:13,color:DM,marginBottom:16,lineHeight:1.6}}>Enter the family password to view the tree</div>
        <input type="password" value={gatePassword} onChange={e=>{setGatePassword(e.target.value);setGateError('')}}
          placeholder="Family password" style={gateInp}
          onKeyDown={e=>{if(e.key==='Enter')handleViewerGate()}}/>
        {gateError&&<div style={{fontSize:12,color:'#c05050',marginTop:8}}>{gateError}</div>}
        <button onClick={handleViewerGate} disabled={gateChecking}
          style={{width:'100%',marginTop:12,background:'rgba(196,163,90,0.15)',border:'1px solid '+GD,color:GC,padding:'10px',borderRadius:6,cursor:'pointer',fontSize:14}}>
          {gateChecking?'Checking...':'Enter'}
        </button>
        <div style={{marginTop:20,borderTop:'1px solid '+BR,paddingTop:16}}>
          <span style={{fontSize:12,color:DM}}>Have an account? </span>
          <span onClick={()=>{setShowLogin(true)}} style={{fontSize:12,color:GC,cursor:'pointer',textDecoration:'underline'}}>Sign in</span>
        </div>
      </div>
      {showLogin&&<LoginModal onSuccess={handleLoginSuccess} onCancel={()=>setShowLogin(false)} onRequestAccount={()=>{setShowLogin(false);setShowRequestAccount(true)}}/>}
      {showRequestAccount&&<RequestAccountModal flat={flat} onDone={()=>setShowRequestAccount(false)} onCancel={()=>setShowRequestAccount(false)}/>}
    </div>
  );

  if(loading) return(
    <div style={{background:BG,minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',flexDirection:'column',gap:16}}>
      <span style={{fontSize:28,color:GC,fontWeight:300,letterSpacing:1}}>Chennamkara</span>
      <span style={{fontSize:13,color:DM}}>Loading family tree...</span>
      <div style={{width:40,height:40,border:'2px solid '+BR,borderTopColor:GC,borderRadius:'50%',animation:'spin 1s linear infinite'}}/>
      <style>{'@keyframes spin{to{transform:rotate(360deg)}}'}</style>
    </div>
  );

  if(!tree) return(
    <div style={{background:BG,minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',flexDirection:'column',gap:16}}>
      <span style={{fontSize:28,color:GC,fontWeight:300}}>Chennamkara</span>
      <span style={{fontSize:13,color:'#a05050'}}>Could not load family tree.</span>
      <button onClick={()=>triggerImportGedcom((result,fileName)=>{setTree(result.tree||result);setPersonMap(result.personMap||{});setFamilyMap(result.familyMap||{});setMsg('Imported: '+fileName)})}
        style={{...btnS,background:'rgba(107,158,114,0.1)',borderColor:MC,color:MC,padding:'10px 20px'}}>⬆ Import GEDCOM File</button>
    </div>
  );

  return(
    <div style={{background:BG,minHeight:'100vh',color:TX,fontFamily:'system-ui,-apple-system,sans-serif'}}>
      <div style={{position:'sticky',top:0,zIndex:50,background:`linear-gradient(180deg,${BG} 80%,transparent)`,padding:'16px 16px 24px'}}>
        <div style={{maxWidth:1200,margin:'0 auto'}}>
          <div style={{display:'flex',alignItems:'baseline',gap:12,marginBottom:4}}>
            <span style={{fontSize:28,color:GC,fontWeight:300,letterSpacing:1,cursor:'pointer'}} onClick={()=>setActiveTab('tree')}>Chennamkara</span>
            <span style={{fontSize:11,color:DM,letterSpacing:3,textTransform:'uppercase'}}>Family Tree</span>
            {user&&isAdmin()&&<>
              <span onClick={()=>setActiveTab('tree')} style={{fontSize:12,color:activeTab==='tree'?GC:DM,cursor:'pointer',padding:'2px 8px',borderRadius:4,background:activeTab==='tree'?'rgba(196,163,90,0.1)':'transparent'}}>🌳 Tree</span>
              <span onClick={()=>setActiveTab('photos')} style={{fontSize:12,color:activeTab==='photos'?GC:DM,cursor:'pointer',padding:'2px 8px',borderRadius:4,background:activeTab==='photos'?'rgba(196,163,90,0.1)':'transparent'}}>📷 Photos</span>
              <span onClick={()=>setActiveTab('admin')} style={{fontSize:12,color:activeTab==='admin'?GC:DM,cursor:'pointer',padding:'2px 8px',borderRadius:4,background:activeTab==='admin'?'rgba(196,163,90,0.1)':'transparent'}}>👤 Admin</span>
            </>}
            {user&&!isAdmin()&&<>
              <span onClick={()=>setActiveTab('tree')} style={{fontSize:12,color:activeTab==='tree'?GC:DM,cursor:'pointer',padding:'2px 8px',borderRadius:4,background:activeTab==='tree'?'rgba(196,163,90,0.1)':'transparent'}}>🌳 Tree</span>
              <span onClick={()=>setActiveTab('photos')} style={{fontSize:12,color:activeTab==='photos'?GC:DM,cursor:'pointer',padding:'2px 8px',borderRadius:4,background:activeTab==='photos'?'rgba(196,163,90,0.1)':'transparent'}}>📷 Photos</span>
            </>}
            <span style={{flex:1}}/>
            {user?
              <span style={{display:'flex',alignItems:'center',gap:8,fontSize:12}}>
                <span style={{width:6,height:6,borderRadius:'50%',background:user.role==='viewer'?DM:MC}}/>
                <span style={{color:TX}}>{user.name||user.email||'Viewer'}</span>
                <span style={{fontSize:10,color:DM,textTransform:'uppercase'}}>{user.role==='viewer'?'viewing':user.role}</span>
                {user.role==='viewer'&&<span onClick={()=>setShowLogin(true)} style={{color:GC,cursor:'pointer',textDecoration:'underline',marginLeft:4}}>Sign in</span>}
                {user.role!=='viewer'&&<span onClick={handleSignOut} style={{color:DM,cursor:'pointer',textDecoration:'underline',marginLeft:4}}>Sign out</span>}
              </span>
            :
              <span onClick={()=>setShowLogin(true)} style={{fontSize:12,color:GC,cursor:'pointer',padding:'4px 12px',border:'1px solid '+GD,borderRadius:5}}>🔒 Sign In</span>
            }
            {msg&&<span style={{fontSize:12,color:'#6b9e72',marginLeft:8,animation:'fadeIn 0.3s'}}>{msg}</span>}
          </div>
          <div style={{display:'flex',gap:20,fontSize:12,color:DM,marginBottom:12,alignItems:'center'}}>
            <span><strong style={{color:GD}}>{total}</strong> people</span>
            <span style={{color:'rgba(196,163,90,0.3)'}}>·</span>
            <span style={{fontSize:10,color:'#5a5548',letterSpacing:1}}>{APP_VERSION}</span>
            <span onClick={()=>{setMsg('Refreshing...');reloadTree(false)}} title="Refresh tree data from database" style={{cursor:'pointer',fontSize:13,color:DM,padding:'2px 6px',borderRadius:4,background:'rgba(196,163,90,0.06)',border:'1px solid rgba(196,163,90,0.1)'}}>↻ Refresh</span>
          </div>
          <div style={{display:'flex',gap:8,flexWrap:'wrap',alignItems:'center'}}>
            <div style={{position:'relative',flex:1,minWidth:180,maxWidth:360}}>
              <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search by name..."
                style={{width:'100%',background:CD,border:`1px solid ${BR}`,color:TX,padding:'7px 12px',borderRadius:6,fontSize:13,outline:'none'}}/>
              {matches.length>0&&<div style={{position:'absolute',top:'100%',left:0,right:0,background:CD,border:`1px solid rgba(196,163,90,0.25)`,
                borderTop:'none',borderRadius:'0 0 6px 6px',maxHeight:280,overflowY:'auto',zIndex:60}}>
                {matches.map((m,mi)=><div key={m.id+'_'+mi} onClick={()=>navigateTo(m)}
                  style={{padding:'6px 12px',cursor:'pointer',fontSize:13,display:'flex',alignItems:'center',gap:6}}
                  onMouseEnter={e=>e.currentTarget.style.background='rgba(255,255,255,0.04)'}
                  onMouseLeave={e=>e.currentTarget.style.background='transparent'}>
                  <span style={{width:6,height:6,borderRadius:'50%',background:m.g==='M'?MC:FC}}/><span>{m._n}</span>
                  {m._matchType==='spouse'&&<span style={{fontSize:10,color:DM,fontStyle:'italic'}}>⚭ spouse of {m._spouseOf}</span>}
                </div>)}
              </div>}
            </div>
            {[['Expand All',expandAll],['Collapse',collapseAll],['2 Lvls',()=>expandTo(2)],['3 Lvls',()=>expandTo(3)]].map(([l,f])=>
              <button key={l} onClick={f} style={btnS}>{l}</button>)}
            <button onClick={()=>{downloadGedcom(tree,personMap,familyMap);setMsg('GEDCOM exported!')}} title="Download the family tree as a GEDCOM file" style={{...btnS,background:'rgba(196,163,90,0.1)',borderColor:GD,color:GC}}>⬇ Export GEDCOM</button>
            <button onClick={()=>triggerImportGedcom((result,fileName)=>{setTree(result.tree||result);setPersonMap(result.personMap||{});setFamilyMap(result.familyMap||{});setMsg('Imported: '+fileName);expandTo(2)})} title="Import a GEDCOM file to view (does not save to database)" style={{...btnS,background:'rgba(107,158,114,0.1)',borderColor:MC,color:MC}}>⬆ Import GEDCOM</button>
            {user&&isAdmin()&&<button onClick={()=>setShowMigrate(true)} title="Replace all database data with a GEDCOM file" style={{...btnS,background:'rgba(196,163,90,0.06)',borderColor:'rgba(196,163,90,0.3)',color:GD}}>🗄 Migrate GEDCOM→DB</button>}
            {user&&isAdmin()&&<button onClick={()=>setShowDiff(true)} title="Compare an external GEDCOM with FTLS and merge differences" style={{...btnS,background:'rgba(107,158,114,0.08)',borderColor:'rgba(107,158,114,0.4)',color:MC}}>🔀 Diff &amp; Merge</button>}
          </div>
        </div>
      </div>
      {activeTab==='tree'&&<>
      <div style={{maxWidth:1200,margin:'0 auto',padding:'0 16px 60px'}}>
        <TreeNode node={tree} exp={exp} onTog={toggle} onSel={(node)=>setSel(findNodeById(tree,node.id)||node)} onEdit={(node)=>requireAuth(()=>openEditForNode(node))} onAdd={(id)=>requireAuth(()=>setAdding(id))} onDel={(id)=>requireAuth(()=>handleDelete(id))} onEditSpouse={(node)=>requireAuth(()=>setSpouseEditing({parentId:node.id,spouse:{...(node.sp||{}),dn:(node.sp&&node.sp.dn)||''}}))} onDelSpouse={(id)=>requireAuth(()=>handleDeleteSpouse(id))} hl={hl}/>
      </div>
      {sel&&!editing&&<Detail node={findNodeById(tree,sel.id)||sel} root={tree} onClose={()=>setSel(null)} onEdit={(node)=>requireAuth(()=>openEditForNode(node))} onEditSpouse={(node)=>requireAuth(()=>setSpouseEditing({parentId:node.id,spouse:{...(node.sp||{}),dn:(node.sp&&node.sp.dn)||''}}))} onDelSpouse={(id)=>requireAuth(()=>handleDeleteSpouse(id))}/>}
      {editing&&<EditForm node={findNodeById(tree,editing.id)||editing} onSave={handleSaveEdit} onCancel={()=>setEditing(null)} isNew={false}/>}
      {spouseEditing&&<EditForm node={spouseEditing.spouse||empty()} onSave={handleSaveSpouse} onCancel={()=>setSpouseEditing(null)} isNew={false}/>}
      {adding&&<EditForm node={empty()} onSave={handleAdd} onCancel={()=>setAdding(null)} isNew={true} parentId={adding} parentName={flat.find(n=>n.id===adding)?._n}/>}
      </>}
      {activeTab==='admin'&&user&&isAdmin()&&<AdminPanel onReloadTree={()=>reloadTree(true)}/>}
      
      {/* ───── PHOTOS GALLERY TAB ───── */}
      {activeTab==='photos'&&user&&<PhotoGallery flat={flat} user={user}/>}
      {showLogin&&<LoginModal onSuccess={handleLoginSuccess} onCancel={()=>{setShowLogin(false);setPendingAction(null)}} onRequestAccount={()=>{setShowLogin(false);setShowRequestAccount(true)}}/>}
      {showRequestAccount&&<RequestAccountModal flat={flat} onDone={()=>setShowRequestAccount(false)} onCancel={()=>setShowRequestAccount(false)}/>}
      {showViewerIdentity&&viewerSubmitData&&<ViewerIdentityModal submitData={viewerSubmitData} flat={flat} onDone={()=>{setShowViewerIdentity(false);setViewerSubmitData(null);setMsg('Update request submitted!')}} onCancel={()=>{setShowViewerIdentity(false);setViewerSubmitData(null)}}/>}
      {showMigrate&&<MigrateDialog onDone={()=>setShowMigrate(false)} onCancel={()=>setShowMigrate(false)}/>}
      {showDiff&&<GedcomDiffModal onClose={()=>setShowDiff(false)} personMap={personMap} familyMap={familyMap} user={user} onMergeComplete={()=>{setShowDiff(false);setMsg('Merging complete — refreshing...');reloadTree(false)}}/>}
      {user&&user.role!=='viewer'&&<div style={{position:'fixed',bottom:16,right:16,background:CD,border:'1px solid '+BR,borderRadius:8,padding:'8px 14px',fontSize:11,color:DM,zIndex:80,display:'flex',alignItems:'center',gap:8}}>
        <span style={{width:6,height:6,borderRadius:'50%',background:MC}}/>
        <span>Signed in as <strong style={{color:TX}}>{user.name||user.email}</strong></span>
        <span style={{color:GD}}>·</span>
        <span>{isAdmin()?'Admin':'Editor'} — changes save to database</span>
      </div>}
    </div>
  );
}

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
