            style={{...inp,minHeight:60,resize:'vertical'}} rows={3}/>
        </div>
        {error&&<div style={{fontSize:12,color:'#c05050',marginBottom:12}}>{error}</div>}
        <div style={{display:'flex',gap:8,justifyContent:'flex-end'}}>
          <button onClick={onCancel} style={{background:'transparent',border:'1px solid rgba(196,163,90,0.12)',color:'#7a7568',padding:'8px 20px',borderRadius:6,cursor:'pointer',fontSize:13}}>Cancel</button>
          <button onClick={handleSubmit} disabled={busy} style={{background:'rgba(196,163,90,0.15)',border:'1px solid #8a7340',color:'#c4a35a',padding:'8px 20px',borderRadius:6,cursor:'pointer',fontSize:13}}>
            {busy?'Submitting...':'Submit for Review'}
          </button>
        </div>
      </div>
    </div>
  );
}

function AdminPanel({onClose, onReloadTree}) {
  const [tab, setTab] = useState('updates'); // 'updates' | 'accounts' | 'users' | 'log'
  const [updateReqs, setUpdateReqs] = useState([]);
  const [accessReqs, setAccessReqs] = useState([]);
  const [allUsers, setAllUsers] = useState([]);
  const [editLog, setEditLog] = useState([]);
  const [expandedLog, setExpandedLog] = useState(null); // id of expanded log entry
  const [loading, setLoading] = useState(true);
  const [actionMsg, setActionMsg] = useState('');
  const btnS2={background:'rgba(196,163,90,0.08)',border:'1px solid rgba(196,163,90,0.2)',color:'#c4a35a',padding:'6px 14px',borderRadius:5,fontSize:12,cursor:'pointer'};

  useEffect(()=>{
    (async()=>{
      try {
        const h = { 'Authorization': 'Bearer ' + authSession.access_token };
        const [ur, ar, us, el] = await Promise.all([
          sbFetch('update_requests?order=created_at.desc&limit=50', {headers:h}),
          sbFetch('access_requests?order=created_at.desc&limit=50', {headers:h}),
          sbFetch('users?order=name', {headers:h}),
          sbFetch('edit_log?order=created_at.desc&limit=50', {headers:h}),
        ]);
        setUpdateReqs(ur); setAccessReqs(ar); setAllUsers(us); setEditLog(el);
      } catch(e) { console.error('Admin load error:', e); }
      setLoading(false);
    })();
  },[]);

  // Field label mapping for human-readable display
  const fieldLabels = {
    fn:'First Name',mn:'Middle Name',ln:'Last Name',dn:'Display Name',nk:'Nickname',md:'Maiden Name',
    g:'Gender',dob:'Date of Birth',dod:'Date of Death',dec:'Deceased',bo:'Birth Order',
    em:'Email',ph:'Phone',a1:'Address 1',a2:'Address 2',ci:'City',st:'State',zp:'Zip',co:'Country',
    fb:'Facebook',ig:'Instagram',li:'LinkedIn',ws:'Website',pp:'Profile Photo',bio:'Bio',loc:'Location',
    prof:'Profession',emp:'Employer',stories:'Stories',notes:'Notes',pgl:'Photo Gallery',dl:'Documents',
    mdate:'Marriage Date',mplace:'Marriage Place',
    _action:'Action Type',_context:'Context/Explanation',
    first_name:'First Name',middle_name:'Middle Name',last_name:'Last Name',display_name:'Display Name',
    nickname:'Nickname',date_of_birth:'Date of Birth',date_of_death:'Date of Death',
    email:'Email',phone:'Phone',profession:'Profession',employer:'Employer',location:'Location',
    profile_photo:'Profile Photo',
  };
  const getLabel = (k) => fieldLabels[k] || k;

  const approveUpdate = async (req) => {
    try {
      const h = { 'Authorization': 'Bearer ' + authSession.access_token };
      const action = req.changes?._action || 'update';

      // Take snapshot before making changes (for undo)
      if (req.person_id && action !== 'add_child') {
        try {
          await sbFetch('rpc/snapshot_person', {
            method: 'POST', headers: h,
            body: JSON.stringify({ p_person_id: req.person_id, p_reason: 'before_approve_request_' + req.id })
          });
        } catch(e) { console.warn('Snapshot failed:', e); }
      }

      // Map short field names (from edit form) to database column names
      const fieldMap = {
        fn:'first_name', mn:'middle_name', ln:'last_name', dn:'display_name',
        nk:'nickname', md:'maiden_name', g:'gender', dob:'date_of_birth',
        dod:'date_of_death', dec:'is_deceased', bo:'birth_order',
        em:'email', ph:'phone', a1:'address1', a2:'address2',
        ci:'city', st:'state', zp:'zip', co:'country',
        fb:'facebook', ig:'instagram', li:'linkedin', ws:'website',
        pp:'profile_photo', loc:'location', prof:'profession', emp:'employer',
        pgl:'photo_gallery_link', dl:'documents_link',
        // These are already correct DB names — pass through
        first_name:'first_name', middle_name:'middle_name', last_name:'last_name',
        display_name:'display_name', nickname:'nickname', gender:'gender',
        date_of_birth:'date_of_birth', date_of_death:'date_of_death',
        email:'email', phone:'phone', profession:'profession', employer:'employer',
        location:'location', profile_photo:'profile_photo', bio:'bio',
        notes:'notes', stories:'stories',
        address1:'address1', address2:'address2', city:'city', state:'state',
        zip:'zip', country:'country', facebook:'facebook', instagram:'instagram',
        linkedin:'linkedin', website:'website',
      };

      // Convert changes to DB column names, stripping unknown/internal fields
      const skipFields = new Set(['_action','_context','_previous','id','ch','sp','fams','famc','_fams','_famc','_p','_n','_matchType','_spouseOf','gen','mdate','mplace','marriage_date','marriage_place','bo','birth_order']);
      const dbChanges = {};
      for (const [k, v] of Object.entries(req.changes)) {
        if (skipFields.has(k)) continue;
        const dbCol = fieldMap[k];
        if (dbCol) {
          dbChanges[dbCol] = (k === 'dec') ? !!v : (v || '');
        }
        // If key is already a valid DB column name and not in fieldMap, skip it
      }

      if (action === 'delete') {
        await sbFetch(`persons?id=eq.${req.person_id}`, { method: 'DELETE', headers: h });
      } else if (action === 'add_child') {
        const newId = req.changes.id || ('@I' + Date.now() + '@');
        dbChanges.id = newId;
        await sbFetch('persons', {
          method: 'POST', headers: {...h, 'Prefer':'return=minimal'},
          body: JSON.stringify(dbChanges)
        });
      } else {
        // Regular edit or edit_spouse — patch the person
        if (Object.keys(dbChanges).length > 0) {
          await sbFetch(`persons?id=eq.${req.person_id}`, {
            method: 'PATCH', headers: {...h, 'Prefer':'return=minimal'},
            body: JSON.stringify(dbChanges)
          });
        }
      }

      // Save marriage date/place to families table if present in changes
      const mdate = req.changes.mdate || req.changes.marriage_date;
      const mplace = req.changes.mplace || req.changes.marriage_place;
      if (mdate || mplace) {
        try {
          const fams = await sbFetch(`families?select=*&or=(husband_id.eq.${req.person_id},wife_id.eq.${req.person_id})`, {headers:h});
          if (fams.length > 0) {
            await sbFetch(`families?id=eq.${fams[0].id}`, {
              method: 'PATCH', headers: {...h, 'Prefer':'return=minimal'},
              body: JSON.stringify({ marriage_date: mdate||fams[0].marriage_date||'', marriage_place: mplace||fams[0].marriage_place||'' })
            });
          }
        } catch(e) { console.warn('Marriage approve save failed:', e); }
      }

      // Mark request as approved
      await sbFetch(`update_requests?id=eq.${req.id}`, {
        method: 'PATCH', headers: h,
        body: JSON.stringify({ status: 'approved', resolved_by: authUser.id, resolved_at: new Date().toISOString() })
      });
      setUpdateReqs(prev=>prev.map(r=>r.id===req.id?{...r,status:'approved'}:r));
      setActionMsg('Update approved and applied!');
      if (onReloadTree) onReloadTree();
      setTimeout(()=>setActionMsg(''),3000);
    } catch(e) { setActionMsg('Error: ' + e.message); }
  };

  const rejectUpdate = async (req, reason) => {
    try {
      const h = { 'Authorization': 'Bearer ' + authSession.access_token };
      await sbFetch(`update_requests?id=eq.${req.id}`, {
        method: 'PATCH', headers: h,
        body: JSON.stringify({ status: 'rejected', admin_response: reason||'', resolved_by: authUser.id, resolved_at: new Date().toISOString() })
      });
      setUpdateReqs(prev=>prev.map(r=>r.id===req.id?{...r,status:'rejected'}:r));
      setActionMsg('Request rejected');
      setTimeout(()=>setActionMsg(''),3000);
    } catch(e) { setActionMsg('Error: ' + e.message); }
  };

  const approveAccess = async (req) => {
    try {
      const h = { 'Authorization': 'Bearer ' + authSession.access_token };
      setActionMsg('Creating account for ' + req.name + '...');
      
      // Step 1: Create auth user + public.users row via signup
      await createUserAccount(req.email, req.name, req.person_id || null, 'editor');
      
      // Step 2: Send password reset email so user can set their own password
      let emailSent = false;
      try {
        await resetPassword(req.email);
        emailSent = true;
      } catch(e) { console.warn('Password reset email may not have sent:', e); }
      
      // Step 3: Mark request as approved
      await sbFetch(`access_requests?id=eq.${req.id}`, {
        method: 'PATCH', headers: h,
        body: JSON.stringify({ status: 'approved', resolved_by: authUser.id, resolved_at: new Date().toISOString() })
      });
      
      setAccessReqs(prev=>prev.map(r=>r.id===req.id?{...r,status:'approved'}:r));
      // Refresh users list
      const updatedUsers = await sbFetch('users?order=name', {headers:h});
      setAllUsers(updatedUsers);
      setActionMsg(emailSent 
        ? 'Account created for ' + req.name + '! Password reset email sent to ' + req.email 
        : 'Account created for ' + req.name + '! (Email may not have sent — verify Resend domain)');
      setTimeout(()=>setActionMsg(''),8000);
    } catch(e) { setActionMsg('Error: ' + e.message); }
  };

  const changeUserRole = async (userId, newRole) => {
    try {
      const h = { 'Authorization': 'Bearer ' + authSession.access_token };
      await sbFetch(`users?id=eq.${userId}`, {
        method: 'PATCH', headers: h,
        body: JSON.stringify({ role: newRole })
      });
      setAllUsers(prev=>prev.map(u=>u.id===userId?{...u,role:newRole}:u));
      setActionMsg('Role updated!');
      setTimeout(()=>setActionMsg(''),3000);
    } catch(e) { setActionMsg('Error: ' + e.message); }
  };

  const statusBadge = (s) => {
    const colors = {pending:'#c4a35a',approved:'#6b9e72',rejected:'#c05050',clarification:'#9b82c4'};
    return <span style={{fontSize:10,background:colors[s]+'22',color:colors[s],padding:'2px 8px',borderRadius:10,textTransform:'uppercase',letterSpacing:1}}>{s}</span>;
  };

  const tabBtn = (id,label,count) => (
    <button key={id} onClick={()=>switchTab(id)} style={{
      background:tab===id?'rgba(196,163,90,0.12)':'transparent',
      border:tab===id?'1px solid #8a7340':'1px solid transparent',
      color:tab===id?'#c4a35a':'#7a7568',padding:'6px 14px',borderRadius:5,fontSize:12,cursor:'pointer'
    }}>{label}{count>0&&<span style={{marginLeft:4,fontSize:10,background:'#c4a35a22',color:'#c4a35a',padding:'1px 6px',borderRadius:8}}>{count}</span>}</button>
  );

  const pendingUpdates = updateReqs.filter(r=>r.status==='pending').length;
  const approvedUpdates = updateReqs.filter(r=>r.status==='approved').length;
  const rejectedUpdates = updateReqs.filter(r=>r.status==='rejected').length;
  const pendingAccess = accessReqs.filter(r=>r.status==='pending').length;
  const [statusFilter, setStatusFilter] = useState('pending');

  const switchTab = (t) => { setTab(t); setActionMsg(''); setStatusFilter('pending'); };

  return(
    <div style={{maxWidth:1200,margin:'0 auto',padding:'0 16px 60px'}}>
      <div style={{display:'flex',gap:8,marginBottom:16,flexWrap:'wrap',alignItems:'center'}}>
        {tabBtn('updates','Update Requests',pendingUpdates)}
        {tabBtn('accounts','Account Requests',pendingAccess)}
        {isSuperAdmin()&&tabBtn('users','Manage Users',0)}
        {tabBtn('log','Edit Log',0)}
        {actionMsg&&<span style={{fontSize:12,color:actionMsg.startsWith('Error')?'#c05050':'#6b9e72',marginLeft:16}}>{actionMsg}</span>}
      </div>

      {loading&&<div style={{color:'#7a7568',fontSize:13}}>Loading...</div>}

      {!loading&&tab==='updates'&&<div>
        <div style={{display:'flex',gap:6,marginBottom:12}}>
          {[['pending','Pending',pendingUpdates],['approved','Approved',approvedUpdates],['rejected','Rejected',rejectedUpdates]].map(([s,l,c])=>
            <button key={s} onClick={()=>setStatusFilter(s)} style={{
              background:statusFilter===s?'rgba(196,163,90,0.1)':'transparent',
              border:statusFilter===s?'1px solid rgba(196,163,90,0.3)':'1px solid transparent',
              color:statusFilter===s?'#c4a35a':'#7a7568',padding:'4px 12px',borderRadius:4,fontSize:11,cursor:'pointer',textTransform:'uppercase',letterSpacing:1
            }}>{l}{c>0&&<span style={{marginLeft:4,fontSize:10,opacity:0.7}}>({c})</span>}</button>
          )}
        </div>
        {updateReqs.filter(r=>r.status===statusFilter).length===0&&<div style={{color:'#7a7568',fontSize:13}}>No {statusFilter} requests.</div>}
        {updateReqs.filter(r=>r.status===statusFilter).map(r=><div key={r.id} style={{background:'#141410',border:'1px solid rgba(196,163,90,0.08)',borderRadius:8,padding:16,marginBottom:8}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>
            <div>
              <span style={{color:'#d4cfc0',fontSize:14,fontWeight:500}}>{r.person_name||r.person_id}</span>
              <span style={{color:'#7a7568',fontSize:12,marginLeft:8}}>by {r.requester_name} ({r.requester_email})</span>
            </div>
            {statusBadge(r.status)}
          </div>
          <div style={{fontSize:12,color:'#7a7568',marginBottom:8}}>{new Date(r.created_at).toLocaleString()}</div>
          {r.changes?._action&&<div style={{marginBottom:8}}>
            <span style={{fontSize:11,padding:'3px 10px',borderRadius:10,letterSpacing:1,textTransform:'uppercase',
              background:r.changes._action==='delete'?'rgba(192,80,80,0.15)':r.changes._action==='add_child'?'rgba(107,158,114,0.15)':'rgba(196,163,90,0.15)',
              color:r.changes._action==='delete'?'#c05050':r.changes._action==='add_child'?'#6b9e72':'#c4a35a',
            }}>{r.changes._action==='edit_spouse'?'Edit Spouse':r.changes._action==='add_child'?'Add Child':r.changes._action==='delete'?'Delete Person':'Edit Person'}</span>
          </div>}
          {r.changes?._context&&<div style={{fontSize:12,color:'#d4cfc0',background:'rgba(155,130,196,0.08)',border:'1px solid rgba(155,130,196,0.15)',padding:'6px 10px',borderRadius:4,marginBottom:8,fontStyle:'italic'}}>
            "{r.changes._context}"
          </div>}
          {r.changes&&(()=>{
            const prev = r.changes._previous || {};
            const skipDisplay = new Set(['_action','_context','_previous','id','ch','sp','fams','famc','_fams','_famc','_p','_n','_matchType','_spouseOf','gen']);
            const entries = Object.entries(r.changes).filter(([k])=>!skipDisplay.has(k));
            // Filter to only changed fields (where new !== old, ignoring both-empty)
            const diffs = entries.filter(([k,v])=>{
              const oldVal = String(prev[k]||'').trim();
              const newVal = String(v||'').trim();
              // Skip if both empty or unchanged
              if (!oldVal && !newVal) return false;
              if (oldVal === newVal) return false;
              return true;
            });
            return diffs.length > 0 ? (
              <div style={{fontSize:12,background:'#0a0a08',padding:10,borderRadius:4,marginBottom:8,maxHeight:200,overflowY:'auto'}}>
                {diffs.map(([k,v])=>{
                  const oldVal = prev[k];
                  const newVal = v;
                  const hasOld = oldVal && String(oldVal).trim();
                  return(
                    <div key={k} style={{padding:'3px 0',borderBottom:'1px solid rgba(196,163,90,0.05)'}}>
                      <strong style={{color:'#8a7340'}}>{getLabel(k)}:</strong>{' '}
                      {hasOld&&<><span style={{color:'#c05050',textDecoration:'line-through',opacity:0.7}}>{String(oldVal)}</span><span style={{color:'#7a7568'}}> → </span></>}
                      <span style={{color:'#6b9e72'}}>{String(newVal)}</span>
                      {!hasOld&&<span style={{color:'#7a7568',fontSize:10,marginLeft:4}}>(new)</span>}
                    </div>
                  );
                })}
              </div>
            ) : (
              <div style={{fontSize:12,color:'#7a7568',marginBottom:8,fontStyle:'italic'}}>No field changes detected</div>
            );
          })()}
          {r.status==='rejected'&&r.admin_response&&<div style={{fontSize:12,color:'#c05050',background:'rgba(192,80,80,0.08)',padding:'6px 10px',borderRadius:4,marginBottom:8}}>
            <strong>Rejection reason:</strong> {r.admin_response}
          </div>}
          {r.resolved_at&&<div style={{fontSize:11,color:'#7a7568',marginBottom:8}}>
            {r.status==='approved'?'Approved':'Rejected'} on {new Date(r.resolved_at).toLocaleString()}
          </div>}
          {r.status==='pending'&&<div style={{display:'flex',gap:8}}>
            <button onClick={()=>approveUpdate(r)} style={{...btnS2,borderColor:'#6b9e72',color:'#6b9e72'}}>✓ Approve</button>
            <button onClick={()=>{const reason=prompt('Reason for rejection (optional):');if(reason!==null)rejectUpdate(r,reason)}} style={{...btnS2,borderColor:'#c05050',color:'#c05050'}}>✕ Reject</button>
            <a href={`mailto:${r.requester_email}?subject=About your family tree update request&body=Hi ${r.requester_name},%0A%0ARegarding your update request for ${r.person_name}:%0A%0A`}
              style={{...btnS2,borderColor:'#9b82c4',color:'#9b82c4',textDecoration:'none'}}>✉ Reply</a>
          </div>}
        </div>)}
      </div>}

      {!loading&&tab==='accounts'&&<div>
        {accessReqs.length===0&&<div style={{color:'#7a7568',fontSize:13}}>No account requests yet.</div>}
        {accessReqs.map(r=><div key={r.id} style={{background:'#141410',border:'1px solid rgba(196,163,90,0.08)',borderRadius:8,padding:16,marginBottom:8}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>
            <div>
              <span style={{color:'#d4cfc0',fontSize:14,fontWeight:500}}>{r.name}</span>
              <span style={{color:'#7a7568',fontSize:12,marginLeft:8}}>claims to be {r.person_name}</span>
            </div>
            {statusBadge(r.status)}
          </div>
          <div style={{fontSize:12,color:'#7a7568'}}>Email: {r.email}{r.phone&&' · Phone: '+r.phone} · {new Date(r.created_at).toLocaleString()}</div>
          {r.status==='pending'&&<div style={{display:'flex',gap:8,marginTop:8}}>
            <button onClick={()=>approveAccess(r)} style={{...btnS2,borderColor:'#6b9e72',color:'#6b9e72'}}>✓ Approve</button>
            <button onClick={()=>{
              sbFetch(`access_requests?id=eq.${r.id}`, {
                method:'PATCH', headers:{'Authorization':'Bearer '+authSession.access_token},
                body:JSON.stringify({status:'rejected',resolved_by:authUser.id,resolved_at:new Date().toISOString()})
              }).then(()=>setAccessReqs(prev=>prev.map(x=>x.id===r.id?{...x,status:'rejected'}:x)));
            }} style={{...btnS2,borderColor:'#c05050',color:'#c05050'}}>✕ Reject</button>
          </div>}
        </div>)}
      </div>}

      {!loading&&tab==='users'&&isSuperAdmin()&&<div>
        {allUsers.map(u=><div key={u.id} style={{background:'#141410',border:'1px solid rgba(196,163,90,0.08)',borderRadius:8,padding:12,marginBottom:6,display:'flex',alignItems:'center',gap:12}}>
          <span style={{color:'#d4cfc0',fontSize:14,flex:1}}>{u.name||u.email}</span>
          <span style={{fontSize:11,color:'#7a7568'}}>{u.email}</span>
          {u.role==='super_admin'?
            <span style={{fontSize:11,color:'#c4a35a',padding:'3px 10px',background:'rgba(196,163,90,0.1)',borderRadius:10}}>Super Admin</span>
          :
            <select value={u.role} onChange={e=>changeUserRole(u.id,e.target.value)}
              style={{background:'#0a0a08',border:'1px solid rgba(196,163,90,0.2)',color:'#d4cfc0',padding:'4px 8px',borderRadius:4,fontSize:12}}>
              <option value="editor">Editor</option>
              <option value="admin">Admin</option>
            </select>
          }
        </div>)}
      </div>}

      {!loading&&tab==='log'&&<div>
        {editLog.length===0&&<div style={{color:'#7a7568',fontSize:13}}>No edits logged yet.</div>}
        {editLog.map(e=>{
          const isSnapshot = e.action === 'snapshot';
          const isRevert = e.action === 'revert';
          const isUpdate = e.action === 'update';
          const personName = e.changes?.person?.display_name || e.person_id || '—';
          const reason = e.changes?.reason || '';
          const isOpen = expandedLog === e.id;
          const canRevert = isSnapshot && isAdmin(); // admin + super_admin can revert

          return(<div key={e.id} style={{background:isOpen?'rgba(196,163,90,0.03)':'transparent',borderRadius:6,marginBottom:4}}>
            <div onClick={()=>setExpandedLog(isOpen?null:e.id)} style={{fontSize:12,color:'#7a7568',padding:'8px 10px',cursor:'pointer',display:'flex',alignItems:'center',gap:8,
              borderBottom:isOpen?'none':'1px solid rgba(196,163,90,0.05)'}}>
              <span style={{width:8,height:8,borderRadius:'50%',flexShrink:0,
                background:isSnapshot?'#9b82c4':isRevert?'#c4a35a':e.action==='delete'?'#c05050':'#6b9e72'}}/>
              <div style={{flex:1}}>
                <span style={{color:isSnapshot?'#9b82c4':isRevert?'#c4a35a':'#8a7340',fontWeight:500}}>
                  {isSnapshot?'📸 Snapshot':isRevert?'↩ Reverted':isUpdate?'✎ Updated':e.action}
                </span>
                {' '}<span style={{color:'#d4cfc0'}}>{isSnapshot?personName:e.person_id||'—'}</span>
                {e.edited_by&&e.edited_by!=='system'&&<span> by {e.edited_by}</span>}
                {reason&&<span style={{fontStyle:'italic'}}> ({reason})</span>}
              </div>
              <span style={{fontSize:11,color:'#5a5548',flexShrink:0}}>{new Date(e.created_at).toLocaleString()}</span>
              <span style={{color:'#5a5548',fontSize:10,flexShrink:0}}>{isOpen?'▼':'▶'}</span>
            </div>

            {isOpen&&<div style={{padding:'8px 10px 12px 28px',borderBottom:'1px solid rgba(196,163,90,0.05)'}}>
              {isSnapshot&&e.changes?.person&&<div style={{fontSize:11,color:'#d4cfc0',background:'#0a0a08',padding:10,borderRadius:4,marginBottom:8,maxHeight:200,overflowY:'auto'}}>
                <div style={{color:'#8a7340',fontWeight:500,marginBottom:6}}>Saved State:</div>
                {Object.entries(e.changes.person).filter(([k,v])=>v&&k!=='id'&&!k.startsWith('created')&&!k.startsWith('updated')).map(([k,v])=>
                  <div key={k}><span style={{color:'#7a7568'}}>{k}:</span> {String(v)}</div>
                )}
                {e.changes.families&&<div style={{marginTop:8}}>
                  <div style={{color:'#8a7340',fontWeight:500,marginBottom:4}}>Family Data:</div>
                  {(Array.isArray(e.changes.families)?e.changes.families:[]).map((f,i)=>
                    <div key={i}>{f.marriage_date&&<span>Marriage: {f.marriage_date} </span>}{f.marriage_place&&<span>at {f.marriage_place}</span>}</div>
                  )}
                </div>}
              </div>}

              {isUpdate&&e.changes&&<div style={{fontSize:11,color:'#d4cfc0',background:'#0a0a08',padding:10,borderRadius:4,marginBottom:8,maxHeight:200,overflowY:'auto'}}>
                {e.changes.person_name&&<div style={{color:'#c4a35a',fontWeight:500,marginBottom:6}}>{e.changes.person_name}</div>}
                {e.changes.changed_fields?
                  <div>
                    <div style={{color:'#8a7340',fontWeight:500,marginBottom:4}}>Changes:</div>
                    {Object.entries(e.changes.changed_fields).filter(([k])=>k!=='id'&&!k.startsWith('updated')).map(([k,v])=>{
                      const prevVal = e.changes.previous_values?.[k];
                      return <div key={k} style={{padding:'2px 0'}}>
                        <span style={{color:'#7a7568'}}>{k.replace(/_/g,' ')}:</span>{' '}
                        {prevVal ? <><span style={{color:'#a05050',textDecoration:'line-through'}}>{String(prevVal).substring(0,60)}</span> → </> : ''}
                        <span style={{color:'#6b9e72'}}>{String(v).substring(0,80)}</span>
                      </div>;
                    })}
                  </div>
                :
                  <div>
                    <div style={{color:'#8a7340',fontWeight:500,marginBottom:6}}>Changes Applied:</div>
                    {Object.entries(e.changes).filter(([k,v])=>v&&k!=='id'&&!k.startsWith('updated')&&k!=='person_name').map(([k,v])=>
                      <div key={k}><span style={{color:'#7a7568'}}>{k}:</span> {String(v).substring(0,80)}</div>
                    )}
                  </div>
                }
              </div>}

              {isRevert&&<div style={{fontSize:11,color:'#c4a35a',fontStyle:'italic'}}>
                Reverted from snapshot #{e.changes?.reverted_from_snapshot}
              </div>}

              {!isSnapshot&&!isUpdate&&!isRevert&&e.changes&&<div style={{fontSize:11,color:'#d4cfc0',background:'#0a0a08',padding:10,borderRadius:4,marginBottom:8,maxHeight:150,overflowY:'auto'}}>
                <pre style={{margin:0,whiteSpace:'pre-wrap',wordBreak:'break-all',fontFamily:'inherit'}}>{JSON.stringify(e.changes,null,2).substring(0,500)}</pre>
              </div>}

              {canRevert&&<button onClick={async(ev)=>{
                ev.stopPropagation();
                if(!confirm('Revert '+personName+' to this snapshot? This will undo all changes made after this point.'))return;
                try{
                  const h={'Authorization':'Bearer '+authSession.access_token};
                  await sbFetch('rpc/revert_to_snapshot',{method:'POST',headers:h,body:JSON.stringify({p_log_id:e.id})});
                  setActionMsg('Reverted '+personName+' to snapshot!');
                  if(onReloadTree)onReloadTree();
                  const newLog=await sbFetch('edit_log?order=created_at.desc&limit=50',{headers:h});
                  setEditLog(newLog);
                  setExpandedLog(null);
                  setTimeout(()=>setActionMsg(''),3000);
                }catch(err){setActionMsg('Revert error: '+err.message)}
              }} style={{background:'rgba(155,130,196,0.1)',border:'1px solid rgba(155,130,196,0.3)',color:'#9b82c4',padding:'4px 14px',borderRadius:4,cursor:'pointer',fontSize:11,marginTop:4}}>
                ↩ Revert to this snapshot
              </button>}
            </div>}
          </div>);
        })}
      </div>}
    </div>
  );
}

const empty=()=>({id:'@I'+Date.now()+'@',fn:'',mn:'',ln:'',dn:'',nk:'',md:'',g:'M',dob:'',dod:'',dec:false,bo:0,
  em:'',ph:'',a1:'',a2:'',ci:'',st:'',zp:'',co:'',fb:'',ig:'',li:'',ws:'',pp:'',bio:'',loc:'',prof:'',emp:'',

/* ───── FORM ───── */
function EditForm({node,onSave,onCancel,isNew,parentId,parentName}){
  const [f,setF]=useState(()=>({...empty(),...node}));
  const [uploading,setUploading]=useState(false);
  const set=(k,v)=>setF(p=>({...p,[k]:v}));
  const inp={width:'100%',background:'#1a1a14',border:`1px solid ${BR}`,color:TX,padding:'6px 10px',
    borderRadius:5,fontSize:13,outline:'none',fontFamily:'inherit'};
  
  const handlePhotoUpload = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    setUploading(true);
    try {
      const result = await uploadToCloudinary(file, 'profiles');
      set('pp', result.url);
    } catch(err) {
      alert('Photo upload failed: ' + err.message);
    }
    setUploading(false);
  };
  
  const photoUrl = f.pp;
  const thumbUrl = photoUrl ? cldImg(photoUrl, 'c_fill,w_120,h_120,g_face') : null;
  
  return(
    <div style={{position:'fixed',inset:0,zIndex:200,display:'flex',alignItems:'center',justifyContent:'center'}}>
      <div onClick={onCancel} style={{position:'absolute',inset:0,background:'rgba(0,0,0,0.6)'}}/>
      <div style={{position:'relative',background:CD,border:`1px solid ${BR}`,borderRadius:12,width:Math.min(520,window.innerWidth-32),
        maxHeight:'90vh',overflowY:'auto',padding:24,zIndex:201}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>
          <span style={{fontSize:20,color:GC,fontWeight:300}}>{isNew?'Add New Member':'Edit Member'}</span>
          <button onClick={onCancel} style={{background:'none',border:'none',color:DM,fontSize:18,cursor:'pointer'}}>✕</button>
        </div>
        {isNew&&parentId&&<div style={{fontSize:12,color:DM,marginBottom:12}}>Adding as child of: {parentName||parentId}</div>}
        
        {/* Profile Photo Upload */}
        <div style={{display:'flex',alignItems:'center',gap:16,marginBottom:20,padding:12,background:'rgba(196,163,90,0.03)',borderRadius:8,border:`1px solid ${BR}`}}>
          <div style={{width:80,height:80,borderRadius:'50%',overflow:'hidden',background:'#1a1a14',border:`2px solid ${BR}`,flexShrink:0,display:'flex',alignItems:'center',justifyContent:'center'}}>
            {thumbUrl ?
              <img src={thumbUrl} style={{width:'100%',height:'100%',objectFit:'cover'}} alt="Profile"/>
              : <span style={{fontSize:32,color:'#3a3a30'}}>{f.g==='F'?'👩':'👨'}</span>
            }
          </div>
          <div>
            <div style={{fontSize:12,color:DM,marginBottom:6}}>Profile Photo</div>
            <label style={{display:'inline-block',background:'rgba(196,163,90,0.12)',border:`1px solid ${GD}`,color:GC,padding:'5px 14px',borderRadius:5,cursor:'pointer',fontSize:12}}>
              {uploading ? 'Uploading...' : (photoUrl ? '📷 Change Photo' : '📷 Upload Photo')}
              <input type="file" accept="image/*" onChange={handlePhotoUpload} style={{display:'none'}} disabled={uploading}/>
            </label>
            {photoUrl && <span onClick={()=>set('pp','')} style={{marginLeft:8,color:'#a05050',cursor:'pointer',fontSize:11}}>✕ Remove</span>}
          </div>
        </div>
        
        {SECTIONS.map(sec=>(
          <div key={sec.title} style={{marginBottom:16}}>
            <div style={{fontSize:11,color:GD,textTransform:'uppercase',letterSpacing:2,marginBottom:8,borderBottom:`1px solid ${BR}`,paddingBottom:4}}>{sec.title}</div>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>
              {sec.fields.map(fd=>(
                <div key={fd.k} style={{gridColumn:fd.type==='textarea'?'1/-1':undefined}}>
                  <label style={{fontSize:11,color:DM,display:'block',marginBottom:2}}>{fd.l}</label>
                  {fd.type==='select'?(
                    <select value={f[fd.k]||''} onChange={e=>set(fd.k,e.target.value)} style={inp}>
                      {fd.opts.map(o=><option key={o} value={o}>{o==='M'?'Male':'Female'}</option>)}
                    </select>
                  ):fd.type==='checkbox'?(
                    <input type="checkbox" checked={!!f[fd.k]} onChange={e=>set(fd.k,e.target.checked)}/>
                  ):fd.type==='textarea'?(
                    <textarea value={f[fd.k]||''} onChange={e=>set(fd.k,e.target.value)} rows={3} style={{...inp,resize:'vertical'}}/>
                  ):fd.type==='number'?(
                    <input type="number" value={f[fd.k]||0} onChange={e=>set(fd.k,parseInt(e.target.value)||0)} style={inp}/>
                  ):(
                    <input value={f[fd.k]||''} onChange={e=>set(fd.k,e.target.value)} style={inp}/>
                  )}
                </div>
              ))}
            </div>
          </div>
        ))}
        <div style={{display:'flex',gap:8,justifyContent:'flex-end',marginTop:16}}>
          <button onClick={onCancel} style={{background:'transparent',border:`1px solid ${BR}`,color:DM,padding:'8px 20px',borderRadius:6,cursor:'pointer',fontSize:13}}>Cancel</button>
          <button onClick={()=>{const dn=f.dn||(f.fn+(f.mn?' '+f.mn:'')+(f.ln?' '+f.ln:'')).trim()||'(Unknown)';onSave({...f,dn})}}
            style={{background:'rgba(196,163,90,0.15)',border:`1px solid ${GD}`,color:GC,padding:'8px 20px',borderRadius:6,cursor:'pointer',fontSize:13}}>
            {isNew?'Add Member':'Save Changes'}
          </button>
        </div>
      </div>
    </div>
  );
}

/* ───── TREE NODE ───── */
function TreeNode({node,exp,onTog,onSel,onEdit,onAdd,onDel,onEditSpouse,onDelSpouse,hl}){
  const has=node.ch&&node.ch.length>0;
  const open=exp.has(node.id);
  const isHL=hl===node.id;
  return(
    <div>
      <div style={{display:'flex',alignItems:'center',gap:6,padding:'6px 8px',borderRadius:6,
        background:isHL?'rgba(196,163,90,0.15)':'transparent',transition:'background 0.15s'}}
        onMouseEnter={e=>{if(!isHL)e.currentTarget.style.background='rgba(255,255,255,0.03)'}}
        onMouseLeave={e=>{if(!isHL)e.currentTarget.style.background='transparent'}}>
        <span onClick={()=>has&&onTog(node.id)} title={has?(open?'Collapse children':'Expand children'):''} style={{width:16,height:16,display:'flex',alignItems:'center',justifyContent:'center',
          fontSize:10,color:DM,transform:open?'rotate(90deg)':'none',transition:'transform 0.2s',
          opacity:has?1:0.2,cursor:has?'pointer':'default',background:has?'rgba(196,163,90,0.06)':'none',borderRadius:3,flexShrink:0}}>
          {has?'▶':'·'}
        </span>
        <span title={node.g==='M'?'Male':'Female'} style={{width:7,height:7,borderRadius:'50%',background:node.g==='M'?MC:FC,flexShrink:0}}/>
        {node.pp ? 
          <img src={cldImg(node.pp,'c_fill,w_24,h_24,g_face,r_max')} style={{width:24,height:24,borderRadius:'50%',objectFit:'cover',flexShrink:0}} alt=""/>
          : null}
        <span onClick={()=>onSel(node)} title="View details" style={{fontSize:14,color:node.dec?'#6b6560':'#f0ebe0',cursor:'pointer',
          whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{node.dn}</span>
        {node.nk&&node.nk!==node.dn&&<span style={{fontSize:11,color:DM,fontStyle:'italic'}}>"{node.nk}"</span>}
        {node.sp?.dn&&<span style={{fontSize:12,color:DM,display:'inline-flex',alignItems:'center',gap:4}}>
          <span style={{color:GD,fontSize:11}}>⚭</span> <span style={{opacity:0.7}}>{node.sp.dn}</span>
          <span style={{display:'inline-flex',gap:1,opacity:0.65}}
            onMouseEnter={e=>e.currentTarget.style.opacity='1'} onMouseLeave={e=>e.currentTarget.style.opacity='0.65'}>
            <button onClick={e=>{e.stopPropagation();onEditSpouse(node)}} title="Edit spouse details" style={{background:'none',border:'none',color:GD,cursor:'pointer',fontSize:11,padding:'1px 3px'}}>✎</button>
            <button onClick={e=>{e.stopPropagation();onDelSpouse(node.id)}} title="Remove spouse from this person" style={{background:'none',border:'none',color:'#a05050',cursor:'pointer',fontSize:11,padding:'1px 3px'}}>✕</button>
          </span>
        </span>}
        {node.dob&&<span style={{fontSize:11,color:DM,marginLeft:'auto',opacity:0.6}}>b.{node.dob}</span>}
        {has&&<span title={node.ch.length+' children'} style={{fontSize:10,color:GD,background:'rgba(196,163,90,0.08)',padding:'1px 6px',borderRadius:8,flexShrink:0}}>{node.ch.length}</span>}
        <span style={{display:'flex',gap:2,marginLeft:has?0:'auto',opacity:0.4,transition:'opacity 0.2s'}}
          onMouseEnter={e=>e.currentTarget.style.opacity='1'} onMouseLeave={e=>e.currentTarget.style.opacity='0.4'}>
          <button onClick={e=>{e.stopPropagation();onEdit(node)}} title="Edit this person's details" style={{background:'none',border:'none',color:GD,cursor:'pointer',fontSize:12,padding:'2px 4px'}}>✎</button>
          <button onClick={e=>{e.stopPropagation();onAdd(node.id)}} title="Add a child under this person" style={{background:'none',border:'none',color:MC,cursor:'pointer',fontSize:12,padding:'2px 4px'}}>+</button>
          {!node.sp?.dn&&<button onClick={e=>{e.stopPropagation();onEditSpouse(node)}} title="Add a spouse to this person" style={{background:'none',border:'none',color:FC,cursor:'pointer',fontSize:12,padding:'2px 4px'}}>⚭</button>}
          {!has&&<button onClick={e=>{e.stopPropagation();onDel(node.id)}} title="Delete this person (only if no children)" style={{background:'none',border:'none',color:'#a05050',cursor:'pointer',fontSize:12,padding:'2px 4px'}}>✕</button>}
        </span>
      </div>
      {has&&open&&<div style={{paddingLeft:20,marginLeft:18,borderLeft:`1px solid ${BR}`}}>
        {node.ch.map(c=><TreeNode key={c.id} node={c} exp={exp} onTog={onTog} onSel={onSel} onEdit={onEdit} onAdd={onAdd} onDel={onDel} onEditSpouse={onEditSpouse} onDelSpouse={onDelSpouse} hl={hl}/>)}
      </div>}
    </div>
  );
}

/* ───── DETAIL ───── */
function Detail({node,onClose,onEdit,onEditSpouse,onDelSpouse,root}){
  const [personMedia,setPersonMedia]=useState([]);
  const [mediaLoaded,setMediaLoaded]=useState(false);
  const [lightbox,setLightbox]=useState(null);
  
  useEffect(()=>{
    if(node?.id){
      setMediaLoaded(false);
      loadMedia(node.id).then(m=>{setPersonMedia(m||[]);setMediaLoaded(true)}).catch(()=>setMediaLoaded(true));
    }
  },[node?.id]);

  if(!node)return null;

  const R=({l,v})=>v?<div style={{display:'flex',justifyContent:'space-between',padding:'3px 0',fontSize:13}}><span style={{color:DM}}>{l}</span><span style={{color:TX}}>{v}</span></div>:null;
  const lineage=(findPath(root,node.id)||[]).map(n=>n.dn);
  const profileUrl = node.pp ? cldImg(node.pp,'c_fill,w_120,h_120,g_face') : null;
  const spProfileUrl = node.sp?.pp ? cldImg(node.sp.pp,'c_fill,w_40,h_40,g_face') : null;
  
  return(<>
    <div onClick={onClose} style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.5)',zIndex:90}}/>
    <div style={{position:'fixed',right:0,top:0,width:Math.min(380,window.innerWidth),height:'100vh',background:CD,borderLeft:`1px solid ${BR}`,zIndex:100,overflowY:'auto',padding:24}}>
      <div style={{display:'flex',justifyContent:'space-between'}}>
        <div/>
        <div style={{display:'flex',gap:8}}>
          <button onClick={()=>onEdit(node)} style={{background:'none',border:`1px solid ${BR}`,color:GD,padding:'4px 12px',borderRadius:5,cursor:'pointer',fontSize:12}}>Edit</button>
          <button onClick={onClose} style={{background:'none',border:'none',color:DM,fontSize:18,cursor:'pointer'}}>✕</button>
        </div>
      </div>
      
      {/* Profile photo + name header */}
      <div style={{display:'flex',alignItems:'center',gap:16,marginTop:8,marginBottom:16}}>
        {profileUrl ? 
          <img src={profileUrl} style={{width:80,height:80,borderRadius:'50%',objectFit:'cover',border:`2px solid ${BR}`}} alt={node.dn}/>
          : <div style={{width:80,height:80,borderRadius:'50%',background:'#1a1a14',border:`2px solid ${BR}`,display:'flex',alignItems:'center',justifyContent:'center'}}>
              <span style={{fontSize:36,color:'#3a3a30'}}>{node.g==='F'?'👩':'👨'}</span>
            </div>
        }
        <div>
          <div style={{fontSize:11,color:DM,textTransform:'uppercase',letterSpacing:2}}>{node.g==='M'?'Male':'Female'}{node.dec?' · Deceased':''}</div>
          <div style={{fontSize:22,color:GC,fontWeight:300}}>{node.dn}</div>
          {node.nk&&<div style={{fontSize:13,color:DM,fontStyle:'italic'}}>"{node.nk}"</div>}
        </div>
      </div>
      
      <R l="Born" v={node.dob}/><R l="Birthplace" v={node.loc}/><R l="Died" v={node.dod}/><R l="Married" v={node.mdate}/>
      <R l="Profession" v={node.prof}/><R l="Employer" v={node.emp}/><R l="Email" v={node.em}/><R l="Phone" v={node.ph}/>
      {node.bio&&<div style={{marginTop:12}}><div style={{fontSize:11,color:GD,textTransform:'uppercase',letterSpacing:2,marginBottom:4}}>Bio</div><div style={{fontSize:13,color:TX,lineHeight:1.6}}>{node.bio}</div></div>}
      {node.sp?.dn&&<div style={{marginTop:16}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:6}}>
          <div style={{fontSize:11,color:GD,textTransform:'uppercase',letterSpacing:2}}>Spouse</div>
          <div style={{display:'flex',gap:8}}>
            <button onClick={()=>onEditSpouse(node)} style={{background:'none',border:`1px solid ${BR}`,color:GD,padding:'3px 10px',borderRadius:5,cursor:'pointer',fontSize:12}}>Edit Spouse</button>
            <button onClick={()=>onDelSpouse(node.id)} style={{background:'none',border:`1px solid rgba(160,80,80,0.35)`,color:'#c07a7a',padding:'3px 10px',borderRadius:5,cursor:'pointer',fontSize:12}}>Delete Spouse</button>
          </div>
        </div>
        <div style={{display:'flex',alignItems:'center',gap:8}}>
          {spProfileUrl && <img src={spProfileUrl} style={{width:32,height:32,borderRadius:'50%',objectFit:'cover'}} alt=""/>}
          <div><R l="Name" v={node.sp.dn}/><R l="Born" v={node.sp.dob}/><R l="Died" v={node.sp.dod}/></div>
        </div>
      </div>}
      {!node.sp?.dn&&<div style={{marginTop:16}}>
        <button onClick={()=>onEditSpouse(node)} style={{background:'rgba(155,130,196,0.08)',border:`1px solid rgba(155,130,196,0.25)`,color:FC,padding:'6px 14px',borderRadius:6,cursor:'pointer',fontSize:12}}>⚭ Add Spouse</button>
      </div>}
      {node.ch?.length>0&&<div style={{marginTop:16}}><div style={{fontSize:11,color:GD,textTransform:'uppercase',letterSpacing:2,marginBottom:6}}>Children ({node.ch.length})</div>
        {node.ch.map(c=><div key={c.id} style={{display:'flex',alignItems:'center',gap:6,padding:'3px 0',fontSize:13}}>
          {c.pp ? <img src={cldImg(c.pp,'c_fill,w_20,h_20,g_face,r_max')} style={{width:20,height:20,borderRadius:'50%',objectFit:'cover'}} alt=""/>
            : <span style={{width:5,height:5,borderRadius:'50%',background:c.g==='M'?MC:FC}}/>}
          <span style={{color:TX}}>{c.dn}</span>
          {c.dob&&<span style={{color:DM,marginLeft:'auto',fontSize:11}}>{c.dob}</span>}
        </div>)}
      </div>}
      
      {/* Photos of this person */}
      {mediaLoaded && personMedia.length>0 && <div style={{marginTop:16}}>
        <div style={{fontSize:11,color:GD,textTransform:'uppercase',letterSpacing:2,marginBottom:8}}>Photos & Documents ({personMedia.length})</div>
        <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:6}}>
          {personMedia.map(m=>(
            <div key={m.id} onClick={()=>setLightbox(m)} style={{cursor:'pointer',borderRadius:6,overflow:'hidden',aspectRatio:'1',background:'#1a1a14',border:`1px solid ${BR}`}}>
              {m.media_type==='document' ?
                <div style={{width:'100%',height:'100%',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:4}}>
                  <span style={{fontSize:24}}>📄</span>
                  <span style={{fontSize:9,color:DM,textAlign:'center',padding:'0 4px',wordBreak:'break-all'}}>{m.file_name||'Document'}</span>
                </div>
              : <img src={cldImg(m.cloudinary_url,'c_fill,w_150,h_150,g_face')} style={{width:'100%',height:'100%',objectFit:'cover'}} alt={m.caption||''}/>
              }
            </div>
          ))}
        </div>
      </div>}
      
      {lineage.length>1&&<div style={{marginTop:16}}><div style={{fontSize:11,color:GD,textTransform:'uppercase',letterSpacing:2,marginBottom:6}}>Lineage</div>
        <div style={{fontSize:12,color:DM,lineHeight:1.8}}>
          {lineage.map((p,i)=><span key={i}><span style={{color:i===lineage.length-1?GC:TX}}>{p}</span>{i<lineage.length-1&&<span style={{color:GD}}> › </span>}</span>)}
        </div>
      </div>}
    </div>
    
    {/* Lightbox */}

function PhotoGallery({flat, user}) {

  const [showUpload, setShowUpload] = useState(false);
  const [lightbox, setLightbox] = useState(null);

  // Load all media on mount
  useEffect(() => {
    loadMedia().then(m => { setAllMedia(m || []); setLoading(false); }).catch(() => setLoading(false));
  }, []);

  const reload = () => {
    loadMedia().then(m => setAllMedia(m || []));

    const map = {};
    flat.forEach(n => { map[n.id] = n; });

    let items = allMedia;

/* ───── MEDIA UPLOAD MODAL ───── */
function MediaUploadModal({flat, user, onDone, onCancel}) {
  const [files, setFiles] = useState([]);
  const [caption, setCaption] = useState('');
  const [eventDate, setEventDate] = useState('');
  const [tagSearch, setTagSearch] = useState('');
  const [taggedPersons, setTaggedPersons] = useState([]);
  const [uploading, setUploading] = useState(false);
  const [progress, setProgress] = useState('');
  const [error, setError] = useState('');
  const [previews, setPreviews] = useState([]);

  const inp = { width: '100%', background: '#1a1a14', border: `1px solid ${BR}`, color: TX, padding: '8px 12px', borderRadius: 6, fontSize: 14, outline: 'none', fontFamily: 'inherit' };

  const tagMatches = useMemo(() => {
    if (tagSearch.length < 2) return [];
    const q = tagSearch.toLowerCase();
    const alreadyTagged = new Set(taggedPersons.map(p => p.id));
    return flat.filter(n => !alreadyTagged.has(n.id) && ((n.dn || '').toLowerCase().includes(q) || (n.nk || '').toLowerCase().includes(q))).slice(0, 8);
  }, [tagSearch, flat, taggedPersons]);

  const handleFiles = (e) => {
    const selected = Array.from(e.target.files);
    setFiles(selected);
    // Generate previews for images
    const prevs = [];
    selected.forEach(f => {
      if (f.type.startsWith('image/')) {
        const url = URL.createObjectURL(f);
        prevs.push({ name: f.name, url, type: 'image' });
      } else {
        prevs.push({ name: f.name, url: null, type: 'document' });
      }
    });
    setPreviews(prevs);
  };

  const handleUpload = async () => {
    if (files.length === 0) { setError('Select at least one file'); return; }
    if (taggedPersons.length === 0) { setError('Tag at least one family member'); return; }
    setUploading(true); setError('');
    try {
      for (let i = 0; i < files.length; i++) {
        const file = files[i];
        setProgress(`Uploading ${i + 1} of ${files.length}: ${file.name}`);
        const isDoc = file.type === 'application/pdf' || !file.type.startsWith('image/');
        const result = await uploadToCloudinary(file, 'gallery');
        await saveMediaRecord({
          cloudinary_url: result.url,
          cloudinary_id: result.publicId,
          media_type: isDoc ? 'document' : 'photo',
          file_name: isDoc ? file.name : '',
          caption: caption,
          uploaded_by: user.name || user.email || '',
          uploaded_by_id: user.id || '',
          tagged_persons: taggedPersons.map(p => p.id),
          event_date: eventDate,
        });
      }
      setProgress('');
      onDone();
    } catch (err) {
      setError('Upload failed: ' + err.message);
      setUploading(false);
    }
  };

  return (
    <div style={{ position: 'fixed', inset: 0, zIndex: 300, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
      <div onClick={onCancel} style={{ position: 'absolute', inset: 0, background: 'rgba(0,0,0,0.7)' }} />
      <div style={{ position: 'relative', background: CD, border: `1px solid ${BR}`, borderRadius: 12, width: Math.min(480, window.innerWidth - 32), maxHeight: '90vh', overflowY: 'auto', padding: 24, zIndex: 301 }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 16 }}>
          <span style={{ fontSize: 18, color: GC, fontWeight: 300 }}>Upload Photos & Documents</span>
          <button onClick={onCancel} style={{ background: 'none', border: 'none', color: DM, fontSize: 18, cursor: 'pointer' }}>✕</button>
        </div>

        {/* File picker */}
        <div style={{ marginBottom: 16 }}>
          <label style={{ display: 'block', background: 'rgba(196,163,90,0.06)', border: `2px dashed ${GD}`, borderRadius: 8, padding: 20, textAlign: 'center', cursor: 'pointer' }}>
            <div style={{ fontSize: 28, marginBottom: 4 }}>📷 📄</div>
            <div style={{ fontSize: 13, color: GC }}>{files.length > 0 ? `${files.length} file(s) selected` : 'Tap to select photos or PDFs'}</div>
            <div style={{ fontSize: 11, color: DM, marginTop: 4 }}>Images & PDF documents accepted</div>
            <input type="file" accept="image/*,.pdf" multiple onChange={handleFiles} style={{ display: 'none' }} />
          </label>
          {previews.length > 0 && <div style={{ display: 'flex', gap: 6, marginTop: 8, flexWrap: 'wrap' }}>
            {previews.map((p, i) => (
              <div key={i} style={{ width: 60, height: 60, borderRadius: 6, overflow: 'hidden', background: '#1a1a14', border: `1px solid ${BR}`, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                {p.type === 'image' ? <img src={p.url} style={{ width: '100%', height: '100%', objectFit: 'cover' }} alt="" /> : <span style={{ fontSize: 24 }}>📄</span>}
              </div>
            ))}
          </div>}
        </div>

        {/* Caption */}
        <div style={{ marginBottom: 12 }}>
          <label style={{ fontSize: 11, color: DM, display: 'block', marginBottom: 3 }}>Caption (optional)</label>
          <input value={caption} onChange={e => setCaption(e.target.value)} placeholder="e.g., Family reunion 2023" style={inp} />
        </div>

        {/* Event date */}
        <div style={{ marginBottom: 12 }}>
          <label style={{ fontSize: 11, color: DM, display: 'block', marginBottom: 3 }}>Date (optional)</label>
          <input type="date" value={eventDate} onChange={e => setEventDate(e.target.value)} style={inp} />
        </div>

        {/* Tag people */}
        <div style={{ marginBottom: 16, position: 'relative' }}>
          <label style={{ fontSize: 11, color: DM, display: 'block', marginBottom: 3 }}>Tag family members *</label>
          {taggedPersons.length > 0 && <div style={{ display: 'flex', gap: 4, flexWrap: 'wrap', marginBottom: 6 }}>
            {taggedPersons.map(p => (
              <span key={p.id} style={{ display: 'inline-flex', alignItems: 'center', gap: 4, fontSize: 11, color: TX, background: 'rgba(107,158,114,0.1)', border: `1px solid rgba(107,158,114,0.3)`, padding: '2px 8px', borderRadius: 12 }}>
                <span style={{ width: 5, height: 5, borderRadius: '50%', background: p.g === 'M' ? MC : FC }} />
                {p.dn}
                <span onClick={() => setTaggedPersons(prev => prev.filter(t => t.id !== p.id))} style={{ cursor: 'pointer', color: DM, marginLeft: 2 }}>✕</span>
              </span>
            ))}
          </div>}
          <input value={tagSearch} onChange={e => setTagSearch(e.target.value)} placeholder="Search by name to tag..." style={inp} />
          {tagMatches.length > 0 && <div style={{ position: 'absolute', top: '100%', left: 0, right: 0, background: '#141410', border: `1px solid rgba(196,163,90,0.25)`, borderRadius: '0 0 6px 6px', maxHeight: 200, overflowY: 'auto', zIndex: 10 }}>
            {tagMatches.map(m => <div key={m.id} onClick={() => { setTaggedPersons(prev => [...prev, m]); setTagSearch(''); }}
              style={{ padding: '6px 12px', cursor: 'pointer', fontSize: 12, display: 'flex', alignItems: 'center', gap: 6 }}
              onMouseEnter={e => e.currentTarget.style.background = 'rgba(255,255,255,0.04)'}
              onMouseLeave={e => e.currentTarget.style.background = 'transparent'}>
              <span style={{ width: 5, height: 5, borderRadius: '50%', background: m.g === 'M' ? MC : FC }} /><span>{m.dn}</span>
            </div>)}
          </div>}
        </div>

        {error && <div style={{ fontSize: 12, color: '#c05050', marginBottom: 12 }}>{error}</div>}
        {progress && <div style={{ fontSize: 12, color: GC, marginBottom: 12 }}>{progress}</div>}

        <div style={{ display: 'flex', gap: 8, justifyContent: 'flex-end' }}>
          <button onClick={onCancel} style={{ background: 'transparent', border: `1px solid ${BR}`, color: DM, padding: '8px 20px', borderRadius: 6, cursor: 'pointer', fontSize: 13 }}>Cancel</button>
          <button onClick={handleUpload} disabled={uploading} style={{ background: 'rgba(196,163,90,0.15)', border: `1px solid ${GD}`, color: GC, padding: '8px 20px', borderRadius: 6, cursor: 'pointer', fontSize: 13 }}>
            {uploading ? 'Uploading...' : `Upload ${files.length || ''} File${files.length !== 1 ? 's' : ''}`}
          </button>
        </div>
      </div>
    </div>
  );
}

/* ───── GEDCOM DIFF & MERGE UI ───── */
function GedcomDiffModal({ onClose, personMap, familyMap, user, onMergeComplete }) {
  const [diffResult, setDiffResult] = useState(null);
  const [fileName, setFileName] = useState('');
  const [tab, setTab] = useState('summary');
  const [merging, setMerging] = useState({});
  const [merged, setMerged] = useState(new Set());
  const [mergeLog, setMergeLog] = useState([]);
  const [fieldSelections, setFieldSelections] = useState({}); // { personId: { fieldKey: true/false } }
  const [expandedDiffs, setExpandedDiffs] = useState(new Set());

  const handleFile = () => {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = '.ged,.gedcom';
    input.onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      setFileName(file.name);
      const reader = new FileReader();
      reader.onload = (evt) => {
        try {
          const text = evt.target.result;
          const raw = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
          // Parse into flat people/families (reuse parser internals)
          const lines = raw.split('\n').filter(l => l.trim());
          const elements = [];
          const stack = [{ children: elements, level: -1 }];
          for (const line of lines) {
            const m = line.match(/^(\d+)\s+(@[^@]+@)?\s*(\S+)\s*(.*)?$/);
            if (!m) continue;
            const level = parseInt(m[1]);
            const pointer = (m[2] || '').trim();
            const tag = m[3].trim();
            const value = (m[4] || '').trim();
            const el = { level, pointer, tag, value, children: [] };
            while (stack.length > 1 && stack[stack.length - 1].level >= level) stack.pop();
            stack[stack.length - 1].children.push(el);
            stack.push(el);
          }
          const extPeople = {};
          const extFamilies = {};
          for (const el of elements) {
            if (el.tag === 'INDI' && el.pointer) { const p = parseIndi(el); extPeople[p.id] = p; }
            else if (el.tag === 'FAM' && el.pointer) { const f = parseFam(el); extFamilies[f.id] = f; }
          }
          const result = computeGedcomDiff(extPeople, extFamilies, personMap, familyMap);
          setDiffResult(result);
          setTab('summary');
        } catch (err) {
          alert('Error parsing GEDCOM: ' + err.message);
        }
      };
      reader.readAsText(file, 'utf-8');
    };
    input.click();
  };

  const doMerge = async (type, item) => {
    const key = type + '_' + (item.id || item.extId || '');
    setMerging(prev => ({ ...prev, [key]: true }));
    try {
      if (type === 'ext_person') {
        await mergePersonToDb(item, user?.email || 'GEDCOM merge');
        setMergeLog(prev => [...prev, `✓ Added ${item.dn || item.fn + ' ' + item.ln}`]);
      } else if (type === 'ext_family') {
        await mergeFamilyToDb(item);
        setMergeLog(prev => [...prev, `✓ Added family ${item.id}`]);
      } else if (type === 'fields') {
        const sel = fieldSelections[item.id] || {};
        const fieldsToApply = Object.keys(sel).filter(k => sel[k]);
        if (fieldsToApply.length === 0) { setMerging(prev => ({ ...prev, [key]: false })); return; }
        await mergeFieldsToDb(item.ftls, fieldsToApply, item.ext, user?.email || 'GEDCOM merge');
        setMergeLog(prev => [...prev, `✓ Updated ${fieldsToApply.length} fields on ${item.ftls.dn}`]);
      }
      setMerged(prev => new Set([...prev, key]));
    } catch (err) {
      setMergeLog(prev => [...prev, `✗ Error: ${err.message}`]);
    }
    setMerging(prev => ({ ...prev, [key]: false }));
  };

  const mergeAllExtPersons = async () => {
    if (!diffResult) return;
    for (const p of diffResult.extOnly) {
      const key = 'ext_person_' + p.id;
      if (merged.has(key)) continue;
      await doMerge('ext_person', p);
    }
  };

  const downloadFtlsOnly = () => {
    if (!diffResult) return;
    const content = exportDiffGedcom(diffResult.ftlsOnly, familyMap);
    const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'FTLS_Only_Additions.ged';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };

  const toggleFieldSel = (personId, fieldKey) => {
    setFieldSelections(prev => {
      const cur = prev[personId] || {};
      return { ...prev, [personId]: { ...cur, [fieldKey]: !cur[fieldKey] } };
    });
  };

  const toggleExpand = (id) => {
    setExpandedDiffs(prev => {
      const s = new Set(prev);
      s.has(id) ? s.delete(id) : s.add(id);
      return s;
    });
  };

  const S = diffResult?.stats;
  const tabStyle = (t) => ({ fontSize: 12, padding: '6px 14px', cursor: 'pointer', borderRadius: '6px 6px 0 0', background: tab === t ? 'rgba(196,163,90,0.15)' : 'transparent', color: tab === t ? GC : DM, border: tab === t ? `1px solid ${GD}` : '1px solid transparent', borderBottom: 'none' });
  const sectionHdr = { fontSize: 14, color: GC, fontWeight: 600, margin: '16px 0 8px', paddingBottom: 4, borderBottom: `1px solid ${BR}` };
  const rowS = { padding: '6px 0', borderBottom: `1px solid rgba(196,163,90,0.06)`, fontSize: 13 };
  const badgeS = (color) => ({ display: 'inline-block', padding: '1px 8px', borderRadius: 10, fontSize: 11, background: color, color: '#fff', marginLeft: 6 });

  return (
    <div style={{ position: 'fixed', inset: 0, zIndex: 200, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
      <div style={{ position: 'absolute', inset: 0, background: 'rgba(0,0,0,0.85)' }} onClick={onClose} />
      <div style={{ position: 'relative', background: '#141410', border: `1px solid ${GD}`, borderRadius: 12, width: Math.min(900, window.innerWidth - 32), maxHeight: '90vh', display: 'flex', flexDirection: 'column', zIndex: 201 }}>
        {/* Header */}
        <div style={{ padding: '16px 20px', borderBottom: `1px solid ${BR}`, display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
          <div>
            <span style={{ fontSize: 18, color: GC, fontWeight: 500 }}>🔀 GEDCOM Diff &amp; Merge</span>
            {fileName && <span style={{ fontSize: 12, color: DM, marginLeft: 12 }}>vs {fileName}</span>}
          </div>
          <span onClick={onClose} style={{ fontSize: 20, color: DM, cursor: 'pointer', padding: '4px 8px' }}>✕</span>
        </div>

        {/* Body */}
        <div style={{ flex: 1, overflowY: 'auto', padding: '0 20px 20px' }}>
          {!diffResult ? (
            <div style={{ textAlign: 'center', padding: '60px 20px' }}>
              <div style={{ fontSize: 48, marginBottom: 16 }}>📂</div>
              <div style={{ fontSize: 15, color: TX, marginBottom: 8 }}>Upload an external GEDCOM to compare</div>
              <div style={{ fontSize: 12, color: DM, marginBottom: 24, lineHeight: 1.6 }}>
                This will compare every person and family in the uploaded file against your FTLS database.<br />
                You can then selectively merge new people or updated fields into FTLS,<br />
                or export FTLS-only additions as a GEDCOM for the external tool.
              </div>
              <button onClick={handleFile} style={{ background: 'rgba(107,158,114,0.15)', border: `1px solid ${MC}`, color: MC, padding: '12px 28px', borderRadius: 8, cursor: 'pointer', fontSize: 14 }}>
                📄 Select GEDCOM File
              </button>
            </div>
          ) : (
            <>
              {/* Tabs */}
              <div style={{ display: 'flex', gap: 2, marginTop: 12, borderBottom: `1px solid ${BR}` }}>
                <span style={tabStyle('summary')} onClick={() => setTab('summary')}>Summary</span>
                {S.changed > 0 && <span style={tabStyle('changed')} onClick={() => setTab('changed')}>Changed ({S.changed})</span>}
                {S.extOnly > 0 && <span style={tabStyle('ext_only')} onClick={() => setTab('ext_only')}>External Only ({S.extOnly})</span>}
                {S.ftlsOnly > 0 && <span style={tabStyle('ftls_only')} onClick={() => setTab('ftls_only')}>FTLS Only ({S.ftlsOnly})</span>}
                {diffResult.fuzzyMatched.length > 0 && <span style={tabStyle('fuzzy')} onClick={() => setTab('fuzzy')}>Fuzzy Matches ({diffResult.fuzzyMatched.length})</span>}
                {mergeLog.length > 0 && <span style={tabStyle('log')} onClick={() => setTab('log')}>Log ({mergeLog.length})</span>}
              </div>

              {/* Summary Tab */}
              {tab === 'summary' && (
                <div style={{ padding: '16px 0' }}>
                  <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12, marginBottom: 20 }}>
                    <div style={{ background: 'rgba(107,158,114,0.08)', border: `1px solid rgba(107,158,114,0.2)`, borderRadius: 8, padding: 14 }}>
                      <div style={{ fontSize: 11, color: DM, textTransform: 'uppercase', letterSpacing: 1, marginBottom: 4 }}>External GEDCOM</div>
                      <div style={{ fontSize: 24, color: MC, fontWeight: 600 }}>{S.extTotal} <span style={{ fontSize: 13, fontWeight: 400 }}>persons</span></div>
                      <div style={{ fontSize: 13, color: DM }}>{S.extFamilies} families</div>
                    </div>
                    <div style={{ background: 'rgba(196,163,90,0.08)', border: `1px solid rgba(196,163,90,0.2)`, borderRadius: 8, padding: 14 }}>
                      <div style={{ fontSize: 11, color: DM, textTransform: 'uppercase', letterSpacing: 1, marginBottom: 4 }}>FTLS Database</div>
                      <div style={{ fontSize: 24, color: GC, fontWeight: 600 }}>{S.ftlsTotal} <span style={{ fontSize: 13, fontWeight: 400 }}>persons</span></div>
                      <div style={{ fontSize: 13, color: DM }}>{S.ftlsFamilies} families</div>

                  <div style={sectionHdr}>Match Results</div>
                  <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill,minmax(160px,1fr))', gap: 8 }}>
                    <div style={{ padding: 10, background: 'rgba(255,255,255,0.02)', borderRadius: 6, border: `1px solid ${BR}` }}>

                    <div style={{ padding: 10, background: 'rgba(255,255,255,0.02)', borderRadius: 6, border: `1px solid ${BR}` }}>

              )}

              {/* Changed Tab */}
              {tab === 'changed' && (
                <div style={{ padding: '12px 0' }}>
                  <div style={{ fontSize: 12, color: DM, marginBottom: 12 }}>People matched by ID with field differences. Select fields to import from the external GEDCOM.</div>

                            <span style={{ color: isExpanded ? GC : DM, marginRight: 6 }}>{isExpanded ? '▼' : '▶'}</span>
                            {m.ftls.dn || m.ext.dn} <span style={badgeS('rgba(196,163,90,0.6)')}>{m.diffs.length} diff{m.diffs.length > 1 ? 's' : ''}</span>
                          </span>
                          {merged.has(key) && <span style={{ fontSize: 11, color: '#6b9e72' }}>✓ merged</span>}
                        </div>
                        {isExpanded && (
                          <div style={{ padding: '8px 12px' }}>
                            <table style={{ width: '100%', fontSize: 12, borderCollapse: 'collapse' }}>

                              <tbody>

                                    <td style={{ padding: '4px 8px' }}>
                                      <input type="checkbox" checked={!!(fieldSelections[m.id] || {})[d.key]}
                                        onChange={() => toggleFieldSel(m.id, d.key)} />
                                    </td>
                                    <td style={{ padding: '4px 8px', color: DM }}>{d.label}</td>

                            {!merged.has(key) && (
                              <button onClick={() => doMerge('fields', m)} disabled={merging[key]}
